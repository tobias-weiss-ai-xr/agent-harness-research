# Multi-source discovery queries (fetch_other_sources.py)
# Sources supported: dblp, crossref, europepmc, openalex, semantic_scholar, zenodo
# Categories/subcategories follow config/taxonomy.yaml (no free-form hints).
#
# Source status (verified 2026-11-08):
#   - dblp:          BLOCKED — Anubis anti-bot challenge (non-JSON response); remove
#                    queries here until DBLP lifts machine access.
#   - semantic_scholar: RATE-LIMITED — public endpoint returns 429 without an API
#                    key; re-add queries once a key or higher limit is available.
#   - europepmc:     OMITTED — biomedical corpus, off-topic for agent-harness.
#   - zenodo:        OMITTED — code/artifact packages, not research papers.
#   - openalex:      covered by scripts/fetch/fetch_openalex_bulk.py (per-category).

- source: crossref
  query: "agent harness large language model tools"
  category: runtime
  subcategory_hint: systems
- source: crossref
  query: "LLM agent runtime context memory evaluation"
  category: runtime
  subcategory_hint: systems
- source: crossref
  query: "agentic harness safety permission sandbox"
  category: safety
