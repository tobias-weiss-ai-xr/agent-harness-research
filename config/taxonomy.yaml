# Agent Harness Research Taxonomy & Discovery Config
#
# Focus: Runtimes, tooling, control planes, and interfaces for LLM-based agents
#
# Pipeline: config/taxonomy.yaml -> papers.yaml -> validate -> README -> reports

topic:
  name: "Agent Harness"
  short: "agent-harness"
  description: "Runtimes, tooling, control planes, and interfaces for LLM-based agentic systems."
  openalex_mailto: "tobias@tobias-weiss.org"

taxonomy:
  categories:
    - id: runtime
      display: "Agent Runtimes & Harnesses"
      description: "Core runtimes and harness architectures for LLM agents"
    - id: tooling
      display: "Tool Use & Execution"
      description: "Tool calling, execution, and sandboxing"
    - id: context
      display: "Context & State Management"
      description: "Context windows, state, and memory within harnesses"
    - id: orchestration
      display: "Orchestration & Workflows"
      description: "Multi-agent orchestration and workflow engines"
    - id: interface
      display: "Interfaces & Meta-Access"
      description: "User interfaces, meta access, and control surfaces"
    - id: safety
      display: "Safety, Permissions & Sandboxing"
      description: "Permissions, sandboxing, and safety controls"
    - id: evaluation
      display: "Evaluation & Benchmarks"
      description: "Benchmarks and evaluation for agent harnesses"
    - id: method
      display: "Methods & Architectures"
      description: "Methodological approaches and architectures"
    - id: application
      display: "Applications"
      description: "Real-world applications of agent harnesses"
    - id: survey
      display: "Surveys & Taxonomies"
      description: "Surveys and taxonomies of the field"

  subcategories:
    - id: method
      display: "Method"
    - id: theory
      display: "Theory"
    - id: application
      display: "Application"
    - id: survey
      display: "Survey"
    - id: experiment
      display: "Experiment"
    - id: systems
      display: "Systems"
    - id: development
      display: "Development"

arxiv_queries:
  - query: 'cat:cs.AI AND (abs:"agent harness" OR abs:"agentic harness")'
    category: runtime
    subcategory_hint: systems
  - query: 'cat:cs.AI AND (abs:"meta access" AND abs:"agent")'
    category: interface
    subcategory_hint: method

other_sources_queries: []

openalex_queries:
  - category: runtime
    query: "agent harness runtime LLM"
  - category: interface
    query: "meta access chat AI agent"

trend_keywords:
  - harness
  - runtime
  - agent
  - tool
  - context
  - orchestration
  - permission
  - sandbox
  - meta access
  - control plane

subcategory_keywords: []
