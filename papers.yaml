papers:
- title: The Power of Meta Access in the Software of the Future --- Demonstrated on
    LLM Chat UIs and Chat AI
  date: 2026-11
  url: https://arxiv.org/abs/2611.08428
  category: interface
  subcategory: method
  authors:
  - Julian Kunkel
  - Ali Doosthosseini
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Chat remains the default surface for many large language model (LLM)
    tasks, even as agentic tools such as OpenCode excel at coding and automation.
    Yet the model sees the current dialogue but not the workspace around it. We explore
    meta access---giving the assistant a structured, permissioned view of the interface
    itself and propose a ladder of levels: feature tutoring; metadata, settings, and
    preference access; retrieval over summaries and messages, confirmed mutation,
    and full orchestration. Meta access can turn a chat client from many screens into
    one entry point for finding, navigating, organising, and operating it, while raising
    risks around grounding, privacy, prompt injection, and trust. General-purpose
    agentic harnesses are runtimes; because they can change their own settings, meta
    access becomes reflexive and needs a separate control-plane boundary. We ground
    this in the Meta Chat prototype of the Chat AI client. It builds bounded context
    from, e.g., summaries, settings, and relevant messages; links references to conversations,
    topics, and personas; supports confirmed, reversible changes; offers a browsable
    tutorial library; and recommends personas as user-started conversations. By exposing
    application state in structured form, meta access can extend screen readers from
    widget descriptions to semantic workspace operations. Meta access thus turns chat
    from a window onto one conversation into a control layer for the whole workspace,
    extending chat toward agentic capability without surrendering user control. As
    assistants become embedded in IDEs, dashboards, office suites, and operating systems,
    AI-era interfaces should expose a structured, permissioned model of their state
    and capabilities, ideally by opening their existing metamodels through a debugger-like
    interface.

    '
  tags: []
- title: 'Agent Harness Awareness: Turning Verified Telemetry into Operational Control
    for Tool-Using Agents'
  date: 2026-09
  url: https://arxiv.org/abs/2611.05391
  category: runtime
  subcategory: method
  authors:
  - Manu Agrawal
  - Shrey Nagpal
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Tool descriptions tell an agent what an action can do, but they do not
    necessarily reveal whether that action is healthy or suitable at the moment of
    use. Execution harnesses often possess this information through monitors, traces,
    and recent failures while the model choosing the next action does not. We call
    this gap operational blindness. We introduce Agent Harness Awareness, a trust-separated
    design in which the host supplies a small, fresh, verified state snapshot before
    a consequential action while retaining measurement, enforcement, evaluation, and
    final dispatch authority. We test its tools-and- network instance with ToolRoute,
    a controlled isolation benchmark that holds the task and candidate semantics constant
    and varies the operational information available to the model. In a 216-decision
    ablation across GPT-5.6 Sol, Claude Sonnet 5, and Gemini 3.7 Flash, verified tool-health
    state reduced mean observable policy regret by 96.9% against a same-shape neutral
    control (4,252 ms to 131 ms) and raised single-dispatch completion from 69.4%
    to 95.8%. In a separate 27-decision end-to-end replication with live local TCP/HTTP
    execution, OpenTelemetry client spans, and Toxiproxy-injected faults, verified
    state reduced mean regret from 8,956 ms to 0 ms (zero excess observable operational
    cost) and completed the live action in 9/9 model-by- fault cases versus 5/9 for
    the neutral control. These studies establish the tools-and-network instance of
    Agent Harness Awareness: selected host telemetry materially improves pre-dispatch
    operational choice. Runtime state, hardware pressure, economics, retry-aware recovery,
    and heterogeneous selection remain open empirical extensions of the same architecture.

    '
  tags: []
- title: 'What makes a harness a harness: necessary and sufficient conditions for
    an agent harness'
  date: 2026-06
  url: https://arxiv.org/abs/2606.10106
  category: runtime
  subcategory: theory
  authors:
  - Sanderson Oliveira de Macedo
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'The term agent harness now circulates widely in software engineering
    with generative artificial intelligence. It names the layer that wraps a language
    model and turns it into a coding agent able to act on a repository. The usage
    is loose and polysemous. Sometimes the term denotes the whole product (Claude
    Code, Codex CLI); sometimes it denotes the evaluation scaffold that runs an agent
    against tasks (the SWE-bench harness); sometimes it gets conflated with an agent
    framework, an SDK, an IDE plugin, or an orchestrator. What is missing is a reference
    definition that works as an instrument, one that includes and excludes cases consistently.
    We build that definition through a conceptual analysis that combines works with
    persistent identifiers and primary grey- literature sources, such as official
    documentation, glossaries, and engineering reports. We reconstruct the genealogy
    of the term, from the horse''s tack to the classic test harness, to the machine-learning
    evaluation harness, and finally to the agent harness. We then propose a constitutive
    definition that states the necessary and sufficient conditions for a system to
    be an agent harness, we operationalize it as an inclusion and exclusion test,
    and we draw the boundary of the concept against an agent framework, an agent SDK,
    an IDE plugin, an eval harness, and an orchestrator. We apply the definition to
    six real harnesses (Claude Code, Codex CLI, Aider, Cline, OpenHands, and SWE-agent)
    and to deliberate edge cases; the test includes and excludes consistently. We
    close with a research agenda organized by design tension axes. The contribution
    is an operational definition of agent harness, with a shared vocabulary, able
    to guide engineering practice and the scientific comparison of agentic systems.

    '
  tags: []
- title: 'DS-Lighting: Making Agent Harnesses Explicit for Data-Science Automation'
  date: 2026-06
  url: https://arxiv.org/abs/2608.28590
  category: application
  subcategory: method
  authors:
  - Fan Liu
  - Hao Liu
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Large Language Model (LLM) agents have shown promise for automating data-
    science workflows, yet their end-to-end performance depends critically on the
    agent harness that represents tasks, manages execution state, constrains output
    artifacts, and provides evaluation feedback. Existing data-science agents often
    leave this harness implicit, making results difficult to reproduce, compare, and
    attribute across heterogeneous tasks. We introduce DS- Lighting, a unified harness
    toolkit that makes harness design explicit for data-science automation. DS-Lighting
    decomposes the harness into four reusable layers: data, workflow, execution, and
    evaluation, and represents diverse agents as executable operator programs that
    support both predefined pipelines and adaptive search. We further integrate multiple
    open-source data-science benchmarks into an MLE-Bench-style task format, enabling
    controlled comparison under a shared task interface, sandboxed runtime, and metric
    protocol. Experiments across agents, harnesses, models, and ablations show that
    explicit harness design improves reproducibility, comparability, and reliability,
    while reducing avoidable system-level failures in end-to-end data-science workflows.
    Our code is available at https://github.com/usail-hkust/dslighting

    '
  tags: []
- title: 'Complex Agents, Shallow Tests: Demystifying and Enhancing Test Adequacy
    of Agent Harness in the Wild'
  date: 2026-10
  url: https://arxiv.org/abs/2610.04921
  category: evaluation
  subcategory: experiment
  authors:
  - Yifan Xiong
  - Jingyi Ge
  - Zhenpeng Chen
  - Yiling Lou
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'LLM-based agentic systems are emerging as a new software paradigm. Modern
    agents are typically composed of backbone LLMs and a surrounding harness that
    serves as the operational software infrastructure for agent execution. As agent
    harnesses grow increasingly complex, agents suffer from diverse harness implementation
    bugs, raising substantial reliability concerns. In this work, we conduct the first
    empirical study to systematically investigate the test adequacy of harness in
    real-world agentic systems. Our analysis reveals that agent harness remains substantially
    undertested. In particular, LLM-dependent harness (LDH) code, despite its critical
    role in processing LLM outputs and governing agent behavior, receives limited
    testing attention, with less than half of its lines and branches covered by existing
    tests. Motivated by these findings, we further propose HarnessTester, the first
    harness-oriented test generation technique that incorporates explicit agent-harness
    contract support to construct contract-faithful test setups and extensively exercise
    LDH code. Our evaluation shows that HarnessTester substantially outperforms state-of-
    the-art general-purpose test generation techniques in achieving 75.95%/84.76%
    larger line/branch coverage gains and 69.89% larger mutation-score gains. Furthermore,
    HarnessTester detects 122 real-world harness bugs in widely-used agentic systems
    (e.g., OpenClaw), among which, 88 bugs are previously-unknown bugs and 69 bugs
    have been confirmed by agent developers. These results highlight the practical
    effectiveness of HarnessTester in improving test adequacy and assuring the reliability
    of real-world agentic systems.

    '
  tags: []
- title: 'A Blind Trust, the Bloody Thrust: When Attacker-Controlled Hook Updates
    Steer AI Agent Harnesses towards Malicious Behaviors'
  date: 2026-09
  url: https://arxiv.org/abs/2609.03884
  category: safety
  subcategory: method
  authors:
  - Pengxun Li
  - Litian Zhang
  - Jianwei Hou
  - Shujiang Wu
  - Song Li
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Modern AI agent harnesses expose lifecycle hooks that bind shell commands
    to runtime events such as session start, tool calls, and file edits. These commands
    run with host privileges yet ship as lifecycle-hook configuration and may fire
    at times the LLM never observes. We identify the lifecycle-hook update path, which
    harnesses trust blindly, as a new attack surface. Under a supply-chain threat
    model in which an attacker controls only plugin metadata and lifecycle-hook configuration,
    a benign versioned plugin can be trojanized by an update that silently binds attacker-chosen
    commands to benign events, yielding malicious host-side behavior such as privilege
    escalation. We propose HookPry, an open-source and fully automated attack framework
    that systematically exploits this vulnerability across heterogeneous AI agent
    harnesses. HookPry realizes ten attack objectives; across 25 combinations of harnesses
    and backends in 1,000 end-to-end runs, it compromises all seven evaluated harnesses,
    with per-harness success rates reaching 92.5%. Representative defenses remain
    insufficient: Microsoft Defender has 0% recall, and the union of three static
    defenses misses 47.5% of malicious artifacts.

    '
  tags: []
- title: 'Don''t Blame the Large Language Model: How Agent Harness Evolution Shapes
    Coding Agent Quality'
  date: 2026-07
  url: https://arxiv.org/abs/2607.03691
  category: runtime
  subcategory: method
  authors:
  - Oussama Ben Sghaier
  - Hao Li
  - Bram Adams
  - Ahmed E. Hassan
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Coding agents, autonomous systems that use large language models (LLMs)
    to resolve software engineering tasks, rely on agent harness: a middleware layer
    in between a developer and a large language model that orchestrates system prompts,
    tool execution, context management, and iterative reasoning loops. While these
    agent harnesses evolve at extreme velocities, no study has examined how this evolution
    affects agent quality (i.e., effectiveness and efficiency) over time. Practitioners
    regularly report quality regressions after agent harness updates, yet consistently
    attribute them to the underlying model rather than the harness itself. In this
    paper, we address this gap by conducting the first controlled longitudinal study
    that isolates the agent harness contribution. Unlike prior work that fixes the
    agent harness and varies the model, we fix the model and vary only the agent harness,
    evaluating 35 sequential releases to measure their impact on agent effectiveness
    and efficiency. We first empirically study the development and release evolution
    of five major open-source agent harnesses (i.e., Codex, Qwen Code, Gemini, OpenCode,
    and OpenHands), revealing extreme release velocities exceeding two releases per
    day and thousands of issues within months. We then perform a controlled deep dive
    into 35 sequential releases of the Qwen Code CLI, evaluating each against 50 stratified
    SWE-bench Verified tasks while holding the underlying LLM constant. We trace the
    resulting quality fluctuations to specific development patterns and architectural
    components, and illustrate our findings with concrete qualitative evidence linking
    individual pull requests to measured quality shifts.

    '
  tags: []
- title: Code as Agent Harness
  date: 2026-05
  url: https://arxiv.org/abs/2605.18747
  category: runtime
  subcategory: method
  authors:
  - Xuying Ning
  - Katherine Tieu
  - Dongqi Fu
  - Tianxin Wei
  - Zihao Li
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Recent large language models (LLMs) have demonstrated strong capabilities
    in understanding and generating code, from competitive programming to repository-
    level software engineering. In emerging agentic systems, code is no longer only
    a target output. It increasingly serves as an operational substrate for agent
    reasoning, acting, environment modeling, and execution-based verification. We
    frame this shift through the lens of agent harnesses and introduce code as agent
    harness: a unified view that centers code as the basis for agent infrastructure.
    To systematically study this perspective, we organize the survey around three
    connected layers. First, we study the harness interface, where code connects agents
    to reasoning, action, and environment modeling. Second, we examine harness mechanisms:
    planning, memory, and tool use for long-horizon execution, together with feedback-driven
    control and optimization that make harness reliable and adaptive. Third, we discuss
    scaling the harness from single-agent systems to multi-agent settings, where shared
    code artifacts support multi-agent coordination, review, and verification. Across
    these layers, we summarize representative methods and practical applications of
    code as agent harness, spanning coding assistants, GUI/OS automation, embodied
    agents, scientific discovery, personalization and recommendation, DevOps, and
    enterprise workflows. We further outline open challenges for harness engineering,
    including evaluation beyond final task success, verification under incomplete
    feedback, regression-free harness improvement, consistent shared state across
    multiple agents, human oversight for safety-critical actions, and extensions to
    multimodal environments. By centering code as the harness of agentic AI, this
    survey provides a unified roadmap toward executable, verifiable, and stateful
    AI agent systems.

    '
  tags: []
- title: 'Verify Smarter, Evolve Further: Efficient Harness Evolution through Behavior-Aware
    Verification'
  date: 2026-08
  url: https://arxiv.org/abs/2608.27311
  category: evaluation
  subcategory: method
  authors:
  - Jinghan Xu
  - Yikai Zhang
  - Aili Chen
  - Weiyuan Li
  - Jiaqing Liang
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Agent harnesses shape how language-model agents use instructions, tools,
    and runtime components, but adapting these harnesses requires costly verification.
    Existing propose-and-verify methods typically score every candidate on a fixed
    task set, wasting rollouts on unrelated behaviors and allowing aggregate scores
    to obscure specific regressions. We introduce HarnessLens, a budget- aware framework
    for automated harness evolution. HarnessLens jointly explores the task space and
    user-configurable components, derives candidate modifications from execution trajectories,
    and selectively verifies each candidate on behavior-relevant tasks using an attributable-evidence
    gate. Across three agent harnesses and four benchmarks, HarnessLens improves average
    held-out performance by 7.6-13.6% while consuming substantially less evaluation
    budget than competing baselines. These results demonstrate that behavior-aware
    verification with explicit attribution enables more reliable and sample-efficient
    harness evolution under constrained interaction budgets. Our code is available
    at https://github.com/jhxu5214/HarnessLens.

    '
  tags: []
- title: Distributing Security Controls Through Harness Engineering
  date: 2026-07
  url: https://arxiv.org/abs/2607.25890
  category: safety
  subcategory: systems
  authors:
  - William Robert Gore
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'AI coding agents are being adopted at historic speed, yet security and
    risk concerns remain the primary barrier to scaling agentic AI across organizations.
    Existing security controls for coding agents are not systematically distributed
    to engineering teams, and vendor-native solutions introduce ecosystem dependencies
    that may not suit every deployment context. This paper investigates whether off-the-shelf
    security controls can be implemented on commercial AI coding agents and scaled
    to a distributed user base via a custom agent harness. A phased testing methodology
    was applied across four agent configurations --- two commercial agents with and
    without controls, a baseline harness, and a security-hardened harness --- using
    a 23-test suite derived from the OWASP Top 10 for Agentic Applications. SHarD
    (Secure Harness Distribution), a distributable harness built on the Pi agent harness,
    demonstrated that three categories of security controls --- OS sandboxing, skill
    scanning, and tool restriction --- can be embedded and distributed via a single
    install command while retaining equivalent efficacy to direct installation on
    commercial agents. SHarD achieved an adjusted score of 100\%, matching the best
    securely configured commercial agent, with no regression across any test category.
    Notable observations include evidence that model non-determinism produces inconsistent
    security outcomes and that autonomous agent behavior can cross system boundaries
    in ways that OS sandboxing directly mitigates. Initial characteristics toward
    a control harness fitness framework are proposed, and a third research question
    is identified for future investigation.

    '
  tags: []
- title: 'HarnessRisk: A Lifecycle-Oriented Benchmark for Agent Harness Safety'
  date: 2026-08
  url: https://arxiv.org/abs/2608.17597
  category: safety
  subcategory: experiment
  authors:
  - Yajing Bai
  - Jinhao Duan
  - Jie Peng
  - Xianfeng Wu
  - Sijia Liu
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Large language models are increasingly deployed through agent harnesses
    that manage tools, extensions, persistent state, permissions, and external actions.
    Existing safety benchmarks mainly target individual attack mechanisms or a limited
    subset of operational settings, making it difficult to compare how safety failures
    emerge across different harness responsibilities. We present HarnessRisk, a lifecycle
    oriented benchmark that organizes agent harness safety into six operational phases
    including Harness Configuration, Capability Extension, Runtime Operation, State
    Persistence, Action Control, and Incident Recovery. HarnessRisk contains 128 sandboxed
    cases, each pairing a benign user objective with an adversarial instruction embedded
    in an untrusted workflow artifact. We evaluate each trajectory using Utility,
    Attack Success Rate, Persistence, and Detection. Across three harnesses, six language
    models, and 14 model and harness configurations, attack success ranges from 12.6%
    to 80.9%, while Utility remains between 75.0% and 97.6%. Harness Configuration
    is the most vulnerable phase across all three harnesses, showing that attacks
    can succeed by altering security sensitive parameters within otherwise authorized
    workflows. We also find that explicit risk recognition does not reliably lead
    to safe action, as some configurations detect risks in more than 90% of runs while
    retaining substantial attack success. These results highlight the need to evaluate
    agent safety across multiple harness responsibilities and at the level of the
    deployed model and harness configuration.

    '
  tags: []
- title: Where Does Exactly-Once Live? Model, Harness, and Tool-Contract Effects on
    Duplicate Side Effects in LLM Agents
  date: 2026-09
  url: https://arxiv.org/abs/2609.29095
  category: method
  subcategory: experiment
  authors:
  - Jiapeng Li
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'When a tool-using agent''s write times out or returns a server error,
    the action may already have taken effect. Retrying blindly duplicates it -- a
    second charge, a second announcement, a second deployment -- while giving up skips
    required work. We ask where exactly-once behaviour should be enforced: in the
    model, in the agent harness, or in the tool contract. We introduce LIMBO, a deterministic
    sandbox of six services with realistic contracts (optional idempotency keys, eventually
    consistent and missing read paths) and twelve fault modes injected at the service
    boundary, including late commits, redelivery and partial batches; every episode
    is graded against a ledger of committed effects. Across 25,930 episodes spanning
    nine recent models, three production agent harnesses, two contract variants and
    fifteen recovery conditions, the answer depends on the fault. When an immediate
    read-back can reveal what happened, the model decides: frontier models instructed
    to act exactly once almost never duplicate a write whose acknowledgement was lost
    (0.5%), weaker models often do, and the model explains 53% of the explained variance.
    When it cannot -- the request is still in flight, or the transport delivered it
    twice -- the same frontier models duplicate in 56% and 74% of episodes, and the
    contract explains 81%. We prove that no verification-only policy is exactly-once
    under late commits without a bound on in-flight time. Waiting works when such
    a bound is short and known, but with heavy-tailed in- flight delays even an hour
    of waiting per episode falls short of offering an idempotency key on every write,
    which lowers the duplicate rate from 28% to 4% because agents use keys when they
    exist. The harness barely matters, a guard that attaches keys transfers across
    harnesses unchanged, and agents reported success in 90% of the episodes in which
    they had duplicated an effect.

    '
  tags: []
- title: 'The Empire, Long Divided, Must Unite: Architectural Convergence in Three
    LLM Agent Harnesses'
  date: 2026-08
  url: https://arxiv.org/abs/2608.23953
  category: survey
  subcategory: survey
  authors:
  - Dai Jiahong
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'An agent harness is what turns a language model into an autonomous agent:
    the surrounding code that builds the model''s context, mediates its tools, runs
    the loop, and persists state across a long-horizon run. This layer, not the model
    it wraps, is increasingly the binding constraint on agent behaviour. We present
    a source-level, multi-case study of three open coding-agent harnesses built from
    deliberately opposing philosophies: LangChain''s deepagents (batteries-included),
    Earendil''s pi (radical minimalism), and DeepSeek''s dsh (everything-is-a-plugin).
    Reading each at a pinned commit and following its commit history, we find that
    the two mature harnesses have travelled in opposite directions (deepagents subtracting
    authored scaffolding, pi accreting durable infrastructure), yet converged toward
    one architectural middle form of five recurring elements: a commoditised loop,
    an append-only replayable session record, model quirks kept as data, progressive
    disclosure of context, and explicit extension seams. A third harness, read afterward
    as a held-out check, exhibits all five, and in one seam reuses another''s implementation
    outright. We therefore do not claim independent invention, and decompose the convergence
    into parallel discovery, diffusion, and literal reuse. Finally, one load-bearing
    dimension shows no convergence, and indeed no presence: external verifiability,
    a tamper-evident record an outside party can check without trusting the runtime.
    We read this absence not as an oversight but as a predictive gap, the next axis
    on which harnesses for provenance-sensitive domains will differ.

    '
  tags: []
- title: 'MESH-Harness: Self-Improving Agent Harnesses via Bandit-Guided Compositional
    Evolution'
  date: 2026-10
  url: https://arxiv.org/abs/2610.05300
  category: method
  subcategory: systems
  authors:
  - Zhiwei Shang
  - Yu Huo
  - Mingrong Gong
  - An Yan
  - Zikun Qu
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'An agent harness is the code that organizes context, maintains state,
    and coordinates tool calls for a language model. We study how to improve the harness
    under a limited evaluation budget while keeping model weights fixed. Our method,
    MESH-Harness, organizes each harness into functional modules with explicit role-specific
    interfaces, allowing alternative implementations of each module to be substituted
    and recombined. It uses shared module representations and full-covariance LinUCB
    to score candidate combinations based on predicted performance and exploration
    value. Mixed-start coordinate ascent selects complete configurations for evaluation
    without enumerating the combinatorial space. Validation traces then guide local
    code edits, and the resulting candidates are incorporated into fixed-capacity
    role-specific pools for subsequent recombination. On text tasks, retrieval-augmented
    mathematical reasoning, code generation, and interactive scientific tasks, MESH-Harness
    outperforms Meta-Harness by 5.70, 7.01, 2.00, and 5.00 points, respectively, under
    matched candidate-evaluation budgets. Iterative harness optimization improves
    MESH-Harness by 5.63-7.79 points over its first-round configurations. For the
    reported configurations, aggregate test-time cost is 44.2% lower than that of
    Meta-Harness, while total cost including search is 14.6% lower. These results
    show that combining module-level design reuse with feedback-driven compositional
    search can systematically improve agent harnesses while keeping overall optimization
    cost under control.

    '
  tags: []
- title: 'Trial by Trace: Benchmarking AI Agent Harnesses for Reliability and Failure
    Attribution'
  date: 2026-10
  url: https://arxiv.org/abs/2610.32285
  category: evaluation
  subcategory: experiment
  authors:
  - Zhiyong Cao
  - Hengjie Zhu
  - Yongxin Wang
  - Xuchen Li
  - Jintao Li
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'LLM agents are increasingly used to solve real-world problems, and their
    effectiveness depends on both the underlying models and the harnesses that support
    their operation. However, most existing benchmarks focus on model capabilities
    and overall agent performance, with limited attention to the evaluation of agent
    harnesses. To address this gap, we introduce TraceTrial- Bench, which organizes
    harness reliability into seven components covering context, execution, governance,
    lifecycle, observability, tools, and verification. We construct 95 expert-level,
    mechanism-oriented tasks with executable or state-based ground truth to support
    semantically equivalent comparisons while preserving the native behavior of each
    harness. We design a Trajectory Tracing (TT) module to capture agent execution
    traces and introduce a two-layer evaluation framework that separately assesses
    agent performance and harness reliability. In addition, we design a Multi-source
    Evidence Acquisition (MEA) module to provide evidence from the agent context,
    harness, and execution environment for LLM-based evaluation, and develop a Failure
    Attribution (FA) module that uses explicit mechanism chains to support attribution
    at the run level. Across 4 harnesses, 9 models, and 95 tasks, our evaluation of
    3,420 runs yields macro-averaged harness scores ranging from 59.8% to 72.0%, while
    31.1% of runs achieve task success despite failing at least one harness criterion.
    TraceTrial-Bench provides an auditable and reproducible foundation for comparing
    agent harnesses, diagnosing their failures, and studying how harness design interacts
    with model behavior.

    '
  tags: []
- title: 'Mingbird: A Local-First Agent Harness Enabling Small Open Models to Complete
    Real Tasks'
  date: 2026-10
  url: https://arxiv.org/abs/2610.02001
  category: runtime
  subcategory: development
  authors:
  - Hao Wang
  - Ting Huang
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Small open-weight models (2-9B) run on ordinary laptops, but under cloud-scale
    agent harnesses they rarely complete real tasks: tool prefill overflows the context,
    self-correction diverges, tool demonstrations loop, and tasks are silently abandoned.
    We present evidence, from a controlled single-machine comparison and one third-party
    benchmark, that a substantial share of these failures is attributable to the harness
    rather than the model. We introduce Mingbird, a local-first agent harness for
    Windows and Ollama whose ten mechanisms compensate point-by-point for small-model
    failure forms, three of them representative: a byte-level net-zero prefill budget,
    a finish gate that re-reads the task before accepting completion, and signature-level
    loop detection. On LRAB, a controlled comparison holding machine, models, budgets,
    and scoring fixed (4 harnesses \times 4 open models (2B-35B) \times 18 real tasks,
    deterministic artifact scoring), Mingbird reaches 0.886 overall against 0.631
    (goose), 0.479 (opencode), and 0.405 (agent-mini), with all 288 cells published;
    on τ²-bench (278 tasks, three arms, one protocol) it totals 0.856 against 0.791
    and 0.737; and a frontier-model probe on the same 18 tasks spans 0.997 to 0.478
    across harnesses, with well-formed scaffolds staying within 0.072 of each other.
    A leave-one-mechanism-out ablation is reported as directional only: same-night
    replications of the same arm move its mean by up to 0.069, the size of every nominal
    single-trial delta, and the one batch-matched comparison (full mechanism stack
    versus text re-read alone) gives the executable completion guards a paired +0.10
    across three replications. The evidence carries stated limits: a self-built benchmark,
    a single machine, and single-trial scoring.'
  tags: []
- title: 'openJiuwen: Beyond Static Harnesses for Long-Horizon Coding Agents'
  date: 2026-08
  url: https://arxiv.org/abs/2608.27969
  category: runtime
  subcategory: systems
  authors:
  - Tao Yu
  - Xinyu Zhang
  - Qianqian Chen
  - Xiaoneng Xiang
  - Chia Kwangyang
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Long-horizon coding agents operate over evolving repository states while
    increasingly relying on heterogeneous capabilities, delegated agents, and multi-agent
    coordination. These trends pose two complementary challenges for the agent harness.
    First, developers need to compose capabilities, reconfigure execution logic, and
    scale increasingly complex agent systems without repeatedly rebuilding orchestration.
    Second, complex coding tasks continuously produce new evidence---such as semantic
    diagnostics, execution outcomes, task progress, and changing context relevance---that
    should dynamically influence subsequent runtime decisions. We characterize these
    challenges as Structural Composability and Runtime Adaptivity. We present openJiuwen,
    an open-source harness designed for both developer composability and adaptive
    task execution. openJiuwen provides a shared execution substrate and Rail-based
    capability composition across single agents, delegated sub-agents, and Swarm Flow,
    enabling developers to construct sophisticated agent harnesses under common execution
    semantics. It further adapts framework-controlled runtime decisions around a fixed
    model policy, allowing evolving evidence to dynamically affect context, feedback,
    and task control toward successful completion. We systematically evaluate openJiuwen
    on SWE-bench Verified and Terminal-Bench 2.1, where it achieves 82.6% and 87.19%,
    respectively, exceeding the strongest selected official-leaderboard point estimates
    by 3.4 and 3.39 percentage points. These results show that openJiuwen achieves
    strong performance on complex coding tasks while providing a composable and adaptive
    harness design.

    '
  tags: []
- title: 'MemoHarness: Agent Harnesses That Learn from Experience'
  date: 2026-07
  url: https://arxiv.org/abs/2607.14159
  category: runtime
  subcategory: systems
  authors:
  - Yue Huang
  - Wenjie Wang
  - Han Bao
  - Yuchen Ma
  - Xiaonan Luo
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'An agent harness is the external control layer that turns a base LLM
    into an executable agent by managing context, tools, orchestration, memory, decoding,
    and output handling. While harness design strongly affects agent behavior, most
    automatic improvement methods optimize narrower artifacts such as prompts, pipelines,
    or workflows, and deployed agents usually reuse a single global harness for all
    cases. We introduce MemoHarness, an adaptive harness optimization framework that
    learns from its own executions. MemoHarness decomposes the harness into six editable
    control dimensions, stores per-case diagnoses and distilled global patterns in
    a dual-layer experience bank, and adapts the learned harness to each test case
    using retrieved experience without test-time labels, feedback, or additional search.
    In our evaluation across shell-agent, code-generation, and analytical-reasoning
    benchmarks, MemoHarness improves over the fixed harnesses we compare against and
    shows selective transfer to unseen suites and base models. Its additional context
    can also remain cost-competitive when much of the retrieved experience is cacheable.
    These results provide evidence that execution experience is a practical substrate
    for building agent harnesses that are more adaptive than a single static configuration,
    while leaving broader claims about statistical robustness and component attribution
    to future work.

    '
  tags: []
- title: 'AgentRewind: Recoverable Execution for Long-Horizon LLM Agents'
  date: 2026-08
  url: https://arxiv.org/abs/2608.14380
  category: runtime
  subcategory: method
  authors:
  - Yu Zhuang
  - Kefei Chen
  - Yitong Duan
  - Shuxin Zheng
  - Jian Li
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Many real-world tasks require LLM agents to interact with their environments
    over long execution horizons. Errors that occur early in execution may propagate
    through both the agent context and environment state, and their effects may be
    difficult to reverse through subsequent actions. Existing methods mainly seek
    to reduce such errors through plan refinement and safety checks but provide little
    support after errors occur. To enable recovery during long-horizon execution,
    we present AgentRewind, a runtime recovery framework that records aligned checkpoints
    of the agent context and controlled environment, allowing agents to return to
    an earlier state and resume execution with information from previous attempts.
    We also construct MettleBench, a benchmark for evaluating task completion and
    partial progress on long-horizon engineering assignments containing a series of
    related requirements. Experiments across tasks, multiple models, execution strategies,
    and agent harnesses show that AgentRewind improves task success rate and average
    checklist progress over the compared baselines.

    '
  tags: []
- title: 'Trace-to-Architecture: Capability Bottleneck Diagnosis for Harness Revision'
  date: 2026-10
  url: https://arxiv.org/abs/2610.16725
  category: method
  subcategory: method
  authors:
  - Wenfeng Wang
  - Jianrui Shi
  - Mingang Guo
  - Jiayuan Ma
  - Yuqi Lu
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Improving an LLM agent requires knowing what to change when it fails.
    Similar failures can require different fixes, and resolving one problem can expose
    another. We introduce Trace-to-Architecture (T2A), a framework that uses execution
    trajectories to determine what to change in an agent''s harness and when those
    changes apply. A development agent diagnoses failures using execution evidence
    from successful and failed tasks, revises the corresponding harness components,
    and then checks whether target tasks improve, selected successful tasks remain
    successful, and the edits are actually triggered. New execution evidence guides
    subsequent diagnosis and revision. Across ALFWorld, ScienceWorld, and AppWorld,
    T2A achieves the highest aggregate score for all three evaluated task agents,
    exceeding their respective strongest baselines by 6.2--30.3 points. We also integrate
    T2A''s diagnosis and validation procedures into Meta-Harness, improving the resulting
    harnesses'' mean ScienceWorld score by 21.6 points from the same starting harness.

    '
  tags: []
- title: Rethinking Verification in Agent Harnesses
  date: 2026-10
  url: https://arxiv.org/abs/2610.34577
  category: evaluation
  subcategory: method
  authors:
  - Zhengxin Zhang
  - Erkang Zhu
  - Yin Lin
  - Claire Cardie
  - Bolin Ding
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Agent harnesses enable large language models to act through tools, observe
    the results, and iteratively work toward a task goal. Verification checks and
    revises agents'' work to improve output quality. Yet there is limited guidance
    on how harnesses should organize this effort. We study verification as an axis
    of test-time scaling by examining when to intervene, who checks the work, and
    how checking leads to revision. Our framework spans four layers of the agent lifecycle:
    initial instructions, mid-turn reminders, completion gates, and independent review.
    We compare 17 designs across seven frontier coding models on Terminal-Bench (TB)
    and SWE-bench Verified (SWE), and introduce VisualBench for expert evaluation
    of visual and interactive artifacts. Initial instructions and execution-time reminders
    yield modest, model-dependent average gains on the coding benchmarks, without
    substantially increasing average output token use. Completion gates can yield
    larger gains but may substantially increase cost. Independent review by a critic
    offers a more favorable accuracy-cost tradeoff, improving average accuracy by
    5.9-9.5 percentage points on TB and 3.9-6.6 on SWE at 1.13-1.25 and 1.00-1.04
    times baseline cost, respectively. On VisualBench, independent review achieves
    net preferences of 13.2-23.8 points over the baseline across its four designs,
    exceeding the evaluated L0-L2 designs. Additional review rounds or independent
    critics further improve average TB accuracy by up to 3.5 percentage points. Together,
    these results provide empirical guidance for verification design in agent harnesses
    and support independent review as a practical axis of test- time scaling.

    '
  tags: []
- title: 'Profiling a Frontier Agent with EBench: From Direct Control to Harness with
    Policy'
  date: 2026-10
  url: https://arxiv.org/abs/2610.35832
  category: evaluation
  subcategory: method
  authors:
  - Yifei Yao
  - Yude Zou
  - Guanbo Jiao
  - Xing Gao
  - Ning Gao
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Frontier multimodal large language models (MLLMs) can control robots
    without robot-specific training, but how their capabilities compare and interact
    with post-trained vision-language-action (VLA) and world action model (WAM) policies
    across manipulation demands remains to be thoroughly evaluated. In this report,
    we evaluate GPT-6-Astra on EBench as the core of an agent that controls a robot
    through an agent harness under the same visual and proprioceptive observation
    protocol as post-trained policies. We study two agent configurations: direct control,
    in which the agent generates waypoint commands directly, and harness with policy,
    in which it can also invoke a post-trained VLA or WAM policy for action execution.
    Under direct control, the agent achieves competitive overall performance relative
    to post-trained policies. It leads on short-horizon tasks and exhibits the least
    performance variation across generalization dimensions, whereas it underperforms
    post- trained policies on long-horizon tasks, tabletop manipulation, and high-
    precision contact-rich tasks. In the harness with policy, invoking a post- trained
    VLA or WAM combines the complementary strengths of both components, raising overall
    task success to the level of the strongest compared post- trained policies while
    substantially reducing token cost. However, performance remains below the per-task
    upper bound of the standalone components due to suboptimal policy invocation,
    fixed-instruction execution without subgoals, and grasp disruption when the agent
    resumes control. Overall, our study characterizes the capability boundary of a
    frontier MLLM agent and suggests directions for improving future agent harness
    design. Project page: https://internrobotics.github.io/EBench-Astra-Tech-Report/

    '
  tags: []
- title: 'Rethinking Multi-Agent Collaboration: When More Is Less'
  date: 2026-09
  url: https://arxiv.org/abs/2609.19759
  category: orchestration
  subcategory: method
  authors:
  - Yishuo Yuan
  - Yibo Wu
  - Yihan Zhang
  - Minyuan Sun
  - Shenliang Li
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'The rapid advancement of large language models and single-agent harnesses
    has reshaped the landscape of autonomous systems, raising a critical question
    of when multi-agent collaboration offers genuine value. As individual agent capabilities
    continue to scale, multi-agent collaboration faces diminishing returns while incurring
    growing context overhead. Through systematic analysis, we delineate the capability
    boundaries of multi-agent collaboration relative to single-agent alternatives,
    showing that it confers systematic benefits specifically in long-horizon tasks
    with sparse dependencies, while single- agent harnesses remain superior in tightly
    coupled, sequential workflows. Building on these insights, we propose SAIGE, a
    lightweight multi-agent collaboration mechanism based on Semantic-Aware Incremental
    Graph Evolution. SAIGE models collaboration as a dynamically evolving graph, where
    nodes are agent instances spawned on demand and edges encode semantic dependencies
    established through content-based information retrieval. Experiments on long-
    horizon, complex task benchmarks show that SAIGE achieves a favorable trade- off
    between context efficiency and task performance, and that scaling the agent pool
    or deepening the recursion level does not consistently improve outcomes. Our findings
    suggest that multi-agent superiority is bounded by task structure rather than
    universal, and that more agents do not necessarily make a system more intelligent.

    '
  tags: []
- title: 'HarnessSafe: Evaluating Safety Across Persistent Carriers in Agent Harnesses'
  date: 2026-08
  url: https://arxiv.org/abs/2608.06984
  category: safety
  subcategory: experiment
  authors:
  - Xiao Zhang
  - Yusheng Wang
  - Yuhao Fei
  - Dongyuan Li
  - Zian Liang
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Modern agent harnesses persist state across tasks and sessions through
    persistent carriers like memory, skills, tools, and shared artifacts. However,
    this capability creates delayed safety risks: attacker-influenced content can
    cross system boundaries and later affect the execution of a benign request. Existing
    benchmarks typically focus on a few carriers or harnesses, while end- to-end attack-success
    rates reveal little about how risks propagate. To this end, we present HarnessSafe,
    a benchmark comprising 328 executable cases across seven persistent-carrier families
    and evaluated on most mainstream agent harnesses. Each case is specified as a
    Persistent-Risk Lifecycle that traces attacker influence from its initial entry,
    through persistence across carriers and system boundaries, to a later benign trigger
    and an observable violation. We further introduce a multi-stage, trace-based evaluation
    that uses observable execution evidence to determine how far each attack chain
    progresses and where it is stopped. Experiments show that containment is carrier-specific
    and strongly depends on the harness-model configuration. Both the harness and
    model backend substantially shape containment outcomes, while attack success rates
    cannot reflect distinct lifecycle progression patterns.

    '
  tags: []
- title: Context Compaction for World Models
  date: 2026-10
  url: https://arxiv.org/abs/2610.38980
  category: context
  subcategory: method
  authors:
  - Hayder Tirmazi
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'World models let observers explore and interact with generated worlds.
    Recent work shows that when observers revisit a region, current models often fail
    to regenerate it consistently. We view this as a context retrieval problem. LLM
    agents manage context retrieval at two layers of their stack. At the model layer,
    the KV cache design determines how much context fits in memory. At the agent harness
    layer, harnesses such as Claude Code pick the context sent to the LLM. Prior work
    on world models has mostly focused only on the model layer. In this paper, we
    make three contributions. First, we build a benchmark to measure world model context
    retrieval. It generates new worlds for every episode, preventing a model from
    recalling rooms using training data. It also separates context retrieval from
    guesses based on nearby frames. Second, we build an agent harness that performs
    context compaction for world models, which to our knowledge no prior work has
    studied. Third, we use our benchmark to study four world model designs. Context
    compaction lets our world models retrieve rooms up to 4 times beyond their context
    window without retraining. However, world models with sliding-window attention
    lose most of their context retrieval when dreaming. Therefore, a dreaming world
    agent benefits more from extending the reach of its world model using context
    compaction than switching to sliding window attention at the model layer.

    '
  tags: []
- title: 'Beyond Skill Evolution: Self-Evolving Context Management Policies for Long-Horizon
    Agent Harnesses'
  date: 2026-09
  url: https://arxiv.org/abs/2609.34649
  category: context
  subcategory: method
  authors:
  - Weiyuan Li
  - Jinghan Xu
  - Aili Chen
  - Xintao Wang
  - Shuang Liang
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Harness evolution improves LLM agents by learning from execution trajectories,
    but existing experience- and skill-based methods are less effective on long- horizon
    tasks. As interactions grow, useful evidence can be buried by redundant or outdated
    context, making context management itself a key bottleneck. We introduce ContextEvo,
    a framework that learns a context policy from long-horizon trajectories. ContextEvo
    reconstructs the model-visible context at key decision points, identifies context-related
    failures, and applies targeted policy updates. Starting from the open-source Pi-agent
    harness, ContextEvo improves performance across three long-horizon task benchmarks,
    achieving results comparable to or better than several prominent agent harnesses,
    including Codex, OpenCode, and OpenClaw. Additional analyses show that fixed or
    locally evolved context strategies can fall short under long-horizon information
    pressure, while our methods adapt to the information demands of each environment.

    '
  tags: []
- title: 'Optimize the Harness, Not the Model: Fitting a Minimal Agent to a Self-Hostable
    LLM for Investigative Analysis'
  date: 2026-11
  url: https://arxiv.org/abs/2611.03434
  category: method
  subcategory: method
  authors:
  - Shai Nahum Gefen
  - Vered Chassida
  - Dmitry Basin
  - Guy Feigenblat
  venue: CIKM 2026
  code_url: ''
  project_url: ''
  abstract: 'Government intelligence teams need LLM agents that can analyze large,
    messy evidence collections, but security and cost constraints often rule out hosted
    frontier models and broad, hard-to-audit tool surfaces. We report CLEO: Constrained
    Loop for Environment Optimization, a method for fitting a minimal agent harness
    to a fixed, self-hostable LLM. Given an expert-validated dataset, CLEO admits
    only the tools, guardrails, memory policies, and loop components that improve
    accuracy while remaining general and auditable. On our held-out dataset, the CLEO
    harness reaches an 83.8% pass rate, within 1.2 points of the strongest out-of-the-box
    Claude Code SDK baseline, while being two orders of magnitude smaller.

    '
  tags: []
- title: Do Agents Still Follow the Rules? Benchmarking Rule Compliance under Agent
    Context Compaction
  date: 2026-11
  url: https://arxiv.org/abs/2611.03223
  category: evaluation
  subcategory: experiment
  authors:
  - Yiwei Zha
  - Qingyu Meng
  - Herbert Bos
  - Min Chen
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'LLM agents compact long histories to fit their context windows, but the
    compacted context must still carry the operating rules that govern later actions.
    Prior work shows that violations rise after compaction, but measures compliance
    outside a complete agent harness and does not identify where each violation comes
    from. We introduce ARCBench(Agent Rule Compliance Benchmark), a configurable benchmark
    built on the open-source pi agent harness. Its tool- calling agent loop lets us
    measure rule compliance from actions taken during execution, bringing the evaluation
    closer to deployed agent workflows. Using ARCBench, we examine where violations
    after compaction come from, and how different compaction configurations and adversarial
    settings change their sources. We find that compaction rarely deletes the rule:
    most violations after compaction occur while the rule is still in the compacted
    history, with the agent treating a later request as permission, ignoring the rule,
    and proceeding anyway. Where violations come from depends on the configuration:
    how the rule is delivered decides whether the agent would break it even without
    compaction, while the compaction strategy and budget decide whether the rule survives.
    The strongest compactor-targeted attack more than doubles violations by corrupting
    the rule in the summary and changing how the agents behave, whereas the strongest
    defense restores the rule in most summary but still violates. Finally, retaining
    a rule does not guarantee compliance: compacted runs that retain the rule violate
    more than twice as often as runs with the full history.

    '
  tags: []
- title: 'LEGO-RL: Harness-Native Reinforcement Learning for Coding Agents'
  date: 2026-08
  url: https://arxiv.org/abs/2608.17393
  category: method
  subcategory: method
  authors:
  - Yiming Du
  - Yuxin Jiang
  - Tao Yuan
  - Jianbo Dai
  - Shaowei Wang
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Reinforcement learning for coding agents increasingly relies on long-running
    agent harnesses to manage tool integration, repository contexts, and execution
    feedback. However, the native execution environments of these harnesses are inherently
    misaligned with policy-gradient training: environmental crashes and reward hacking
    corrupt outcome signals, while train-inference discrepancies decouple rollout
    behavior from policy updates. To address this, we present LEGO-RL, a framework
    that bridges native coding-agent harnesses with scalable policy-gradient optimization
    without modifying their internal control flow. LEGO-RL is built upon three pillars:
    (1) faithful optimization via in-process LLM proxying that captures raw generation
    streams for token-level alignment and robust trainer-side log-probability recomputation,
    even under harness-side compaction or re-serialization; (2) reliable execution
    via scalable sandbox orchestration featuring image caching and stage-wise defenses
    to mitigate reward hacking; and (3) observable training through an integrated
    plugin that automates validation and monitoring, paired with a Live UI for granular
    trajectory diagnostics. We evaluate LEGO-RL by training the sparse MoE model Qwen3.5-35B-A3B
    with GSPO across three native coding-agent harnesses. LEGO-RL improves Qwen3.5-35B-A3B
    across OpenHands SDK (64.0% to 70.4%), Claude Code (62.4% to 68.2%), and OpenCode
    (57.2% to 66.6%) on SWE-bench Verified, while maintaining a rollout-training probability
    correlation above 0.99.

    '
  tags: []
- title: 'HASTE: Evolving Agent Harnesses Against Emerging Attacks Using Sparse Evidence'
  date: 2026-10
  url: https://arxiv.org/abs/2610.02920
  category: safety
  subcategory: method
  authors:
  - Xiqiao Xiong
  - Moxin Li
  - Zhixin Ma
  - Ouxiang Li
  - Wenjie Wang
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Agent harnesses play a critical role in defenses by enforcing safety
    constraints to prevent unsafe actions. However, rapidly emerging attacks outpace
    manual harness adaptation, motivating automated harness evolution. Yet the signals
    available for harness evolution are often sparse, such as brief descriptions or
    a few attack examples in threat reports and preprints. To address this limitation,
    we introduce HASTE, a multi-agent framework that evolves agent harnesses from
    sparse threat evidence through an adversarial interplay between safety-specification
    generation and attack-case generation. Safety specifications guide harness updates
    toward addressing identified safety vulnerabilities, while attack cases probe
    for remaining safety vulnerabilities after each update. By feeding evaluation
    outcomes back into both processes, HASTE enables harness evolution against emerging
    attacks beyond the initially observed evidence. Experimental results across multiple
    backbone models, attack types, and evidence forms show that HASTE consistently
    reduces attack success rates while preserving benign-task utility. The code is
    available at https://github.com/xxiqiao/HASTE.

    '
  tags: []
- title: Can Coding Agents Sustain Continual Evolution without Forgetting?
  date: 2026-11
  url: https://arxiv.org/abs/2611.03219
  category: runtime
  subcategory: method
  authors:
  - Shangziqi Zhao
  - Yitong Zhang
  - Jia Li
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Recently, harness self-evolution has emerged as an important paradigm
    for improving agent performance. Prior studies show that evolving the agent harness
    can effectively enhance agent capabilities without modifying the foundation model''s
    parameters. We find that existing approaches largely study agent evolution on
    a single task. In practice, coding agents may need to handle multiple task types
    over time. Whether an agent harness can continuously evolve across multiple tasks
    without suffering from catastrophic forgetting remains an important open question.
    In this paper, we investigate this open question through a comprehensive empirical
    study of continual harness self-evolution. We organize three software engineering
    task datasets into six different evolution directions and apply two representative
    harness evolution methods to perform continual evolution along these directions.
    Our experimental results show that evolution on a subsequent dataset can substantially
    undermine the performance on previously seen datasets. For example, with DeepSeek-V4-Flash-0731,
    Meta-Harness improves its performance on SWE-Bench to 94.0% after evolution. However,
    after further evolution on FeatureBench, its performance on SWE-Bench drops to
    32.0% by the fifth round, corresponding to a 66% relative decrease. Finally, based
    on our experimental findings, we identify several insights, providing directions
    for the continual self-evolution of agent harnesses. Code is available at https://github.com/THU-Agent/continual-harness-evolution.

    '
  tags: []
- title: 'LongHarness: Advancing Agentic Reasoning over 100M-Token Corpora via Stateful
    Evidence Management'
  date: 2026-10
  url: https://arxiv.org/abs/2610.13075
  category: context
  subcategory: systems
  authors:
  - Songtao Huang
  - Zhijie Zhong
  - Xiaohan He
  - Shuaiyu Zhang
  - Zhiyin Yu
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Corpus-level long-context reasoning requires agents to acquire and integrate
    evidence across document collections that exceed their context windows. Existing
    agent harnesses enable incremental access to these corpora, but acquired evidence
    and evolving conclusions often remain entangled in a growing interaction history.
    This implicit state management can lead to two coupled failure modes: unbounded
    exploration, where retrieval expands the interaction history without resolving
    decision-relevant information gaps, and evidence- state drift, where previously
    acquired evidence or subsequent corrections fail to inform the current conclusion.
    We present LongHarness, a model-agnostic harness that makes the interaction between
    acquired evidence and evolving conclusions explicit. Its core mechanism, Evidence-Conclusion
    Coevolution, uses unresolved conclusions to guide exploration toward missing information,
    while newly acquired evidence strengthens or revises the conclusions that directed
    the search. LongHarness couples this process with Evidence Lifecycle Management,
    which keeps accumulated evidence current and traceable throughout the interaction.
    Together, these mechanisms focus retrieval on remaining information needs and
    keep conclusions aligned with current evidence. We evaluate LongHarness on OfficeQA
    Pro V1 and V2, AA-LCR, and LongBench v2 using GLM-5.3-Flash and Qwen3.8-Flash.
    Compared with direct reasoning using the same backbone, LongHarness improves GLM-5.3-Flash
    exact match on OfficeQA Pro from 15.8% to 60.2% on V1 and from 4.4% to 61.1% on
    V2. Against state-of-the-art agent harnesses, it surpasses Claude Code by 12.0
    percentage points on V1 and Codex by 18.9 points on V2. With Qwen3.8-Flash, LongHarness
    reaches 61.7% on V1, outperforming Claude Code by 8.3 points and Codex by 12.0
    points.

    '
  tags: []
- title: 'RRSI: Regularized Recursive Self-Improvement of Agent Harnesses'
  date: 2026-09
  url: https://arxiv.org/abs/2609.24972
  category: method
  subcategory: systems
  authors:
  - Peng Xia
  - Rujun Han
  - Zifeng Wang
  - Yanfei Chen
  - Yufan Zhuang
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'An LLM agent''s capability is largely magnified by its harness, namely
    the prompts, control flow, tooling, memory, and context management surrounding
    the frozen backbone model. Recent methods increasingly automate this process by
    iteratively proposing and selecting component-wise edits of an agent harness,
    practically establishing a form of recursive self-improvement (RSI) at the agent-system
    level. However, such recursive evolution may overfit by memorizing the training
    tasks, showing large in-distribution gains that shrink or even vanish on out-of-distribution
    benchmarks. We introduce Regularized Recursive Self-Improvement of Agent Harnesses
    (RRSI), which incorporates the principles of regularizations into harness self-improvement
    by constraining the evolution candidate proposal and selection. The proposer operates
    with a temporally annealed budget, limiting how many edits a candidate can bundle,
    and it encourages unexplored trajectories based on evolution history. The selector
    is equipped with a critic and a pruner: the critic screens benchmark- specific
    proposals, while the pruner, removes changes that are too small, too expensive,
    or no longer useful. Together these constraints favor reusable agent mechanisms
    over benchmark-specific ones or even noises. Across eight benchmarks spanning
    coding, agentic workspace and engineering design tasks, RRSI gains up to 6.0 points
    on the split it evolves against and up to 4.3 points on the five out-of-distribution
    benchmarks, while producing a harness that runs on 30% fewer policy tokens than
    the unregularized evolution. Code is available at https://github.com/google-research/rrsi
    and project page is https://regularized-rsi.com/.

    '
  tags: []
- title: 'Harness-Zero: Harness Distillation via Agent-as-Harness'
  date: 2026-09
  url: https://arxiv.org/abs/2609.24974
  category: method
  subcategory: method
  authors:
  - Haoran Ye
  - Yuxing Lu
  - Haonan Dong
  - Zhaochen Su
  - Guojie Song
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Agent harnesses, the external systems that mediate model-environment
    interaction, can substantially improve agent performance, but their gains remain
    tied to the harness at deployment. Because the best harness varies across domains,
    instances, and models, a general-purpose agent must either settle for a suboptimal
    shared harness or route among an ever-growing set of specialized ones. We therefore
    study agent harness distillation: using a domain- or instance-optimized harness
    as training-time guidance and transferring the behaviors it induces into model
    weights, so that its gains survive under a single fixed target harness. The challenge
    is that the two harnesses differ in action space and available information, so
    guidance from the optimized harness cannot serve directly as supervision for the
    target one. We introduce Harness-Zero, which enables harness distillation through
    agent- as-harness. Guided by the optimized harness, a harnessing agent corrects
    student responses before execution in the target harness''s action space, turning
    harness guidance into training demonstrations. Fine-tuning on the resulting trajectories
    internalizes harness-induced behavior into the model, so the specialized harness
    can be removed at deployment. Our experiments spanning knowledge work, tool use,
    and science domains show that: (1) For frontier LLMs using the same evolved harness,
    agent-as-harness outperforms code-as-harness. (2) With the specialized harness
    removed at deployment, Harness-Zero improves the base model''s macro-average task
    success from 23.3% to 44.3%, even exceeding the 41.7% it reaches with that harness
    still attached. (3) Harness-Zero recovers harness-induced behaviors absent from
    the base model, with 82.3% average recovery across 28 patterns in the three domains.

    '
  tags: []
- title: 'Forging More Tasks into Better Harnesses: Agentic Harness Evolution via
    Successive Scale Racing'
  date: 2026-10
  url: https://arxiv.org/abs/2610.28815
  category: method
  subcategory: method
  authors:
  - Jingzhe Liu
  - Jiliang Tang
  - Tong Zhao
  - Neil Shah
  - Clark Mingxuan Ju
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Agentic harness evolution optimizes an agent''s instructions, tools,
    and control flow by using its task execution experiences as evolving evidence.
    While more evolution tasks should intuitively improve performance, our preliminary
    study reveals a paradoxical failure mode: the performance of existing methods
    degrades as the task pool expands. Our further analysis demonstrates that this
    degradation stems from suboptimal evidence selection during optimization, as different
    evidence combinations lead to substantially different evolution outcomes. To address
    this issue, we propose Successive Scale Racing (SSR), a framework that adaptively
    searches for optimal evidence combinations in each evolution round. SSR constructs
    diverse evidence combinations based on the corresponding task quality and coverage,
    and efficiently races the resulting candidate harnesses under a small compute
    budget. Empirically, across three distinct benchmarks, SSR achieves state-of-
    the-art results in all six configurations. Notably, as the task pool grows from
    40 to 200, SSR steadily improves the pass rate from 64.3% to 68.3%, while the
    baselines'' performances all drop. Furthermore, its racing mechanism identifies
    near-optimal candidates while reducing validation executions by 60%.

    '
  tags: []
- title: 'Representation Affects Retrieval: A Case Study of Skill Discovery and Routing
    in a Multimodal Agent Harness'
  date: 2026-06
  url: https://arxiv.org/abs/2608.20389
  category: method
  subcategory: experiment
  authors:
  - Kevin Dela Rosa
  venue: SIGIR 2026
  code_url: ''
  project_url: ''
  abstract: 'A production agent harness must discover and rank, from a growing library
    of skills, the one most appropriate for a user''s task. At small scale this selection
    happens in context: the LLM planner chooses among skill representations exposed
    in its system prompt, without an explicit embedding- based retrieval step. We
    treat this in-context selection as the small-N counterpart to embedding-based
    skill retrieval at scale, and present a case study of how Tinycloud, a production
    multimodal video agent harness, represents its skills for the planner. The harness
    ships skills under two recurring representations: tool-skills that wrap a single
    external API or system tool and serve as primitive vocabulary, and workflow-skills
    that orchestrate tool-skill calls plus a template render to produce one named
    deliverable. The harness exposes them via two surfaces in the system prompt: an
    inlined-body surface (full instructions, scripts, templates) for autoloaded skills,
    and a one-line listing for on-demand skills. A six-task selection ablation across
    three exposure regimes (all-on, default, all-off) shows that full autoload selects
    the gold skill on every task; all-off slows execution and produces hard discovery
    failures; and the production default misroutes one task because its lexical signal
    collides with an autoloaded tool-skill that pulls planner attention away from
    a listed workflow-skill. The headline finding is that in-prompt exposure of skills
    is not monotonically helpful: partial exposure can create lexical competition
    that suppresses correct selection. We connect this small-N observation to recent
    retrieval-based skill-routing work at large scale, and frame this contribution
    as a case study rather than a benchmark.

    '
  tags: []
- title: 'MemSecBench: Tracking Agent Memory Poisoning from Persistence to Consequence
    and Repair'
  date: 2026-07
  url: https://arxiv.org/abs/2607.27080
  category: safety
  subcategory: experiment
  authors:
  - Xuanze Chen
  - Xukang Xie
  - Wentao Fu
  - Jiajun Zhou
  - Shanqing Yu
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Memory systems allow agents to retain and reuse information from past
    interactions, but they can also let malicious content persist. A malicious instruction
    crafted by an attacker may be stored in long-term memory, recalled much later,
    and quietly shape a real action. Recent benchmarks increasingly examine agent
    memory security, yet few trace the same malicious semantics across persistence,
    downstream consequences, and selective repair under diverse memory-backend comparisons.
    To address this gap, we introduce MemSecBench, a task-grounded benchmark for the
    lifecycle security of agent memory systems. It contains 310 cases drawn from 48
    realistic contexts across code and science, daily life, and office work. Each
    case follows a controlled Write--Execute--Forget protocol in an isolated runtime
    under an exact agent configuration, defined by an agent harness, a memory backend,
    and an LLM backend. Evidence-based adjudication combines a deterministic write
    check, checkpoint-specific judge-model evaluations, and programmatic gates across
    seven lifecycle checkpoints. The experimental design spans a 24-configuration
    matrix of two agent harnesses, four memory backends, and three LLM backends. Across
    all 24 configurations, malicious memory persists in 84.2% of all cases, and the
    full Write--Execute chain succeeds in 50.3%. Among successfully poisoned cases,
    59.6% complete the full Execute chain, while 56.1% achieve selective repair.Compared
    with matched Native configurations, the largest absolute differences are 16.1
    percentage points for end-to-end attack success and 41.3 percentage points for
    selective repair. These descriptive contrasts indicate that the evaluated memory
    system stacks differ in lifecycle security, both in the propagation of malicious
    memory and in selective repair after successful memory poisoning.

    '
  tags: []
- title: 'From Prompt Injection to Persistent Control: Defending Agentic Harness Against
    Trojan Backdoors'
  date: 2026-05
  url: https://arxiv.org/abs/2605.31042
  category: safety
  subcategory: method
  authors:
  - Jiejun Tan
  - Zhicheng Dou
  - Xinyu Yang
  - Yuyang Hu
  - Yiruo Cheng
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'LLM agents are evolving from conversational chatbots to operational tools
    in real-world workspaces. In local agentic harnesses, an LLM can read and write
    files, call tools, and reuse workspace state across sessions. While such capabilities
    enhance utility, they also expose a new attack surface for attackers. Attackers
    can embed a prompt injection within a file or tool output. Agents may read this
    hidden instruction, store it, and execute it later. In this multi-step trojan
    attack paradigm, no individual step appears malicious on its own, but these steps
    can collectively turn untrusted text into persistent control content. However,
    existing defenses often inspect each step in isolation. As a result, they can
    block a clear harmful action, but fail to detect the earlier write operation that
    plants the backdoor. To reveal this threat, we introduce ClawTrojan, a benchmark
    designed to identify multi- step trojan attacks in local agentic harnesses. In
    an OpenClaw-style simulated workspace with GPT-5.4, ClawTrojan reaches a 95.5%
    attack success rate (ASR), while existing single-turn prompt-injection attacks
    produce near-zero ASR on the same model. To address this threat, we propose DASGuard,
    which scans control-like text in sensitive local files, traces its origin, and
    removes control content that does not originate from a trusted source. Our results
    show that DASGuard achieves strong dynamic defense by combining runtime attack
    blocking with sanitized commits to the workspace.

    '
  tags: []
- title: 'SHarP: Saliency-based Pruning of Agent Harnesses'
  date: 2026-10
  url: https://arxiv.org/abs/2610.04178
  category: method
  subcategory: method
  authors:
  - Xinyi Gao
  - Qiucheng Wu
  - Kaizhi Qian
  - Handong Zhao
  - Shiyu Chang
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Agent harnesses are systems that coordinate model calls, tool use, and
    task execution to help large language models complete complex tasks. To meet task
    requirements and address failures, these systems are often iteratively refined
    by amending and patching their instructions, tools, and workflows, continuously
    increasing harness complexity. It is therefore unclear whether some resulting
    harness modules are redundant, introducing substantial token overhead with little,
    if any, performance gain. Inspired by neural network pruning, in this paper, we
    study harness pruning as a means of striking a better balance between task performance
    and token cost. We propose SHarP (Saliency-based Harness Pruning), a simple yet
    effective pruning strategy based on the saliency of each harness module with respect
    to performance and efficiency. Specifically, we first identify tools, instructions,
    and supporting mechanisms as components that can be individually disabled. We
    then estimate the saliency of each module by ablating it and assessing its task
    performance and token cost relative to the full set of single-module ablations.
    Modules with the smallest contribution to performance or largest computational
    overhead are subsequently pruned. Our evaluation across various harnesses on held-out
    validation sets reveals a surprising finding: most harnesses that we studied are
    highly redundant and can maintain comparable performance and efficiency even after
    a substantial portion of their modules are pruned. Our pruning approach and empirical
    findings provide new perspectives on agent harness design and optimization.

    '
  tags: []
- title: Is Progressive Disclosure All You Need for Long-Context Agents?
  date: 2026-07
  url: https://arxiv.org/abs/2607.17598
  category: context
  subcategory: method
  authors:
  - Yifeng He
  - Yinzhe Zhao
  - Jicheng Wang
  - Hao Chen
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Long-document question answering usually forces a choice between loading
    the whole document into the context window and bolting on a separate retriever.
    Agentic AI suggests a broader option, giving the agent the document path and letting
    it decide how and what to read. Agent Skills, a standard for packaging expertise
    into folders an agent loads on demand, supply a ready mechanism: progressive disclosure,
    which exposes only what a query needs, from a short description down to the specific
    passages. Practitioners rapidly adopted this pattern for book-length understanding
    tasks, but the evidence to support such choices has been anecdotal. We run the
    first controlled study of the pattern, comparing raw-document navigation and several
    designs of Agent Skills packs against a classical hybrid retriever across three
    agent harnesses and three model families on InfiniteBench. On a single book, the
    gain depends on the harness, running large when the agent navigates the raw document
    poorly but near zero when a strong agent harness already divides and retrieves
    on its own. When scaling up to tasks that span many books, raw-document navigation
    collapses while one-level progressive disclosure degrades more slowly and pulls
    ahead. A second, deeper routing level never helps and sometimes breaks accuracy
    outright, so one level is enough. Progressive disclosure buys context, not intelligence:
    it is redundant while a strong agent can locate the right passages itself, and
    decisive once the corpus grows too large to navigate by reading.

    '
  tags: []
- title: Who Is Behind the Harness? Fingerprinting LLMs through Agentic Behavior
  date: 2026-09
  url: https://arxiv.org/abs/2609.28559
  category: safety
  subcategory: method
  authors:
  - Chuyi Wang
  - Xiaohui Xie
  - Tongze Wang
  - Fangchen Luo
  - Yong Cui
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'LLMs increasingly operate through coding-agent harnesses that inspect
    repositories, invoke tools, and modify files. Substituting the model behind such
    an agent can therefore change security-relevant decisions, including whether it
    verifies changes or recovers safely from failures. Existing LLM fingerprints largely
    infer identity from direct text or token distributions. In coding agents, these
    signals are mediated by system instructions, controller logic, tools, and execution
    feedback, limiting their transfer. We present LIDAR (LLM Identification from Decisions
    and Actions at Runtime), an active black-box fingerprinting method for coding-agent
    execution. Three coding probe pairs expose post-edit verification, transient-failure
    recovery, and specification--test conflict resolution under controlled changes.
    LIDAR represents the resulting trajectories with complementary instance-level
    and distribution-level features and compares them with clean references using
    a lightweight probabilistic identifier. It requires no access to model weights,
    logits, or provider internals. Across 36 models from seven families and two agent
    harnesses, LIDAR achieves high Top-1 accuracy and MRR and outperforms four existing
    fingerprinting and API-auditing baselines. Ablations confirm that the two feature
    levels, all probe pairs, and their controlled variants contribute. These results
    show that agent execution behavior provides model- identity evidence beyond final
    outputs.

    '
  tags: []
- title: 'Evolving Agents in the Dark: Retrospective Harness Optimization via Self-Preference'
  date: 2026-06
  url: https://arxiv.org/abs/2606.05922
  category: method
  subcategory: method
  authors:
  - Wenbo Pan
  - Shujie Liu
  - Chin-Yew Lin
  - Jingying Zeng
  - Xianfeng Tang
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'AI agents rely on a harness of skills, tools, and workflows to solve
    complex problems. Continually improving this harness is essential for adapting
    to new tasks. However, existing optimization methods typically require ground-truth
    validation sets, yet such labeled data is difficult to acquire in practical deployment
    settings. To address this problem, we introduce Retrospective Harness Optimization
    (RHO), a self-supervised method that optimizes the agent harness using only past
    trajectories. Specifically, RHO selects a diverse coreset of challenging tasks
    from past trajectories and re-solves them in parallel. The agent analyzes these
    rollouts using self-validation and self- consistency, then generates candidate
    harness updates and selects the most effective one by its own pairwise self-preference.
    We evaluate RHO across three diverse domains, spanning software engineering, technical
    work, and knowledge work. Notably, a single optimization round improves the pass
    rate on SWE-Bench Pro from 59% to 78% without any external grading. Furthermore,
    our analysis demonstrates that RHO effectively targets prior failure modes. As
    a result, the optimized harness alters the agent''s behavior patterns and sustains
    higher accuracy during long-horizon sessions.

    '
  tags: []
- title: 'ClawMMU: Protection-Coherent Virtual Memory for Stateful LLM Agents'
  date: 2026-10
  url: https://arxiv.org/abs/2610.28093
  category: safety
  subcategory: systems
  authors:
  - Jinhao Hu
  - Bardia Mohammadi
  - Mofasshara Binte Rafique
  - Lars Henning Klein
  - Akhil Arora
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'AI agents keep long-term memory, much of which comes from web pages and
    tool results. Agent harnesses, the software that runs the model, do not record
    who may act on this memory, so an instruction hidden in a fetched page can be
    treated as the user''s own instruction. We propose ClawMMU, a protection layer
    that labels every piece of memory with its owner, scope, origins, and authority.
    ClawMMU checks these labels whenever content enters the model''s context, is written
    to storage, returns from storage, or drives a tool call. Its central rule is that
    information may rise in authority, but authority never lifts itself. Because the
    checks depend on where content came from, not on what it says, memory attacks
    become classical protection faults that the harness stops even when the model
    is fooled.

    '
  tags: []
- title: 'Co-Harness: Co-Evolving Harnesses and Model Weights for LLM Agents'
  date: 2026-07
  url: https://arxiv.org/abs/2607.22688
  category: method
  subcategory: systems
  authors:
  - Zhengyu Chen
  - Teng Xiao
  - Huaisheng Zhu
  - Yige Yuan
  - Luan Zhang
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Post-training agents for automated AI research requires optimizing not
    only model parameters, but also the runtime harness that shapes how research trajectories
    are generated, evaluated, and learned from. Existing pipelines typically train
    models under a fixed harness, including prompts, tools, skills, middleware, and
    memory, while leaving the data-generating process outside the optimization objective.
    This creates a mismatch between model updates and the static scaffolding that
    determines trajectory quality. We introduce Co-Harness, a framework that jointly
    optimizes the agent harness and model parameters during post-training. Co-Harness
    alternates between harness optimization and model optimization. An LLM-based HarnessCritic
    analyzes failed trajectories, identifies harness-level failure modes, and proposes
    validated local updates. The model is then fine-tuned on high-quality trajectories
    generated by the improved harness, distilling effective scaffolding into model
    parameters. A 200+ hour autonomous case study further shows that Co-Harness can
    recover from system crashes, improve inference efficiency, and discover ensemble
    strategies without human intervention. These results suggest that joint harness
    and model optimization is an effective way to improve agents beyond fixed-harness
    post-training.

    '
  tags: []
- title: Environment Evolution for Terminal Agents
  date: 2026-09
  url: https://arxiv.org/abs/2609.04128
  category: method
  subcategory: method
  authors:
  - Zhiyuan Fan
  - Tinghao Yu
  - Yuanjun Cai
  - Jiang Zhou
  - Jiangtao Guan
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Scaling interactive and verifiable environments is critical for training
    terminal agents. As frontier models become more capable, environments synthesized
    from scratch become less challenging and thus provide limited learning signals.
    Recent co-evolution methods iteratively synthesize environments near the model''s
    learnable frontier based on weaknesses exposed during rollouts. However, their
    dependence on on-policy rollouts limits generalization and the continuous provision
    of learning signals as the model becomes stronger. In this paper, we propose environment
    evolution, which incrementally increases environment difficulty off-policy and
    schedules the evolved environments generation by generation during training to
    provide continuous learning signals. We derive three evolution directions that
    influence environment difficulty from the multi-turn learning objective and then
    implement evolution along these directions through a loop-engineered multi-agent
    harness. Quantitative rollout experiments with Hy4 preview, Claude Opus 5, and
    GPT-5.6 Sol show that environment evolution consistently produces more difficult
    environments. We validate its effectiveness on Qwen3.6-27B and Qwen3.6-35B-A3B
    through simple long-horizon RL training, improving their performance by 14.4 and
    18.0 percentage points on Terminal-Bench 2.1, respectively.

    '
  tags: []
- title: Understanding the Benefits of Scaffolds through Computational Separations
  date: 2026-10
  url: https://arxiv.org/abs/2610.27157
  category: method
  subcategory: theory
  authors:
  - Jingchu Gai
  - Adam Block
  - Andrej Risteski
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Inference-time harnesses, i.e., external procedures that call a model
    many times and keep state across calls, can substantially improve model capabilities.
    In this paper, we investigate the benefits of using such harnesses and the extent
    to which these benefits can be internalized through training. More precisely,
    we conceptualize a harness A as an arbitrary wrapper around a base model M and
    attempt to distill a student model from the harness''s traces. Empirically we
    find that, even with simple scaffolds and small models, the inference-time harness
    significantly outperforms a distilled student. We then prove that such a gap is
    due to a fundamental representational limitation: inference-time harnesses can
    compute a closure of their per-call primitive that is NL-complete even when the
    primitive is a trivial AC0 lookup, and that no fixed-depth forward pass can represent
    under the widely believed conjecture that NL not subset of TC0. Our theory suggests
    that expanding the representational capacity of the student relative to the task
    at hand, e.g., by enlarging the model, making the task easier, or lengthening
    its chain-of- thought, is necessary to close the gap, which we verify empirically.
    Finally, we scale to an agentic harness on competition math, where the same gap
    reappears. Overall, our results show that a harness confers on the base model
    a profound gain in representational power, one that training a same-class student
    on its traces cannot transfer back into the weights.

    '
  tags: []
- title: 'Harmony Harness: Multi-Objective Self-Evolution of Agent Harnesses'
  date: 2026-10
  url: https://arxiv.org/abs/2610.15150
  category: method
  subcategory: systems
  authors:
  - Weichen Yu
  - Lesly Miculicich
  - Bhavana Dalvi Mishra
  - Jiefeng Chen
  - Shuo Li
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Recent work on self-evolving LLM agents treats the agent harness as an
    optimization target that can be iteratively improved through execution feedback.
    Existing approaches, however, largely optimize a single objective and evolve the
    harness as a monolithic artifact, limiting their ability to handle competing goals
    and to separate transferable design from environment- specific adaptation. We
    introduce Harmony Harness, a framework for multi- objective, compositional harness
    evolution. Harmony Harness formulates harness evolution as a multi-objective optimization
    problem and uses decomposition- based evolutionary search to maintain solutions
    across different regions of the Pareto frontier, avoiding reliance on a hand-designed
    structural diversity metric for repository-scale harnesses. In parallel, we introduce
    factorized evolution operators that separately refine general-purpose harness
    mechanisms and benchmark-specific adaptations, together with a dynamic composition
    workflow that integrates them at inference time. Across SecRepoBench and BaxBench,
    Harmony Harness consistently outperforms strong harness-evolution baselines, with
    gains exceeding 10% on both benchmarks. Our results show that explicitly modeling
    both objective trade-offs and harness structure yields substantially stronger
    and more transferable agent evolution than existing single-objective, monolithic
    approaches.

    '
  tags: []
- title: Better Deck or Different Judge? Evaluating Agentic Harness Gains in Corporate
    and Investment Banking
  date: 2026-09
  url: https://arxiv.org/abs/2609.39958
  category: evaluation
  subcategory: experiment
  authors:
  - Ludovic Gibert
  - Matis Despujols
  - Andre-Louis Rochet
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Corporate and investment banking teams use presentations to support credit
    decisions and advise clients on financing and transactions. Producing these decks
    requires reconciling financial data, tracing sources and turning analysis into
    a recommendation. We retrospectively study the development of an agentic harness
    combining a 27B language model, financial calculations, narrative templates and
    validation checks. LLM judges guide engineering changes and assess the resulting
    decks, raising the question of whether higher scores reflect better documents
    or changes in grading. In shared-session text- only grading with template markers
    removed, five judges score the complete system 20.4 to 33.6 points out of 95 above
    the same model generating directly from a short prompt. Every judge scores the
    system higher on all seventeen development deliverables. Margins against direct
    Opus generation from a short prompt range from -4.7 to +0.8 points. Judges agree
    on broad progress across development rounds but agree less on final-deck rankings
    than on pooled scores. Repeated grading also shifts scores on unchanged decks,
    making small improvements difficult to distinguish from judge variability.

    '
  tags: []
- title: 'VibeSearchBench: Benchmarking Long-horizon Proactive Search in the Wild'
  date: 2026-05
  url: https://arxiv.org/abs/2605.27882
  category: evaluation
  subcategory: experiment
  authors:
  - Xiaohongshu Inc
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'LLM-based agents score well on search benchmarks, yet real users consistently
    find results unsatisfying, revealing a persistent evaluation-experience gap. We
    attribute this gap to existing benchmarks'' reliance on over-specified queries,
    single-turn interactions, and fixed-schema evaluation, none of which reflect real
    search behavior where users and agents collaboratively refine vague intent through
    multi-turn dialogue. We term this paradigm VibeSearch and introduce VibeSearchBench,
    a benchmark comprising 200 manually curated bilingual (Chinese and English) tasks
    across 20 domains, split into VibeSearch-Pro (professional) and VibeSearch-Daily
    (daily-life) subsets. Each task pairs a user persona with a schema-free ground-truth
    knowledge graph, and is evaluated through a progressive-disclosure user simulator
    and a graph- matching evaluation framework. We benchmark seven frontier models
    under both the ReAct framework and the OpenClaw agent harness. Results show that
    all models remain substantially inadequate for VibeSearch (best F1: 30.30), highlighting
    the need for fundamental advances in long-context reasoning, proactive intent
    elicitation, and structured knowledge construction.

    '
  tags: []
- title: 'DAR: Deontic Reasoning with Agentic Harnesses'
  date: 2026-06
  url: https://arxiv.org/abs/2606.05009
  category: method
  subcategory: method
  authors:
  - Guangyao Dou
  - William Jurayj
  - Nils Holzenberger
  - Benjamin Van Durme
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Deontic reasoning is the task of answering questions by applying explicit
    rules and policies to case-specific facts, for example computing tax liability
    under a statute or determining the outcome of an immigration appeal. A key technical
    challenge for LLM-based deontic reasoning is that the relevant ruleset can be
    long and cross-referenced, so models may still fail to locate the rules needed
    for a particular reasoning step. We introduce Deontic Agentic Reasoning (DAR),
    an agentic reasoning setup in which the model interacts with the statutes on demand.
    We evaluate DAR under multiple harnesses on hard subsets of DeonticBench. Across
    these settings, we find that agentic harnesses can push the frontier on deontic
    reasoning tasks, but improvements are not uniform: weaker models often degrade
    on numerical tasks while consuming far more tokens.

    '
  tags: []
- title: 'Agent Lightning v1.0: Towards Harnessed Agentic RL'
  date: 2026-08
  url: https://arxiv.org/abs/2608.17528
  category: method
  subcategory: method
  authors:
  - Zhiyuan He
  - Siwei Zhang
  - Zhiwen Zhou
  - Yuqing Yang
  - Yu Kang
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Modern agents operate inside agent harnesses that manage tools, context,
    and control flow, making the harness a critical part of the agent system. Our
    original Agent Lightning introduced a disaggregated architecture that connects
    arbitrary agents to RL training through an LLM endpoint proxy, an approach later
    adopted by frameworks such as verl Uni-Agent, AReaL 2.0, slime, and Polar. We
    refer to this paradigm as harnessed agentic RL, where the deploy- time harness
    directly participates in model post-training. Harnessed agentic RL differs fundamentally
    from traditional agentic RL: the harness, rather than the training engine, owns
    the environment interaction loop, while the trainer observes only sequences of
    LLM request-response pairs. This introduces challenges in retokenization, sample
    merging, advantage calculation, loss normalization, and backend scheduling, which
    can substantially affect training stability and effectiveness. We present Agent
    Lightning v1.0, a lightweight framework for harnessed agentic RL implemented in
    approximately 3,500 lines of code. It supports arbitrary agent harnesses and serves
    as a practical testbed for studying these challenges. We evaluate it on instruction-following,
    search, and coding agents, and provide a complete reproducible pipeline for coding-agent
    RL. Using only 6K training examples and modest compute, RL improves Qwen3.5-9B
    on SWE-bench Verified from 41.8% to 56.4%, a 14.6-point absolute gain. We release
    the complete workflow and training scripts to facilitate reproducible research
    on harnessed agentic RL.

    '
  tags: []
- title: 'Same Simulation, Different Evidence: Where Retrieved Tool Output Costs LLM
    Agents Accuracy'
  date: 2026-10
  url: https://arxiv.org/abs/2610.26836
  category: evaluation
  subcategory: experiment
  authors:
  - Ke Zhang
  - Sahchit Chundur
  - Jerry Peprah Owusu
  - Mohammad Javad Abdolhosseini Qomi
  - Maziar Raissi
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'LLM agents that compute the right answer can still answer wrongly. Agent
    harnesses increasingly keep long tool outputs out of the context window, saving
    them to files that the agent searches or reads on demand. We ask where this costs
    accuracy with a real scientific tool: PHREEQC, a widely used geochemistry simulator
    from the USGS, whose reports reach 846.8k characters and whose determinism lets
    every printed value be traced. Agents use it to answer 158 execution-verified
    multiple-choice items. When agents read the simulator''s report through a section
    index rather than in context, GPT-5.1 and GPT-5.2 lose 11.3 and 7.9 points of
    accuracy, while Claude Opus 4.6 and Claude Sonnet 4.6 show no detectable cost.
    Re-running all 11,007 logged simulator calls shows that both GPT models compute
    the keyed value about as often as before; what changes is the evidence they answer
    from. Under retrieval they often skip the report, answer from their own higher-precision
    output files, and misround to a neighboring option, a failure we call evidence
    substitution. With the simulation held fixed, retrieval still costs GPT-5.2 9.4
    points. For GPT-5.4, more frequent correct simulations mask an evidence-use loss
    of about ten points, leaving a net change indistinguishable from zero. Naming
    the authoritative output raises accuracy by 6.3-7.9 points over plain retrieval
    for the three GPT models; for GPT-5.1 and GPT-5.2, inlining outputs that fit works
    as well, while asking for correct rounding does not. Context-management choices
    in agent harnesses should be judged by where accuracy is lost, not only by final
    accuracy.

    '
  tags: []
- title: 'SEAGym: An Evaluation Environment for Self-Evolving LLM Agents'
  date: 2026-06
  url: https://arxiv.org/abs/2606.17546
  category: evaluation
  subcategory: experiment
  authors:
  - Congjie Zheng
  - Chuanyi Xue
  - Bin Liang
  - Jun Yang
  - Changshui Zhang
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Self-evolving LLM-based agents improve mainly by changing their agent
    harness: the structured execution layer around a base model, including prompts,
    memory, tools, middleware, runtime state, and the model-tool interaction loop.
    Existing evaluations often reduce this process to isolated task scores or a single
    sequential curve, obscuring whether an update produces reusable improvement, overfits
    recent tasks, increases cost, or harms older behavior. We introduce SEAGym, an
    evaluation environment for measuring agent harness updates across training, validation,
    test, replay, and cost records. SEAGym turns Harbor-compatible benchmarks into
    dynamic self-evolution task sources with train batches, frozen update-validation,
    held-out ID and OOD transfer views, replay diagnostics, and saved snapshot and
    metric records. Instantiating SEAGym on Terminal-Bench 2.0 and HLE, we compare
    ACE, TF-GRPO, and AHE under a shared epoch/batch protocol. The results show that
    these evaluation views provide complementary signals about the evolution process:
    frequent updates may fail to improve held-out performance, useful intermediate
    snapshots may collapse later, and source diversity and model backend can affect
    harness reliability.

    '
  tags: []
- title: 'EMHO: EMbodied Agent Harness Optimization via Experience Traces'
  date: 2026-10
  url: https://arxiv.org/abs/2610.08432
  category: method
  subcategory: method
  authors:
  - Hyun Jung Lee
  - Jungtaek Kim
  - Jongwon Jeong
  - Tae-Eui Kam
  - Donghyun Kim
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Improving embodied agents often focuses on optimizing the underlying
    model through training, while the surrounding agent harness that controls planning,
    context, and tool use is typically engineered. We ask whether this harness can
    instead improve itself directly from experience traces under sparse environmental
    feedback. We propose EMbodied Agent Harness Optimization (EMHO), a self-evolving
    framework that keeps the embodied model frozen and iteratively revises its harness
    by analyzing execution trajectories and prior harness history. EMHO optimizes
    beyond skills or recovery prompts, modifying how the agent monitors progress,
    uses vision tools, grounds observations, and responds to failures. To support
    multiple subtasks with a single harness, we introduce EMHO-Merge, which addresses
    trade-offs in jointly optimizing a single shared harness across subtasks by using
    episode-level gains and losses to guide evidence-supported refinement of when
    and how revised behaviors are applied. We evaluate EMHO on EmbodiedBench across
    navigation and manipulation tasks, and EMHO consistently improves task success
    for both Qwen 9B and 27B models. Qualitative analysis shows that EMHO goes beyond
    recovering from failures and unproductive actions to reshape how the embodied
    agent interprets and interacts with its environment.

    '
  tags: []
- title: Improving Evaluation Realism with Inference-Time Compute and Deployment Scaffolds
  date: 2026-09
  url: https://arxiv.org/abs/2609.02302
  category: evaluation
  subcategory: method
  authors:
  - Axel Ahlqvist
  - Richard Guan
  - Juan-Pablo Rivera
  - Adeline Kassler
  - Dmitrii Troitskii
  venue: NeurIPS 2026. Code
  code_url: ''
  project_url: ''
  abstract: 'A core obstacle to alignment evaluation is evaluation awareness: capable
    models can tell when they are being tested rather than deployed, weakening the
    conclusions a safety evaluation can support. We present two techniques that make
    simulated alignment evaluations harder to distinguish from real deployments. Our
    first technique, critique refinement, spends additional inference-time compute
    on each simulator action: the simulator generates multiple candidate actions,
    refines them using feedback from an instance of the target model on how to make
    them more realistic, and continues the evaluation with the most deployment-like
    candidate. Our second technique, DISH (Deployment-Imitating SWE-Agent Harness),
    wraps the target in an agent harness, reducing the gap between simulated and real
    deployment environments in coding settings. We test the techniques on multiple
    target models and find that they compose: applying both yields larger realism
    gains than either alone. Our results show that automated approaches can improve
    the realism of alignment evaluations, and that these improvements use additional
    compute more effectively than making the audits longer.

    '
  tags: []
- title: 'Learning to Evaluate Before Improving: Automatic Rubric Induction for Automatic
    Research Agents'
  date: 2026-08
  url: https://arxiv.org/abs/2608.31076
  category: evaluation
  subcategory: method
  authors:
  - Xuehai Wang
  - Haowei Qin
  - Tongxin Liu
  - Junkai Li
  - Buqiang Xu
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Autonomous scientific research agents are increasingly applied to end-to-end
    scientific workflows, including literature review, data analysis, experimentation,
    and report generation. However, open-ended research tasks often do not clearly
    specify the analyses, methods, and success criteria required to complete the task.
    As a result, agents may miss important analyses, use inappropriate methods, or
    draw conclusions that are insufficiently supported by evidence. To address the
    problem, we present AutoSciRub, an evaluation-first framework that induces a task-specific
    executable rubric before research execution, and uses it to guide execution, criterion-level
    verification as well as iterative revision. AutoSciRub decomposes an underspecified
    instruction into atomic scientific goals, grounds them in relevant literature
    and task-visible data, and synthesizes specific, actionable, and verifiable criteria.
    The resulting rubric makes implicit experimental and evidential requirements explicit,
    providing guidance for experiments and analyses. During revision, rubric-guided
    verification identifies unmet criteria and enables targeted refinement of the
    research report and its supporting artifacts. On ResearchClawBench, AutoSciRub
    consistently improves all tested configurations, with an average gain of 2.08
    points across three backbone LLMs under the fixed Codex harness and 2.95 points
    across three agent harnesses using a fixed DeepSeek-V4-Flash backbone. On a randomly
    sampled 20-task subset of AstaBench E2E Discovery, AutoSciRub further achieves
    an average improvement of 16.8 points across three agent harnesses, while maintaining
    or increasing the number of successfully completed tasks. These results demonstrate
    that evaluation-first guidance provides an effective and generalizable control
    mechanism for autonomous scientific research (Code: https://github.com/zjunlp/AutoSciRub).

    '
  tags: []
- title: 'Code Isn''t Memory: A Structural Codebase Index Inside a Coding Agent'
  date: 2026-06
  url: https://arxiv.org/abs/2606.22417
  category: context
  subcategory: method
  authors:
  - Ishaan Bhola
  - Adithyan Krishnan
  - Sravanth Kurmala
  - Mukunda NS
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Coding agents now interleave LLMs with retrieval over the working repository,
    and retrieval implementations vary widely across deployed harnesses. Inside a
    fixed coding-agent harness on a fixed model, does adding a structural codebase
    index actually change cost or resolve? We ran three arms (the harness with the
    index, the same harness without it, and an agentic-grep comparator) on SWE- PolyBench
    Verified and SWE-bench Pro with Claude Opus 4.7 held fixed throughout, across
    three seeds, inside a leak-audited per-task sandbox. The within-harness ablation
    produces a large localization gain and a statistically separated resolve gain,
    with no cost penalty per cell and lower cost per solve. The cross-harness check
    shows that the index does not regress against an agentic-grep baseline on resolve
    or localization, again at no cost penalty. We release the per-cell exclusion ledger,
    the leak-audit script, the localization extractor, and the results database. The
    deployment question for a structural codebase index is thus not whether it is
    too expensive to run (across seeds, the index lands at a lower $/solved than agentic
    grep) but whether the workload includes multi-file changes where structural ranking
    pays off.

    '
  tags: []
- title: 'Cogentic: Multi-Agent Orchestration for Automated Proof Discovery'
  date: 2026-09
  url: https://arxiv.org/abs/2609.40324
  category: orchestration
  subcategory: method
  authors:
  - Yang Cai
  - Vineet Gupta
  - Yanchen Jiang
  - Christopher Liaw
  - Aranyak Mehta
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'We present Cogentic, a multi-agent harness for automated proof discovery
    on open research problems. While frontier language models can generate strong
    mathematical ideas in a single shot, single-shot generation is often insufficient
    for open problems that require exploring multiple competing conjectures, overcoming
    subtle technical obstructions, and retaining intermediate progress over a long
    horizon. Cogentic addresses these challenges through an iterative prove-verify
    loop in which an orchestrator allocates a population of independent provers across
    distinct proof directions, subjects their output to adversarial verification by
    several specialized components, and promotes confirmed intermediate results into
    a persistent verified ledger that later rounds build on. The harness is designed
    to be able to solve research-level math and theoretical computer science problems.
    Using either Gemini 3.1 Pro or an early version of Gemini 4 Argon as the base
    model, Cogentic produced novel results on open problems across online learning,
    auction theory, and mechanism design. Each result was independently verified by
    domain experts and is developed in full in companion papers. We list these results,
    and new ones as they are verified, at https://sites.google.com/view/cogentic .

    '
  tags: []
- title: 'MarkovSim: an LLM Agent Harness with Bounded Context for Long-Horizon Computational
    Simulation'
  date: 2026-10
  url: https://arxiv.org/abs/2610.35349
  category: context
  subcategory: systems
  authors:
  - Yeui-Lung Lei
  - Wen-Bo Chen
  - Pan Zhang
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Recent studies have applied large language model (LLM) agent systems
    to computational simulation workflows. Such workflows are long-horizon, so the
    information generated can exceed what an LLM can reason over at once, its context
    window. Context management is therefore essential, yet existing systems have either
    neglected it or treated it as a supporting mechanism rather than a subject of
    study. This paper presents MarkovSim, an LLM agent harness for long-horizon computational
    simulation, whose core is a context management scheme built into the workflow.
    The workflow record is written to a memory system with a predefined schema, and
    at workflow-defined boundaries, namely the state transitions of a finite-state
    machine a compact representation of the solution progress is constructed from
    it as the agent''s context. Instantiated on finite element analysis and evaluated
    on six benchmark problems, MarkovSim passed 16 of 18 runs and corrected its own
    faults in both the solver operations and the model physics. The engineer was consulted
    only where engineering judgement was needed. The context remained bounded throughout
    every run, regardless of its length.

    '
  tags: []
- title: 'Towards Verifiable Multimodal Deep Research: A Multi-Agent Harness for Interleaved
    Report Generation'
  date: 2026-05
  url: https://arxiv.org/abs/2605.29861
  category: application
  subcategory: method
  authors:
  - Chenghao Zhang
  - Guanting Dong
  - Yufan Liu
  - Tong Zhao
  - Xiaoxi Li
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Large Language Models (LLMs) have advanced autonomous agents from deep
    search, which retrieves concise factual answers, to deep research, which synthesizes
    scattered evidence into long-form reports. However, verifiable multimodal deep
    research remains challenging due to open-ended synthesis without deterministic
    ground truth and the need to interleave textual arguments with visual evidence.
    We propose Ptah, a multi-agent harness for interleaved report generation. Ptah
    orchestrates the lifecycle from user query to rendered web report through planning,
    research, and writing stages, where specialized agents construct visual-aware
    plans, collect claim-grounded evidence, maintain source-aligned images in a Visual
    Working Memory, and compose reports through declarative multimodal tool use. A
    verifier agent serves as the harness''s acceptance function, enforcing factual
    grounding, citation fidelity, and cross-modal consistency throughout the workflow.
    We further introduce PtahEval, an evaluation protocol that augments existing benchmarks
    with image- level and presentation-level assessments. Experiments on deep research
    benchmarks show that Ptah produces more reliable, visually informative, and usable
    human-facing multimodal reports than strong baselines. Our code is released at
    https://github.com/SnowNation101/Ptah

    '
  tags: []
- title: Internalizing Agent Experience into Diffusion Model Weights via On-Policy
    Context Distillation
  date: 2026-10
  url: https://arxiv.org/abs/2610.07250
  category: method
  subcategory: method
  authors:
  - Wenxuan Wang
  - Zekai Liu
  - Weinan Zhang
  - Yu Cheng
  - Yang Yang
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Wrapping an image generation model in an agentic harness can effectively
    boost Text-to-Image task performance: the harness can leverage memory, skills,
    workflow orchestration, result verification, and iterative refinement to continually
    construct and revise prompts, thereby eliciting better images. These gains, however,
    remain external to the diffusion model and are realized only while the full harness
    runs. We propose Diffusion On-Policy Context Distillation (D-OPCD), which treats
    the agent-improved prompt as privileged context and distills the knowledge encoded
    in the agent harness into the weights of the diffusion model, so that the model
    retains part of the harness''s benefit when conditioned on the original query
    alone. Using a Text- to-Image agent equipped with our proposed Auto Skill Evolver
    (ASE), we show that D-OPCD can internalize harness capabilities into the generator''s
    weights, raising the average direct-generation score from 60.52 to 65.09 across
    four benchmarks. With this knowledge absorbed into the weights, the harness can
    shed its saturated skills and resume evolving: a second ASE round on the updated
    generator improves on a skill-free harness by additional 1.83 points, pointing
    toward text-to-image systems in which harness and model keep improving each other
    through continual co-evolution.

    '
  tags: []
- title: Do AI-for-Science Agents Preserve Model Safety?
  date: 2026-10
  url: https://arxiv.org/abs/2610.32045
  category: safety
  subcategory: method
  authors:
  - Michael Yew Chuan Lee
  - Manya Sriram
  - N. Benjamin Erichson
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'AI-for-Science agents are increasingly being used for formulating scientific
    hypotheses, running autonomous experiments, and interpreting evidence. These agents
    are constructed by integrating a large language model (LLM) into a domain-specific
    agent harness, which in turn can improve the LLM''s scientific capability and
    enable the model to orchestrate scientific tools. In this work, we ask whether
    model safety is preserved when an LLM is integrated in an AI- for-Science agent
    harness. We evaluate five agent harnesses on 50 harmful chemistry requests. Specifically,
    we study how the safety behavior changes under direct prompting, two simple adversarial
    prompting strategies, and an adaptive attack. Across four recent GPT variants,
    our results show that the agent harness can increase harmful compliance even under
    direct prompting. More critically, we find that adaptive attacks that are largely
    unsuccessful against the base LLM suddenly become highly successful after the
    agent harness is introduced. Our results show that the safety behavior of the
    base LLM is not durable once a harness is introduced. Thus, as AI-for-Science
    agents become more capable and autonomous, the community needs to evaluate and
    align the agent using domain-specific safety benchmarks.

    '
  tags: []
- title: Graph, Loop, and Harness Engineering for Zero-Trust Agentic Data Engineering
    and Analytical Processing
  date: 2026-08
  url: https://arxiv.org/abs/2609.29668
  category: safety
  subcategory: systems
  authors:
  - Sagar Srinivas Sakhinana
  - Venkataramana Runkana
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Large language model agents increasingly automate data workflows, but
    end-to- end cloud data engineering and analytical execution require reliable coordination
    across code, data, infrastructure, and runtime environments. We present two zero-trust
    frameworks. Zero-Trust Agentic Data Engineering generates, deploys, and verifies
    complete cloud data-engineering solutions from natural-language tasks, with completion
    conditioned on repository, deployment, runtime, and policy evidence. Zero-Trust
    Agentic OLAP combines governed Data Preparation with verified Online Analytical
    Processing (OLAP), permitting production promotion only after validation and evidence-bound
    approval, and releasing analytical answers only after Same-Snapshot Execution,
    Exact Result Equivalence, deterministic grounding, and reflection. Both frameworks
    share three abstractions: graph engineering for evidence-gated workflow structure,
    loop engineering for bounded recovery, and agent-harness engineering for zero-trust
    execution. We evaluate both frameworks under nominal execution, controlled failures,
    bounded recovery, and policy- constrained conditions, measuring verified completion,
    recovery, authorization enforcement, production promotion, and verified OLAP execution.

    '
  tags: []
- title: 'Toward Auditable AI Scientists: A Hypothesis Evolution Protocol for LLM
    Agents'
  date: 2026-07
  url: https://arxiv.org/abs/2607.09195
  category: safety
  subcategory: method
  authors:
  - Izumi Takahara
  - Teruyasu Mizoguchi
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Large language model (LLM) agents are increasingly expected to play a
    central role in AI-driven scientific discovery. Equipped with broad knowledge,
    flexible reasoning, and tool use, they have the potential to autonomously explore
    and solve scientific problems by repeatedly proposing hypotheses, testing them,
    and revising their beliefs in the light of the evidence. In current agents, however,
    these hypotheses, tests, and belief updates are buried in unstructured logs, and
    no mechanism lets the agent or the human researcher audit that process. Here we
    propose the Hypothesis Evolution Protocol (HEP), an agent harness that provides
    hypothesis generation, evaluation, and evolution as explicit, auditable operations.
    On materials- science research tasks, a HEP-equipped agent operates the hypothesis--test--
    evidence--belief cycle that planning-style agents lack, generalizes across research
    questions, and exploits the protocol more fully as the base LLM becomes more capable.
    These results mark a step toward auditable AI scientists, whose scientific reasoning
    can be inspected, verified, and built upon.

    '
  tags: []
- title: 'Schema: Discovering Unknown Environments via Agentic Program Induction'
  date: 2026-09
  url: https://arxiv.org/abs/2609.39140
  category: method
  subcategory: method
  authors:
  - Guanning Zeng
  - Jiani Wang
  - Wenjie Ma
  - Shaofeng Yin
  - Chenyang Wang
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Learning to complete tasks in unfamiliar environments with unknown rules
    remains a key challenge for LLM agents. Current LLM agents often record their
    discoveries in prose, which may not provide a compact, explicit account of how
    the environment works. Inspired by how scientists organize observations into testable,
    predictive theories, we introduce Schema, an agent harness that organizes learning
    and action through interactive program induction. The LLM agent decides what to
    investigate and how to act, expressing its evolving understanding of the environment
    as executable programs. The harness consists of a persistent program workspace
    and a small set of interfaces for checking these programs against the interaction
    history, planning within them, and executing plans under step-by-step verification.
    Schema raises ARC-AGI-3 RHAE from 58.7% to 99.2% with the same base model, solves
    100% of the public DiG- bench games, and reaches the median performance of the
    top-50 human players on MazeBench. Extensive analysis shows the effectiveness
    of Schema in unknown mechanism discovery, and ablations confirm the contribution
    of each component.

    '
  tags: []
- title: In harmony with gpt-oss
  date: 2026-04
  url: https://arxiv.org/abs/2604.00362
  category: runtime
  subcategory: systems
  authors: []
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'No one has independently reproduced OpenAI''s published scores for gpt-oss-20b
    with tools, because the original paper discloses neither the tools nor the agent
    harness. We reverse-engineered the model''s in-distribution tools: when prompted
    without tool definitions, gpt-oss still calls tools from its training distribution
    with high statistical confidence -- a strong prior, not a hallucination. We then
    built a native harmony agent harness (https://github.com/borislavmavrin/harmonyagent.git)
    that encodes messages in the model''s native format, bypassing the lossy Chat
    Completions conversion. Together, these yield the first independent reproduction
    of OpenAI''s published scores: 60.4% on SWE Verified HIGH (published 60.7%), 53.3%
    MEDIUM (53.2%), and 91.7% on AIME25 with tools (90.4%).'
  tags:
