- title: 'DeciCAD: Harness-Grounded Learning of Action Policies for CAD Agents'
  date: 2026-10
  url: https://arxiv.org/abs/2610.21755
  category: runtime
  subcategory: systems
  authors: []
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Large Language Model agents operate through closed-loop action policies
    whose decision space is defined by an agent harness. We investigate how this operating
    space shapes agent behavior and policy learning in computer-aided design (CAD),
    a professional domain characterized by persistent state, geometric constraints,
    and long-horizon procedures. We instantiate this perspective in DeciCAD, a domain-native
    harness that exposes semantic CAD actions, decision-oriented observations, environment
    feedback, and persistent state transitions. Building on this harness, we develop
    a learning pipeline that extracts causal decision supervision from interaction
    trajectories and improves the policy through supervised fine-tuning (SFT) and
    geometry-grounded online reinforcement learning (RL). Across four CAD benchmarks,
    DeciCAD achieves the best F1 and intersection over union (IoU) while reducing
    model-output tokens by 45--88% relative to a general-purpose coding harness. Under
    matched supervision, its SFT policy improves F1 from 0.6883 to 0.7437 and outperforms
    the coding policy; subsequent online RL further raises geometry availability from
    66.5% to 73.5% and F1 to 0.7880. These results demonstrate that the decision space
    induced by a harness materially affects both agent execution and policy learning
    in CAD.
