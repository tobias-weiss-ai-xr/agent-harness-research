  - auto-systems
- title: 'SKILLER: Language-Level Reinforcement Learning for Reusable Skill Extraction
    in Small Language Models'
  date: 2026-08
  url: https://arxiv.org/abs/2608.10538
  category: runtime
  subcategory: systems
  authors: []
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Agent skills represent a standardized format for packaging procedural
    knowledge and domain expertise, serving within agent harness systems as an essential
    mechanism to continually constrain a language model's behavior space for repeatable,
    high-quality task execution. However, because strong closed-source models entail
    high inference costs, current popular agent harnesses, such as Codex and OpenClaw,
    remain prohibitively expensive when deploying these skills to accomplish real-world
    tasks. The rapid capability enhancement of open-source models deployable on consumer-grade
    GPUs presents a compelling opportunity to drastically reduce these costs by leveraging
    skill-based behavioral constraints. Nevertheless, automatically generating effective
    skills tailored specifically for such compact models remains a significant practical
    challenge. To address this, we propose SKILLER, a natural-language-driven reinforcement
    learning framework designed to automatically generate executor-specific skills
    for small models, which employs a strong model as the actor and critic, treats
    the small-model agent system as the environment, and propagates all reinforcement
    learning signals entirely via natural language. Extensive experimental evaluations
    across five relevant benchmarks using Qwen3.5-9B and Qwen3.5-4B demonstrate that
    SKILLER outperforms three open-source and one closed-source skill generation or
    evolution methods, achieving absolute gains ranging from 4.3 to 20.4 percentage
    points for the 9B model and 1.8 to 13.3 points for the 4B model, while remarkably
    matching the performance of strong closed-source models on single-skill tasks
    in SkillsBench. The project is available at https://github.com/DANG-ai/SKILLER.
  tags:
  - auto-runtime
  - auto-systems
- title: 'Beyond Executable Models: The Pufibara Agent Harness and the Modelica Agent
    Workflow Benchmark for Physical System Modeling'
  date: 2026-08
  url: https://arxiv.org/abs/2608.23653
  category: runtime
  subcategory: systems
  authors: []
  venue: ''
  code_url: ''
  project_url: ''
  abstract: AI agents are increasingly used for simulation-driven engineering. Physical
    system modeling presents different requirements from general-purpose code generation
    in software engineering, because correctness depends not only on syntax and executability
    but also on physical consistency and scenario-dependent behavior. We study this
    challenge in Modelica, an equation-based modeling language in which a model may
    compile and simulate while still violating its intended physics or engineering
    requirements. Across successive revisions, an agent may lose track of requirements
    or rely on simulation evidence produced by an outdated candidate. To address this
    challenge, we present Pufibara, an agent harness that maintains persistent engineering
    state across revisions, associates execution and simulation evidence with the
    candidate that produced it, and makes submission an explicit agent action. To
    evaluate end-to-end Modelica agent workflows, we also propose a source-grounded
    method for constructing realistic and independently evaluable tasks. We use this
    method to build the 232-task Modelica Agent Workflow Benchmark, spanning Model
    Repair, Model Generation, and Model Tuning. Each submitted candidate is scored
    by a benchmark-owned evaluator outside the agent loop. We compare Pufibara with
    Claude Code as complete harnesses under two matched large language model (LLM)
    backends. With DeepSeek v4 Flash, Pufibara passes 202 tasks, compared with 185
    for Claude Code. With Claude Sonnet 5, Pufibara passes 202 tasks, compared with
    187 for Claude Code. Under the repository-reported token accounting, Pufibara
    records 76.4%-82.5% lower logical-token totals. Its sequential runtime is 6.1%-58.4%
    lower. These findings show that, even under matched LLM backends, complete agent
    harnesses can differ substantially in both task success and resource use for physical
    system modeling.
  tags:
  - auto-runtime
  - auto-systems
- title: 'AgenticPD: A Stage-Aware Agentic Framework for Closed-Loop Physical Design
    Optimization'
  date: 2026-07
  url: https://arxiv.org/abs/2607.04758
  category: runtime
  subcategory: systems
  authors: []
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Physical design quality-of-results (QoR) optimization is hard and expensive.
    Choices made at one stage can help or hurt later stages. Each evaluation requires
    a costly EDA run through the full flow. While existing methods still treat optimization
    as flat parameter tuning or a LLM-based script generation task, we present AgenticPD,
    a stage-aware agentic framework for physical design QoR optimization. Instead
    of re-running the full flow after every trial, AgenticPD is organized around the
    stage boundaries of the physical design flow, where a Judge Agent navigates the
    search and stage-specialized agents make local decisions within their own stage
    using stage-local tools. Additionally, the agent harness in AgenticPD provides
    structured observations, execution history, and agent context management. Experimental
    results show that AgenticPD achieves the best timing performance among the evaluated
    PD tuners while maintaining competitive power and area.
  tags:
  - auto-runtime
  - auto-systems
- title: 'ScienceVision: Can AI Observe and Reason Like a Scientist?'
  date: 2026-11
  url: https://arxiv.org/abs/2611.04087
  category: runtime
  subcategory: systems
  authors: []
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Scientific discovery builds on accurate observations interpreted through
    domain knowledge and reasoning. For scientific 3D data, this requires understanding
    structures and spatial relationships, from protein contacts to anatomical organization.
    Existing multimodal benchmarks largely evaluate text and 2D images, while scientific
    3D evaluations vary in representations and protocols across disciplines, limiting
    cross-disciplinary comparison. To assess these foundational capabilities, we introduce
    ScienceVision, a cross-domain benchmark for scientific 3D understanding and reasoning
    through expert-level visual question answering (VQA). We construct 250 questions,
    with 50 each from Biology, Chemistry, Medical Imaging, Mechanical CAD, and Architecture,
    through a pipeline combining synthetic question generation with domain-expert
    review and annotation. Each task pairs a native 3D artifact with a scientific
    question, a specified response format, and a task-specific reference answer, requiring
    domain knowledge to be applied to geometric or topological evidence. We evaluate
    12 models on the same questions in three settings: visual question answering with
    native 3D artifacts accessed through an agent harness''s file and code-execution
    tools; the same workflow augmented with expert-inspired viewer inspection and
    measurement tools exposed through the Model Context Protocol (MCP); and visual
    question answering from prescribed rendered 2D images using an agent harness.
    All settings use the same task-specific deterministic final-answer scoring. The
    inspection environment supports view changes, target isolation, and slice inspection.
    In this main comparison, the best mean answer score is 0.53 out of 1. Mean scores
    in the native-artifact workflow without additional MCP tools exceed those in the
    rendered-image workflow for every model, by 17.2 percentage points on average.'
  tags:
  - auto-runtime
  - auto-systems
- title: Harnessing Generalist Agents for Contextualized Time Series
  date: 2026-06
  url: https://arxiv.org/abs/2606.05404
  category: runtime
  subcategory: systems
  authors: []
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Time series are often embedded in rich contexts that are essential for
    holistic modeling. Moreover, real-world practitioners often require end-to-end
    workflows for analyzing temporal dynamics, where widely studied tasks such as
    forecasting are only one step in a broader solution loop. While generalist AI
    agents offer a promising interface for such workflows under complex contexts,
    they still operate primarily in textual spaces that are not fully aligned with
    structured temporal signals. In this work, we introduce TimeClaw, an agentic harness
    framework for time series that equips generalist LLM agents with the time series-native
    runtime support needed for contextualized temporal reasoning. TimeClaw integrates
    executable temporal tools for grounded and auditable analysis, experience-driven
    capability evolution for creating reusable analytical routines, and episodic multimodal
    memory for retrieving relevant reasoning traces. Together, these components unlock
    harnessed open-ended temporal reasoning with contextual information. Extensive
    evaluation on multiple benchmarks covering diverse tasks across energy, finance,
    weather, traffic, and other real-world domains demonstrates improved performance
    of TimeClaw. Code is available at https://github.com/iDEA-iSAIL-Lab-UIUC/TimeClaw.
