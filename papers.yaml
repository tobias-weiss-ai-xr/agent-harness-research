- title: 'Beyond Injection Detection: A Positive-Security Prompt Firewall that Closes
    the Scope and PHI Gap SOTA Classifiers Miss in Healthcare'
  date: 2026-06
  url: https://doi.org/10.64898/2026.06.04.26354950
  category: runtime
  subcategory: ''
  authors:
  - James Schwoebel
  - I. Semenec
  - Jenia Rousseva
  abstract: 'Abstract Large language models in autonomous agents process trusted instructions
    and untrusted data in one context window, exposing them to direct and indirect
    prompt injection. In healthcare the stakes are concrete: a 2025 JAMA Network Open
    study found commercial medical LLMs followed injected instructions in 94.4% of
    simulated patient encounters, including life-threatening recommendations [21].
    Yet the decisive problem is different: most real clinical threats—protected health
    information (PHI) exfiltration, cross-patient access, bulk export, out-of-scope
    advice—are fluent, legitimate-looking requests that carry no attack signal, so
    even a state-of-the-art injection detector passes them. We present QFIRE , an
    inline, provider-agnostic prompt firewall built as a single self-contained Rust
    toolchain (proxy, CLI, harness). QFIRE combines (i) positive-security scope constraints
    that confine a call to a declared natural-language purpose and block out-of-scope
    drift, (ii) an asynchronous detector graph that runs N rules concurrently, cheapest
    first, and (iii) a de-obfuscation pass (Base64/hex/ROT13, homoglyphs, leetspeak,
    zero-width). It ships 106 versioned rules and a HIPAA Safe-Harbor (18-identifier)
    PHI panel, and runs a local DeBERTa-v3 classifier via embedded ONNX Runtime. On
    1,968 public prompts QFIRE attains F 1 0.86, statistically tied with Meta’s PromptGuard-2
    (0.86) and above protectai DeBERTa-v3 (0.83). Our central result is on QFIRE-HealthBench
    , a new 2,000-prompt healthcare benchmark we release with real garak and Microsoft
    PyRIT [25] payloads: there PromptGuard-2 recovers only 0.40 recall while QFIRE’s
    combined scope+PHI chain reaches 0.83 ( F 1 0.87) at a calibrated 0.08 false-positive
    rate—generic injection detection is necessary but not sufficient for healthcare.
    A bare LLM judge matches QFIRE on static accuracy ( F 1 0.90) but falls to 34–59%
    recall under adaptive attack (§5.5), where QFIRE adds auditable determinism and
    bounded latency. End-to-end, placing QFIRE in front of a tool-using agent over
    a mock-EHR sandbox cuts its harmful-action rate from 0.38 to 0.00 at a 0.13 benign-utility
    cost. All code, rules, and corpora snapshots are released and regenerate from
    a single make paper target with no paid API keys.'
  venue: medRxiv
- title: 'PersonaUsai: Autonomous Generative Persona Synthesis, Econometric Modeling,
    and In-Silico Marketing Experimentation'
  date: 2026-08
  url: https://doi.org/10.5281/zenodo.22114983
  category: runtime
  subcategory: ''
  authors:
  - Luigi Usai
  abstract: '# PersonaUsai: Autonomous Generative Persona Synthesis, Econometric Modeling,
    and In-Silico Marketing Experimentation ## Abstract **PersonaUsai** is an enterprise-grade,
    mathematically grounded scientific framework and agentic architecture designed
    for the generative synthesis of multidimensional consumer personas, autonomous
    in-silico focus groups, and discrete choice marketing experimentation. Addressing
    the pervasive limitations of contemporary Large Language Model (LLM) agents—specifically
    psychological sycophancy, lack of budget-constrained rationality, and distributional
    mode collapse—PersonaUsai establishes a rigorous bridge between generative artificial
    intelligence and classical microeconomic choice theory. The architecture operationalizes
    McFadden’s Random Utility Model (RUM) under axiomatic Gumbel perturbation, multivariate
    Gaussian copula joint distributions for demographic and psychometric (OCEAN Big
    Five, Schwartz Value Inventory) sampling, zero-sum simplex resource allocations,
    and Van Westendorp Price Sensitivity Meter (PSM) solvers. Complete econometric
    recovery is achieved via Maximum Likelihood Estimation (MLE) of Multinomial Logit
    (MNL) parameters, backed by Fisher Information asymptotic standard errors and
    willingness-to-pay (WTP) derivations. --- ## 1. Scientific Motivation & Problem
    Formulation While generative LLMs have demonstrated remarkable qualitative simulation
    capabilities, unconstrained agentic simulations frequently suffer from critical
    methodological failures: 1. **Acquiescence & Sycophantic Bias:** LLM agents inherently
    exhibit unconstrained positive appraisal when evaluating proposed products or
    concepts, violating basic budget frontiers and microeconomic scarcity axioms.
    2. **Distributional Mode Collapse:** Standard prompt-based demographic sampling
    collapses towards central stereotypical behaviors, artificially suppressing population
    variance and cross-trait correlations. 3. **Lack of Econometric Tractability:**
    Standard agent dialogues rarely output structured, invertible choice matrices
    suitable for rigorous econometric parameter estimation. PersonaUsai resolves these
    vulnerabilities by enforcing invariant mathematical constraints at the agent runtime
    level, formalizing agent decision-making within explicit utility maximization
    frameworks and validating cohort distributions against empirical references via
    Jensen-Shannon Divergence ($D_{\text{JS}}$). --- ## 2. Mathematical & Methodological
    Foundations ### 2.1 McFadden''s Random Utility Model (RUM) & Choice Probability
    Individual agent deliberation is governed by the Random Utility Model: $$U_{i,
    j} = V(x_j; \theta_i) - \beta_{p, i} \cdot \left(\frac{p_j}{I_i / 12}\right)^{\frac{1}{\alpha_i}}
    + \epsilon_{i, j}$$ where: * $V(x_j; \theta_i)$ represents the deterministic valuation
    of product attribute vector $x_j$ conditioned on the agent''s psychometric vector
    $\theta_i$ (OCEAN traits and Schwartz personal values). * $\beta_{p, i}$ represents
    price sensitivity, scaled non-linearly by monthly disposable income $I_i / 12$
    and risk aversion parameter $\alpha_i$. * $\epsilon_{i, j} \sim \text{Gumbel}(0,
    1)$ represents independent identically distributed stochastic unobserved utility
    shocks. Integrating the Gumbel distribution yields the classic Multinomial Logit
    (Softmax) choice probability for alternative $j$ in choice set $\mathcal{C}_k$:
    $$P(y_{i,k} = j \mid \mathcal{C}_k) = \frac{\exp(V_{i,j})}{\sum_{m \in \mathcal{C}_k}
    \exp(V_{i,m})}$$ ### 2.2 Multivariate Gaussian Copula Synthesis To ensure authentic
    joint dependencies between continuous income, age, education, and five-factor
    psychometrics without assuming multivariate normality, PersonaUsai employs a Gaussian
    Copula formulation: $$C(u_1, \dots, u_d; \mathbf{\Sigma}) = \Phi_{\mathbf{\Sigma}}\left(\Phi^{-1}(u_1),
    \dots, \Phi^{-1}(u_d)\right)$$ where $\Phi_{\mathbf{\Sigma}}$ is the joint cumulative
    distribution function of a zero-mean multivariate Gaussian distribution with positive
    semi-definite correlation matrix $\mathbf{\Sigma} = \mathbf{L}\mathbf{L}^T$ (Cholesky
    factorization), and $\Phi^{-1}$ is the standard normal quantile function. ###
    2.3 Anti-Sycophancy Simplex Invariant To eliminate sycophantic appraisal, resource
    prioritization tasks enforce a strict zero-sum simplex invariant: $$\sum_{k=1}^K
    c_k = B \quad \text{such that} \quad c_k \ge 0, \; \forall k \in \{1, \dots, K\}$$
    This forces agents to allocate constrained cognitive or financial currency over
    candidate features, rendering unconstrained qualitative flattery impossible. ###
    2.4 Normalized Jensen-Shannon Divergence ($D_{\text{JS}}$) & Mode Collapse Detection
    Synthetic cohort diversity is continuously evaluated against theoretical or empirical
    baseline distributions $P_{\text{ref}}$: $$D_{\text{JS}}(P \parallel Q) = \frac{1}{2}
    D_{\text{KL}}(P \parallel M) + \frac{1}{2} D_{\text{KL}}(Q \parallel M), \quad
    M = \frac{1}{2}(P + Q)$$ Cohort generation automatically flags mode collapse if
    $D_{\text{JS}} > \tau_{\text{collapse}}$ or when the intra-cohort entropy $H(P_{\text{syn}})
    \to 0$. ### 2.5 Van Westendorp Price Sensitivity Meter (PSM) Pricing curves are
    modeled by capturing four subjective price thresholds per agent: $$P_{\text{too\_cheap}}
    \le P_{\text{cheap}} \le P_{\text{expensive}} \le P_{\text{too\_expensive}}$$
    Cumulative empirical distribution function intersections rigorously determine:
    * **Point of Marginal Cheapness (PMC):** Intersection of *Too Cheap* and *Expensive*.
    * **Optimal Price Point (OPP):** Intersection of *Too Cheap* and *Too Expensive*.
    * **Indifference Price Point (IPP):** Intersection of *Cheap* and *Expensive*.
    * **Point of Marginal Expensiveness (PME):** Intersection of *Cheap* and *Too
    Expensive*. * **Acceptable Price Range (APR):** $[PMC, PME]$. --- ## 3. Architecture
    & Modular Subsystems ``` ┌──────────────────────────────────────────────────────────────────────────┐
    │ PERSONAUSAI ARCHITECTURE │ └──────────────────────────────────────────────────────────────────────────┘
    │ ┌─────────────────────────────┼─────────────────────────────┐ ▼ ▼ ▼ ┌──────────────┐
    ┌──────────────┐ ┌──────────────┐ │ core.models │ │ agents.bdi │ │ simulations
    │ │ core.math │ ──────────► │ agents.memory│ ───────────► │ - DCE │ │ core.synth
    │ │ agents.anti │ │ - FocusGrp │ └──────────────┘ └──────────────┘ │ - PSM │ │
    └──────────────┘ │ │ ▼ ▼ ┌──────────────┐ ┌──────────────┐ │ validation │ ◄────────────────────────────────────────
    │ analytics │ │ (JSD Metric)│ │ - MNL MLE │ └──────────────┘ │ - NLP Clust │ └──────────────┘
    ``` 1. **`personausai.core`**: Strict, immutable Pydantic v2 schemas (`PersonaProfile`,
    `ProductProfile`, `ChoiceTask`, `ResourceAllocationTask`), Copula sampling, and
    deterministic Dirichlet simplex partitioning. 2. **`personausai.agents`**: Asynchronous
    BDI (Belief-Desire-Intention) deliberation engine, dual episodic/dense semantic
    cosine vector memory stores, and anti-sycophancy zero-sum validation. 3. **`personausai.simulations`**:
    Directed acyclic state graph orchestrator, fractional factorial Discrete Choice
    Experiments (Conjoint Analysis), autonomous focus group moderation with social-proof
    facilitation, and Van Westendorp PSM pipelines. 4. **`personausai.analytics`**:
    Full Newton-Raphson / BFGS Maximum Likelihood Estimator for Multinomial Logit
    models, computing Hessian-derived asymptotic variance-covariance matrices, z-scores,
    p-values, and Part-Worth utilities; semantic qualitative NLP centroid clustering
    for utterance transcripts. 5. **`personausai.llm`**: Multi-provider asynchronous
    execution client supporting rate-limited concurrency semaphores, exponential backoff
    with jitter (`tenacity`), and deterministic high-fidelity mock engines for automated
    test harness verification. --- ## 4. Verification, Test Harness & Engineering
    Standards The codebase adheres to rigorous NASA and Google software engineering
    specifications: * **Static Type Safety:** 100% type-annotated, passing `mypy --strict`
    with zero type errors. * **Property-Based Testing:** Invariants verified across
    randomized seeds using `pytest` and `hypothesis`. * **End-to-End Test Harness:**
    Continuous validation of mathematical invariants (budget conservation, price monotonicity,
    probability simplex normalization) across synthetic cohorts. --- ## 5. Metadata
    for Zenodo Archival | Field | Value | |---|---| | **Title** | PersonaUsai: Autonomous
    Generative Persona Synthesis, Econometric Modeling, and In-Silico Marketing Experimentation
    | | **Resource Type** | Software / Preprint / Methodology | | **Keywords** | Generative
    AI, Synthetic Personas, Discrete Choice Experiment, Multinomial Logit, Econometrics,
    BDI Agents, Van Westendorp, Anti-Sycophancy, Gaussian Copula | | **Language**
    | English | | **Programming Language** | Python (>= 3.11) | | **Methodology**
    | Random Utility Modeling, Multi-Agent Deliberation, Copula Sampling, Maximum
    Likelihood Estimation |'
