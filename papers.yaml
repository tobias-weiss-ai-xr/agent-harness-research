- title: 'DocOps: A Verifiable Benchmark for Autonomous Agents in Complex Document
    Operations'
  date: 2026-07
  url: https://arxiv.org/abs/2607.19865
  category: runtime
  subcategory: systems
  authors: []
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'As autonomous agents rapidly evolve, their ability to reliably manipulate
    ubiquitous digital documents has become critical for enabling general-purpose
    AI assistants and automating complex workspace workflows. In this paper, we introduce
    DocOps, a deterministically verifiable evaluation framework underpinned by a hierarchical
    taxonomy that deconstructs document operations inspired by real-world practices
    into atomic dimensions and escalating workflow complexities. Based on DocOps,
    we systematically evaluate representative closed- and open-source models across
    various agentic harnesses, revealing that even the most advanced frontier configurations
    still exhibit profound limitations when handling highly coupled, long-range tasks.
    Furthermore, a fine-grained analysis of existing agents'' manipulation behaviors
    uncovers 3 key failure modes: long-term state tracking collapse, shallow semantic
    verification, and destructive editing of structural metadata. Ultimately, our
    work exposes the capability boundaries of agents in maintaining global document
    consistency, shedding light on the future design of robust, non-destructive agents
    for complex digital ecosystems.'
