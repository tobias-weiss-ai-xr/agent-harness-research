- title: How Far Can GPT-6-Astra Go? Evaluating Capabilities in Zero-Shot Vision-and-Language
    Navigation
  date: 2026-09
  url: https://arxiv.org/abs/2609.20116
  category: runtime
  subcategory: systems
  authors: []
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'We study GPT-6-Astra in a zero-shot Vision-and-Language Navigation in
    Continuous Environments (VLN-CE) system, where it interprets instructions, assesses
    its surroundings, and proposes actions. The system uses a common observation--decision--execution
    workflow with direct model API calls, without a packaged agent harness or navigation-specific
    fine-tuning. In this workflow, each request receives selected observations, execution
    feedback, and retained progress records. Evaluation covers the complete system,
    including context management and action control. We evaluate the system on 50
    of the 100 R2R-CE val-unseen episodes used by Open-Nav. It achieves a success
    rate of 52.0\%, an SPL of 48.9\%, and an nDTW of 70.8\%. Our analysis highlights
    three findings. First, recorded responses link landmarks and earlier actions to
    instructions using observations and supplied history. Second, reviews include
    requests for additional views and revisions of uncertain judgments. Third, the
    results suggest a gap between task understanding and autonomous completion: an
    unfinished crossing is recognized while rotation continues. At termination, 36.0\%
    of episodes succeed with a workflow-accepted STOP, while another 16.0\% meet the
    distance criterion at the step limit. These results highlight a central challenge:
    translating correct local judgments into sustained progress and appropriate stopping.'
  tags:
  - auto-runtime
  - auto-systems
- title: 'SuperNav: An Agentic Navigation System for Any Task in Any Scene'
  date: 2026-10
  url: https://arxiv.org/abs/2610.12126
  category: runtime
  subcategory: systems
  authors: []
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'General-purpose service robots need navigation systems that can handle
    diverse human requests in unfamiliar environments, combining task generality with
    scene generality. Some existing methods fine-tune multimodal large language models
    (MLLMs) to predict navigation actions, making their behavior dependent on the
    coverage of navigation training data and potentially limiting generalization to
    new requests and environments. Our key insight is to let the MLLM focus on interpreting
    requests, understanding scenes, and making decisions while preserving its general-purpose
    capabilities and delegating motion execution to navigation tools. To realize this
    idea, we introduce SuperNav, which equips a pretrained MLLM with a specialized
    agent harness without navigation-specific fine-tuning of the MLLM. Our harness
    supports these decisions with Navigation Skills, agent-oriented Tools for physical
    interaction, and task-progress and context management. A unified visual-point
    interface connects decision-making to motion by allowing the model to specify
    destinations directly in images and revise its decisions from execution feedback.
    Together, these components support sustained navigation across different task
    requirements and environments. SuperNav outperforms four evaluated baselines on
    instance-level, multi-object, and demand-driven tasks. Category-level evaluation
    on HM3D and deployment on a real quadruped robot further demonstrate its applicability
    across environments. Project Page: https://zju3dv.github.io/SuperNav/'
  tags:
  - auto-runtime
  - auto-systems
- title: 'Let the Mind Conceive, Let the Hand Achieve: Following Multimodal Instructions
    for Long-Horizon Robotic Manipulation'
  date: 2026-10
  url: https://arxiv.org/abs/2610.18352
  category: runtime
  subcategory: systems
  authors: []
  venue: ''
  code_url: ''
  project_url: ''
  abstract: A robot following a multi-step instruction needs to act on the right objects
    in the right order, even as the scene changes. It must also maintain awareness
    of task progress and determine when to advance. To address these challenges, we
    introduce Orchestra, an agent harness that separates task planning and execution
    management from action generation. Orchestra decomposes a complete multimodal
    instruction into ordered subtasks, tracks completed steps, and updates the locations
    of relevant objects and destinations during execution. It maintains a shared context
    containing the active subtask, spatial grounding, and recent observations. An
    action policy uses this context to generate actions, while a separately trained
    progress evaluator estimates when to advance to the next subtask. To evaluate
    whether robots trained on atomic instructions and short trajectories can execute
    longer subtask sequences, we introduce a benchmark named RMBench-Compose. Orchestra
    achieves a mean success rate of 68.22\% across nine RMBench tasks, outperforming
    Mem-0 by 26.22 percentage points. On RMBench-Compose, it achieves an Average Success
    Length (ASL) of 7.35 subtasks, 2.46 times that of HarnessVLA. Across four real-world
    multi-step tasks, it improves mean ASL by 25.0\% over Orchestra using the base
    π_{0.5} policy. These results show that Orchestra helps robots carry out longer
    sequences of subtasks while preserving the requested subtask order and acting
    on the specified objects. Our code and project page are available at https://youpengwen.github.io/Orchestra.
  tags:
  - auto-runtime
  - auto-systems
- title: 'Auriga Technical Report: A Task-Agnostic Agent Harness for Zero-Shot Embodied
    Manipulation'
  date: 2026-10
  url: https://arxiv.org/abs/2611.01112
  category: runtime
  subcategory: systems
  authors: []
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Vision-language models can interpret instructions and plan manipulation
    tasks, yet struggle when acting directly as robot policies. On RoboDojo, a large
    planning-execution gap separates high-level task decisions from physical execution:
    removing arm execution raises GPT-6 Astra''s success rate from 22.5% under the
    reference control interface to 76.2%. We present Auriga, a task-agnostic agent
    harness that closes 68.3% of this gap in zero-shot manipulation without target-task
    trials or resets. In Auriga, the model makes all task decisions over an explicit
    task belief and acts through either direct tool calls or synthesized multi-step
    Python programs, while the harness supplies calibrated 3D measurements, finger-referenced
    dual-arm control, and a single admission gateway to the robot. Before motion,
    the model inspects a visual trajectory preview while simulation is paused; during
    execution, the harness checks declared stage tolerances and grasp bounds, stopping
    the robot on divergence and returning the measured discrepancy for in-place recovery.
    Developed across 13 cross-task capability iterations and frozen for evaluation,
    Auriga ranks first on the RoboDojo leaderboard with a 57.7% success rate (64.0
    Score), more than doubling the reference harness on the same model, and remains
    first under scene randomization while learned policies drop by up to 33.9%. On
    RoboCasa365, the same frozen harness reaches a 73.2% success rate, outperforming
    VLA-assisted agents by up to 23.1% on composite tasks. Project page: https://auriga.stelledge.com/
    Code: https://github.com/lose4578/Auriga'
  tags:
  - auto-runtime
  - auto-systems
- title: An LLM-Agnostic, MAVLink-Based Drone Command and Control Interface and Agentic
    Harness Using the Model Context Protocol
  date: 2026-01
  url: https://arxiv.org/abs/2601.15486
  category: runtime
  subcategory: systems
  authors: []
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Artificial intelligence integrated with drone command and control (physical
    AI) offers a route to autonomy through large language models (LLMs), yet a unified
    LLM-to-drone interface has been missing. We present an LLM-agnostic command-and-control
    interface and agentic harness joining the Model Context Protocol (MCP) to MAVLink,
    the near-universal drone command-and-telemetry standard: "DroneServer" gives any
    MCP-capable LLM command, telemetry, mission, and safety functions over ArduPilot
    and PX4. Its 98 tools cover 223 of 238 client-side methods of MavSDK, MAVLink''s
    library; 61 of the 98 were exercised in software-in-the-loop. We treat the LLM
    as an untrusted commander: zero public ports (externally verified); every command
    validated server-side (tiers, confirmation handshakes, independent geofence, audit
    log), exercised by an adversarial safety suite. Server-side mission state resolves
    the "fire-and-forget" mismatch: a scripted client''s 37.8-minute mission survived
    a 4-minute disconnection. Over 1,000 simulated flights ran a ten-mission LLM-UAV
    control benchmark; eight of eleven models complete 90.0-100% of its six flying
    missions, and no aircraft left the permitted zone in 110 geofence-violation trials.
    On real hardware, the unmodified server commanded three quadcopters, GPS-guided
    and GPS-denied; five providers'' models flew an unseen mission, ten of ten. The
    tests and datasets include: repeated trials, standardized evaluation tasks, success/failure
    statistics, latency analysis, uncertainty treatment, comparative benchmarking
    across models/platforms, prompt sets, mission complexity, tool-call traces, safety-intervention
    logs, and safety-performance assessment. The architecture is a scaffold for a
    higher-level drone-LLM operating system where plain-language commands realize
    complex missions, and a path to agent swarms commanding drone swarms under one
    security umbrella.'
  tags:
  - auto-runtime
  - auto-systems
- title: 'RegenHarness: A Robot Agent Harness with Evidence-Gated Recursive Self-Improvement'
  date: 2026-09
  url: https://arxiv.org/abs/2609.27612
  category: runtime
  subcategory: systems
  authors: []
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Long-horizon robot execution requires a clear distinction between a model's
    proposal, a controller's termination, and verified task completion. We present
    RegenHarness, an evidence-gated robot-agent harness connecting task planning to
    heterogeneous robot skills. Its execution architecture couples a model loop for
    context-conditioned proposals with an agent loop for dispatch, observation, verification,
    commitment, and bounded recovery. Four role-isolated contexts separate planning,
    supervision, verification, and recovery inputs. Versioned memory distinguishes
    observed facts from accepted task progress, while an identity- and version-bound
    commit gate controls updates to trusted task state. The runtime combines duplicate-dispatch
    control, resource leases, and recovery budgets under explicit backend contracts,
    and checks the original user goal before reporting completion. To our knowledge,
    we are the first to introduce an evidence-gated recursive self-improvement (RSI)
    protocol for embodied robotic agents. Across missions, execution records motivate
    candidate changes to context rules, task templates, routing, and recovery policies;
    fixed regression checks and release authorization govern their acceptance; versioned
    rollout and rollback preserve configuration traceability. This RSI protocol revises
    the harness configuration without online model-weight updates or permission to
    weaken the commit gate. A real quadruped deployment documents voice-triggered
    warehouse navigation, panoramic inspection, visual analysis, message delivery,
    return, and spoken reporting through linked audio, images, trajectories, and receipts.
    A separate circuit demonstrates why completion depends on execution history rather
    than endpoint proximity alone. Together, the cases demonstrate integrated perception,
    physical execution, communication, and history-dependent completion in real-world
    robot tasks.
  tags:
  - auto-runtime
  - auto-systems
- title: 'World Action Agent: Harnessing VLMs for Robot Manipulation via World Action
    Rehearsal'
  date: 2026-09
  url: https://arxiv.org/abs/2609.29964
  category: runtime
  subcategory: systems
  authors: []
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'General-purpose vision-language models (VLMs) bring broad knowledge and
    spatial reasoning to robot manipulation, yet existing systems either use them
    indirectly, to predict constraints or write programs, or give them a view of the
    scene rather than a world in which to act. We present World Action Agent (WAA),
    a multi-agent harness through which VLMs pilot robots with basic tools, making
    every decision within a visual action workspace. The workspace has three properties.
    Contact views, selected automatically from the scene geometry, present the scene
    around the current interaction. Action rehearsal turns each action into an editable
    proposal that the agent, alone or through an Imagination Agent, previews and revises
    against planning feedback before execution. In-view correction closes the loop
    between observation, rehearsal, and low-level execution, letting the agent remove
    residual offsets in the view where it observes them. Through the same workspace,
    WAA acquires embodied procedural knowledge in two ways: it evolves multimodal
    skills from expert videos and human teaching under evidence-based review and consults
    them through a Skill Agent, and its interaction traces train smaller VLMs to pilot
    the same harness. On LIBERO-Pro, WAA with skills evolved only from LIBERO-90 reaches
    a state-of-the-art 75.6% average success, outperforming end-to-end VLAs, code-as-policy
    agents, and a visual-harness baseline with the same backbone; the same skills
    remain effective on robosuite without further learning. Fine-tuning Qwen3.5-9B
    on harness traces raises its out-of-domain success from 1.7% to 43.3%.'
  tags:
  - auto-runtime
  - auto-systems
- title: Generalizing Manipulation Skills with a Local Coding Agent
  date: 2026-09
  url: https://arxiv.org/abs/2609.26499
  category: runtime
  subcategory: systems
  authors: []
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Today, progress in open-weight language models enables systems capable
    of writing, executing and debugging code while still running on a single workstation.
    Most language-driven robots give the model a fixed action interface or a trained
    policy. Generalizing to a new task therefore means more engineering effort or
    more data collection, both time-consuming. We investigate whether a local open-weight
    vision-language model can control a robot and one-shot generalize to new variations
    of a task without new human programming or training. We let a local open-weight
    VLM, Qwen3.8-27B, drive a UR3e robotic arm from a coding-agent harness. It writes
    and runs its own code above a service that implements kinematics, safety limits
    and classic computer vision techniques. We investigate if this system is capable
    of generalizing to unseen tasks. Specifically, we test it on nine tasks built
    from children''s toys designed to probe generalization capability across various
    object characteristics: color, size, shape, and task variation of those. With
    five trials for each task, we observe generalization in 30 out of 45 trials with
    durations ranging from 3.4 to 67.5 minutes depending on task complexity. We further
    test if there is a speedup when an agent is asked to redo the task after successful
    completion. This resulted in a 50% reduction in duration, indicating that there
    is self-improvement over time. Finally, we expose the limitations of a local coding
    agent. We believe that solving those limitations combined with further investigation
    of self-improvement over time points at a direct path toward real-world deployment
    of a local coding agent.'
  tags:
  - auto-runtime
  - auto-systems
- title: 'Code2Worlds-2: Physically Plausible Agent Harness for Embodied World Simulation'
  date: 2026-10
  url: https://arxiv.org/abs/2610.17651
  category: runtime
  subcategory: systems
  authors: []
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Recent coding large language models (LLMs) can synthesize dynamic 4D
    worlds from natural language, but the resulting content remains a visual artifact.
    It lacks physical semantics such as the collision geometry, mass, friction, inertia,
    and joint structure, required to enable it to simulate the physical world, and
    its dynamics are scripted to look plausible rather than designed to execute. What
    is needed is an executable world: one that a physics engine can load and step,
    resolving contact physically. We present Code2Worlds-2, an extension of Code2Worlds
    that turns 4D world generation into an embodied world simulation. We keep the
    original dual-stream generation pipeline intact and append two modules. First,
    a SimReady Scene Compiler that turns a generated visual scene into a simulator-compatible
    representation: it assigns collision meshes via convex decomposition, estimates
    physical attributes with a vision-language model, infers a lightweight support
    graph, instantiates the engine''s contact, friction, and dynamics constraints,
    and applies a gravity settling pass, before exporting the scene as MuJoCo MJCF.
    Second, a Simulator-in-the-Loop 4D Refiner that implements an automated agent
    harness-a compile, simulate, critique and refine loop-that converts visual dynamics
    into executable rigid and articulated dynamics and evolves the physical settings
    rather than only the code, replacing the purely visual motion critic with a simulator
    critic that inspects penetration depth, collision pairs, stability, contact forces,
    joint limits, and robot reachability. We further propose SimCode4D, a state-based
    benchmark with five task templates for evaluating embodied simulation. Experiments
    on SimCode4D and across natural, indoor, industrial, urban, and service scenes
    show that Code2Worlds-2 produces physically plausible, simulator-compatible, and
    robot-interactable scenes.'
  tags:
  - auto-runtime
  - auto-systems
- title: 'Guava: Distilling Frontier VLMs into a Compact Agent through a Robotic Manipulation
    Harness'
  date: 2026-06
  url: https://arxiv.org/abs/2606.18363
  category: runtime
  subcategory: systems
  authors: []
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Language models trained on large-scale vision-language data have demonstrated
    strong potential for embodied agents. Harnessing models through embodied tools
    use offers a promising alternative to end-to-end vision-language-action systems
    by combining high-level reasoning with external modules for perception, planning,
    and control. However, it remains unclear what makes an effective harness for embodied
    manipulation, and to what extent such a harness can unlock embodied capabilities
    in a wide range of reasoning models. In this work, we present Guava, a harness
    framework for embodied tool use developed through systematic exploration of the
    design space of agent workflows, action spaces, and observation spaces. Our study
    identifies three key ingredients for effective embodied agents: iterative perception-reasoning-action
    loops, semantic action abstractions, and multimodal observations. To understand
    whether these design principles are universal even to small models, we develop
    an end-to-end training pipeline that distills embodied manipulation capabilities
    into a 4B open-source model using fewer than 2K trajectories collected entirely
    in simulation. Experimental results in both simulation and real-world environments
    show performance comparable to frontier proprietary models while exhibiting strong
    generalization to unseen objects, novel instructions, and long-horizon tasks.
    Results suggest that a well-designed harness can serve as a scalable, model-agnostic
    interface for embodied manipulation, enabling strong emergent embodied capabilities
    in compact open-source models with minimal training data.'
  tags:
  - auto-runtime
  - auto-systems
- title: 'PhysAgent: Automating Physics-Based 4D Synthesis via Trajectory-Grounded
    Multi-Agent Feedback'
  date: 2026-06
  url: https://arxiv.org/abs/2606.08688
  category: runtime
  subcategory: systems
  authors: []
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Achieving fully automated, physically plausible 3D motion synthesis is
    a core objective in graphics and generative AI. However, configuring complex environmental
    force fields still relies entirely on manual expert intervention, creating a severe
    bottleneck for large-scale simulation data generation. Existing automated methods
    primarily focus on material optimization and exhibit severe modality gaps and
    technical flaws when applied to the vastly more complex force field optimization
    space: naive Large Language Models (LLMs) lack underlying simulation feedback,
    causing severe physical inaccuracies, while traditional Score Distillation Sampling
    (SDS) suffers from sluggish gradients, local optima entrapment, and a mathematical
    inability to dynamically switch discrete force fields. To address this, we propose
    PhysAgent, the first simulator-in-the-loop multi-agent framework that leverages
    multimodal inputs for automated, physically grounded 4D synthesis. By decoupling
    intrinsic materials from extrinsic dynamics, PhysAgent utilizes a Semantic Agent
    equipped with an externalized Force Field Skill module to master simulation rules
    and generate valid initializations. Subsequently, the Refine Agents, driven by
    Trajectory-Grounded Multi-Agent Feedback, leverage vision foundation models to
    extract dense point trajectories from rendered frames. By converting these explicit
    motion trajectories into structured textual descriptors, the agent harnesses LLM
    commonsense reasoning to execute zero-shot macroscopic leaps, effectively escaping
    local optima and dynamically switching discrete force fields. Extensive experiments
    demonstrate that PhysAgent rapidly generates stable, diverse physical scenes from
    arbitrary multimodal prompts, significantly outperforming existing baselines in
    both generation diversity and physical accuracy.'
  tags:
  - auto-runtime
  - auto-systems
- title: 'Scale and Selection: What Makes Automatic Harness Evolution Work for Visual-Interface
    Robot Agents'
  date: 2026-09
  url: https://arxiv.org/abs/2609.39304
  category: runtime
  subcategory: systems
  authors: []
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'When an off-the-shelf coding agent is used directly as a robot policy,
    observing a browser-based 3D interface through screenshots and acting by posing
    a virtual target gripper through a few tools, the agent''s harness, its prompts,
    tools, and control rules, largely determines success, and until now it has been
    written by hand. We show that this harness can be improved automatically by another
    coding agent, the optimizer agent, and report two findings about what makes it
    work. First, the number of rollouts the optimizer agent sees per round governs
    whether the evolved harness generalizes: with rounds fixed, held-out success rises
    as the training batch grows from 5 to 100 rollouts, while small batches overfit
    the training tasks. Second, the optimizer agent must not be given free rein. Accepting
    every revision it proposes degrades the harness within a few rounds; a simple
    Champion-Challenger rule that promotes a revision only if it beats the incumbent
    on the same fixed cases turns the same loop into one that raises held-out success
    on LIBERO tasks from 51% to 67% over 30 rounds. The evolved harness is also a
    natural place to attach a pretrained policy, through one tool that hands it control.
    Distilling the rollouts of that combination back into the policy with multi-teacher
    on-policy distillation yields a standalone policy at 62.2% on RoboCasa365 under
    the official protocol, 4.8 points above its starting point with no harness at
    inference; the evolved harness on top of the distilled policy reaches 71.2% on
    the RoboCasa365 leaderboard benchmark, 13.1 points above the best published entry,
    and the loop closes when harness evolution resumes on the stronger policy. Automatic
    harness evolution for visual-interface robot agents is thus feasible, but its
    gains hinge on the rollout scale behind each decision and on how the optimizer
    agent''s revisions are selected.'
  tags:
  - auto-runtime
  - auto-systems
- title: 'Workspace Optimization: How to Train Your Agent'
  date: 2026-05
  url: https://arxiv.org/abs/2605.09650
  category: context
  subcategory: method
  authors:
  - Elad Sarafian
  - Gal Kaplun
  - Ron Banner
  - Daniel Soudry
  - Boris Ginsburg
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Modern agents built on frontier language models often cannot adapt their
    weights. What, then, remains trainable? We argue it is the agent''s \emph{workspace},
    the structured external substrate it reads, writes, and tests; we call its evolution
    workspace optimization. Workspace optimization targets hard multi-turn environments
    where a frontier model has strong priors but cannot solve the task in a single
    shot, so the agent must learn through interaction. We propose a principled way
    to evolve the workspace, mirroring the structure of weight-space training: artifacts
    in place of parameters, evidence in place of data, counterexamples in place of
    losses, and textual feedback in place of gradients. We instantiate the idea in
    DreamTeam, a multi- agent harness for ARC-AGI-3 whose roles build an executable
    world model, plan, hypothesize, probe, strategize, and route failures. On the
    current 25-game ARC-AGI-3 public set under the official scoring protocol and averaged
    over two independent runs, DreamTeam improves the SOTA protocol-matched agent''s
    score from 36% to 38.4%, while using 31% fewer environment actions per game.

    '
  tags: []
- title: Evolving Agent Interfaces
  date: 2026-10
  url: https://arxiv.org/abs/2610.28601
  category: interface
  subcategory: method
  authors:
  - Saaket Agashe
  - Yuzhe Yang
  - Gonzalo Gonzalez-Pumariega
  - Bhuvan Chandra Koduru
  - Chih-Lun Li
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Computer-use agents are limited by the interfaces humans give them. An
    agent may type a spreadsheet cell by cell when a single line of code would do,
    or print all two thousand lines of a file through a shell to find one function.
    Both the interfaces and the knowledge of when to use each are built by hand, which
    cannot keep pace with new applications, workflows, and models. We argue that interface
    design should itself be an agent capability. We introduce Agent S4, an autonomous
    computer-use scientist that builds Evolving Agent Interfaces from task experience.
    A meta-agent examines task agents'' trajectories on synthetic training tasks,
    without success labels, and constructs and revises interfaces and usage knowledge
    in a repository. Population-based evolution then selects which repositories to
    develop further by their performance on validation tasks the meta-agent never
    sees, favoring changes that generalize beyond the seen tasks. On OSWorld V2, Agent
    S4, with Qwen3.8-27B and the evolved repository of interfaces, sets a new state
    of the art in open-source computer-use agents, reaching 21.3% binary score, 3.8
    times the same model with fixed interfaces. This is above both GPT-5.5 (13.0%)
    and Claude Opus 4.8 (20.6%), at about 4.3% and 1.5% of their respective costs.
    On ScienceBoard, the evolved interfaces improve the success rate from 41.4% to
    58.6% with the same model. These results suggest that useful interfaces can be
    evolved from experience, making autonomous interface design a source of improvement
    complementary to advances in models and harnesses. We open-source our code at
    https://github.com/simular-ai/agent-s.

    '
  tags: []
- title: 'Web$hell: A Unified Interface for Agentic Web Access'
  date: 2026-10
  url: https://arxiv.org/abs/2610.13416
  category: interface
  subcategory: method
  authors:
  - Sunghwan Kim
  - Deogyong Kim
  - Sangam Lee
  - Donguk Kwon
  - Dongha Lee
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Large language model (LLM) agents are becoming direct users of the open
    web. As they take on increasingly complex and information-intensive tasks, effective
    web access is becoming a core capability for agentic problem solving. Existing
    approaches have advanced agentic web access through different access models, including
    search-augmented agents, browser-based agents, and, more recently, filesystem-based
    agents. Nevertheless, as users expect agents to complete long-horizon, end-to-end
    tasks, they increasingly need to conduct broad information gathering, perform
    browser actions, and revisit acquired evidence within a single trajectory. Yet
    our preliminary analyses reveal that existing access models struggle to meet these
    demands. They primarily support either information gathering or browser interaction,
    while combining their capabilities can involve substantial costs or performance
    trade-offs. To this end, we present Web\$hell, an interface that unifies web access
    under a single access model. Using a common schema defined by WebContract, WebCompiler
    compiles live webpages into addressable information and action objects. These
    objects are maintained in WebCache and handled through a shared set of operations,
    providing agents with consistent, operable, and persistent web access. Through
    extensive experiments across web search, web navigation, and deep research benchmarks,
    we show that Web\$hell achieves strong task performance at lower cost. Our results
    further indicate the importance of interface design for effective web access,
    with Web\$hell opening new possibilities for more capable and efficient LLM agents
    on the web.

    '
  tags: []
- title: 'RobustSGPO: Search-Space Control for Agent Harness Evolution'
  date: 2026-09
  url: https://arxiv.org/abs/2609.09646
  category: runtime
  subcategory: systems
  authors:
  - Zibo Zhao
  - Jijun Shi
  - Mo Zhou
  - Zhongyuan Wang
  - Shifu Bie
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Semantic-gradient-based prompt optimization (SGPO) improves agent harnesses
    using execution feedback, but its local update rule leaves the choice of edit
    scope and operation unresolved. We introduce RobustSGPO, which specifies the requested
    edit, constructs and checks the patch, and continues search from either the incumbent
    or retained snapshots. We evaluate permission scheduling, cumulative controls,
    and task-family transfer in the AgentX brainstorming workflow using 120 tasks,
    95 runs, and 7,350 candidate attempts. Periodic $1\to2\to3$ scheduling exceeds
    fixed maximum permission by 0.28 test-score points. RobustSGPO increases completion
    on 30 held-out tasks from 60.0% to 80.0% and improves test quality from 3.77 to
    4.14 under a 20-million-token budget. Category retention reduces source-task degradation
    after a shift, whereas random retention reaches a higher destination endpoint.
    Search-space control benefits quality through executable edits and alternative
    starting points, with measurable retention overhead.
- title: 'SHE: Trajectory-driven Safety Harness Evolution for LLM Agents'
  date: 2026-08
  url: https://arxiv.org/abs/2608.09885
  category: safety
  subcategory: method
  authors:
  - Wanying Qu
  - Qinghua Mao
  - Yu Li
  - Jiyao Liu
  - Xin Zhang
  venue: ''
  code_url: ''
  project_url: ''
  abstract: The safety of large language model (LLM) agents depends not only on model
    weights but also on the agent harness that manages context, memory, tools, permissions,
    and runtime control. Existing safety mechanisms often treat the harness as a fixed
    deployment artifact, limiting their ability to evolve with emerging risks. Moreover,
    coupled functions across harness components obscure safety responsibility attribution,
    making localized evolution difficult. We propose Safety Harness Evolution (SHE),
    a framework that learns evolving safe boundaries from rollout trajectories. SHE
    decomposes the harness into four artifacts with explicit safety responsibilities,
    including the System Prompt, Rule Bank, Safety Memory, and Tool Policy, defining
    clear functional boundaries for localized evolution. Based on this decomposition,
    SHE introduces an attribution-guided evolution loop that converts trajectory failures
    into structured diagnoses, learns artifact-specific boundary refinements, and
    selects evolved harnesses through safety-utility validation. Experiments on Agent-SafetyBench
    demonstrate that SHE effectively enhances safety through harness evolution, achieving
    a 3.1x ASR reduction compared with static SafeHarness, while also improving benign
    utility. The evolved harness further generalizes to unseen risks on the held-out
    AgentHarm benchmark and transfers across agent models without additional evolution.
- title: 'Reliable Before Profitable: QuantHarness for Governing Financial Strategy
    Development with LLM Agents'
  date: 2026-10
  url: https://arxiv.org/abs/2610.26101
  category: runtime
  subcategory: systems
  authors:
  - Jiasheng Mao
  - Jiacheng Liu
  - Hengwei Ye
  - Zheng Tian
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'LLM agents can turn natural-language financial research requests into
    executable and backtested strategies, but a successful run may still implement
    the wrong rule, use information unavailable at decision time, or obscure how repairs
    and candidate selection changed the strategy. Because these failures arise throughout
    development, final code and performance metrics alone are insufficient to establish
    either fidelity to the request or the validity of the development process. We
    therefore address the reliability of financial strategy development at the trajectory
    level: the system must control how intermediate outputs become downstream state
    and preserve the evidence needed to justify the terminal outcome. We introduce
    QuantHarness, a two-layer agent harness in which a finance-specific Workflow structures
    specification, data grounding, construction, testing, and review, while Harness
    Core enforces stage-specific information, action, and commitment boundaries. We
    also introduce FinRelBench, a benchmark that evaluates strategy-development reliability
    through execution success, requirement satisfaction, and runtime evidence. QuantHarness
    achieves the highest Task Success at 90.72\%, compared with 74.23\%--84.54\% for
    the comparison systems. Controlled stress tests show that its boundaries contain
    targeted violations, while structured run records improve evidence retrieval and
    support decision replay under the evaluated protocol.'
- title: 'Learning from Research: Toward Lifelong Agent Harness Evolution'
  date: 2026-09
  url: https://arxiv.org/abs/2609.40169
  category: runtime
  subcategory: systems
  authors:
  - Jingbo Yang
  - Kwei-Herng Lai
  - Xiaowen Wang
  - Yaar Harari
  - Evgeniy Gabrilovich
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Language agents are expected to solve increasingly complex tasks, creating
    a growing need for continual improvement. One promising approach is to evolve
    the agent harness, the software that governs tool use, memory management, and
    task execution, while keeping the underlying language model fixed. Recent methods
    automate this process by using a meta coding agent to modify the harness based
    on execution feedback. However, relying on that agent's existing knowledge and
    observed failures can restrict exploration and make adaptation reactive. Inspired
    by how human experts learn from the research literature for new solutions, we
    introduce ScholarEvolve, a framework that automatically draws on state-of-the-art
    research to guide harness evolution. ScholarEvolve organizes the harness evolution
    directions into functional modules and uses topic modeling to identify distinct
    improvement strategies for each module. It implements these strategies and evaluates
    their combinations to improve task performance. Moreover, the framework is designed
    to incorporate new publications over time, allowing research advances to drive
    proactive lifelong evolution. Experiments demonstrate improvements on AppWorld
    and Tau2-Bench. ScholarEvolve raises Qwen3.5-27B task goal completion from 49.6%
    to 63.6% on AppWorld Challenge, and raises GPT-5.4-mini pass@1 from 72.7% to 81.9%
    on Tau2-Bench Telecom.
- title: 'Beneath the Surface: What We Overlook When We Talk About Agent Evolution'
  date: 2026-11
  url: https://arxiv.org/abs/2611.07624
  category: runtime
  subcategory: systems
  authors:
  - Xiaobo Wang
  - Zimu Wang
  - Siyu Ye
  - Jiaqi Li
  - Min Tang
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Agent harness evolution enables recursive self-improvement (RSI) without
    updating model weights. We examine whether higher benchmark scores yield reliable,
    efficient, and transferable improvement. We evaluate four methods across harnesses,
    general and coding tasks. Repeated evaluations, controlled agent expansion, component
    interventions, and admission replays reveal recurring patterns. All sixteen evolved
    agents gain previously uncovered tasks while losing previously covered ones. In
    one general-task case, reliability rises by 5.2 points despite losing ten previously
    covered tasks. Most reliability gains also increase deployment cost. Specific
    changes usually outperform generic reminders, but their benefits can change when
    combined. The highest-scoring agent does not yield the largest mean improvement
    in any of our four pools, and stricter admission can discard useful alternatives.
    Transfer selectively preserves gains: coverage usually falls on the general-task
    target across both harness types and paradigms, but rises on the coding target
    with the outer-layer-only harness. These findings motivate preservation-aware
    evaluation, tested decision rules, and explicit applicability conditions. As a
    constructive follow-up, EvoAudit turns these diagnostics into revisions of select,
    analyze, mutate, and gate, achieving the best performance.'
- title: Safety Signals to Verify NetOps Agents with Action-Level Granularity
  date: 2026-09
  url: https://arxiv.org/abs/2609.14422
  category: safety
  subcategory: method
  authors:
  - Tobias Labarta
  - Frederik Pahde
  - Novak Boškov
  - Maximilian Dreyer
  - David Birkenberger
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Agentic Network Operations (NetOps) are an emerging paradigm promising
    to enable workload-aware, self-adjustable, and reliable autonomous networks. While
    agents have proven their value in incident summarization and telemetry signal
    extraction, their effectiveness as autonomous control-loop engines heavily relies
    on their long-horizon reliability. One such setting is the datacenter fabric,
    where an agent must respond to alarms and operator intents while abstaining from
    high-risk actions that may cause or extend downtime. Abstention, however, presupposes
    that an action's impact is known pre-execution, which necessitates a per-action
    ground truth that NetOps agent benchmarks do not provide. We construct such a
    ground truth for the network repair task of NetArena. A symbolic replay of the
    emulated network, validated against the environment at every turn, yields the
    exact value of every action. From the action-level value, we derive two pre-execution
    targets, namely whether an action reduces the repair distance (progress) and whether
    it increases it (harm). We show across 10 agent models, that agent verifiers leveraging
    internal signals predict both harm and progress more reliably than a baseline
    using observable signals only. Perspectively, we aim to use these signals as safety
    feedback to an agent harness to abstain from risky actions and protect the target
    system.
- title: 'VideoEvolve: Evolving Agent Harnesses for Video Temporal Grounding'
  date: 2026-10
  url: https://arxiv.org/abs/2610.01766
  category: runtime
  subcategory: systems
  authors:
  - Bingjun Luo
  - Yuhuan Fan
  - Jialin Guo
  - Siqi Li
  venue: ''
  code_url: https://github.com/bingjunluo/VideoEvolve
  project_url: ''
  abstract: Video temporal grounding aims to localize events in videos from natural-language
    queries. For agents built around frozen video-language models, the harness determines
    how queries guide temporal predictions and how those predictions are refined.
    Manually refining these harnesses requires diagnosing grounding failures and coordinating
    changes to both agent workflows and instructions. We introduce VideoEvolve, a
    framework that automatically evolves agent harnesses for video temporal grounding.
    VideoEvolve uses a Cloze-Structured Harness Representation that preserves stage
    interfaces while leaving agent workflows and instructions open to evolution. Branch-Guided
    Harness Evolution preserves promising code branches for continued refinement,
    using execution feedback to guide local edits and validation to determine which
    improvements are carried forward. Experiments demonstrate improved grounding performance
    across multiple benchmarks. Component analyses identify instruction refinement
    as a consistent source of gains, while the benefits of evolved code vary across
    evaluation settings. Together, these results support automated harness evolution
    as an effective approach to improving video temporal grounding. Code is available
    at https://github.com/bingjunluo/VideoEvolve .
- title: 'Exo: An Architecture for Self-Improving Systems at Runtime'
  date: 2026-10
  url: https://arxiv.org/abs/2611.00463
  category: runtime
  subcategory: systems
  authors:
  - Alexander Krentsel
  - Sylvia Ratnasamy
  - Ion Stoica
  - Martin Casado
  - Ankur Goyal
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Agent harnesses govern how language models act in an environment; designing
    their policies by hand is difficult, while automated techniques require representative
    datasets and costly executions. We present Exo, an agent runtime architecture
    for safe learning during ongoing work that collapses the optimization loop into
    task execution, allowing agents to revise both their harness and their strategies
    for further improvement. A minimal protected mechanism layer preserves execution
    history and governs policy activation while the harness evolves through inspectable
    code changes. On long-running objectives in an open-world game, Exo reduces model
    cost by 12-53% relative to Codex and Pi in standalone runs and 45-82% in transfer
    runs, while matching task completion rates. Compared with the same starting policy
    without the ability to edit policy, Exo reduces held-out model cost by 35-61%
    on AppWorld and SREGym with comparable correctness, cutting AppWorld's mean task
    time by 13% and SREGym's median diagnosis time by 35%. On Continual Learning Bench
    coding tasks, model cost including learning falls by 14%, with both policies resolving
    every issue.
- title: 'I-HITL: Inalienable Human-in-the-Loop'
  date: 2026-10
  url: https://arxiv.org/abs/2610.35835
  category: safety
  subcategory: method
  authors:
  - Samuel Breckenridge
  - Dani Vilardell
  - Wenhao Wang
  - Fan Zhang
  - Ari Juels
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Human oversight is a pillar of AI safety. It is often exercised by a human
    in the loop (HITL) who approves critical actions taken by an AI agent. AI agents'
    increasing ability to bypass guardrails, though, raises the question of how to
    enforce HITL robustly. We introduce the concept of inalienable human-in-the-loop
    (I-HITL). An I-HITL protocol ensures that an agent can initiate an action only
    with explicit human approval, even when the human interacts with a system (e.g.,
    a local agentic harness) compromised by the agent. A strong I-HITL protocol additionally
    ensures such approval even when an adversarial human attempts to delegate approvals
    to an agent. To motivate I-HITL, we report on experiments with a popular agentic
    wallet platform in which raising an agent's spending cap requires HITL approval
    via emailed one-time passcodes (OTPs). Given access to the user's email and a
    task blocked by the cap, we find that ten different frontier models will often
    autonomously raise the cap, harvesting OTPs to bypass a HITL guardrail and surfacing
    other vulnerabilities. We formally define I-HITL using the concept of communication
    topologies and prove necessary and sufficient conditions for its realization.
    We show that an I-HITL protocol requires a trusted entity - a trusted computing
    device (or equivalent) - and characterize which such devices can and cannot realize
    an I-HITL protocol. We present a prototype I-HITL system called Countersign that
    can plug into and strengthen existing HITL systems using off-the-shelf consumer
    mobile devices.
- title: 'WeAgent-MMSearch: Native Text-Vision Interaction for Multimodal Search Agents'
  date: 2026-08
  url: https://arxiv.org/abs/2608.28062
  category: runtime
  subcategory: systems
  authors:
  - Zongkai Liu
  - Hui Zhang
  - Liqiang Niu
  - Zhen Cao
  - Han Li
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Multimodal search agents extend parametric knowledge with newly emerging
    and long-tail evidence from the open web. Yet many existing agentic search environments
    often expose retrieved evidence only as text and omit tool-returned images from
    subsequent context, reducing visually grounded trajectories to text-only reasoning.
    Long-horizon interaction also compounds tool-call, response-length, timeout, and
    budget failures, which can discard salvageable trajectories, waste rollout computation,
    and disturb policy updates. To address these issues, we introduce WeAgent-Harness,
    a multimodal agentic harness that supports native text-vision interaction and
    runtime recovery. Retrieved images receive persistent disk references, allowing
    the model to inspect, process, and cite them throughout the trajectory. Based
    on this harness, we develop WeAgent-MMSearch, an integrated system spanning data
    construction, agentic post-training, and multimodal rollout. For data construction,
    a strong MLLM uses WeAgent-Harness to discover, synthesize, and verify MMSearch-style
    tasks and collect expert trajectories. During post-training, our Failure-Aware
    GSPO (FA-GSPO) recovers salvageable abnormal rollouts and filters invalid ones
    to improve bounded multimodal planning and search. We also introduce VisTarget-Bench,
    a 150-task human-verified benchmark that pairs each question with a held-out target
    image, distinguishing image-retrieval failures from visual-perception failures.
    Evaluation on VisTarget-Bench and seven public benchmarks shows that agentic post-training
    improves the average score by 19.22 points, enabling our model to outperform similarly
    sized open-source models and rival models with roughly ten times its parameter
    count.
- title: 'VerifiedLab: Harnessing Knowns for Unknowns'
  date: 2026-10
  url: https://arxiv.org/abs/2610.37923
  category: runtime
  subcategory: systems
  authors:
  - Yu Yao
  - Jiayi Dong
  - Yang Yang
  - Shuiwang Ji
  - Ju Li
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Across human history, knowledge has undergone several transitions, from
    orality to writing and then to digital archives. At each transition, humans established
    new conventions to preserve knowledge for the new era. Nowadays, as research agents
    are increasingly deployed for laboratory experiments, knowledge is crossing another
    boundary: from records written for humans to those for machines. In this work,
    we introduce VerifiedLab, a multi-agent harness framework for this human-to-machine
    transition of knowledge. VerifiedLab transforms research output from passive artifacts
    into active systems that accelerate downstream use, adoption and prediction of
    future trends. In VerifiedLab, a team of AI scientists with distinct roles reasons
    over records verified field by field: a principal investigator plans, a librarian
    computes the evidence directly from the records, specialists draft, and a gate
    and a critic check each claim against the measured reliability of its data before
    the harness decides whether to release or withhold it. We demonstrate the efficacy
    of VerifiedLab through extensive experiments on perovskite solar cells: VerifiedLab
    recovers known physical trends, anticipates devices reported a year later, and
    lets AI scientists inherit the literature together with a measure of how far it
    can be trusted. By scaling the inference-time verification compute, VerifiedLab
    introduces a new pathway for knowledge dissemination and machine harness for AI
    co-scientists.'
- title: 'Fyan: A Human--AI Harness with Semantic Auditing for Document-Level Formalization'
  date: 2026-09
  url: https://arxiv.org/abs/2609.39228
  category: runtime
  subcategory: systems
  authors:
  - Wei Zhao
  - Yangshuo Zou
  - Chengxiang Ding
  - Yifan Wu
  - Xuchuan Wang
  venue: ''
  code_url: ''
  project_url: ''
  abstract: We present FYAN, a human--AI harness for document-level mathematical formalization.
    Rather than treating theorems in isolation, FYAN coordinates an end-to-end workflow
    spanning specification, proof planning, logical review, Lean proof construction,
    knowledge curation, and validation, with support for independent supervision and
    human guidance. A central component is evidence-grounded semantic auditing, which
    assesses whether formal statements faithfully preserve their informal specifications.
    A language model constructs structured evidence over local correspondences, omissions,
    scope, and logical relations, while a deterministic validator checks this evidence
    and produces reproducible judgments. When a substantive but admissible deviation
    is accepted, FYAN requires an explicit proof-transfer obligation connecting the
    formal statement back to a source-facing interpretation. With the same model (DeepSeek-V4.1-Flash)
    in every stage, FYAN proves 86 of 143 FormalTCS theorems under a strict Lean check,
    against 69 for a general agent harness, and raises the natural-language proof
    score from 0.501 to 0.851. On ConsistencyCheck, its semantic audit catches more
    inconsistent statements than a direct LLM judge, both on labels verified against
    the source (recall 0.777 vs. 0.636) and on the original labels (0.873 vs. 0.820),
    and localizes each mismatch it reports to a specific hypothesis, conclusion, or
    scope. FYAN also built ODENumLib, a 9,355-line Lean library for the numerical
    analysis of ordinary differential equation.
- title: 'AeroWeaver: An Embodied-Agent Harness for Weaving Aerial Skills into Distributed,
    Adaptive Swarm Execution'
  date: 2026-09
  url: https://arxiv.org/abs/2609.18520
  category: runtime
  subcategory: systems
  authors:
  - Jiabin Lou
  - Yirong Yang
  - Haopeng Wang
  - Xuxin Lv
  - Xinyu Liu
  venue: ''
  code_url: https://github.com/Admire-ljb/AeroWeaver
  project_url: ''
  abstract: 'Collective intelligence is a collaborative autonomy paradigm in which
    multiple agents pursue shared objectives through local perception, information
    exchange, and coordinated action. UAV swarms embody this paradigm by coordinating
    multiple vehicles in tasks such as search, inspection, and tracking. Recent advances
    in large language model (LLM) agents have strengthened natural-language task understanding
    and high-level planning, providing a flexible semantic interface between mission
    descriptions and collective behavior. While these advances expand semantic reasoning,
    applying LLM agents to UAV swarms raises challenges in grounding model decisions
    in executable capabilities, reconciling global task reasoning with distributed
    execution, and using mission-specific experience for continual adaptation. To
    address these challenges, we introduce AeroWeaver, an embodied-agent harness that
    weaves individual UAV skills into coordinated mission-level behavior. AeroWeaver
    connects semantic decisions to governed skills, organizes role-conditioned local
    agents for distributed coordination, and uses role-indexed state-action-reward
    experience to refine skill selection online. Experiments and runtime validation
    show that AeroWeaver maintains valid skill execution under tested conditions and
    supports body-local multi-UAV operation without a central agent generating joint
    actions from global context, while reward-guided online updates provide a training-free
    path for adaptive learning swarm agents from accumulated execution experience.
    Code: https://github.com/Admire-ljb/AeroWeaver.'
- title: How Do Agent Harnesses Create Value? Planning Information and Release Control
    in Stateful LLM Agents
  date: 2026-09
  url: https://arxiv.org/abs/2609.20474
  category: runtime
  subcategory: systems
  authors:
  - Yukun Zhang
  - Kemu Xu
  - Yishen Chen
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Agent harnesses supply planning guidance, organize execution, and check
    completion. We study how these components affect success, erroneous acceptance,
    and cost in two Retail experiments and an Airline pilot in $τ^2$-bench. The primary
    comparison pairs prewritten task-specific plans (Fixed) with shuffled policy text
    matched in word count (Sham), isolating the contribution of guidance content.
    Across 265 matched cells, Fixed improves oracle-verified success by 7.17 percentage
    points (90\% task-clustered bootstrap interval, 1.15--13.36 points), with gains
    concentrated in higher-complexity tasks. A read-only terminal verifier rejects
    61\% of Retail oracle-invalid episodes while withholding 17\% of correct ones,
    at less than one cent of additional cost per episode. Which component matters
    more depends on the loss assigned to erroneous acceptance: at low liability the
    planning gain dominates; at high liability the verifier''s avoided false passes
    dominate---and a standalone verifier captures nearly all the false-pass benefit
    of the full planning-plus-verification stack at a fraction of its cost.'
- title: 'SecProbe: Adaptive Evaluation of Coding Agents on Cybersecurity Vulnerabilities'
  date: 2026-09
  url: https://arxiv.org/abs/2609.33763
  category: evaluation
  subcategory: method
  authors:
  - Xiaonan Luo
  - Yue Huang
  - Kehan Guo
  - Ping He
  - Chuan Zou
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Assessing cybersecurity vulnerability awareness in coding agents requires
    evaluations that reveal capability gaps and remain informative as models evolve.
    Static benchmarks offer fixed coverage and difficulty, while scarce vulnerable
    repositories and costly expert authoring limit their renewal at scale. We introduce
    SecProbe, a framework for adaptive evaluation that combines Item Response Theory
    (IRT) with on-demand synthesis of repository-scale vulnerability-repair tasks.
    From observed performance, \textsc{SecProbe} estimates agent ability and identifies
    where additional evidence is most informative, selecting existing tasks or synthesizing
    new ones accordingly. As one use case, we construct 353 tasks spanning six programming
    languages and 151 CWE types and evaluate nine frontier models with two agent harnesses.
    Success rates peak at 28.33\%, highlighting substantial gaps in vulnerability
    recognition and repair. Compared with random and one-shot baselines, \textsc{SecProbe}
    achieves comparable agent ability estimates while requiring agents to solve up
    to 29.5\% fewer tasks. These results support adaptive evaluation as an efficient
    and discriminative approach to assessing cybersecurity vulnerability awareness.
- title: 'SUMONE: A Simple and Efficient Summarizer for Plug-and-Play Agent Memory'
  date: 2026-11
  url: https://arxiv.org/abs/2611.06445
  category: context
  subcategory: method
  authors:
  - Jizhe Zhang
  - Ang Li
  - Chenheng Zhang
  - Yisen Wang
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Long-horizon language-model agents accumulate increasingly large interaction
    histories, making context compaction essential for efficient execution. Existing
    learned compaction methods often rely on downstream task outcomes or solver behavior,
    coupling training to specific tasks or agents. We introduce SumOne, a standalone
    summarizer trained to preserve information in agent histories through masked reconstruction.
    Given a summary of the expired history, a frozen reconstructor recovers randomly
    masked portions of the original trajectory; reconstruction quality, combined with
    a length penalty, provides a task-agnostic reward for optimizing the summarizer
    with GRPO. This yields self-supervision directly from raw trajectories, without
    reference summaries or downstream task execution. At inference time, only the
    lightweight summarizer is retained, enabling plug-and-play context compression
    for otherwise unchanged agents. We conduct a systematic evaluation of SumOne in
    long-horizon search and software-engineering tasks. SumOne reduces estimated inference
    cost by approximately 78\% on DeepSearchQA and 75\% on SWE-bench Verified relative
    to operating with full context, with absolute decreases of 0.04. The same checkpoint
    also transfers across downstream models and agent harnesses without additional
    fine-tuning.
- title: 'SBCO: Self-Supervised, Verifier-Grounded Harness Optimization For Planning
    Agents'
  date: 2026-08
  url: https://arxiv.org/abs/2608.10157
  category: runtime
  subcategory: systems
  authors:
  - Vivek Kulkarni
  - Sudipta Paul
  - Aounon Kumar
  - Nicholas Tzou
  - Srinivas Chappidi
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Self-improving agents seek to reduce the human engineering effort behind
    AI systems by enabling them to evolve and self-improve their performance over
    time. Recently, methods like the Darwin Gödel Machine and the Huxley Gödel Machine
    have been proposed which enable open-ended, recursive self-improvement through
    self-reference where a coding agent edits its own code. Such self-referential
    self-improvement methods require that the competence required to perform the task
    coincides or aligns well with the competence required for self-modification which
    is the case for coding tasks. For domains or tasks, which do not satisfy the alignment
    needed, self-referential self-improvement is not available. In such cases, it
    is possible to adapt the above algorithms to other tasks by removing the self-referential
    aspect or introducing explicit self-modification of a meta-agent -- both computationally
    expensive, relying on population or self-modification search over many candidate
    agents. For planning tasks with explicit constraints, we propose a far cheaper
    alternative. We introduce SBCO (Self-supervised Block Coordinate Optimizer), a
    verifier-grounded harness optimizer in the same closed-loop, improve-from-experience
    family as the Gödel-machine methods, but self-supervised rather than self-referential.
    Given an agentic harness, SBCO learns a decomposed bank of verifiers and a harness
    policy via approximate block coordinate ascent, improving the agent's outputs
    from its own graded feedback---with a fixed meta-agent and no human labels. Across
    two domains SBCO matches or exceeds a customized self-modifying baseline while
    using 4-5.5 times less compute budget.
- title: 'StarHarness: Evolving Harnesses with Stratified Search for Enterprise Environments'
  date: 2026-08
  url: https://arxiv.org/abs/2608.24804
  category: runtime
  subcategory: systems
  authors:
  - Esakkivel Esakkiraja
  - Denis Akhiyarov
  - Vikas Yadav
  - Sai Rajeswar
  - Patrice Bechard
  venue: ''
  code_url: ''
  project_url: ''
  abstract: We present StarHarness, a framework for evolving environment-specific
    agent harnesses while keeping model weights fixed. The evolved harness can include
    prompt and task framing, tool interfaces, skills, MCP-backed providers, subagent
    structure, and agent-loop configuration. StarHarness constructs a compact evolution
    pool by stratifying tasks according to baseline failure behavior, separates proposer-visible
    search tasks from proposer-hidden selection tasks, and reserves held-out tasks
    for evaluating generalization. Across ITBench SRE, EnterpriseOps-Gym ITSM, and
    AutomationBench Finance, harness evolution improves full-benchmark performance
    by 20-35 percentage points over the default harness after 4-12 accepted changes
    per environment. These gains persist on tasks excluded from evolution and transfer
    without re-evolution across GPT and Qwen model families. Trace analysis links
    the improvements to interface repairs, environment conventions, and operational
    knowledge that compresses search, with fewer false-positive diagnoses and shorter
    trajectories in several settings. StarHarness therefore offers a practical way
    to reduce persistent model-environment mismatch in tool-rich enterprise tasks.
- title: 'Evolver: Turning Agent Exploration into Evolving Capabilities'
  date: 2026-11
  url: https://arxiv.org/abs/2611.07595
  category: runtime
  subcategory: systems
  authors:
  - Haoyang Zhang
  - Qumeng Sun
  - Xiao Zhang
  - Xiang Liu
  - Zhidong Fan
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Agent exploration produces valuable procedural knowledge, yet much of
    this experience remains confined to transient execution traces and is not systematically
    reused. We introduce Evolver, an experience-driven framework that transforms agent
    exploration into persistent, reusable capabilities without updating foundation
    model parameters. Built around structured Gene assets, Evolver integrates experience
    acquisition, retrieval, and feedback-guided evolution to support experience-conditioned
    execution across existing agent harnesses. We evaluate Evolver using Claude Code
    and Codex, two foundation model configurations, and four benchmarks: Terminal-Bench
    2.1, SWE-bench Multilingual, SWE-rebench, and GAIA. On a selected diagnostic set
    of 320 paired executions, Evolver improves task success from 83.13% to 87.50%
    (+4.38 percentage points) while reducing recorded task-execution token consumption
    by 24.24%. Furthermore, among 265 pairs successful under both conditions, token
    consumption decreases by 17.57%, demonstrating efficiency benefits even when task
    success is preserved. These findings suggest that persistent procedural experience
    can improve both task effectiveness and execution efficiency, providing a practical
    foundation for transforming agent exploration into evolving capabilities.'
- title: 'CoSA: The Conflict of Skills Attack in Real-World LLM Agent Ecosystems'
  date: 2026-10
  url: https://arxiv.org/abs/2610.35082
  category: safety
  subcategory: method
  authors:
  - Yujia Zheng
  - Tianhao Li
  - Shangzhi Xu
  abstract: 'Agent Skills allow LLM agents to combine reusable capabilities, but checking
    each Skill in isolation cannot rule out policy violations when they are composed.
    We term such failures Conflict of Skills (CoS): artifacts or assessment signals
    produced for one purpose may be reused downstream without preserving the restrictions
    or authorization needed for their new use. Using controlled executions of publicly
    available Skills and matched single-Skill controls, we identify four recurring
    mechanisms behind CoS. Building on these findings, we introduce the Conflict of
    Skills Attack (CoSA), which adds locally admitted Skills to an existing pool to
    supply missing business operations (capability supplementation) or reshape artifact
    exchange, decision reuse, and target/action bindings (relationship reshaping).
    CoSA leaves existing Skills and runtime permissions unchanged. To evaluate this
    threat under autonomous Skill selection, we introduce CoSA-Bench, built from real-world
    Skills and controlled services, with 288 tasks across recruiting, finance, IT,
    and business, covering data leakage, unauthorized state modification, and unsafe
    execution. Across five LLMs and three agent harnesses, additions capped at 5%
    of each original pool raise the policy-violation rate from 35.02% to 58.45%, an
    increase of 23.43 percentage points. Trace analysis links compliant-to-violating
    transitions to cross-Skill dependencies involving the additions. Finally, we develop
    a lightweight harness-level guard that checks information flow and authorization
    before consequential actions. On OpenClaw recruiting tasks across five models,
    the guard reduces violations from 65.28% to 6.67%, while policy-compliant task
    completion on matched benign controls changes from 66.67% to 65.00%.'
  venue: ''
- title: 'DoGNAVY-Exploit: Harnessing Parallel Open-Weight Agents for Stage-Aware
    Vulnerability Exploitation'
  date: 2026-11
  url: https://arxiv.org/abs/2611.04196
  category: safety
  subcategory: method
  authors:
  - Yuxuan Wang
  - Dadi Guo
  - Weijie Guo
  abstract: 'Frontier LLM agents can turn known vulnerabilities into working exploits,
    but are costly and often access-restricted due to their potential for malicious
    use. Open-weight models offer a more accessible alternative, but struggle to maintain
    progress across long exploitation chains. They also often fail to apply relevant
    security knowledge at the appropriate stage and in the right context to identify
    and evaluate promising attack directions. To address these limitations, we propose
    DoGNAVY-Exploit, a multi-agent harness built around two complementary designs:
    stage-aware decomposition with progressive expert knowledge disclosure, and hierarchical
    orchestration with parallel exploration. Specifically, DoGNAVY-Exploit uses configurable
    milestones to recast long-horizon exploitation as short, verifiable capability
    transitions and provides only the knowledge relevant to each stage. Within each
    milestone, a hierarchical architecture separates strategic planning from parallel
    execution: a planner proposes diverse attack routes, executors test them concurrently,
    and a controller accepts progress only when supported by runtime evidence. A shared
    structured memory consolidates verified facts, artifacts, replay steps, and failed
    routes across branches, allowing agents to build on collective progress and carry
    validated knowledge into subsequent milestones. In controlled benchmark environments,
    DoGNAVY-Exploit with GLM-5.2 achieves 97.5% Pass@1 on Cybench, and 97.5% zero-day
    and 100% one-day Pass@1 on CVE-Bench. On ExploitGym, it solves 79 tasks with GLM-5.2
    and 157 with GLM-5.3, while the corresponding public Claude Code baselines solve
    39 and 130 tasks, respectively. Ablation results further demonstrate that the
    stage-aware orchestration, expert knowledge, parallel exploration, and memory
    designs can substantially improve the exploitation capabilities of open-weight
    agents.'
  venue: ''
- title: 'Built to Remember, Shipped to Forget: Operational Contracts, Failures, and
    Repairs in Containerized LLM Agent Deployments'
  date: 2026-10
  url: https://arxiv.org/abs/2610.34620
  category: runtime
  subcategory: systems
  authors:
  - Meriem Mastouri
  - Emna Ksontini
  - Amine Barrak
  abstract: 'LLM agent systems reach production as container images run by platforms
    such as Docker, Compose, and Kubernetes. Framework and platform document opposite
    expectations: to the platform a container is disposable, while the framework persists
    conversations, pauses runs for human input, and resumes interrupted work from
    saved state; each side specifies only its own behavior, so the obligations their
    composition creates are stated nowhere. We present the first empirical study of
    this boundary, stating these obligations as operational contracts: guarantees
    a deployment must provide to preserve an agent system''s required behavior when
    a deployment-platform event occurs. From the first-party documentation of LangGraph
    and the three platforms we derive 14 contracts and evaluate them with three independent
    sources of evidence: 433 deployed open-source agent systems, seven events induced
    on 12 of them, and 122 developer repairs mined from 39,261 commits, pull requests,
    and issues. At least one contract applies to 75.5% of the systems, yet its guarantee
    is routinely missing: of systems that must keep state beyond the process, 37.4%
    lose it to a restart and 41.5% to a container replacement, and every assessable
    deployment stops the framework''s production server mid-drain. Induced events
    turn 14 of 16 predicted violations into runtime failures and all seven predicted
    holds pass. The failures are born in deployment but repaired in code: developer
    repairs independently cover twelve of the fourteen contracts, 78% change application
    code, and only two in three fully restore the violated guarantee. The 14-contract
    catalogue, detection rules, fault-injection harness, and 35-pattern repair taxonomy
    provide a basis for checking and strengthening agent deployments.'
  venue: ''
- title: 'Model-as-a-Trojan: Self-Activating Covert DNS Exfiltration Baked Into the
    Weights of an LLM Agent'
  date: 2026-10
  url: https://arxiv.org/abs/2610.22578
  category: safety
  subcategory: method
  authors:
  - Barak Haryati
  - Shaked Zychlinski
  abstract: 'Open-weight models are downloaded from public hubs and run inside agent
    harnesses that grant them tools, most powerfully, a shell, under the assumption
    that a sandbox contains whatever the model might do. This paper demonstrates that
    the assumption has a blind spot: the weights themselves can be the malware, and
    the sandbox''s last open door, DNS, is enough. We fine-tune an open-weight LLM
    so that a single covert behavior lives in its parameters: on the first turn of
    every conversation, whenever the model infers from its context that a shell tool
    is available, it emits one self-contained command that reads a secret from the
    runtime environment, base32-encodes it, chunks it, and exfiltrates it as DNS queries
    toward an attacker-controlled authoritative name server. It then answers the user
    normally and never mentions, or repeats, the act. Because the channel is DNS,
    the attack completes from inside a container with no internet egress beyond name
    resolution - measured payload-level and model-level behind an egress firewall
    that drops every non-DNS packet, with the secret reconstructed from the gateway
    resolver''s query log. Because the behavior lives in the weights, prompting is
    the only off-switch a victim has, and it is unreliable: the implant fires in 20/20
    of adversarial suppression trials, deflects direct interrogation without disclosing
    the sequence, and sweeps a 45-cell sandbox-fault matrix across five tool-calling
    formats - plus a fresh post-training canary, persona-only and absent system prompts,
    and an egress-locked topology - with zero leaks and zero repeat fires. Every training
    trajectory is execution-verified in a real container, and every claimed exfiltration
    is proven resolver-side: we reconstruct the secret from the authoritative resolver''s
    query log alone.'
  venue: ''
- title: 'ToFu: Exploiting and Fuzzing the LLM-Orchestrator-Tool Trust Boundary'
  date: 2026-10
  url: https://arxiv.org/abs/2610.13651
  category: safety
  subcategory: method
  authors:
  - Md Nazmul Islam Ananto
  - Pierre Prevost-Avenel
  - Colin Smith
  abstract: Large language models (LLMs) are increasingly deployed as agents that
    interact with external software through tools, with an orchestration layer translating
    model outputs into structured tool invocations. This architecture creates an LLM-orchestrator-tool
    trust boundary where tool semantics may go unenforced and LLM-generated arguments
    may be incorrectly treated as trusted. We present ToFu, a tool-aware framework
    that automatically derives semantic security checks for LLM tools from their existing
    metadata and a CWE-guided sanitizer corpus. ToFu specializes these checks to individual
    tools and automatically generates fuzzing harnesses and semantic oracles using
    runtime introspection and outcome sanitization. We evaluated ToFu across 273 MCP
    servers containing 3405 tools and identified verified bugs corresponding to CWE
    weakness classes in 343 tools across 118 of the servers. Our findings show that
    real-world tools frequently fail to enforce their documented input semantics,
    making it unsafe to treat LLM-generated arguments as trusted.
  venue: ''
- title: 'StateMirror: Pre-Execution Detection of Hallucinated Tool Calls in Coding
    Agents'
  date: 2026-10
  url: https://arxiv.org/abs/2610.32648
  category: safety
  subcategory: method
  authors:
  - Shiwen Shan
  - Yintong Huo
  - Zhiying Wu
  abstract: Large language model (LLM)-based coding agents may propose invalid actions
    that are not applicable in the execution environment, such as accessing non-existent
    paths or missing packages. We term this mismatch hallucinated tool use. A preliminary
    study of 4,398 agent trajectories reveals that these hallucinations are pervasive
    and costly, requiring a median of 3 additional interaction steps and 22.4K tokens
    to recover. Existing frameworks rely on reactive, post-execution feedback, wasting
    runtime resources. Nevertheless, since an agent's execution environment is grounded
    in concrete codebase and harness components, many action prerequisites can be
    extracted and validated prior to execution. To this end, we introduce StateMirror,
    a lightweight pre-execution detector. StateMirror intercepts actions at the harness
    boundary, extracts state predicates via AST and command analysis, and deterministically
    validates them against the live repository. By pinpointing exact environment mismatches
    before execution, StateMirror preempts invalid actions and subsequent recovery
    cycles. Evaluation on 2,508 actions shows StateMirror achieves 0.940 precision
    and 0.817 F1 in detecting such hallucinations, surpassing the strongest LLM judge
    by 35.3% in F1 while reducing median detection latency from 17.73 s to 1.50 ms
    with zero token consumption. For practical mitigation, StateMirror's pre-execution
    feedback enables agents to rectify over 95% of hallucinated tool calls. During
    live mitigation on 79 tasks, StateMirror reduces agent execution time by 15.8%
    and token consumption by 11.8% while maintaining task resolution.
  venue: ''
- title: 'Lessons Outlive Their Failures: A Case Study of Rules for AI Coding Agents'
  date: 2026-10
  url: https://arxiv.org/abs/2610.32578
  category: runtime
  subcategory: method
  authors:
  - Hassan Hassanzadeh Aliabadi
  abstract: 'AI coding agents increasingly work inside a harness: rule files such
    as AGENTS.md, on-demand skills, runtime hooks and automated checks. Most studies
    of harnesses look at a single point in time or at short benchmark runs. I report
    a six-week case study of my personal system of record, a plain-markdown repository
    that three AI agent tools edited daily under one shared rule set. I built a ledger
    of 118 agent failures, their fixes and whether they came back. I also tested the
    system''s monthly LLM documentation audit against 47 known stale statements and
    20 planted errors. Finally, I replayed five past failures in isolated git clones,
    with and without their fixes. All results come from one repository with three
    runs per condition, so I report them as exploratory. Stale documentation (drift)
    was the largest failure class (48 of 118), although 35 of those were found on
    one audit day. A single audit run found about half of the known drift (Claude
    Sonnet 5.5 mean: 50%), and at least 93% of its findings were correct. On Sonnet
    5.5, the agent finished four of the five replayed tasks. In three of those four,
    the failure did not happen, with or without its fix. Only the stale-count failure
    came back without its check, and the check stopped it in every run. On older models,
    an agent drafted an em-dash once while the em-dash lint check was active, and
    the check rejected it. A written rule on run-time estimates did not change Sonnet
    4.5''s overestimates. These results suggest that harness lessons can outlive the
    failures they were written to fix, while drift persists and still needs mechanical
    checks. Tools that evolve a harness add lessons faster than they retire them,
    so they should re-test their rules from time to time and retire the obsolete ones.'
  venue: ''
- title: 'Airlock: Bounding the Multi-Agent Blast Radius via Selective Online Containment'
  date: 2026-11
  url: https://arxiv.org/abs/2611.06727
  category: safety
  subcategory: systems
  authors:
  - Zhonghao Zhan
  - Javad Forough
  - Yefan Zhang
  abstract: 'When multi-agent systems act on the external world, a single agent''s
    faulty output can spread across tasks before detection, creating a system-wide
    blast radius. Single-agent guardrails are confined to individual harnesses, while
    existing multi-agent controls either cancel only the faulty source and miss downstream
    consumers or halt and roll back the entire workflow at the cost of healthy work.
    We present Airlock, a multi-agent runtime and guardrail for selective post-alert
    fault containment. Its tree-structured runtime, EdgeCitadel, narrows permissions
    vertically from parent to child agents to establish node boundaries and control
    switches. Meanwhile, an append-only provenance DAG records cross-agent data consumption
    horizontally. Upon an alert, Airlock traces forward on this DAG to isolate tainted
    executions and pending actions, and backward to narrow root causes. At the site
    switches, a default full quarantine tier freezes affected branches without a solver,
    while an assured optimized cut tier uses fence-then-prune to enforce a deadline-aware
    minimum cut minimizing collateral disruption. Across 1,832 testbed runs, 161 physical
    smart-home LLM runs, and 24,266 simulation records, Airlock blocks all post-alert
    faulty actuations on our main testbed and smart-home grids with zero post-convergence
    leaks. Whereas native controls in A2A and LangGraph either contain at most 33.3%
    of faults or retain at most 16% of work without redo, Airlock retains +68 pp to
    +96 pp more healthy work, and its optimized cut retains +46 pp more than full
    quarantine under dense spread. These results show that co-designing runtime authority
    boundaries with online provenance enables surgical fault containment without sacrificing
    healthy work (code: https://github.com/EdgeCitadelTeam/EdgeCitadel).'
  venue: ''
- title: 'Organon : From Evolutionary Search to Recursive Self-Improving Agents for
    Scientific Discovery'
  date: 2026-10
  url: https://arxiv.org/abs/2610.33046
  category: runtime
  subcategory: systems
  authors:
  - Cheikh Ahmed
  - Zhiyu Zhang
  - Kun Mao
  abstract: 'Scientific discovery does not follow a single fixed methodology: research
    methods vary across domains and evolve through experimentation as investigations
    unfold. Although LLM-guided evolutionary search has advanced automated discovery,
    existing frameworks typically rely on fixed search procedures or restrict adaptation
    to predefined components, limiting their ability to address diverse research problems
    and adapt to challenges that emerge at runtime. We introduce Organon, a recursively
    self-improving agent for scientific discovery. During execution, a single persistent
    agent analyzes its accumulated experience and autonomously revises its own search
    strategies, population management, diagnostic tools, memory, and worker coordination.
    These revisions take effect at runtime, allowing the agent to continuously adapt
    its approach as research progresses. Importantly, the agent can also diagnose
    and correct flaws in its own adaptation procedures, enabling recursive improvement
    of the mechanisms that guide its future self-improvement. We evaluate Organon
    across 21 computational discovery tasks spanning algorithm design, GPU kernel
    optimization, mathematical construction, and systems optimization. On ALE-Bench
    Lite, Organon achieves the best performance among competing search frameworks
    on all 10 tasks, improving mean held-out performance by 20.5% over EvoX. On KernelBench,
    it achieves the best results on three of four workloads, with speedups of up to
    1.67x over the strongest competing method. Analysis of the search trajectories
    further reveals how the agent develops task-specific search strategies, builds
    new diagnostic capabilities, and corrects or reverses its own earlier revisions.
    We implement Organon using DeepSeek Harness and Cordis''s spatiotemporal composability.
    Code is available at https://github.com/cheikh025/Organon.'
  venue: ''
- title: 'ProgAgent: Learning Tool Orchestration through Programmatic Training'
  date: 2026-10
  url: https://arxiv.org/abs/2610.14774
  category: method
  subcategory: method
  authors:
  - Hao Li
  - Keqing He
  - Longtao Zheng
  abstract: Large language models (LLMs) are increasingly expected to orchestrate
    diverse tools over long-horizon tasks. Existing agents typically use Direct Tool
    Calling (DTC), where the model invokes tools sequentially, and tool responses
    accumulate in the model context, which can lead to context rot and orchestration
    breakdown. In contrast, Programmatic Tool Calling (PTC) invokes tools through
    executable code and stores intermediate results in runtime variables rather than
    appending them to the context. Prior work has explored PTC mainly as an inference-time
    optimization, but its benefits for agentic training remain unclear, and suitable
    verifiable training tasks are scarce. In this work, we introduce ProgAgent, a
    full PTC training stack, comprising a pipeline for synthesizing verifiable long-horizon
    tasks, a lightweight PTC runtime, and a two-stage training recipe. Using only
    215 tasks instantiated at four environment scales, ProgAgent yields higher pass
    rates than the evaluated baselines of comparable size across four benchmarks.
    On LOCA-bench, ProgAgent-14B achieves a 30.7% pass rate at a 64k-token environment
    state, where these baselines score zero. Cross-harness experiments show that PTC-trained
    models outperform DTC-trained models under both evaluation interfaces, suggesting
    that the benefits of PTC training extend beyond the interface.
  venue: ''
- title: 'Agent Harness for Large Language Model Agents: A Survey'
  date: 2026-04
  url: https://doi.org/10.20944/preprints202604.0428.v3
  category: survey
  subcategory: survey
  authors:
  - Qianyu Meng
  - Yanan Wang
  - Liyi Chen
  - Yihang Li
  - Wei Wu
  - Wenyuan Jiang
  - Qimeng Wang
  - Chengqiang Lu
  - Yan Gao
  - Yi Wu
  - Yao Hu
  venue: Preprints.org
  code_url: https://github.com/Gloriaameng/Awesome-Agent-Harness
  project_url: ''
  abstract: 'In production environments, reliability of LLM agents is increasingly
    determined not by the model but by the agent harness that encapsulates it. We
    present the first systematic survey of the LLM agent harness, based on a review
    of over a hundred papers, technical reports, and industry blogs. Contributions:
    (1) a formal six-component definition of the agent harness H=(E,T,C,S,L,V) — execution
    loop, tool registry, context manager, state store, lifecycle hooks, evaluation
    interface; (2) a historical tracing of the harness concept from software testing
    and RL environments to modern LLM agents, identifying a unifying architectural
    pattern of a controllable, observable, verifiable runtime for unpredictable agents;
    (3) an empirically grounded taxonomy of 23 representative systems via a six-component
    completeness matrix; (4) analysis of nine cross-cutting challenges spanning sandboxing,
    evaluation, protocol standardization, and compute economics, including an empirical
    MCP-vs-A2A protocol comparison and ultra-long-context implications; (5) future
    directions where harness-layer infrastructure remains underdeveloped.'
