    --dataset . --work /tmp/xhw python3 code/figures/make_figures.py --decl /tmp/xhw/decl-nemo
    --decl /tmp/xhw/decl-batch2 --items /tmp/xhw/items cmp code/build/numbers.json
    paper/numbers.json && echo "numbers identical" make_figures.py rebuilds every
    card from the per-item records and aborts on any disagreement with the signed
    declarations. When we ran this on the package as published, numbers.json and all
    seven tables came out byte-identical to the released copies. Licence, contact
    and objections Data and paper: CC-BY-4.0. Model outputs are included as research
    evidence; each model remains under its own licence. Contact, corrections and o'
  venue: Zenodo (CERN European Organization for Nuclear Research)
- title: 'BETTINA: Skill-Anchored Governance and Koopman-Assisted Semantic Control
    in Production LLM Systems'
  date: 2026-05
  url: https://doi.org/10.6084/m9.figshare.32174238
  category: runtime
  subcategory: ''
  authors:
  - reynaldo rosa neto
  abstract: 'This preprint presents BETTINA (Bilinear Expansion with Transient Trajectories
    for Intelligent Nonlinear Adaptation), a layered framework for controlling large
    language model behavior through two complementary regimes: a research regime based
    on chaotic perturbation and Koopman-operator analysis, and a production regime
    based on tenant-scoped skill-anchor governance in the OpenClaw Gateway. In the
    deployed path, the system validates tenant context, resolves an agent-specific
    skill anchor, injects anchor-grounded support into the prompt through Operator
    S Inline, optionally applies Koopman-assisted chunk scoring over SentenceTransformer
    embeddings, and performs post-response semantic auditing with protocol disclosure.Across
    controlled experiments, BETTINA reduces hallucination loss by 73-86% and improves
    semantic coherence by 78-94%, including under oracle pollution. In reported internal
    two-skill batteries for legal and guidance scenarios, a curated 30-case harness
    reaches 87-93% in-domain accuracy, while broader hardening notes show weaker regimes
    under other calibration profiles; these values should therefore be read as scenario-scoped
    evidence rather than universal runtime guarantees. The paper focuses on semantic
    routing, auditability, and multitenant LLM governance, while explicitly distinguishing
    directional semantics from action-policy control.'
