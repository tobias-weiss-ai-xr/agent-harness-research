- title: 'VEX-Bench: Benchmarking LLM Agents for Assessing Exploitability of Software
    Supply Chain Vulnerabilities'
  date: 2026-09
  url: https://arxiv.org/abs/2609.08040
  category: runtime
  subcategory: systems
  authors: []
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'The software supply chain has become an increasingly exposed attack surface
    because of its reliance on intricate yet fragile dependencies. Existing defenses
    such as GitHub Dependabot often raise many false alerts because their coarse-grained
    matching cannot determine whether a vulnerable dependency is actually exploitable.
    Security analysts typically spend substantial time assessing vulnerability exploitability
    case by case. Recent LLM agents have emerged as promising candidates for this
    task given their advanced capabilities in coding and cybersecurity, yet no existing
    benchmark evaluates them on it. Prior benchmarks target zero-day settings, where
    agents detect and exploit previously unknown vulnerabilities. In contrast, software
    supply chain security focuses on how known vulnerabilities in upstream dependencies
    affect downstream projects. This requires agents to reason across repositories
    and determine whether an upstream vulnerability is exploitable in the downstream
    project. To address this gap, we introduce VEX-Bench, the first benchmark for
    evaluating LLM agents'' ability to assess the exploitability of software supply
    chain vulnerabilities. It contains 75 real-world cases mined from GitHub and labeled
    by security experts, covering Python, Java, and Go. We evaluate nine models across
    three agent harnesses. While GPT-5.5 and Claude Opus 4.6 reach approximately 80%
    F1 on binary vulnerability-status classification, only GPT-5.5 surpasses 70% macro-F1
    on fine-grained justification classification. This gap highlights the challenge
    of moving beyond binary exploitability assessment to identifying fine-grained
    exploitability reasons. Code and data: https://github.com/steven1518/vex-bench'
  tags:
  - auto-runtime
  - auto-systems
- title: 'Scores Are Not Decisions: Cost-Aware Stopping for Tool Acquisition in LLM
    Agents'
  date: 2026-07
  url: https://arxiv.org/abs/2607.27083
  category: runtime
  subcategory: systems
  authors: []
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'As LLM agents increasingly depend on diverse external services such as
    search engines, databases, and connectors, agent harnesses face a fundamental
    tool-selection challenge: acquiring too few tools leaves the task under-informed,
    while too many adds cost, context load, and privacy exposure. Routers and retrievers
    can rank candidate tools by relevance, but a ranking alone does not determine
    how many are worth selecting. Existing approaches leave acquisition under heterogeneous
    costs unaddressed. We formulate this decision as cost-aware marginal decision-focused
    stopping (CAM-DF) over ranked tool prefixes, with CAM-DF-lite as a compact interpretable
    variant. We train directly on the offline gap between stopping now and the best
    continuation: its sign labels the decision, its magnitude weights each error by
    the payoff at stake. We prove this objective is Bayes-aligned with the stopping
    target and that score-only rules are suboptimal under heterogeneous costs. We
    evaluate on 1,343 tasks across five tool-use domains. On τ-bench Retail, CAM-DF
    attains the highest payoff among deployable methods, with gains over a predict-then-threshold
    baseline across all five ranking sources and two cost regimes. Our approach is
    state-of-the-art under heterogeneous costs and high cost pressure, with larger
    gains under weaker rankings. In live execution, CAM-DF exposes the agent to 37\%
    fewer tools than full access while maintaining comparable task success. The CAM-DF
    family is a lightweight pre-execution plugin that turns existing tool rankings
    into lower-cost acquisition decisions without fine-tuning the underlying LLM.'
