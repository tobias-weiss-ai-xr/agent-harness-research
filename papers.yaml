    { "provider": { "ollama-cloud": { "api_key": "<your_key>" } } } EOF Replace <your_key>
    with your Ollama Cloud API key in bothlocations. The three open-weight LLMs evaluated
    in the paper are pulled byOllama at runtime: ollama-cloud/glm-5:cloud ollama-cloud/kimi-k2.5
    ollama-cloud/qwen3.5:397b 4. LLM Selection The three LLMs evaluated in the study
