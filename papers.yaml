- title: 'Agentic programs: an emerging form of scientific software in computational
    materials science'
  date: 2026-09
  url: https://arxiv.org/abs/2609.00795
  category: runtime
  subcategory: systems
  authors: []
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Computational materials science has traditionally delegated algorithmic
    tasks to computers while leaving scientific judgments to humans. We argue that
    recent LLM-based agent harnesses enable an emerging form of scientific software,
    agentic programs, that combine deterministic algorithms with bounded LLM-based
    judgment, task-specific verification, episodic maturation, and complete delegation
    in production. We illustrate this concept with DeMARS, an agentic program for
    constructing atomistic models from experimentally measured disordered crystal
    structures.
