  - auto-systems
- title: 'ThinkLocoManip: A Whole-Body Control Agentic Harness for Legged Loco-Manipulation'
  date: 2026-10
  url: https://arxiv.org/abs/2610.34370
  category: runtime
  subcategory: systems
  authors: []
  venue: ''
  code_url: ''
  project_url: ''
  abstract: In this paper, we propose ThinkLocoManip, an agentic harness for legged
    loco-manipulation designed to tackle complex, long-horizon tasks in large-scale
    environments. Existing approaches typically follow either direct action generation
    or a plan-then-act paradigm, both of which can struggle with the generalization
    and error-recovery capabilities required for extended task execution. In contrast,
    ThinkLocoManip adopts an interleaved reasoning-and-acting paradigm, allowing the
    agent to continuously reason about its current state, execute actions, observe
    their outcomes, and adapt its strategy accordingly. Building on this paradigm,
    our agentic harness orchestrates a suite of specialized tools for perception,
    navigation, manipulation, and locomotion, enabling flexible composition of heterogeneous
    capabilities. Unlike existing robotic agentic harnesses, ThinkLocoManip explicitly
    incorporates locomotion as a tool domain for agent reasoning and execution. We
    further design a set of skills that explicitly account for both tool usage within
    each functional domain and coordination across domains, supporting effective execution
    of complex behaviors over long horizons. To tackle task failure during long-horizon
    interactions, we develop keyframe thinking mechanism to preserve critical execution
    context and support efficient error recovery. Extensive real-world experiments
    demonstrate that ThinkLocoManip substantially outperforms representative methods
    based on both direct action generation and plan-then-act paradigms across challenging
    long-horizon legged loco-manipulation tasks. Notably, ThinkLocoManip achieves
    a success rate of 77%, more than twice that of the strongest plan-then-act baseline
    (37.1%). Our experiments further validate the effectiveness of interleaved reasoning
    and acting, tool orchestration, and coordinated skill execution.
  tags:
  - auto-runtime
  - auto-systems
- title: 'Embodied Turing Machines: Stateful Code for Robot Recursive Self-Improvement'
  date: 2026-10
  url: https://arxiv.org/abs/2610.12369
  category: runtime
  subcategory: systems
  authors: []
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Most robot policies keep a model in the control loop: a VLA maps observations
    to actions, and an Agent Harness, such as Agent-as-Policy or Harness VLA queries
    a VLM for decision making at run time. We propose a different view: the embodied
    world is an Embodied Turing Machine, whose tape is the robot and environment state
    and rules are the policy. If this state can be represented accurately, the decision
    making can be written entirely in code. We therefore propose Code-Only-as-Policy
    (COAP): code measures and tracks the robot, environment, and task state from camera
    images and proprioception, and makes every decision from it. The same code applies
    across episodes, and different tasks share one library without a VLM or VLA in
    the loop. Compared with VLAs and Agent Harnesses, we analyze three advantages
    of COAP: (i) Explicit State: the state can be stored in code; (ii) Execution:
    code makes decision making controllable, recovers from failures flexibly, and
    runs fast and cheaply online; (iii) Extensibility: new tasks reuse, inherit, or
    extend the shared library, so capabilities can accumulate over tasks. These advantages
    make COAP a suitable medium for recursive self-improvement (RSI): coding agents
    develop the library in a closed loop, and each change is explicit and controllable.
    On RoboDojo''s 42 bimanual tasks, the resulting library reaches a success rate
    of 70.24% without a model at test time. The upper bound of COAP lies in how accurately
    the state is represented for decision making and how robust the code logic is.
    We thus propose COAP as a new paradigm for embodied tasks; since it applies across
    episodes, it can also serve as an efficient data engine for VLAs and Agent Harnesses.'
  tags:
  - auto-runtime
  - auto-systems
- title: 'RobotUse: Allocating Computation, Context, and Decisions'
  date: 2026-10
  url: https://arxiv.org/abs/2610.04929
  category: runtime
  subcategory: systems
  authors: []
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Robot agents must connect their intended actions to observed outcomes
    while retaining the context needed to revise their choices over repeated attempts.
    Existing interfaces often leave these choices inside predefined tools or require
    agents to manage detailed execution code and its growing history. We introduce
    RobotUse, a robot agent harness that organizes computation, context, and decisions
    around specifying and revising physical actions. Agents visually select targets
    and poses, while the backend handles geometry, motion planning, and control. Subagents
    retain detailed interactions within each subgoal and return the information needed
    for subsequent decisions. Continual harnessing lets agents learn from execution
    by updating a persistent playbook. On RoboLab, RobotUse achieves 45% task success,
    outperforming CaP-X by 6.7 percentage points while maintaining compact decision
    contexts and reducing reliance on predefined action abstractions. Furthermore,
    we show that RobotUse learns from real-world execution despite imperfect feedback
    and transfers what it learns to subsequent tasks. Project page is available at
    https://robotuse-team.github.io/.
