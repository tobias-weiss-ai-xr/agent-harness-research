- title: 'Priming Base Models for Agentic Post-Training: An Open Midtraining Recipe'
  date: 2026-10
  url: https://arxiv.org/abs/2610.22019
  category: runtime
  subcategory: systems
  authors: []
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Frontier models, general-purpose and domain-specific alike, now include
    a midtraining stage between pretraining and post-training, but little has been
    published about how this stage is built. We present an open midtraining recipe
    that primes base models for agentic post-training, and we show its effectiveness
    on two Nemotron models of different sizes. Pretraining typically runs at short
    context and sees almost no agent interactions, while SFT data is mostly synthetic,
    and very long SFT stages can hurt the model's later RL trainability. Our midtraining
    stage sits between the two. It trains at 256K context for hundreds of billions
    of tokens on a diverse mixture of natural software-engineering data like packed
    repositories, pull requests, commit histories, and build logs together with a
    small share of agentic traces. On Nemotron 3.5 Lightning, 500B midtraining tokens
    improve SWE-bench Verified from 60.7 to 64.5, SWE-bench Multilingual from 55.8
    to 62.8, and SWE-bench Pro from 32.0 to 35.5 after identical full SFT. On the
    larger Nemotron 3.5 Super, 280B midtraining tokens improve DeepSWE, a harder benchmark
    of long-horizon tasks, from 11.7 to 15.7 and SWE-bench Verified from 72.9 to 74.3
    after identical full SFT. Midtraining also improves robustness across agent harnesses
    on both models. We report the ablations behind the recipe and an evaluation protocol
    built on short fixed SFT runs, since base-model proxy metrics did not correlate
    reliably with post-training results.
