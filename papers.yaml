- title: 'HarnessVLN: Unifying Training-Free Embodied Navigation through an Agent
    Harness'
  date: 2026-09
  url: https://arxiv.org/abs/2609.15195
  category: runtime
  subcategory: systems
  authors: []
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Embodied navigation requires agents to ground instructions or object goals
    in spatial observations and translate plans into successful execution. As multimodal
    large language models (MLLMs) become increasingly capable, they offer stronger
    support for navigation without task-specific training; however, improved semantic
    reasoning alone does not ensure that proposed actions remain consistent with spatial
    evidence, task progress, and execution outcomes. We introduce HarnessVLN, a zero-shot,
    training-free framework that unifies instruction-following and object-goal navigation
    through a shared Agent Harness. The Harness coordinates perception, memory, and
    execution tools through a unified interface, validating planner proposals for
    evidential support, geometric feasibility, and subgoal consistency before dispatch.
    It jointly manages hierarchical event memory and a persistent Spatiotemporal Graph
    to track task progress, preserve spatial evidence, and contextualize failures.
    Structured execution feedback updates this shared state, guiding subsequent planning,
    recovery, and termination. Across R2R, RxR, HM3D-v2, and HM3D-OVON, HarnessVLN
    achieves success rates of 59.6%, 51.4%, 76.0%, and 59.3%, respectively, outperforming
    prior training-free methods. Humanoid robot deployment further demonstrates its
    applicability to both navigation tasks in real-world environments. The project
    page is available at [https://agibot-harnessvln.netlify.app/].
  tags:
  - auto-runtime
  - auto-systems
- title: 'Affordance Agent Harness: Verification-Gated Skill Orchestration'
  date: 2026-05
  url: https://arxiv.org/abs/2605.00663
  category: runtime
  subcategory: systems
  authors: []
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Affordance grounding requires identifying where and how an agent should
    interact in open-world scenes, where actionable regions are often small, occluded,
    reflective, and visually ambiguous. Recent systems therefore combine multiple
    skills (e.g., detection, segmentation, interaction-imagination), yet most orchestrate
    them with fixed pipelines that are poorly matched to per-instance difficulty,
    offer limited targeted recovery from intermediate errors, and fail to reuse experience
    from recurring objects. These failures expose a systems problem: test-time grounding
    must acquire the right evidence, decide whether that evidence is reliable enough
    to commit, and do so under bounded inference cost without access to labels. We
    propose Affordance Agent Harness, a closed-loop runtime that unifies heterogeneous
    skills with an evidence store and cost control, retrieves episodic memories to
    provide priors for recurring categories, and employs a Router to adaptively select
    and parameterize skills. An affordance-specific Verifier then gates commitments
    using self-consistency, cross-scale stability, and evidence sufficiency, triggering
    targeted retries before a final judge fuses accumulated evidence and trajectories
    into the prediction. Experiments on multiple affordance benchmarks and difficulty-controlled
    subsets show a stronger accuracy-cost Pareto frontier than fixed-pipeline baselines,
    improving grounding quality while reducing average skill calls and latency. Project
    page: https://tenplusgood.github.io/a-harness-page/.'
