- title: 'Nemotron 3.5 Super and Lightning: Open, Efficient Mixture-of-Experts Hybrid
    Mamba-Transformer Models for Agentic AI'
  date: 2026-10
  url: https://arxiv.org/abs/2610.38095
  category: runtime
  subcategory: systems
  authors: []
  venue: ''
  code_url: ''
  project_url: ''
  abstract: We introduce Nemotron 3.5 Super and Nemotron 3.5 Lightning, open and efficient
    Mixture-of-Experts Hybrid Mamba-Transformer models designed for reasoning, long-context
    understanding, and agentic workloads. Super is a 120B-parameter, 12B-active multimodal
    model, while Lightning is a smaller 30B-parameter, 3B-active text model; both
    designed for efficient deployment. Both models combine large-scale distillation,
    long-context training, and native speculative decoding, while Super further incorporates
    Indic continued pretraining and agentic software-engineering mid-training. We
    develop a comprehensive post-training pipeline spanning supervised fine-tuning
    and reinforcement learning (RLVR and RLHF), complemented in Super by specialized
    teacher training and multi- teacher on-policy distillation (MOPD). This transforms
    Super from a text-only base model into a multimodal agent capable of reasoning
    over text, images, video, and interactive tool environments. We further explore
    test-time scaling through parallel agent execution and self-verification. Across
    training and deployment, we jointly optimize capability and efficiency. Indic
    continued pretraining improves Indian-language benchmarks by up to 9.82 percentage
    points, while agentic mid-training strengthens software-engineering capabilities
    and robustness across agent harnesses. The post-trained Super model achieves 51.78%
    on SWE-bench Pro, surpassing Nemotron 3 Ultra despite using approximately 4.6x
    fewer active parameters. Post-training MTP boosting improves speculative- decoding
    acceptance length by up to 21.8% under probabilistic draft sampling, while NVFP4
    quantization achieves 99.62% median accuracy recovery relative to BF16. Inference
    optimizations enable up to 4,856 output tokens/s/GPU on GB200 while sustaining
    at least 50 tokens/s/user.
