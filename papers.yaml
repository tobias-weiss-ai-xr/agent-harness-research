- title: 'HLSClaw: Bringing Vibe Coding to High-Level Synthesis through Skill-Based
    Agentic Harness'
  date: 2026-11
  url: https://arxiv.org/abs/2611.02784
  category: runtime
  subcategory: systems
  authors: []
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'LLM agents are rapidly shifting software development toward intent-driven
    vibe coding, yet their effectiveness drops sharply in high-level synthesis (HLS),
    where code optimization must jointly consider design structure, directive search,
    and downstream hardware constraints. Existing HLS optimization approaches, including
    both heuristic-based methods and recent LLM-assisted pipelines, typically operate
    at fixed abstraction levels or in weakly coupled stages, limiting their ability
    to leverage the strong interplay between source code restructuring and directive
    search outcomes. Our key insight is that HLS optimization can be reframed from
    a fixed, hardwired transformation pipeline into a skill-based agentic control
    problem: an LLM agent equipped with modular, executable optimization skills and
    a feedback-driven orchestrator can autonomously navigate the coupled space of
    code restructuring and directive search. This motivates the design of HLSClaw,
    the first HLS-specific, skill-based agentic harness for holistic HLS optimization.
    On real-world HLS benchmarks, HLSClaw achieves a 39.12x geometric-mean latency
    speedup, outperforming the compiler baseline ScaleHLS by 1.98x, and surpassing
    the commercial coding agents Claude Code and Codex by 1.86x and 1.70x, respectively,
    while maintaining strong timing robustness.'
