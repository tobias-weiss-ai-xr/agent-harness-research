  venue: Zenodo (CERN European Organization for Nuclear Research)
- title: 'Externalization in LLM Agents: A Unified Review of Memory, Skills, Protocols
    and Harness Engineering'
  date: 2026-04
  url: https://arxiv.org/abs/2604.08224
  category: runtime
  subcategory: ''
  authors:
  - Chenyu Zhou
  - Huacan Chai
  - Wenteng Chen
  abstract: Large language model (LLM) agents are increasingly built less by changing
    model weights than by reorganizing the runtime around them. Capabilities that
    earlier systems expected the model to recover internally are now externalized
    into memory stores, reusable skills, interaction protocols, and the surrounding
    harness that makes these modules reliable in practice. This paper reviews that
    shift through the lens of externalization. Drawing on the idea of cognitive artifacts,
    we argue that agent infrastructure matters not merely because it adds auxiliary
    components, but because it transforms hard cognitive burdens into forms that the
    model can solve more reliably. Under this view, memory externalizes state across
    time, skills externalize procedural expertise, protocols externalize interaction
    structure, and harness engineering serves as the unification layer that coordinates
    them into governed execution. We trace a historical progression from weights to
    context to harness, analyze memory, skills, and protocols as three distinct but
    coupled forms of externalization, and examine how they interact inside a larger
    agent system. We further discuss the trade-off between parametric and externalized
    capability, identify emerging directions such as self-evolving harnesses and shared
    agent infrastructure, and discuss open challenges in evaluation, governance, and
    the long-term co-evolution of models and external infrastructure. The result is
    a systems-level framework for explaining why practical agent progress increasingly
    depends not only on stronger models, but on better external cognitive infrastructure.
  venue: arXiv (Cornell University)
- title: 'From Failed Trajectories to Reliable LLM Agents: Diagnosing and Repairing
    Harness Flaws'
  date: 2026-06
  url: https://arxiv.org/abs/2606.06324
  category: runtime
  subcategory: ''
  authors:
  - Mengzhuo Chen
  - Junjie Wang
  - Zhe Liu
  abstract: 'LLM agents increasingly rely on agent harness: the runtime infrastructure
    around the base model that defines execution environments, tool interfaces, context,
    lifecycle orchestration, observability, verification, and governance. Existing
    self-improving agents and automatic harness evolution methods mainly improve agents
    through runtime supervision, prompt optimization, workflow search, or harness
    modification based on final outcomes. However, they often fail to diagnose where
    the responsible evidence lies in failed trajectories and which harness implementation
    mechanism causes the unreliable behavior, resulting in broad, indirect, or poorly
    scoped changes. This paper proposes HarnessFix, a trace-grounded and diagnosis-driven
    framework for repairing agent harnesses. HarnessFix compiles raw execution traces
    and harness artifacts into a Harness-aware Trace Intermediate Representation (HTIR),
    which normalizes fragmented trajectory evidence, captures step-level data-flow
    and control-flow relations, and aligns runtime steps with the harness artifacts
    that shape their behavior. It then attributes failures to responsible steps and
    harness artifacts, and consolidates recurring diagnoses into repair-oriented flaw
    records. Finally, HarnessFix maps these records to scoped repair operators, generates
    patches under flaw-specific repair specifications, and accepts them through regression-aware
    validation. We evaluate HarnessFix on four popular benchmarks, and results show
    that it improves the performance over the initial harnesses by 6.3% to 18.4%,
    significantly outperforming human-designed and self-evolution baselines. HarnessFix
    highlights the value of treating failed trajectories not only as feedback signals,
    but also as structured evidence for diagnosing and repairing the harness mechanisms
    behind agent failures.'
  venue: arXiv (Cornell University)
- title: 'HarnessDev: Can LLMs Create and Evolve Their Own Agent Harness?'
  date: 2026-09
  url: https://arxiv.org/abs/2609.01437
  category: runtime
  subcategory: ''
  authors:
  - Yuhao Wu
  - Jingyuan Zhang
  - Jiajun Shi
  abstract: As agents move from research prototypes to deployed tools, their capability
    increasingly depends on model-external execution infrastructure, commonly termed
    the agent harness. Changing this harness while holding model weights fixed can
    substantially alter task performance. Current agent evaluations typically report
    downstream performance under a chosen harness, leaving a model's ability to develop
    the harness itself comparatively underexplored. We introduce HarnessDev, a benchmark
    that shifts the unit of evaluation from task outputs to runnable infrastructure.
    HarnessDev covers two stages. In Creation, the agent starts from a minimal seed
    and a small number of cases, then builds a complete execution system. In Evolution,
    it starts from its own created harness and iteratively revises it using downstream
    execution feedback, with the goal of improving benchmark performance. We then
    evaluate each constructed harness on capability (task success on held-out benchmarks)
    and efficiency (execution-token cost). The reported Creation results cover six
    creator LLMs, four domains, and five downstream benchmarks totaling 2,207 unique
    downstream instances, with hidden evaluation tasks withheld from development.
    We find that generated harnesses remain substantially behind mature human-engineered
    references on code and on search and research, while matching or exceeding the
    selected references on writing and machine-learning experimentation, with large
    variation in execution cost. Evolution produces some performance gains, but they
    are unstable and transfer only partially to held-out tasks. Experiments with a
    fixed runtime model further show that the gains depend strongly on the model executing
    the harness, indicating limited transfer across models.
  venue: arXiv (Cornell University)
- title: 'Harness-MU: A Safe, Governed, and Effective Harness for Multi-User LLM Agents'
  date: 2026-06
  url: https://arxiv.org/abs/2606.21856
  category: runtime
  subcategory: ''
  authors:
  - Wangxuan Fan
  - Xiaoyu Nie
  - Zhongxiang Dai
  abstract: The increasing deployment of large language model (LLM) agents in collaborative
    workflows demands robust multi-user, multi-principal interaction mechanisms capable
    of enforcing access permissions, resolving authoritative conflicts, and preventing
    unauthorized data disclosure. However, a fundamental mismatch exists between the
    single-user training paradigm of contemporary LLMs and the hard constraints required
    for multi-principal governance, rendering probabilistic, prompt-based safeguards
    vulnerable under multi-turn adversarial interactions.Our key insight is that governance
    constraints -- who is authorized, what is restricted, and whose instructions take
    precedence -- are deterministic runtime variables that should be enforced by execution
    hooks rather than entrusted to the LLM. We present \textbf{Harness-MU}, the first
    model-agnostic, zero-tuning infrastructure framework for multi-user LLM agents.
    By decoupling language generation from safety orchestration, Harness-MU guarantees
    unbreakable permission boundaries while maximizing compliant demand satisfaction.
    Across four frontier open-weight and proprietary models on the \textit{Muses-Bench}
    benchmark, Harness-MU achieves the goal of privacy preservation across all access-control
    attacks, outperforming the standard baseline by 0.28--0.39 in utility score and
    improving instruction-following accuracy by up to 48.9 percentage points. Harness-MU
    advances the philosophy of \textit{Harness Engineering}, establishing that systematic
    infrastructure is essential for solving LLM multi-principal governance challenges.
    The code and data are available at https://github.com/YuanJrShiuan/Harness-MulUser.
  venue: arXiv (Cornell University)
- title: 'HARDE: Optimizing Agent Harnesses for Runtime Risk Detection and Execution
    Control'
  date: 2026-09
  url: https://arxiv.org/abs/2609.38291
  category: runtime
  subcategory: ''
  authors:
  - Zhuo Liu
  - Moxin Li
  - Zhixin Ma
  abstract: 'Large language model (LLM) agents are vulnerable to safety risks such
    as injected malicious instructions or misleading information, motivating runtime
    defenses that prevent unsafe action in execution across diverse risks while preserving
    benign-task utility. Existing system-level defenses either focus on risk detection
    rather than timely prevention or rely on predefined rules with limited flexibility
    across diverse risks. We propose a risk-aware harness that integrates LLM-based
    monitoring for flexible risk detection and structures monitor-guided execution
    around three core modules: trigger, monitor, and feedback, enabling targeted safety
    interventions while limiting disruption to benign task execution. To adapt the
    harness to different risks and deployment settings, we introduce HARDE, a two-stage
    harness optimization framework that first performs isolated probing of each module
    to derive an optimization guide, then uses this guide to iteratively optimize
    the harness based on safety and utility feedback. Experiments across three attack
    benchmarks show that HARDE improves runtime safety while preserving utility, outperforming
    manually designed harnesses and naive optimization baselines. Our analysis shows
    that effective runtime defense benefits from complementary safety mechanisms,
    attack-aware harness optimization, and harness designs matched to monitor capabilities.
    Our code is available at https://github.com/Liuz233/HARDE.'
  venue: arXiv (Cornell University)
- title: 'hammerbaki/enterprise-llm-agent-harness: public-baseline-v0.2'
  date: 2026-06
  url: https://doi.org/10.5281/zenodo.20677471
  category: runtime
  subcategory: ''
  authors:
  - joongho ahn
  - Joongho Ahn
  abstract: 'Frozen snapshot for the manuscript. Adds the prompt-only ablation (shallow
    540-run + adversarial 180-run artifacts), adversarial-stress scenario sets, runtime
    claim-eligibility mechanism, English-locale briefing cards, Cloudflare auto-deploy
    workflow, and the two-repo operating model. Full Changelog: https://github.com/hammerbaki/enterprise-llm-agent-harness/compare/public-baseline-v0.3...public-baseline-v0.3'
