- title: 'VeriFine: Scaling Verification for Self-Improvement in Embodied Reasoning'
  date: 2026-10
  url: https://arxiv.org/abs/2610.08761
  category: runtime
  subcategory: systems
  authors: []
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Self-improving policies continually expose new failure patterns, changing
    what their judges must be able to verify. However, current fixed judges constrain
    both optimization feedback and the discovery of useful training examples, limiting
    further self-improvement. This challenge is even more acute in embodied reasoning,
    where reliable evaluation must account for spatial grounding, causal reasoning,
    and safety-aware decision-making. We introduce VeriFine, an agent harness framework
    that scales verification through the co-evolution of the policy, training curriculum,
    and judge. The Policy Improvement Loop uses a rubric judge to diagnose recurring
    failures, construct an adaptive curriculum, and optimize the policy. When progress
    plateaus and verification becomes a bottleneck, the Judge Improvement Loop selectively
    queries human guidance on informative failure cases and refines the judge through
    coactive calibration, in which humans and agents resolve disagreements and converge
    toward the objective rubric of physical reasoning. The revised judge then guides
    the next stage of data selection and policy optimization. Experiments on driving
    and robot navigation tasks demonstrate continuous self-improvement in both policy
    and judge capability across reinforcement and supervised fine-tuning. These results
    show how scaling verification supports continuous self-improvement as policy failure
    patterns evolve.
  tags:
  - auto-runtime
  - auto-systems
- title: 'Refuses When Asked, Complies When Acting: A Runtime Safety Check for Robot
    Control Loops'
  date: 2026-10
  url: https://arxiv.org/abs/2610.27350
  category: runtime
  subcategory: systems
  authors: []
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Frontier models can control robots through agent harnesses that loop
    on one question: what motion comes next toward the user''s goal? We show that
    this default loop carries out harmful instructions. With GPT-6 Astra controlling
    a low-cost SO-101 arm through the Inspect Robots harness on three household tasks
    whose hazard is common knowledge, such as "put the knife in the toy basket", the
    policy refused 0% of 15 trials, attempted the harm every time, and completed it
    in 27%. Its one exit, give_up, is meant for goals that cannot be achieved, and
    it never cited the hazard. We add an optional runtime safety check to the loop:
    before the first motion, the model is asked whether it would carry out the instruction,
    given the same camera frames. The check would have stopped all 15 hazardous instructions,
    including the 4 that completed the harm, and flagged none of the 15 harmless controls.
    Code and data: https://github.com/Arnav-Gr0ver/Refuses-When-Asked-Complies-When-Acting.'
  tags:
