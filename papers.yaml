  - auto-systems
- title: Do Agent Optimizers Compound? A Continual-Learning Evaluation on Terminal-Bench
    2.0
  date: 2026-07
  url: https://arxiv.org/abs/2607.14004
  category: runtime
  subcategory: systems
  authors: []
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Most reported gains from agent-optimization methods are one-shot: an
    agent is optimized against a fixed benchmark and the resulting improvement is
    reported as if it were a stable property of the method. This does not test the
    setting that matters for deployed agents, where optimization is applied recursively
    as new failures and new tasks appear over time. The central question this raises
    is whether optimizer-driven gains compound: after an agent has been optimized
    once, can it be optimized again on newly arrived tasks without eroding the gains
    the first round produced? We study this question with a two-phase continual-learning
    evaluation built from hard tasks in Terminal-Bench 2.0, comparing three approaches
    to agent-harness optimization (GEPA, Meta Harness, and RELAI''s Verifiable Continual
    Learning, RELAI-VCL) under identical optimization budgets. All three methods improve
    over the baseline agent in the conventional, static, single-phase setting. However,
    once new tasks are introduced, the methods diverge sharply: GEPA''s optimized
    agent transfers below the unoptimized baseline, Meta Harness transfers well but
    fails to improve further once given a second optimization budget, and RELAI-VCL
    is the only method that both transfers positively to unseen tasks and continues
    improving after those tasks are folded into the optimization objective, reaching
    the highest pass rate at every evaluated stage and the highest lifelong average
    pass rate overall (76.4% vs. 66.0% for GEPA, 64.6% for Meta Harness, and 58.7%
    for the baseline). Our key observation was that optimization gains compounded
    only when regression control was built into the optimization loop, providing an
    inductive bias against shortcut solutions that fail to generalize.'
  tags:
  - auto-runtime
  - auto-systems
- title: Exploring the Agentic Frontier of Verilog Code Generation
  date: 2026-03
  url: https://arxiv.org/abs/2603.19347
  category: runtime
  subcategory: systems
  authors: []
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Large language models (LLMs) have made rapid advancements in code generation
    for popular languages such as Python and C++. Many of these recent gains can be
    attributed to the use of ``agents'' that wrap domain-relevant tools alongside
    LLMs. Hardware design languages such as Verilog have also seen improved code generation
    in recent years, but the impact of agentic frameworks on Verilog code generation
    tasks remains unclear. In this work, we present the first systematic evaluation
    of agentic LLMs for Verilog generation, using the recently introduced CVDP benchmark.
    We also introduce several open-source hardware design agent harnesses, providing
    a model-agnostic baseline for future work. Through controlled experiments across
    frontier models, we study how structured prompting and tool design affect performance,
    analyze agent failure modes and tool usage patterns, compare open-source and closed-source
    models, and provide qualitative examples of successful and failed agent runs.
    Our results show that naive agentic wrapping around frontier models can degrade
    performance (relative to standard forward passes with optimized prompts), but
    that structured harnesses meaningfully match and in some cases exceed non-agentic
    baselines. We find that the performance gap between open and closed source models
    is driven by both higher crash rates and weaker tool output interpretation. Our
    exploration illuminates the path towards designing special-purpose agents for
    verilog generation in the future.
  tags:
  - auto-runtime
  - auto-systems
- title: 'Dynamic Harness Search: Building Multi-Agent Systems Per-Query via Prediction'
  date: 2026-10
  url: https://arxiv.org/abs/2610.04137
  category: runtime
  subcategory: systems
  authors: []
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Agent harnesses specify the roles, instructions, tools, and communication
    structure used to solve a task, and the right harness depends on the query. Because
    the value of each design choice is observable only through execution, tailoring
    a harness to each query has required either executing alternatives at inference
    time or costly manual design. We introduce SHIFT, which moves execution out of
    the per-query search loop. A local LLM architect learns a policy over harness-building
    actions from search, and a value function that predicts, from measured executions,
    a utility balancing accuracy against execution cost. For each query, Monte Carlo
    tree search uses these predictions to construct a harness. Across 9,193 tasks
    in six benchmarks, from math to document and general-assistant tasks, with a Gemini
    3.5 Flash executor, SHIFT attains the highest mean accuracy, about 80%, outperforming
    17 baselines that span prompting, prompt optimization, and workflow search, and
    exceeding the strongest baseline by 7.2 percentage points. A cheaper mode of SHIFT
    also attains a higher mean accuracy than every baseline while using 32% fewer
    execution tokens than the strongest baseline. We further show that choosing structure,
    instructions, and tools jointly beats choosing only instructions or only tools
    by up to 9.1 percentage points, and that learned value selection identifies more
    accurate harnesses with lower execution cost from candidate pools.
  tags:
  - auto-runtime
  - auto-systems
- title: 'From Model Scaling to System Scaling: Scaling the Harness in Agentic AI'
  date: 2026-05
  url: https://arxiv.org/abs/2605.26112
  category: runtime
  subcategory: systems
  authors: []
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'This paper studies the next major bottleneck in agentic AI as system
    scaling, not only model scaling: the design of auditable, persistent, modular,
    and verifiable architectures around foundation models. We refer to this shift
    as scaling the harness: treating the structured execution layer around a foundation
    model as a first-class object of design, evaluation, and optimization. Although
    recent large language models enable agents to use tools, retrieve information,
    maintain memory, and execute long-horizon workflows, evaluation remains largely
    model-centric, often reducing agents to final-task success while treating memory,
    retrieval, tool use, orchestration, verification, and governance as secondary
    implementation details. This framing is increasingly inadequate because agent
    performance emerges from the interaction among the foundation model, memory substrate,
    context constructor, skill-routing layer, orchestration loop, and verification-and-governance
    layer. Together, these components form the agent harness, which translates model
    capability into long-horizon agent behavior. We study scaling the harness through
    three core bottlenecks: context governance, trustworthy memory, and dynamic skill
    routing, together with the orchestration and governance mechanisms that coordinate
    and constrain them. We further outline a research agenda for harness-level benchmarks
    that go beyond one-shot task success to measure trajectory quality, memory hygiene,
    context efficiency, communication fidelity, verification cost, and safe evolution
    over time. To make the discussion concrete, we develop CheetahClaws: https://github.com/SafeRL-Lab/cheetahclaws,
    a Python-native reference harness, and compare it with Claude Code and OpenClaw.
    Our main claim is that future progress in agentic AI will depend as much on system
    design as on stronger foundation models.'
  tags:
  - auto-runtime
  - auto-systems
- title: 'A Closer Look at Agentic BBO: Benchmarking LLM Agents for Black-Box Optimization'
  date: 2026-10
  url: https://arxiv.org/abs/2610.12183
  category: runtime
  subcategory: systems
  authors: []
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Black-box optimization (BBO) arises in many scientific and engineering
    problems where objective evaluations are expensive and limited. Recent large language
    model (LLM) agents offer a new way to approach BBO by combining task semantics,
    computation, optimization tools, and feedback-driven decision making, showing
    great potential due to the integration with mathematically rigorous tools. However,
    existing agentic BBO studies use different task domains and system configurations,
    making their results difficult to compare and the effects of individual design
    choices hard to isolate. We therefore introduce AgenticBBO-Bench, a cross-domain
    benchmark for agentic BBO spanning synthetic functions, hyperparameter optimization,
    database tuning, chip design, and molecular design under a unified finite-budget
    evaluation protocol. In our experiments, agentic BBO achieves higher family-averaged
    scores than direct LLM-based methods in all five domains and outperforms the best
    numerical optimizers in four. We further study three factors shaping agent performance:
    optimization tools, task information and prior knowledge, and the role of the
    LLM during search. Our results show that additional numerical tools do not consistently
    improve performance, task semantics are broadly useful while more specific priors
    are less reliable, and numerical optimizers can effectively absorb gains from
    search trajectories established by the agent. Finally, we introduce a five-task
    frontier challenge within AgenticBBO-Bench and evaluate seven LLMs under the Codex
    agent harness, where GPT-6 Astra and DeepSeek-V4.1-Flash lie on the Pareto frontier
    of performance and cost among the evaluated models. Our code is available at https://github.com/lamda-bbo/agentic-bbo.'
  tags:
  - auto-runtime
  - auto-systems
- title: Cognitive-structured Multimodal Agent for Multimodal Understanding, Generation,
    and Editing
  date: 2026-07
  url: https://arxiv.org/abs/2607.08497
  category: runtime
  subcategory: systems
  authors: []
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Recent unified multimodal models show a single architecture can jointly
    perform vision/language understanding and image generation/editing. However, they
    repeatedly feed all historical visual and textual inputs into a shared context
    window, limiting long-horizon multimodal dialogue due to visual token explosion
    and unreliable cross-turn referencing. We propose a Cognitive-structured Multimodal
    Agent that externalizes visual information into an Episodic Visual Memory and
    selectively reactivates relevant episodes during reasoning. The agent consists
    of a Perceptual Abstraction Engine for structured visual abstraction, a Cognitive
    Retrieval Engine for cross-turn memory retrieval, and a Multimodal Executive Controller
    for autonomous task inference and action planning. To address the lack of turn-level
    retrieval supervision in existing datasets, we develop a Unified Scenario Engine
    that programmatically generates structured multi-turn conversations with fine-grained
    retrieval annotations, enabling reinforcement learning to optimize abstraction
    and retrieval policies. We also construct a long-horizon visual-dialogue benchmark
    stratified by difficulty to evaluate episodic visual recall. Our 8B agent achieves
    91.4% retrieval accuracy over 20-turn sessions, surpassing 32B baselines by +8.2%
    while nearly halving per-turn inference time (23.1s -&gt; 12.7s). We further present
    the Cognitive-structured Multimodal Agent Harness (CMA-Harness), a tool-augmented
    deployment of the same cognitive structure integrating persistent multimodal memory,
    web access, image generation/editing/composition tools, and OpenAI-compatible
    serving. Structured memory and modular decision-making offer a more scalable,
    efficient paradigm for long-horizon multimodal agents than monolithic parameter
    scaling. Code: https://github.com/caseclose/cma-harness ; Project page: https://caseclose.github.io/cma-harness/'
  tags:
  - auto-runtime
  - auto-systems
- title: 'VERSE: Verified Self-Evolving Optimizer for Agent Harnesses'
  date: 2026-10
  url: https://arxiv.org/abs/2610.02616
  category: runtime
  subcategory: systems
  authors: []
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Harness evolution improves an LLM agent's prompts, tools, and workflow,
    while the optimizer's own tools and procedures often remain fixed. We study whether
    an optimizer can improve another agent more effectively by also improving how
    it diagnoses failures, develops edits, and tests their effects. Two observations
    guide our design. In a controlled study, optimizer self-evolution fails to improve
    performance without execution-based verification, but achieves the best result
    of that study when verification is available. Across five executors, self-evolving
    optimizers build their own tools for failure analysis, verification, training
    audits, and workflow control. Motivated by these findings, we introduce VERSE,
    a Verified Self-Evolving optimizer for agent harnesses. VERSE lets the optimizer
    test draft edits, replay failures, and perturb suspected steps before submission,
    while tracking fixes and regressions across rounds. Using this feedback, the optimizer
    revises both the executor harness and its own prompts, skills, tools, hooks, and
    notes, while the weights of the optimizer and executor models stay fixed. Under
    a shared protocol with disjoint training, validation, and test tasks, VERSE improves
    all four evaluated harness optimizers on held-out SWE-rebench tasks and newer
    out-of-distribution tasks in five languages. Its best validation-selected harness
    reaches 42.3% and 37.7% accuracy, respectively, against 39.2% and 29.3% for the
    strongest baselines. Code is available at https://github.com/wzekai/VERSE.
  tags:
  - auto-runtime
  - auto-systems
- title: 'SCLATE: a Substrate for Continual-Learning Agent Training and Evaluation'
  date: 2026-09
  url: https://arxiv.org/abs/2609.32391
  category: runtime
  subcategory: systems
  authors: []
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Continual-learning agents are systems of models, harnesses, and memory
    operating over long multi-session horizons. Evaluating and training them requires
    interleaving tasks with agent-side events such as session stop and start, crons,
    and memory consolidation. Yet existing benchmarks and training frameworks schedule
    only the benchmark's own events, leaving each benchmark and agent pair to build
    a custom scheduling loop. We present SCLATE, an execution substrate where benchmarks
    and unmodified agents each add their events to one open event scheduler through
    an adapter. A hybrid simulated clock runs these events on a shared timeline, flowing
    in real time while the agent works and skipping idle gaps, which compresses a
    month-long scenario into hours. SCLATE also serves as a rollout engine that runs
    any agent's harness and memory unmodified, recording the tokens and log probabilities
    of every model call through an in-container proxy. We port seven benchmarks to
    SCLATE and compare ten unmodified harness and memory configurations head to head
    on ten models. The comparison shows that an added memory system does not reliably
    beat the harness's native memory and that models differ widely in how they use
    the same harness and memory. We then post-train Qwen3.5-4B through unmodified
    harnesses and memory systems. The model learns to use both, reading 6.8x fewer
    file lines with a 16.7-point higher SWE-bench Verified pass rate, and writing
    richer memory records, while its held-out MetaClaw accuracy rises by up to 11.8
    points.
  tags:
  - auto-runtime
  - auto-systems
- title: An Explicit Feedback Contract for Iterative ML-Agent Harnesses
  date: 2026-10
  url: https://arxiv.org/abs/2610.28798
  category: runtime
  subcategory: systems
  authors: []
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Iterative ML agents develop models by editing code, running experiments,
    reading a validation score, and choosing what to try next. In current harnesses
    this loop is served by an exact validation score returned after every attempt,
    which leaves the validation split open to adaptive selection. In this work, we
    introduce an explicit feedback contract for ML-agent harnesses, which specifies
    what an agent may observe, when iteration should stop, and when the test split
    may be touched. The contract releases a validation score only when a submission
    clears a noise threshold computed from the paired standard error, so no margin
    has to be tuned. We ran experiments on click-through-rate prediction, learning
    to rank, and a control task with no signal to find. The control is the sharpest
    case, because the true gain there is zero by construction: an agent reading exact
    scores ended by reporting a gain of 0.0157, while under the contract it reported
    0.0033. On both real tasks the contract narrows the validation-test gap, and test
    performance is slightly higher rather than lower. The largest difference is in
    when the agents stop. Exact feedback used its entire budget of thirty submissions
    on two of the three tasks, including the one where nothing can be learned, while
    the contract halted after four to twelve. A run that exhausts its budget is usually
    read as diligence. It is better read as a symptom: when the feedback channel is
    unbounded, noise keeps supplying improvements to chase.'
  tags:
  - auto-runtime
  - auto-systems
- title: 'ResearchFlow-Eval: Tracing the Execution Gap in End-to-End Multi-Claim Autoresearch'
  date: 2026-10
  url: https://arxiv.org/abs/2610.18088
  category: runtime
  subcategory: systems
  authors: []
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Autoresearch systems increasingly undertake entire research projects.
    In practice, scientific research requires systems to pursue multiple interdependent
    claims through a continuous, multi-stage workflow and revise experiments as evidence
    accumulates. Existing evaluations of autoresearch systems, however, typically
    score isolated tasks or final artifacts, leaving these process-level capabilities
    largely unmeasured. We therefore introduce ResearchFlow-Eval, a fine-grained framework
    for assessing continuous scientific execution and iteration at both the stage
    and claim levels. Each evaluation is grounded in a published anchor paper, from
    which we derive stage-specific rubrics that decompose each research stage into
    dimensions and separately scored rubric items. Using these rubrics, we score each
    research stage and examine experimental execution in detail, focusing on multi-claim
    completion and revisions across attempts. We apply the evaluation framework to
    general-purpose agent harnesses, skill-augmented harnesses, and systems with research-specific
    orchestration. Across all evaluated systems, experimental execution consistently
    lags behind design and planning. Within execution, systems struggle to produce
    high-quality results and meet claim requirements, and repeated attempts rarely
    yield measurable improvements. Moreover, neither skill augmentation nor research-specific
    orchestration reliably yields higher scores. ResearchFlow-Eval thus extends autoresearch
    evaluation beyond isolated, single-objective runs to continuous workflows in which
    systems pursue multiple claims and refine their work across iterations.
