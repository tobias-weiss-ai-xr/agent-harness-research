- title: 'Harnessing LLMs as Agents: What Does It Cost?'
  date: 2026-10
  url: https://arxiv.org/abs/2610.02488
  category: runtime
  subcategory: systems
  authors: []
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Language-model agents increasingly rely on harnesses that manage bounded
    context, persistent memory, tools, verification, and repeated execution, yet existing
    notions of model capability do not quantify the computational resources these
    mechanisms consume. We introduce the Language Model Agent Machine (LAM), a resource-bounded
    abstraction that fixes the underlying semantic model while explicitly charging
    harness-level resources. We establish four classes of results. Communication:
    LAM execution is instancewise equivalent to red--blue pebbling under simultaneous
    call--transfer budgets, transferring classical I/O lower bounds to context--memory
    traffic. Access: memory interfaces induce asymptotic separations, including a
    Θ(n) gap between random and non-speculative sequential access on pointer chasing.
    Recomputation: bit-reversal DAGs require Θ(n^2/(C+S)+n) model calls with context
    capacity C and persistent-memory capacity S, quantifying when stored intermediate
    state avoids repeated semantic computation. Reliability: we derive tight stage-local
    sampling bounds, exact imperfect-verification costs, and a Young--Daly-type checkpoint
    law with a closed-form optimal verification interval. Controlled and held-out
    experiments on GPT-6 Astra test communication and reliability predictions, including
    checkpoint optima, policy selection under programmatic checking, and tradeoffs
    among call granularity, logical input traffic, and reliability on chained MATH
    tasks. Together, these results provide a resource theory for the computational
    cost of language-model agent harnesses.'
