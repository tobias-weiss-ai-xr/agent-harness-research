- title: 'JacksonBeem/MCP-Benchmark: artifact-v2'
  date: 2026-05
  url: https://doi.org/10.5281/zenodo.20075238
  category: runtime
  subcategory: ''
  authors:
  - JacksonBeem
  abstract: 'MCP Benchmark Replication Artifact v1 This release contains the replication
    package for the MCP benchmark paper. The artifact includes the benchmark harness,
    deterministic fixtures, AWS Lambda/EC2 deployment assets, pinned MCP server source
    references, reference outputs, and EC2 sibling runtime repositories. Artifact
    Zip Download: SHA256: DE2488FB4D22A9B879859B6E32F7737187B5D9D0F3D817EB0986B55AE8073F9E
    Contents mcp-benchmark/ - main harness, registry, fixtures, Lambda/SAM deployment,
    analysis, reference data mcp-benchmark-EC2/ - combined EC2 runtime mcp-benchmark-ec2-light/
    - light-tier EC2 runtime mcp-benchmark-ec2-medium/ - medium-tier EC2 runtime mcp-benchmark-ec2-heavy/
    - heavy-tier EC2 runtime Reproduction Start with: mcp-benchmark/REPLICATION.md
    Generated runtime payloads, node_modules, .env, logs, benchmark outputs, and local
    caches are intentionally excluded. Server source is reconstructed from pinned
    commits in mcp-benchmark/servers/registry.yaml. Notes AWS runs require reviewer-provided
    AWS credentials, key pair, region configuration, and optional per-server API keys.
    Paper Abstract The Model Context Protocol (MCP) has rapidly emerged as a de-facto
    standard for connecting Large Language Model (LLM) agents to external tools, resources,
    and data. As agent deployments move from prototypes to production, practitioners
    face a concrete but under-studied question: where should MCP tool servers run?
    Traditional VM-based hosting (e.g., AWS EC2) offers long-lived processes and predictable
    latency, while serverless platforms (e.g., AWS Lambda behind API Gateway) promise
    elastic scaling and pay-per-invocation billing at the cost of cold starts, payload
    limits, and bounded execution windows. Prior serverless-vs-VM studies target generic
    microservices and do not capture the behavior of MCP tool workloads, nor the effect
    of how MCP servers are grouped on each host. In this paper, we present a descriptive
    empirical comparison of VM-based and serverless deployment of MCP tool servers.
    We design experiments on AWS that exercise 30 EC2- and Lambda-hosted MCP servers
    exposing 251 tools across three heuristic server-weight classes (light, medium,
    heavy) and four deployment configurations: EC2 all-in-one, EC2 tiered, Lambda
    per-server, and Lambda tiered. Each benchmark scenario targets one server and
    is exercised across three input variants and three independent warm-only sweeps,
    yielding n=9 per server and n=90 scheduled invocations per configuration-tier
    cell. We measure end-to-end response time, request/response payload size, and
    on- service computation time for every configuration. As a descriptive benchmark,
    we find that EC2 all-in-one and EC2 tiered produce near-equal medians across all
    three tiers in our pooled dataset. Lambda tiered is the consistent median-latency
    outlier: 1.8×– 3.3× higher than Lambda per-server and 2.3×–3.2× higher than EC2
    tiered across tiers, while Lambda per-server is effectively tied with EC2 at the
    light tier and remains within roughly 35– 40% at medium and 20–25% at heavy relative
    to EC2 all-in-one medians. Under a full cost model that includes Lambda duration,
    Lambda request, and API Gateway request charges, Lambda is cost-favorable up to
    approximately 2.34 M (per-server) / 1.19 M (tiered) light, 1.87 M / 1.00 M medium,
    and 0.65 M / 0.60 M heavy monthly invocations per server before a continuously
    billed EC2 t3.micro ($7.59/mo) becomes cheaper. These findings provide bounded
    guidance for choosing between VM- and serverless- hosted MCP servers based on
    server weight, call volume, and grouping strategy.'
