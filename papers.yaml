- title: '"LLM Agent Performance" Is Not a Single Evaluation Target'
  date: 2026-02
  url: https://arxiv.org/abs/2602.03238
  category: runtime
  subcategory: systems
  authors: []
  venue: ''
  code_url: ''
  project_url: ''
  abstract: LLM agent benchmark scores are shaped not only by the model but also by
    the agent harness, environment, evaluator, and inference budget. Unified execution
    controls these non-model factors by evaluating candidate models under the same
    configuration, making observed differences more attributable to the models themselves.
    However, model comparison is only one use of agent benchmarks. Other evaluations
    compare complete agent systems or test whether a fixed model or system remains
    stable across predeclared changes in its operating conditions. These results can
    all be reported under the common label of "LLM agent performance." Our position
    is that "LLM agent performance" does not denote a single evaluation target. Model
    comparisons under a reference stack and comparisons of complete agent systems
    answer different questions, while robustness asks whether either conclusion persists
    across predeclared conditions. The claim supported by a score therefore depends
    on the declared candidate boundary and condition policy. We derive implications
    for leaderboards, result reporting, and benchmark versioning, showing how distinguishing
    these classes preserves fair comparison while accommodating system innovation
    and robustness analysis.
  tags:
