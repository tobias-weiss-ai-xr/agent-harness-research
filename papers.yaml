- title: 'Digital Health Interventions for Substance Use Disorder: A Systematic Review
    (Preprint)'
  date: 2026-10
  url: https://doi.org/10.2196/preprints.114168
  category: interface
  subcategory: ''
  authors:
  - Abd Alhadi Hasan
  abstract: 'BACKGROUND Substance use disorders (SUDs) are chronic, relapsing conditions
    for which effective treatments exist (Volkow & Blanco, 2023). These include medications
    for opioid use disorder (MOUD), cognitive behavioural therapy (CBT), motivational
    interviewing and contingency management (CM), in which individuals receive tangible
    rewards for verified abstinence (Dar et al., 2023; Rosenthal et al., 2022). However,
    many individuals who could benefit never reach treatment, and many who do begin
    it leave early. Distance, cost, stigma, limited clinic hours, and workforce shortages
    restrict access, and the episodic nature of clinic care leaves long gaps between
    contacts in a condition where relapse can occur at any time (Yazıcı & Bardakçı,
    2023). Digital health interventions (DHIs) have been proposed to fill these gaps.
    The term covers smartphone apps, web programmes, text and chat messaging, telehealth,
    remote monitoring, digitally delivered CM, clinical decision support for clinicians
    and, more recently, conversational agents built on large language models (Gentili
    et al., 2022). DHIs can deliver established treatment components at scale, extend
    contact between visits and reach people who would not attend a clinic (Businelle
    et al., 2024; Marsch et al., 2020). Their promise depends on whether they change
    what matters: substance use, retention in treatment, and access to effective medication.
    Existing syntheses suggest a qualified benefit. A 2025 systematic review and meta-analysis
    of 34 randomized trials found that remote or digital interventions added to in-person
    alcohol and drug treatment appear to reduce relapse and days of use (Kwan et al.,
    2025). A review of digital interventions for young people found weak evidence
    overall, with a small, short-lived reduction in alcohol use (O''Logbon et al.,
    2024). A scoping review of methamphetamine-focused tools described rising attrition
    in an app study, from 11.5% at 8 weeks to 55.8% at 40 weeks (Fletcher et al.,
    2025), and a scoping review for opioid use disorder reported reduced opioid use
    against usual care in several trials but not for the A-CHESS support app (Scialanca
    et al., 2025). In tobacco control, the evidence is stronger; a vaping-cessation
    text programme raised 7-month abstinence among young adults from 18.6% to 24.1%
    (Graham et al., 2021). With increasing technological developments, the field of
    DHIs has changed. Telehealth prescribing of buprenorphine has been studied at
    scale in Medicaid, veterans, and commercial populations (Marsch et al., 2020).
    Cluster-randomized trials have tested monitoring apps and clinical decision support
    across dozens of clinics (Shahmoradi et al., 2021). Tailored and adaptive messaging
    has been trialled for alcohol and cannabis, smartphone CM has moved into feasibility
    testing, and AI chatbots have entered pilot evaluation. However, significant uncertainties
    remain. Previous syntheses are often limited to one substance or delivery mode,
    and therefore recent primary studies on DHIs have not been appraised together
    across substance classes. It is therefore unclear which delivery models have credible
    effects, for which substances, and where evidence is still insufficient to guide
    practice. This review addresses that gap by systematically identifying and appraising
    primary studies that examined DHIs. The review addresses the following research
    question: In people with substance use disorder or problematic substance use,
    do digital health interventions improve substance use outcomes, treatment retention,
    or treatment receipt compared with usual care, active or minimal controls, or
    no intervention? OBJECTIVE The review addresses the following research question:
    In people with substance use disorder or problematic substance use, do digital
    health interventions improve substance use outcomes, treatment retention, or treatment
    receipt compared with usual care, active or minimal controls, or no intervention?
    METHODS Methods The review followed the guidelines of the PRISMA 2020 statement
    (Page et al., 2021). The protocol was not prospectively registered; the eligibility
    criteria, search approach, appraisal tools, and synthesis plan below were developed
    before screening began. 2.1 Eligibility Criteria Criteria are summarized in Table
    1. Table 1. Inclusion and exclusion criteria Domain Inclusion criteria Exclusion
    criteria Population People of any age with SUD or problematic or hazardous use
    of alcohol, opioids, stimulants (including methamphetamine and cocaine), cannabis,
    or tobacco and nicotine (including vaping). Prevention studies in people who do
    not use substances; behavioral addictions (gaming, gambling, internet use); prescribed
    stimulant use for ADHD without SUD outcomes. Intervention Digital health interventions:
    smartphone apps, web programs, text or chat messaging, telehealth or telemedicine,
    remote or digital contingency management, remote monitoring or wearables, clinical
    decision support, conversational agents or large language models. Non-digital
    interventions (for example brain stimulation, medications alone, in-person care
    navigation); digital tools used only for research data collection. Comparator
    Usual care, in-person care, waitlist, minimal, educational or active control,
    or no intervention. Uncontrolled designs were accepted and appraised separately.
    None. Comparator type was not used to exclude studies. Outcomes Substance use
    or abstinence, heavy drinking, relapse, treatment retention, linkage to or receipt
    of treatment, health service use, overdose or mortality, feasibility and engagement.
    Development-only reports with no participant outcome data. Study design Primary
    studies: randomized trials (individual, cluster, stepped-wedge, micro-randomized),
    non-randomized studies, cohort studies, single-arm pilots and case series. Systematic
    reviews, meta-analyses, scoping, narrative and umbrella reviews, health technology
    assessments, commentaries, protocols and registry entries, qualitative-only studies,
    surveys, preprints, secondary and mediation analyses. Date and language Published
    1 January 2023 to 29 September 2026; English. Published before 2023; languages
    other than English. 2.2 Information Sources Searches were run on 25 September
    2026 using a web search tool that retrieves journal articles from publisher websites
    including Addiction, JAMA Network, JMIR, Lancet, Elsevier, Wiley and Springer,
    PubMed and PubMed Central records, ClinicalTrials.gov entries and open repositories.
    Licensed bibliographic databases, MEDLINE, Embase, PsycINFO, CENTRAL, and Web
    of Science were not searched directly. Reference lists and linked records of retrieved
    articles guided follow-up searches for named trials. 2.3 Search Strategy Searches
    combined three concept blocks: a substance or SUD term, a digital intervention
    term, and a study design or outcome term, with substance- and modality-specific
    variants. Twenty-three strings were applied (Table 2). Year terms (2023 to 2026)
    were added to many strings, and date eligibility was confirmed during screening.
    Later strings were targeted at named trials or topics identified in earlier results
    to retrieve abstracts and outcome data for those studies. Table 2. Full search
    strings applied (web search tool) Search string Records retrieved 1 systematic
    review meta-analysis digital health interventions substance use disorder 2025
