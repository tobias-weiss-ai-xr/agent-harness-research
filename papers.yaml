- title: 'RecHarness: A Bandit-Routed Agentic Harness for Self-Evolving Recommender
    Systems'
  date: 2026-07
  url: https://arxiv.org/abs/2607.29241
  category: runtime
  subcategory: systems
  authors: []
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Optimizing modern recommender models still depends heavily on engineers
    manually iterating over architectural, objective, and training-strategy changes.
    While LLM-based agents can automate this trial-and-error process, allowing the
    LLM to both select modification directions and generate concrete hypotheses often
    leads to unstable search under limited experiment budgets. Inspired by the above
    challenge, we propose RecHarness, a Bandit-Routed Agentic Harness for automated
    recommender model optimization. RecHarness separates the optimization process
    into two steps: a bandit router selects the next modification direction according
    to historical validation feedback, while the LLM generates a concrete optimization
    hypothesis and executable code edit within the selected direction. To sustain
    long-horizon exploration, RecHarness uses a jump-basin mechanism to activate a
    structural-jump arm when local edits stagnate. Across multiple recommendation
    tasks, datasets, and model backbones, RecHarness achieves more stable performance
    improvements and uses limited trial budgets more effectively than LLM-reasoning
    search. During a 7-day online A/B test on a large-scale short-video advertising
    platform, the selected candidate improves ADVV by 2.084%, Revenue by 0.534%, and
    Exposure by 0.559%. Code is available at https://github.com/6lyc/RecHarness.'
  tags:
  - auto-runtime
  - auto-systems
- title: 'LifeLong Digital Twin: A Unified Modeling Paradigm and Agent Harness for
    Event-Driven Lifelong Health State Trajectories'
  date: 2026-10
  url: https://arxiv.org/abs/2610.05566
  category: runtime
  subcategory: systems
  authors: []
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Human health is a continuous, dynamic trajectory shaped by the cumulative
    interplay of biological processes, clinical events, behaviors and environmental
    exposures across the life course. Unifying the full breadth of lifelong health
    information, including longitudinal records, genetic variation, molecular profiles
    and environmental histories, is essential for whole-person modeling and remains
    a major challenge. We introduce LifeLong Digital Twin, a unified, event-driven
    modeling paradigm that organizes Life Events into daily Health States and accumulates
    them into Lifelong Health Context. An accompanying Agent Harness incorporates
    multimodal evidence beyond the language model''s textual context. We evaluate
    four language models across 25 disease endpoints on three tasks: Disease Trajectory
    Forecasting, Disease Risk Ranking and Multi-horizon Disease Prediction. The approach
    yields marked gains over the reference condition: model-averaged F1 increases
    by 22.0% for disease identification in trajectory forecasting and 18.3% for five-year
    disease outcomes; thyroid-disease F1 reaches 0.669. The framework provides a foundation
    for whole-person digital twins and research on personalized lifelong disease prevention.'
  tags:
  - auto-runtime
