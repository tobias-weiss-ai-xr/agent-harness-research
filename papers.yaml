- title: Replication package for "On Coding Agent Issue Localization Accuracy An Exploratory
    Study"
  date: 2026-05
  url: https://doi.org/10.5281/zenodo.20327573
  category: runtime
  subcategory: ''
  authors:
  - Antonino Coppola
  - Matteo Esposito
  - Rick Kazman
  abstract: 'Replication Package On the Accuracy of Issue Localization by Coding Agents
    1. Overview We empirically evaluate how accurately three open-weightLLM-based
    coding agents identify the software entities thathuman developers modify to resolve
    real-world issues. Thestudy spans 10 Apache Java projects and 2,441 issues, withmetrics
    computed at three granularities: package, class, andmethod. The pipeline reconstructs
    each issue''s historical pre-fixstate, invokes each agent on the issue description,
    andcompares the agent-modified entities against the human groundtruth using Precision,
    Recall, F1, Accuracy, and MCC. 2. Repository Structure . ├── README.md # this
    file ├── requirements.txt # Python dependencies ├── data/ │ ├── raw/ # SQuaD dataset
    (input CSV files) │ ├── interim/ # filtered issues per project (parquet) │ │ ├──
    study_projects.csv # List of the 10 selected projects │ │ ├── pilot_issues__<project>.parquet
    # Initial pool of issues per project (before size filtering) │ │ └── pilot_final__<project>.parquet
    # Sampled issues per project (after size filtering) │ ├── processed/ │ │ ├── ground_truth/
    # human-fix entities per issue │ │ │ └── <project>/ │ │ │ │ └── <issue>.json #
    Package/class/method entities modified by the human in the HIFC │ │ ├── agent_outputs/
    # raw patch.diff + metadata per (model, issue) │ │ │ └── <model>/ │ │ │ └── <project>__<issue>/
    │ │ │ ├── patch.diff # Generated patch │ │ │ ├── run_metadata.json # Timing, exit
    code, timeout flag │ │ │ ├── stdout.log # OpenCode standard output │ │ │ └── stderr.log
    # OpenCode standard error │ │ ├── agent_entities/ # Parsed entities from each
    agent patch (output of stage 07) │ │ │ └── <model>/ │ │ │ └── <project>/ │ │ │
    └── <issue>.json # Package/class/method entities modified by the agent │ │ └──
    metrics/ # P/R/F1 per (model, project, granularity) │ │ ├── _common/ # Issue keys
    completed by all three models for a given project (output of stage 09) │ │ │ ├──
    common_issues__<project>.csv │ │ │ └── all_metrics.csv # Union of all per-issue
    metrics across every model, project, and granularity │ │ ├── _global/ # Final
    aggregated results (output of stage 10) │ │ │ ├── per_model.csv # Macro-averaged
    P/R/F1/Acc per (model, granularity) │ │ │ ├── per_project.csv # Per-project breakdown
    │ │ │ └── cross.csv # Cross-model averages │ │ └── <model>/ # Per-model metrics
    (one folder per LLM) │ │ ├── per_issue__<project>.csv # Per-issue metrics computed
    by stage 08 (all valid runs) │ │ └── per_issue_filtered__<project>.csv # Subset
    restricted to issues completed by all three models │ ├── repos/ # cloned Apache
    repositories │ │ └── apache#<project>/ │ └── workspaces/ # transient git worktrees
    (created at runtime) ├── scripts/ │ ├── 00_download_csv_SQuaD.sh # Download SQuaD
    source files │ ├── 01_filter_and_link.py # Build the DuckDB database from SQuaD
    files │ ├── 02_clone_repos.py # Clone Apache repositories listed in the file data/interim/study_projects.csv
    │ ├── 03_select_pilot_subset.py # Select the issues for each project and create
    the pilot_issues_<project>.parquet file │ ├── 04_extract_ground_truth.py # For
    each issue in pilot_issues_<project>.parquet, compute the human ground truth │
    ├── 04b_filter_pilot_for_size.py # [Not used] Filters selected issues and creates
    the `pilot_final_<project>.parquet` file │ ├── 05_run_one_issue.py # Manual single-shot
    agent run for one (project, issue) pair │ ├── 06_run_pilot.py # Orchestrate the
    agent runs over all issues in pilot_final__<project>.parquet │ ├── 07_extract_aifc_entities.py
    # Parse agent patch with tree-sitter │ ├── 08_compute_metrics.py # Compute TP/FP/FN/TN,
    P/R/F1, Accuracy, MCC per issue │ ├── 09_filter_common_issues.py # Identify the
    intersection of valid issues across all 3 models │ ├── 10_aggregate_metrics.py
    # Aggregate metrics across projects and models │ ├── run_multi_project.py # orchestrator
    │ └── count_divergent_cases.py # Count structurally divergent cases (potentially
    functionally equivalent) ├── llm_selection/ │ ├── artificialanalysis.csv # LLM
    ranking from artificialanalysis.ai │ ├── llmstats.csv # LLM ranking from llmstats.com
    │ ├── opencompass.csv # LLM ranking from OpenCompass leaderboard │ ├── llm_selection.py
    # Aggregates the three rankings and produces the final ranked list │ └── final_ranking.csv
    # Final ranked LLMs; top 3 open-weight models are used in the study └── project_selection/
    ├── all_java_projects.csv # Candidate pool of Java projects from SQuaD ├── list_projects.py
    # Selects Java projects from SQuaD; writes all_java_projects.csv ├── projects_selection.py
    # Ranks candidates by 14 metrics; writes the two CSVs below and study_projects.csv
    ├── projects_at_least_9_median.csv # Projects above the median on ≥9 of 14 metrics
    ├── projects_at_least_9_q3.csv # Projects above the third quartile on ≥9 of 14
    metrics (used for the study) └── count_final_issues.py # Computes Cochran''s sample
    size from the number of filtered issues 3. Requirements System OS: Linux (Ubuntu
    22.04 or later recommended) Python: 3.10 or later Git: 2.43 or later Python dependencies
    python -m venv venv source venv/bin/activate pip install -r requirements.txt Agent
    harness The Ollama Cloud API key must be configured in two places: 1. As an environment
