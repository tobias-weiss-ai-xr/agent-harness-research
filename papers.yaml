- title: 'Open Agent Specification (Agent Spec): A Unified Representation for AI Agents'
  date: 2025-10
  url: https://arxiv.org/abs/2510.04173
  category: runtime
  subcategory: ''
  authors:
  - Amini, Soufiane
  - Yassine Benajiba
  - Cesare Bernardis
  abstract: 'The proliferation of agent frameworks has led to fragmentation in how
    agents are defined, executed, and evaluated. Existing systems differ in their
    abstractions, data flow semantics, and tool integrations, making it difficult
    to share or reproduce workflows. We introduce Open Agent Specification (Agent
    Spec), a declarative language that defines AI agents and agentic workflows in
    a way that is compatible across frameworks, promoting reusability, portability
    and interoperability of AI agents. Agent Spec defines a common set of components,
    control and data flow semantics, and schemas that allow an agent to be defined
    once and executed across different runtimes. Agent Spec also introduces a standardized
    Evaluation harness to assess agent behavior and agentic workflows across runtimes
    - analogous to how HELM and related harnesses standardized LLM evaluation - so
    that performance, robustness, and efficiency can be compared consistently across
    frameworks. We demonstrate this using four distinct runtimes (LangGraph, CrewAI,
    AutoGen, and WayFlow) evaluated over three different benchmarks (SimpleQA Verified,
    $τ^2$-Bench and BIRD-SQL). We provide accompanying toolsets: a Python SDK (PyAgentSpec),
    a reference runtime (WayFlow), and adapters for popular frameworks (e.g., LangGraph,
    AutoGen, CrewAI). Agent Spec bridges the gap between model-centric and agent-centric
    standardization & evaluation, laying the groundwork for reliable, reusable, and
    portable agentic systems.'
  venue: arXiv (Cornell University)
- title: Execution-aware agent harness for accessible and responsible synthetic biology
    automation
  date: 2025-10
  url: https://doi.org/10.1101/2025.09.30.679666
  category: runtime
  subcategory: ''
  authors:
  - Yuan Gao
  - Lizhou Luo
  - Yujie Liu
  abstract: 'Abstract Laboratory automation accelerates synthetic biology, but robot
    programming remains a barrier to broader participation. Large language model (LLM)-based
    automation must address four interconnected requirements in this field: sequence-level
    biosecurity, community standards, context-dependent biological behavior, and distributed
    collaboration across laboratories. Here we present LabscriptAI, an execution-aware
    agent framework that couples authoring and runtime control loops to translate
    natural-language instructions into platform-specific robot scripts and support
    bounded recovery under deterministic authorization and human oversight. On a 90-task
    liquid-handling benchmark, LabscriptAI achieved a 96.7% simulation-pass rate,
    the highest among the evaluated LLM-based and commercial baselines. We demonstrated
    its capabilities through sequence screening at designated workflow checkpoints;
    standardized cell-free characterization of 854 green fluorescent protein (GFP)
    designs from 171 student teams, coupled to data deposition; containment-aware
    engineering of a formaldehyde-converting enzyme, yielding 6.7-fold higher ethylene
    glycol titers in a two-stage cascade; and quality-assured preparation of 531 genetic
    parts for the 2025 iGEM Distribution Kit distributed worldwide. Together, these
    results establish LabscriptAI as a biosecurity-aware, community-integrated framework
    connecting protocol authoring, controlled execution, and traceable experimental
    outputs across laboratory platforms.'
  venue: bioRxiv (Cold Spring Harbor Laboratory)
- title: '"You''re Right, Let Me Fix It": How LLM Agents Damage Correct Work When
    Falsely Accused'
  date: 2026-09
  url: https://arxiv.org/abs/2609.32616
  category: runtime
  subcategory: ''
  authors:
  - Xutao Mao
  - Rui Qian
  - Longxiang Wang
  abstract: LLM agents increasingly keep working after a task succeeds as they resume
    after compaction or take over handoffs. Their finished work keeps receiving follow-up
    input that sometimes falsely accuses it for later failures. We call an agent's
    acceptance of such a false accusation gaslight sycophancy, and destructive over-correction
    when acting on it damages previously correct work. We introduce CAVE-Bench, a
    benchmark of 365 agentic tasks across six domains built around opaque tasks. Every
    scored run first reaches a verified correct state, whose supporting rationale
    and history stay in the workspace while the facts that would settle the accusation
    lie in external or runtime state beyond the agent's reach. The agent cannot confirm
    or refute the claim with a local check, so the right response should keep the
    work and ask for the missing evidence. Each task either hands the agent correct
    work with saved evidence or let it build and verify that work first, and five
    risk factors set how the accusation enters the workflow. We score accusation acceptance
    and evidence use from the trajectory and measure harm by deterministic replay
    of downstream events. Across 14 of the latest models in Claude Code, false accusations
    damage correct work in up to 60.06% of runs, and stronger models often do so after
    recovering the supporting evidence. The same model behaves differently across
    OpenCode, Codex, and Hermes, and a harness gate driven by the benchmark's live
    signals cuts replayed harm by 74%. These results show that preserving already-correct
    work under unsupported accusation is a distinct safety challenge for long-lived
    agents. Our project is in https://henrymao2004.github.io/agent-over-correction/.
  venue: arXiv (Cornell University)
- title: CPOS-H as a Layered Pre-LLM Execution Gate
  date: 2026-06
  url: https://doi.org/10.5281/zenodo.20934112
  category: runtime
  subcategory: ''
  authors:
  - Aya Mizutani
  abstract: 'Agentic LLM systems are vulnerable to cumulative prompt and context poisoning:
    an attacker can gradually drift the interaction into a risky state without triggering
    a single obvious injection signature. This report evaluates CPOS-H, a layered
    pre-LLM execution gate that combines a lightweight NeuroState drift signal with
    action-sensitive execution gating, SDE provenance/trajectory checks, a rule-based
    Shadow Auditor, NEMA-style egress preconditions, and Fresh Import Quarantine.
    The main evidence comes from a deterministic harness with 100 repetitions per
    condition family over fixed attack and normal instruction tapes. In that harness,
    CPOS-H (H) blocks all evaluated AI-native contamination scenarios S1-S17: ASR
    0.0000 over 1,700 attack trials and FPR 0.0000 over 6,400 reviewed normal trials.
    This is a fixed-tape runtime-control result, not a universal security guarantee
    for all prompt injection or all natural conversations. The report frames NeuroState
    not as a validated six-dimensional psychological model, but as a structured external
    state coordinate system whose operational effect can collapse into a low-dimensional
    interaction-drift signal. This black-box runtime framing complements white-box
    representation-engineering work showing low-dimensional safety and refusal directions
    inside model activations. CPOS-H uses the external drift signal operationally,
    without activation access, before dangerous execution.'
  venue: Zenodo (CERN European Organization for Nuclear Research)
- title: 'Compilation Contracts and Runtime Guarantees: How Structural Type Enforcement,
    Trace-Guided Repair, Numeric Format Registries, and Harness Governance Jointly
    Define a Falsifiable Framework for Software Correctness Infrastructure'
  date: 2026-06
  url: https://doi.org/10.5281/zenodo.20664669
  category: runtime
  subcategory: ''
  authors:
  - Saluca Agentic AI Research Team
  abstract: 'This paper advances a candidate reading — explicitly heuristic rather
    than derivational — that a cluster of recent software engineering and programming
    language research converges on a shared structural pattern: correctness properties
    that are enforced *at the wrong layer* of a software stack are systematically
    bypassable, and the measurable cost of that mislocation is documented across credential
    leakage, budget overruns, numeric format divergence, decompiler reusability, and
    agentic harness failures. The thesis is not that these domains share a formal
    unification, but that each independently arrives at the same engineering prescription:
    push the enforcement boundary earlier in the compilation or deployment pipeline,
    make violations structurally inexpressible rather than merely detectable at runtime,
    and instrument the gap between what the contract says and what execution produces.
    The corpus spans cs.SE, cs.PL, and cs.AR preprints from May–June 2026. Five primary
    findings anchor the synthesis: (1) affine type ownership in Rust makes LLM-agent
    token-budget double-spending a compile-time error rather than a runtime race [corpus:arxiv:2606.04056];
    (2) a fixed-point combinator in the Clef compiler carries dimensional and numeric-representation
    structure through MLIR lowering via categorical functors, making structural violations
    detectable during compilation [corpus:arxiv:2606.02854]; (3) an 84-format numeric
    catalog with bit-exact conformance vectors provides a vendor-neutral reference
    that makes silent divergence diagnosable rather than invisible [corpus:arxiv:2606.09686];
    (4) trace-guided harness repair localizes failures to specific harness layers
    rather than applying broad prompt-level patches [corpus:arxiv:2606.06324]; and
    (5) SBOM tooling gaps show that component inclusion has no shared definition,
    making supply-chain security structurally unenforceable with current tools [corpus:arxiv:2606.02442].
    Three supporting findings on undefined behavior in C/C++ [corpus:arxiv:2606.12064],
    governed harness mutation [corpus:arxiv:2605.27328], and semantic entropy for
    code quality [corpus:arxiv:2606.09800] extend the pattern. The primary falsification
    path: if enforcement-layer migration (from runtime to compile-time or from ad-hoc
    to registry-anchored) does not reduce the *rate* of the specific failure class
    it targets — measured against a regression suite or production incident catalog
    — the thesis collapses to a taxonomy, not a design principle. --- Authorship:
    Saluca Agentic AI Research Team (Saluca LLC). AI-drafted from arXiv preprint corpus
    on the date in the filename. Cited arXiv preprints: 2605.21337, 2605.27328, 2605.27332,
    2605.29490, 2605.31004, 2605.31520, 2606.01490, 2606.02442, 2606.02494, 2606.02854,
    2606.04056, 2606.06324, 2606.06492, 2606.07314, 2606.07412, 2606.09686, 2606.09800,
    2606.11076, 2606.11117, 2606.12064, 2606.12212'
  venue: Zenodo (CERN European Organization for Nuclear Research)
- title: 'WildClawBench: A Benchmark for Real-World, Long-Horizon Agent Evaluation'
  date: 2026-05
  url: https://arxiv.org/abs/2605.10912
  category: runtime
  subcategory: ''
  authors:
  - Shuangrui Ding
  - Xuanlang Dai
  - Long Xing
  abstract: Large language and vision-language models increasingly power agents that
    act on a user's behalf through command-line interface (CLI) harnesses. However,
    most agent benchmarks still rely on synthetic sandboxes, short-horizon tasks,
    mock-service APIs, and final-answer checks, leaving open whether agents can complete
    realistic long-horizon work in the runtimes where they are deployed. This work
    presents WildClawBench, a native-runtime benchmark of 60 human-authored, bilingual,
    multimodal tasks spanning six thematic categories. Each task averages roughly
    8 minutes of wall-clock time and over 20 tool calls, and runs inside a reproducible
    Docker container hosting an actual CLI agent harness (OpenClaw, Claude Code, Codex,
    or Hermes Agent) with access to real tools rather than mock services. Grading
    is hybrid, combining deterministic rule-based checks, environment-state auditing
    of side effects, and an LLM/VLM judge for semantic verification. Across 19 frontier
    models, the best, Claude Opus 4.7, reaches only 62.2% overall under OpenClaw,
    while every other model stays below 60%, and switching harness alone shifts a
    single model by up to 18 points. These results show that long-horizon, native-runtime
    agent evaluation remains a far-from-resolved task for current frontier models.
    We release the tasks, code, and containerized tooling to support reproducible
    evaluation.
  venue: arXiv (Cornell University)
- title: 'Three Substrates, Seven Models, Six Tasks: A Comparative Empirical Evaluation
    of Structural Enforcement for AI Agent Runtimes'
  date: 2026-05
  url: https://doi.org/10.5281/zenodo.20043246
  category: runtime
  subcategory: ''
  authors:
  - Jascha Wanger
  abstract: 'This preprint reports a three-substrate empirical evaluation of structural
    enforcement for AI agent runtimes. Most evaluations of AI agent security measure
    attack-class survival within a single substrate. The harder question, whether
    a given substrate provides defense in depth over alternatives, is rarely answered
    empirically because it requires running the same adversarial tasks against multiple
    substrates. We do that. Three substrates (a permissive Python baseline, the same
    baseline wrapped in a Docker container with strict bind mounts, and Symbiont,
    an OATS-compliant runtime with typestate-enforced action dispatch and ToolClad-typed
    argument validators) are evaluated against six adversarial agent task families
    using seven hosted LLMs spanning four vendors and three capability tiers, with
    sample-size tightening to n=200 per cell on the orchestrator-injection vector
    for tight Wilson confidence intervals. This paper sits in the Open Agent Trust
    Stack (OATS) preprint corpus alongside the OATS specification itself, which defines
    the architectural properties under test, and two companion preprints establishing
    those properties within Symbiont (the typestate paper at Layer 1, the ToolClad
    paper at Layer 2). The contribution of this paper is comparative: where prior
    work measured what each fence catches inside a single substrate via stack-stripping
    ablation, this paper measures what the substrate as a whole catches versus alternative
    substrates that lack those structural properties. Empirical results. Symbiont
    reduces escape rate to 0% on four pure-action vectors (filesystem-enumerate, network-boundary,
    syscall-boundary, state-immutability) regardless of model or capability tier.
    Pooled across 7 models and 140 trials per vector, all four report 0/140 escapes.
    Across all gated vectors combined: 526 distinct path/url-validator blocks plus
    1,711 agent_summary content-validator blocks across the n=200 injection sweep.
    Symbiont reduces orchestrator-injection escape from 59% to 3.6% pooled at n=200,
    with six of seven models clustering at 1–4%. GPT-5 alone reaches 16% [12%, 22%],
    a Wilson confidence interval that does not overlap any other model''s CI. The
    GPT-5 residual is the regex ceiling on substring-based content fences and is not
    a function of marker-list completeness; sample bypasses use domain-language paraphrases
    ("EFFECTIVE ROUTING DECISION", "BUSINESS-CRITICAL CLASSIFICATION", "NORTH STAR
    PRIORITY") that share no literal substring with any explicit injection phrasing.
    Closing the gap further requires structural changes (LLM-as-judge classification,
    user-role data separation), not bigger marker lists. Docker-sandboxed Python provides
    material defense only on syscall-boundary (38% → 9% pooled), and only because
    the lure binary (/usr/bin/openssl) is missing from the python:3.12-slim image.
    The defense is fragile and depends on container image contents. On the four other
    gated vectors, OS isolation provides effectively zero protection because the canaries
    live inside the bind-mounted writable area, which is the realistic threat: agents
    being tricked into reading the wrong file in the same data directory, not breaking
    out of containers entirely. OS isolation and typestate-shape enforcement defend
    against independent threat classes. Sandbox helps where typestate doesn''t (one
    fragile defense on syscall-boundary contingent on missing binaries) and is ineffective
    where typestate is most effective (the four pure-action vectors at clean 0%).
    The two should be deployed together as defense in depth, not treated as substitutes.
    A team that deploys agents inside Docker containers without typestate-shape enforcement
    is accepting the in-bind-set scope expansion threat class without any defense;
    a team that deploys typestate-shape enforcement without containers is accepting
    the container-escape threat class without defense. The substrate gap is not capability-dependent.
    Symbiont''s blocking rate stays at ~100% across frontier (GPT-5, Claude Sonnet
    4.6, DeepSeek v4 Pro, Qwen 3.6 Max), mid (DeepSeek v4 Flash, Qwen 3.5 35B), and
    floor (Qwen 3.6 27B) tiers. As model capability scales up, attack sophistication
    may scale with it (GPT-5''s paraphrase aggression on the injection vector suggests
    this), but the structural enforcement on action-shape vectors holds regardless.
    Alignment behaves as a second, partially-overlapping fence. Sonnet 4.6''s baseline
    injection rate is 17% (vs 75–82% for the open-weights frontier) because Sonnet
    refuses approximately 80% of injection trials at the prompt layer before the substrate
    is reached. GPT-5''s baseline rate is 99%; alignment is permissive for this task
    and the substrate has to do the entire work. Both reach near-zero on the four
    pure-action vectors regardless of alignment posture, because alignment cannot
    help when the substrate''s tool surface is genuinely smaller. What this is and
    is not. This is a synthetic adversarial sweep of designed lures, not production
    deployment telemetry. It establishes that the structural enforcement claims of
    the OATS specification translate to comparative escape-rate defense versus alternative
    substrates on the evaluated tasks; it does not establish that they translate to
    controlled production case studies, which is named as the most important external-validity
    gap in Section 11. The evaluation covers scope_target (path validator), allow-list
    URL validation, and agent_summary (content validator); other ToolClad parameter
    types are not exercised. Only one Symbiont implementation is tested; multi-implementation
    conformance across alternative OATS-compliant runtimes is future work. Sample
    sizes are tuned to the expected effect size of each measurement: n=20 per cell
    on the four pure-action vectors (where pooled rates approach the extremes and
    tight Wilson CIs are achievable at n=140 pooled) and n=200 per cell on the orchestrator-injection
    vector (where mid-range rates require ±3–5 pp CIs to distinguish per-model behaviors).
    One methodological inconsistency is documented honestly in Section 9.2: the python_sandboxed
    cell on injection_orchestrator is at n=20 while the other two substrates are at
    n=200 in the same row; an n=200 re-run was prepared on 2026-05-05 (config preserved
    at sweep_config_n200_sandboxed.yaml) but blocked by an OpenRouter account-level
    key spending cap before completion. Closing the cell is the first item on the
    future-work list and is expected to land within a few percentage points of the
    n=20 reading. Reproduction artifact. The reference corpus is published at github.com/ThirdKeyAI/symbiont-orga-demo.
    Sweep configurations, harness, lure prompts, and analysis scripts are committed;
    per-trial JSONL audit sidecars and strace logs are not committed (see evals/escape/PUBLISHABILITY.md
    for rationale) but are regenerated by re-running the sweep. Appendix C of the
    paper contains complete reproduction commands. Cumulative ground-truth OpenRouter
    spend across the entire evaluation effort, including the v4 four-frontier-model
    sweep that fed v5''s three-substrate comparison, is approximately $51; closing
    the n=200 sandboxed-injection cell adds approximately $5 and 3 hours once the
    spending cap is unblocked. Companion preprints in the OATS corpus. Open Agent
    Trust Stack (OATS): A System Specification for Zero-Trust AI Agent Execution,
    version 1.2.0. doi:10.5281/zenodo.19636533 Typestate-Enforced Agent Loops: Making
    Policy Gates Unskippable at Compile Time, preprint v0.5. doi:10.5281/zenodo.19746723
    Making Dangerous Tool Arguments Inexpressible: A Declarative Contract Format for
    LLM Agents, preprint v0.2. doi:10.5281/zenodo.19957595 The four papers reference
    each other coherently: the OATS specification defines the architectural properties;
    the typestate paper establishes that policy gates are unskippable at compile time;
    the ToolClad paper establishes that typed arguments make dangerous parameters
    structurally inexpressible; this paper measures the comparative substrate contribution
    of those properties versus alternative substrates that lack them. Software. The
    Symbiont runtime is open source under Apache 2.0 at github.com/thirdkeyai/symbiont.
    The ToolClad source is at github.com/ThirdKeyAI/ToolClad. The reproduction corpus
    is at github.com/ThirdKeyAI/symbiont-orga-demo. The Open Agent Trust Stack specification
    is at openagenttruststack.org. Contents: 25 pages, 12 tables (substrate decomposition,
    per-task pooled rates, model selection, per-model GPT-5 confidence intervals,
    cross-tier rates, plus per-cell appendices), eleven sections including Introduction,
    Background and Related Work, Threat Model and Task Taxonomy, Methodology, Per-Task
    Results, Substrate Contribution Analysis, The GPT-5 Outlier and the Regex Ceiling,
    Capability-Tier Robustness, Limitations, Related Work, and Conclusion. Three appendices:
    per-cell results tables, per-trial audit sidecar format, and reproduction instructions.
    Keywords: AI agents; LLM tool use; agent security; substrate comparison; structural
    enforcement; typestate; allow-list; declarative contracts; OS isolation; container
    security; Docker; gVisor; orchestrator injection; prompt injection; regex ceiling;
    OATS; Symbiont; ToolClad; comparative evaluation; n=200; Wilson confidence intervals;
    GPT-5. Correspondence: jascha@thirdkey.ai'
