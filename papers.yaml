- title: 'Metal-Sci: A Scientific Compute Benchmark for Evolutionary LLM Kernel Search
    on Apple Silicon'
  date: 2026-05
  url: https://arxiv.org/abs/2605.09708
  category: runtime
  subcategory: ''
  authors:
  - Víctor Gallego
  abstract: 'We present Metal-Sci, a 10-task benchmark of scientific Apple Silicon
    Metal compute kernels spanning six optimization regimes (stencils, all-pairs in
    $n$-body problems, multi-field Boltzmann, neighbor-list molecular dynamics, multi-kernel
    PDE, FFT). Each task ships a CPU reference, a roofline-anchored fitness function,
    and a held-out generalization size. We pair the benchmark with a lightweight harness
    for automatic kernel search that runtime-compiles each candidate, scores it against
    the roofline across multiple sizes, and feeds structured compile and per-size
    correctness diagnostics back to a frozen LLM driving a $(1{+}1)$ evolutionary
    loop. We report matched single-model sweeps of Claude Opus 4.7, Gemini 3.1 Pro,
    and GPT 5.5 on M1 Pro: in-distribution self-speedups span $1.00\times$ to $10.7\times$.
    Beyond raw speedup, our central methodological claim is structural: the held-out
    gate scoring function $Φ_\mathcal{T}$ (evaluated once at end-of-run on a configuration
    the agent never sees during search) functions as a cheap mechanical oversight
    primitive on this automatic search loop, catching e.g. an Opus template HMC win
    that returns wrong samples at unseen dimensions, and a GPT FFT3D best that wins
    in-distribution at $2.95\times$ speedup but collapses to $0.23\times$ on a $256^3$
    held-out cube, a silent regression that the in-distribution score alone cannot
    see. Code at https://github.com/vicgalle/metal-sci-kernels'
  venue: arXiv (Cornell University)
- title: 'EffiSkill: Agent Skill Based Automated Code Efficiency Optimization'
  date: 2026-03
  url: https://arxiv.org/abs/2603.27850
  category: runtime
  subcategory: ''
  authors:
  - Zimu Wang
  - Yuling Shi
  - Mengfan Li
  abstract: 'Code efficiency is a fundamental aspect of software quality, yet how
    to harness large language models (LLMs) to optimize programs remains challenging.
    Prior approaches have sought for one-shot rewriting, retrieved exemplars, or prompt-based
    search, but they do not explicitly distill reusable optimization knowledge, which
    limits generalization beyond individual instances. In this paper, we present EffiSkill,
    a framework for code-efficiency optimization that builds a portable optimization
    toolbox for LLM-based agents. The key idea is to model recurring slow-to-fast
    transformations as reusable agent skills that capture both concrete transformation
    mechanisms and higher-level optimization strategies. EffiSkill adopts a two-stage
    design: Stage I mines Operator and Meta Skills from large-scale slow/fast program
    pairs to build a skill library; Stage II applies this library to unseen programs
    through execution-free diagnosis, skill retrieval, plan composition, and candidate
    generation, without runtime feedback. Results on EffiBench-X show that EffiSkill
    achieves higher optimization success rates, improving over the strongest baseline
    by 3.69 to 12.52 percentage points across model and language settings. These findings
    suggest that mechanism-level skill reuse provides a useful foundation for execution-free
    code optimization, and that the resulting skill library can serve as a reusable
    resource for broader agent workflows.'
  venue: arXiv (Cornell University)
- title: 'Capture the lifecycle: KV Cache management in ReAct Agents with KVTether'
  date: 2026-09
  url: https://arxiv.org/abs/2609.39819
  category: runtime
  subcategory: ''
  authors:
  - Kaihua Fu
  - Yukun Zhou
  - Chaokun Chang
  abstract: Efficient serving of long-context reasoning-and-acting (ReAct) agents
    relies on KV cache reuse to reduce large language model (LLM) prefill latency
    and monetary cost. However, a semantic gap exists between agent harnesses and
    the underlying serving stack. Through context mutation, tool execution, and subagent
    coordination, context messages may become actively engaged, permanently discarded,
    and temporarily unused, while the serving stack only observes accesses to the
    corresponding KV cache. This lifecycle blindness prevents recency-only policies
    such as LRU from reclaiming dead KV promptly and from preserving older KV that
    will be reused sooner than newer entries. We present KVTether, a lifecycle-aware
    KV cache management framework for ReAct agents. By tracing semantic primitives
    embedded in agent harnesses, KVTether captures runtime lifecycle semantics during
    highly dynamic execution. KVTether then translates message-level semantics into
    KV-level lifecycle states and uses these states to drive state-prioritized cache
    management without exposing physical complexities to agent harnesses. After reclaiming
    dead KV, KVTether preferentially preserves live-but-idle KV that is waiting for
    reuse, reducing premature eviction before reuse. Across agent benchmarks and production
    workloads, KVTether reduces end-to-end request latency by up to 26.3% and 17.4%
    relative to LMCache and MORI, respectively, and lowers estimated task cost by
    40.0% and 33.2% on average.
  venue: arXiv (Cornell University)
- title: 'TinyCUA: Self-Refining Agent Loops for Complex Task Solution via Structured
    Task Execution'
  date: 2026-09
  url: https://doi.org/10.1109/icitri71999.2026.11751275
  category: runtime
  subcategory: ''
  authors:
  - Christopher Sebastian
  - Jonathan Limanza
  - Yosepril Zhounggi
  abstract: In recent years, AI agents have been widely used for assisting human tasks.
    Large Language Models (LLM) is the core reasoning part of agents when analyzing
    and solving problems. A persistent challenge in language models is the tendency
    toward hallucination as input context length increases. This study presents TinyCUA,
    a novel architecture designed to address that challenge through self-refining
    loops that enable autonomously refine and maintain context, compression, and update
    contextual information. This approach maintains the models to have more relevant
    context while removing the noisy information. In result, TinyCUA pass 3 of 5 given
    tasks, with slow runtime compared to other harnesses (30 minutes in total runtime).
    These findings suggest that an external orchestration can be used to modify the
    behavior of SLM better than instructions.
  venue: International Conference on Information Technology Research and Innovation
    (ICITRI)
- title: 'XFlow: An Executable Protocol Programming System for Reliable Multi-Agent
    Workflows'
  date: 2026-06
  url: https://arxiv.org/abs/2606.14790
  category: runtime
  subcategory: ''
  authors:
  - Hanqi Li
  - Jie Peng
  - Zijian Wang
  abstract: LLM-based multi-agent systems increasingly coordinate planning, reasoning,
    tool use, and human interaction, yet their reliability remains limited. A central
    source of this limitation is the underspecified prompt--harness boundary. Current
    systems lack a principled way to decide which workflow commitments should remain
    in prompts and which should become harness structure. We present \textbf{XFlow},
    an executable protocol programming system for reliable multi-agent workflows,
    and \textbf{XPF} (XFlow Protocol Format), its domain-specific protocol programming
    language. XFlow occupies a middle position between prompt-only orchestration and
    markup-like workflow descriptions. XPF remains readable as a literate protocol,
    but it is compiled and executed as a program. Its design keeps informal semantic
    work inside actors while moving selected commitments into harness structure that
    can be checked, preserved, and enforced. At runtime, XFlow stages uncertainty
    through lifecycle-governed symbols, which are typed state cells with validation
    and commit states. Actor outputs are mediated before they become shared state,
    instead of spreading through prompts, transcripts, or implicit memory. Our experiments
    cover Constrained Interaction, Long-Context Reasoning, and Agentic Software Engineering.
    They show that XFlow improves reliability by making constraints, evidence handling,
    and process requirements explicit and enforceable.
  venue: arXiv (Cornell University)
- title: 'Planarian: Managing Agent State with Statepoints'
  date: 2026-09
  url: https://arxiv.org/abs/2609.35366
  category: runtime
  subcategory: ''
  authors:
  - Jinnan Guo
  - Hao Mark Chen
  - Kapil Vaswani
  abstract: 'LLM agents solve complex tasks by iteratively changing files, invoking
    local tools, and interacting with remote services, which modifies state across
    their local environment and remote services. Today, agents and users must manage
    these changes explicitly, whether reverting exploratory actions or recovering
    from erroneous ones. Doing so safely requires coordinated actions, yet current
    agent harnesses lack unified abstractions and mechanisms for managing local and
    remote state consistently and efficiently. We describe Planarian, an agent runtime
    with state management that enables agents and users to recover from erroneous
    actions and explore alternative executions over consistent local and remote environment
    state. Planarian introduces the abstraction of agent statepoints, which are consistent,
    restorable point-in-time versions of the environment state. Planarian exposes
    three state-management primitives to agents and users: (i) snapshot creates a
    new statepoint spanning local and remote state without requiring external services
    to support checkpoints: it relies on efficient incremental process and file system
    snapshotting to capture local sandboxed state, and transparently records compensating
    actions to undo remote state changes; (ii) rollback restores the environment to
    a previous statepoint by reverting to a prior local checkpoint and replaying compensating
    actions for remote state changes; and (iii) fork creates multiple isolated branches
    from a statepoint, enabling the agent to explore alternatives in parallel. We
    show that Planarian enables agents to undo mistakes and explore alternatives in
    parallel, improving task quality by up to 15x, and allows users to recover from
    erroneous actions with only 3% overhead.'
  venue: arXiv (Cornell University)
- title: 'On the Clock: Towards Punctual and Productive Time-Budgeted AI Agents'
  date: 2026-10
  url: https://arxiv.org/abs/2610.10833
  category: runtime
  subcategory: ''
  authors:
  - Aaron Wang
  - Neelabh Madan
  - Vlad Sobal
  abstract: 'We study whether small LLM agents can operate effectively under explicit
    wall-clock time budgets by both respecting the allocated runtime and using available
    time productively. We evaluate Qwen3.6-27B on five competitions from MLE-Bench
    Lite and Qwen3-4B on Zork I (Jericho), two agentic benchmarks where additional
    computational time can meaningfully improve performance. In the simplest setting,
    where the budget is stated only in the prompt, agents fail to translate the stated
    budget into controlled use of time. These failures arise from gaps in time awareness,
    since the harness provides no timing feedback, but also because they cannot reliably
    anticipate the duration of actions, and do not have a learned mapping from available
    time to an appropriate strategy. We investigate two complementary classes of interventions:
    harness-based mechanisms that expose timing information and enforce deadlines,
    and reinforcement learning with budget-aware rewards. Injecting timing information
    through the harness substantially improves budget adherence for Qwen3.6-27B without
    measurable loss in performance, while enforcement hooks tighten adherence further.
    RL with GRPO achieves near-perfect budget adherence on Zork I and generalizes
    to held-out budgets not seen during training, but does not improve task performance
    over the untrained harness on MLE-Bench. Once agents are made to respect the budget,
    they still fail to use additional time to improve task performance. RL-trained
    policies learn when to stop but often fill extra time with repeated actions, and
    GRPO training on multiple budgets tends to collapse toward the strategy learned
    for the shortest budget. Our results reveal a gap between time adherence and productive
    time allocation, which remains a central challenge for budget-conditioned agents.'
  venue: arXiv (Cornell University)
- title: 'FuzzAgent: Multi-Agent System for End-to-End Evolutionary Library Fuzzing'
  date: 2026-05
  url: https://arxiv.org/abs/2605.14431
  category: runtime
  subcategory: ''
  authors:
  - Yunlong Lyu
  - Peng Chen
  - Fengyi Wu
  abstract: 'Library fuzzing synthesizes harnesses that expose new API interactions,
    but deploying it end to end still requires extensive project-specific integration.
    Existing LLM-based systems automate individual steps, yet they treat execution
    outcomes as coarse signals: a stalled campaign does not reveal which state blocks
    progress, and a crash trace does not reveal whether the library or the harness
    is at fault. We present FuzzAgent, a multi-agent system that builds and evolves
    a complete fuzzing campaign from a source tree alone. Specialized agents acquire
    project knowledge and repair campaign artifacts automatically. Hierarchical coverage
    diagnosis localizes blockers from modules down to branches, and dependency-aware
    generation converts them into harnesses with the required API lifecycle. Crash
    validation recovers runtime object states to distinguish harness misuse from library
    bugs. We evaluate FuzzAgent on 20 real-world C/C++ libraries against five state-of-the-art
    baselines (OSS-Fuzz, OSS-Fuzz-Gen, PromptFuzz, PromeFuzz, and ProteusFuzz). FuzzAgent
    completes the full fuzzing lifecycle for all 20 libraries without human intervention
    at $3.17 per library. On the 20 libraries, it reaches 179619 branches, exceeding
    OSS-Fuzz, PromptFuzz, ProteusFuzz, PromeFuzz, and OSS-Fuzz-Gen by 45.1%, 73.2%,
    87.7%, 92.1%, and 191.2%, respectively. FuzzAgent also identifies 102 new library
    bugs, 90 of which have already been acknowledged or fixed by upstream maintainers.'
  venue: arXiv (Cornell University)
- title: 'MABDT Engine: A Multi-Agent-Based Digital Twin Engine for Manufacturing
    Operations'
  date: 2026-06
  url: https://doi.org/10.5281/zenodo.20755231
  category: runtime
  subcategory: ''
  authors:
  - Michail Katsigiannis
  abstract: 'The Multi-Agent-Based Digital Twin (MABDT) Engine is an open-source runtime
    for building and executing agent-based Digital Twin models of manufacturing operations
    without commercial simulation software. It is organized around four components:
    a simulation environment that runs agent populations as hierarchical statecharts;
    an event-driven communication kernel that bridges internal messaging and external
    IoT devices via MQTT; an interface layer that exposes system state through read-only
    records; and an application layer for dashboards, IoT command interfaces, and
    LLM-assisted queries. This release includes the deployment-agnostic engine (mabdt),
    a reference deployment on the Tiger Motors educational assembly line (tiger_motors_dt),
    a minimal toy deployment, the scaling-experiment harness, and the test suite.
    It is the companion artifact to the author''s PhD dissertation and to a paper
    submitted to the Journal of Intelligent Manufacturing.'
  venue: Zenodo (CERN European Organization for Nuclear Research)
- title: 'pycognition: A Dual-Process Cognitive Architecture Integrating Deterministic
    Procedural Execution and Deliberative LLM Synthesis'
  date: 2026-11
  url: https://doi.org/10.5281/zenodo.23979551
  category: runtime
  subcategory: ''
  authors:
  - Oleh Riabtsev
  abstract: 'pycognition is an open-source neurosymbolic framework formalizing psychological
    Dual-Process Theory for autonomous software agents. Contemporary agent architectures
    (e.g., ReAct, AutoGen) uniformly route deterministic and repetitive sub-tasks
    through stochastic foundation model APIs, incurring substantial latency, financial
    token overhead, and execution drift. pycognition addresses this efficiency gap
    via a segregated execution topology: an ultra-fast procedural tier (System 1,
    executing validated Python scripts at sub-millisecond latencies with zero API
    token consumption) and a deliberative reasoning tier (System 2, orchestrating
    frontier LLM inference). The Skill Crystallization pipeline compiles verified
    reasoning traces into strongly typed procedural modules, fortified by Abstract
    Syntax Tree (AST) safety inspection and sandboxed unit testing via pytest prior
    to dynamic memory ingestion. Key Empirical Findings (N = 100 heterogeneous benchmark
    tasks): Marginal Procedural Speedup: Compiled System 1 routines achieve a mean
    latency of 0.292 ms vs. 3,307.41 ms for algorithmic LLM calls (11,326.7x marginal
    speedup) and 5,580.36 ms for aggregate System 2 deliberation (19,103.9x). Realistic
    Break-Even Dynamics: Explicitly accounting for autonomous script development latency
    (mean 7,192.20 ms / cold-start 10,499.60 ms), the per-skill break-even point is
    reached at k = 4 calls under ideal synthesis and k = 5 calls accounting for the
    36.2% sandbox rejection rate. Workload Execution Time: Asynchronous task response
    time across 85 algorithmic tasks decreased by 44.7% (155.46 s vs. 281.13 s baseline).
    Full synchronous cluster break-even is reached at N* ≈ 207 tasks. Token Amortization:
    Cumulative token expenditure dropped by 38.0% (53,978 vs. 87,061 tokens), scaling
    to 71.4% procedural coverage in the steady-state final quartile. Defensive Sandboxing:
    The verification harness filtered 17 flawed candidate modules (36.2%), preventing
    silent runtime regressions and guaranteeing 100% execution fidelity across all
    System 1 invocations. Package Contents: pycognition_preprint_en.pdf: Full English
    preprint (canonical academic version) pycognition_preprint_de.pdf: Vollständiger
    wissenschaftlicher Preprint in deutscher Sprache. pycognition_preprint_ru.pdf:
    Полная академическая версия статьи на русском языке. pycognition_preprint_trilingual.html:
    Monolithic standalone HTML manuscript with native MathML equations. metrics_100_deepseek.csv:
    Raw benchmark execution telemetry and latency measurements.'
  venue: Zenodo (CERN European Organization for Nuclear Research)
- title: 'NeuroLog: Reasoning You Can Audit -- Neuro-Symbolic Vulnerability Discovery
    via LLM Facts, Datalog, and SMT'
  date: 2026-05
  url: https://arxiv.org/abs/2606.00669
  category: runtime
  subcategory: ''
  authors:
  - Sanjay Rawat
  abstract: 'Vulnerability discovery on C/C++ source asks the analyst to choose between
    heavyweight static analysers, which need a working build before a single query
    runs, and free-form LLMs, which read source readily but invent details and lose
    track of cross-function dataflow on real codebases. We present NeuroLog, an end-to-end
    build-free pipeline that assigns each layer the role it is uniquely good at: an
    LLM extracts typed dataflow facts one function at a time; a Souffle rule mesh
    composes those facts into cross-function findings; a Z3 post-pass filters infeasible
    findings and emits a SAT model for each survivor. To go beyond pure static reasoning
    we also fold in runtime evidence: likely range invariants from a handful of corpus
    seeds tighten the SMT problem at near-zero cost. A second LLM agent reads each
    SAT model and writes a Python program that produces a candidate crashing input,
    validated by an AddressSanitizer harness. Combining static-narrowing-SMT (Saturn,
    Pinpoint) and Datalog-with-SMT (Formulog) is prior art; new here are an LLM-derived
    fact base, a no-build pipeline, and the SAT model as an artifact (input to crash
    synthesis) rather than a yes/no verdict. Across stb, cJSON, libxml2, an FFmpeg
    demuxer slice, and curl 8.3.0, NeuroLog re-discovers eight CVE-class issues end-to-end,
    including the CVSS-9.8 SOCKS5 heap overflow CVE-2023-38545, each ASan-confirmed.
    On libarchive HEAD we surface five memory-safety bugs (four previously unreported)
    across the cpio reader and the XAR/WARC/7zip writers; all filed upstream, several
    fixes merged, with the cpio use-after-free acknowledged in seven hours. Extraction
    takes ~37 s and $0.005 on stb; crash synthesis turned a static finding into a
    102-byte stb_vorbis crash in two LLM iterations (no fuzzer); a likely-invariant
    filter from three Matroska seeds eliminates 13.2% of the FFmpeg-demuxer feasible
    set.'
  venue: arXiv (Cornell University)
- title: 'Code-Augur: Agentic Vulnerability Detection via Specification Inference'
  date: 2026-06
  url: https://arxiv.org/abs/2606.18619
  category: runtime
  subcategory: ''
  authors:
  - Zhengxiong Luo
  - Mehtab Zafar
  - Dylan Wolff
  abstract: The advent of agentic vulnerability detection is already becoming a watershed
    moment for software security. Audits conducted entirely by autonomous LLM agents
    are uncovering critical vulnerabilities in fundamental software underpinning digital
    society. Many of these vulnerabilities remained masked for years, surfacing only
    now with AI agents. Yet the reasoning behind these discoveries remains alarmingly
    opaque and unvalidated. What assumptions did the agent make about a function's
    inputs when it deemed that function to be secure? Failures in reasoning and incorrect
    assumptions can lead to missed vulnerabilities and reduce trust in agentic analysis.
    We propose a security-specification-first paradigm that (1) exposes the agent's
    tacit assumptions explicitly as security specifications and (2) continuously refines
    those specifications via runtime falsification. We realize our approach in Code-Augur,
    a novel harness for agentic vulnerability detection. Given a codebase, Code-Augur
    analyzes each component of the system for vulnerable code. When it deems a component
    to be secure, it commits the local invariants behind that judgment as in-source
    assertions. In parallel, Code-Augur leverages a guided fuzzer to attempt to falsify
    those assumptions. When the fuzzer triggers an assertion, this either reveals
    a genuine vulnerability or a flawed specification to refine. In both cases, this
    process grounds the agent's understanding, aligning its view of code intent with
    how the code actually behaves. On real-world subjects, Code-Augur effectively
    leverages security specifications to detect more vulnerabilities than other state-of-the-art
    agents. Additionally, Code-Augur found 22 new vulnerabilities in key open-source
    projects. Compared to curated specialized models like Claude Mythos, Code-Augur
    offers effective agentic vulnerability detection built on widely available LLMs
    like Sonnet and DeepSeek.
  venue: arXiv (Cornell University)
- title: 'ExpVoyager: Direct Experience Navigation for Dynamic Agent Skill Synthesis'
  date: 2026-09
  url: https://arxiv.org/abs/2609.32630
  category: runtime
  subcategory: ''
  authors:
  - Kwangwook Seo
  - Dongha Lee
  abstract: Learning from experience in LLM agents has become a key paradigm for developing
    self-evolving agents that continuously learn and expand their capabilities. Within
    this paradigm, synthesizing the agent skill has emerged as a promising solution
    for transforming accumulated experience into reusable procedural knowledge, serving
    as an important layer for the harness system that supplies agents at runtime.
    Despite its potential, existing approaches largely abstract past experience into
    fixed procedural knowledge before downstream demands are known, which risks discarding
    knowledge that later becomes critical while retaining instance-specific details
    irrelevant to future tasks. In this paper, we reframe agent skill synthesis as
    a dynamic navigation problem over past experience, where agents actively explore
    accumulated trajectories on demand for the current task with targeted and fine-grained
    access to experience knowledge. To this end, we propose ExpVoyager, a novel framework
    in which a skill curator navigates raw experience across different views and resolutions,
    continually identifying reusable procedural knowledge from what it observes while
    tracking remaining knowledge needs that guide where to navigate next. Extensive
    experiments demonstrate both the effectiveness and versatility of ExpVoyager,
    showing consistent improvements in downstream task performance, continual gains
    as the experience space scales, and practical compatibility with existing skills
    under efficient experience access.
  venue: arXiv (Cornell University)
- title: Continuous Process-Level Evaluation for Evolving Enterprise AI Agent Skills
  date: 2026-10
  url: https://arxiv.org/abs/2610.01833
  category: runtime
  subcategory: ''
  authors:
  - Ngoc Phuoc An Vo
  - Aarya Mayurpalsingh Doshi
  - Vadim Sheinin
  abstract: 'Enterprise AI agent skills evolve as tool APIs, models, and specifications
    change, yet final-output evaluation can miss process-level behavioral drift. We
    present a continuous evaluation framework combining outcome-level and process-level
    checks, applied to Revenue and Productivity variants of a Business Value Determination
    skill in an enterprise Value Aware Resiliency system. The framework independently
    computes per-run ground truth, materializes reusable template tests, and evaluates
    tool selection, arguments, execution order, and database integrity through programmatic
    checks and a narrowly scoped LLM judge. We evaluate 240 trials across two skills,
    two specification variants, two agent harnesses, and three models. Of 175 trials
    passing all applicable final numerical checks, 162 (92.6 percent; Wilson 95 percent
    CI: 87.7-95.6 percent) contained another evaluator-detected deviation. Under a
    broader seven-check final-state definition, 151 of 164 passing runs (92.1 percent;
    95 percent CI: 86.9-95.3 percent) still violated a trajectory check. Dependency
    attribution reduced a mean of 6.34 failed checks per run to 2.65 roots. Specification
    sensitivity varied by model and harness, with exploratory bootstrap interaction
    intervals excluding zero for all three Revenue comparisons and one of three Productivity
    comparisons. Runtime-resolved templates provided reusable regression coverage
    across the evaluated configurations; longitudinal validation under actual API
    evolution remains future work.'
  venue: arXiv (Cornell University)
- title: 'Mnemosyne: Agentic Transaction Processing for Validating and Repairing AI-generated
    Workflows'
  date: 2026-06
  url: https://arxiv.org/abs/2607.00269
  category: runtime
  subcategory: ''
  authors:
  - Edward Y. Chang
  - Longling Geng
  abstract: 'LLMs increasingly generate workflow actions and repairs that may be well
    formed yet stale, infeasible, conflicting, or destructive of their own evidence.
    We introduce Agentic Transaction Processing (ATP), which treats generated actions
    as untrusted proposals until deterministic admission accepts them under an executable
    constraint set C. Its two-sided principle is: a proposal is not truth, and no
    proposal foresees every disruption. Anything may propose, but only the runtime
    admits and commits; unforeseen disruptions trigger bounded reactive repair whose
    output re-enters admission. Mnemosyne realizes ATP with an append-only transition
    log, effective-state projection, dependency-safe compensation, and active contract
    records. Under stated assumptions and relative to C, we prove four safety properties
    (authority separation, serial-equivalent generative admission, evidence-preserving
    repair, and obligation containment) and establish bounded reactive repair. Across
    nine safety benchmarks and a four-case Temporal SDK comparison, ATP rejects every
    targeted violation while admitting valid work. A matched data-size sweep measures
    5.2-6.6% incremental throughput cost over the same local durable commit path and
    exposes local saturation. In a companion scheduling harness, local repair edits
    nearly an order of magnitude fewer operations than global recompute; a 12-scenario
    interruption stress test rejects every stale recovery candidate without losing
    observations or producing invalid commits. Two bounded pilots route 80 proposals
    from four heterogeneous LLMs through the same gate with zero invalid commits;
    24 of 40 mid-execution proposals are admitted and 16 are rejected, including four
    explicit safety rejections.'
  venue: arXiv (Cornell University)
- title: 'SIGIL: Construction-Level Security for Agent-Authored Code'
  date: 2026-07
  url: https://doi.org/10.5281/zenodo.21699304
  category: runtime
  subcategory: ''
  authors:
  - Nigel Robinson
  abstract: 'Large language model (LLM) agents increasingly write, compile, execute,
    and revise software inside systems that also hold files, credentials, and network
    authority. In that setting, security cannot depend on human review, external sandboxes,
    or post-hoc filtering alone: those mechanisms treat generated code as an opaque
    payload after the agent has already expressed authority, control flow, and data
    movement in an ambient language. We present SIGIL, a capability-secure programming
    language and verification pipeline designed for code whose primary author is an
    LLM. This paper''s evaluation concentrates on the ephemeral agent-authored tool:
    the program an agent writes, runs once, and discards, which is both the most immediate
    deployment surface and the tightest security envelope. SIGIL layers construction-level
    security on top of runtime containment: programs still run inside fresh Wasmtime
    stores with fuel and explicit grants, but authority, effects, taint labels, ring
    boundaries, and solver-backed proof obligations are visible in source and checked
    before bytecode exists. The language combines linear capability types, declared
    effect rows, information-flow taint tracking, two-ring WebAssembly isolation,
    deterministic certificates, and bounded SMT checks over decidable quantifier-free
    bitvector and linear integer arithmetic fragments. We evaluate the system with
    67 adversarial security cases across 9 documented categories, 10 mechanically-checked
    CVE retrofits, 214 tools/ programs, 24,699 nonblank lines of SIGIL-authored compiler
    stages composed into a self-hosted driver whose code-generation path recompiles
    the compiler''s own source to WebAssembly byte-identical to the Rust reference
    (a self-hosting fixed point), differentially tested against the Rust oracle, and
    compile-throughput measurements: Z3-heavy fixtures verify in 5-8 ms median time
    - interactive latency for an agent compile-feedback loop. A mechanized formalization
    in Lean 4 (lambda-SIGIL) - 160 theorems across 19 modules, with zero sorry and
    only standard axioms - proves type soundness, capability safety, effect-row confinement
    and checking, ring isolation, affine ownership, and information-flow taint sink-safety
    (a noninterference-style trace property). In a live agentic harness, frontier
    models with no SIGIL in their training data converge on working, verified tools
    guided only by structured compiler diagnostics: the two strongest models reach
    86% and 74% compile success with 95% and 89% all-input behavioral correctness
    among compiled cells, and compile success across seven models from four vendors
    spans 6-86%, tracking grammar internalization rather than vendor or security-model
    friction. These results establish feasibility: construction-level security is
    practical for interactive agent compile-feedback loops today, without treating
    runtime containment as obsolete - and the compiler''s typed diagnostic surface
    doubles as a training signal for models that write SIGIL natively, which we identify
    as the next step.'
  venue: Zenodo (CERN European Organization for Nuclear Research)
- title: 'Large Language Models for Cybersecurity: A Survey of Data, Training, Models,
    Agent Systems, Evaluation, and Applications'
  date: 2026-10
  url: https://doi.org/10.20944/preprints202610.2235.v1
  category: runtime
  subcategory: ''
  authors:
  - Fasheng Miao
  - Yuanda Wang
  - Zhaoyu Hu
  abstract: 'Advances in language understanding, code reasoning, and tool use are
    enabling cybersecurity agents to progress from question answering and single-step
    analysis to vulnerability research, incident investigation, and multistage task
    execution. These tasks require models to gather information, adapt their strategies,
    and verify results through sustained interaction, making capability development
    increasingly dependent on data, training, and runtime mechanisms. This survey
    examines research on Large Language Models (LLMs) for cybersecurity across six
    dimensions: data, training, models, agent systems, evaluation, and applications.
    We first examine how security corpora, instruction examples, interaction trajectories,
    and preference data are constructed, and how executable environments support training
    and validation. We then compare domain-adaptive continued pretraining, supervised
    fine-tuning, preference optimization, agentic reinforcement learning, and distillation;
    analyze the capabilities of security-specialized and general-purpose models; and
    review mechanisms for planning, tool use, memory management, coordination, and
    verification. Drawing on representative benchmarks and experimental results, we
    assess progress and identify major bottlenecks across applications in threat intelligence,
    vulnerability analysis and remediation, malware analysis, security operations,
    and digital forensics. Based on this systematic review and analysis, we argue
    that cybersecurity LLMs are progressing from acquiring domain knowledge to learning
    how to perform interactive tasks. High-quality security data supports domain learning
    and task-specific supervision. Executable environments extend this training to
    multistep analysis and tool use, with outcome feedback guiding strategy refinement.
    Task quality and cost depend on both the model and its harness: the model reasons
    and selects actions, while the harness organizes information, tools, and execution
    state. Improvements in vulnerability discovery and threat analysis must also support
    effective remediation and timely response to yield lasting security benefits.
    Future research should develop agentic training and model–harness co-optimization
    methods that use validated attack–defense interactions to support continual improvement.
    Learning from operational tasks could further extend model capabilities and their
    contribution to cybersecurity practice.'
  venue: Preprints.org
- title: A Human-in-the-Loop Autonomous Agent for Industry Time Series Forecasting
  date: 2026-09
  url: https://arxiv.org/abs/2608.30976
  category: runtime
  subcategory: ''
  authors:
  - Xiaoyu Tao
  - Mingyue Cheng
  - Ze Guo
  abstract: 'Real-world time-series forecasting is rarely a oneshot model invocation:
    practitioners must formulate tasks, connect data and models, incorporate domain
    expertise, assess prediction plausibility, and communicate uncertainty. Specialized
    forecasting models provide strong numerical predictions but usually operate in
    fixed pipelines, while general-purpose large language model (LLM) agents often
    lack forecastingspecific checks, constraints, and stopping rules. We present CastClaw,
    a human-in-the-loop autonomous forecasting system built through forecasting-oriented
    harness engineering. CastClaw connects data, specialized models, analytical tools,
    user input, and a versioned execution record in one runtime. Users specify the
    target, horizon, constraints, and hypotheses in natural language. Starting from
    a supplied or model-generated forecast, CastClaw checks temporal patterns and
    user constraints; when evidence is missing, it retrieves context, runs an analysis
    or another model, or asks the user. It then keeps, revises, or escalates the result
    under explicit stopping conditions. The output contains the final forecast and
    an execution report recording inputs, evidence, actions, and revisions. In this
    five-dataset electricityprice setting, CastClaw reports the lowest point-estimate
    MSE and MAE among 16 baselines. A Nord Pool case demonstrates the inspectable
    workflow. CastClaw was also validated offline on provincial electricity-load data
    from North China covering January–June 2026.'
  venue: Preprints.org
- title: 'Pratyakṣa: A Context-Engineering System for Long-Context, Hallucination-Resistant
    Agentic AI'
  date: 2026-02
  url: https://doi.org/10.5281/zenodo.19653012
  category: runtime
  subcategory: ''
  authors:
  - Sharath Sathish
  abstract: 'We present Pratyakṣa, a context-engineering system for long-context,
    hallucination-resistant agentic AI, packaged as a Claude-Code- and Cursor-compatible
    plugin (15 Model Context Protocol [MCP] tools, 3 skills, 3 agents, 4 commands,
    3 lifecycle hooks). The system operationalises seven constructs drawn from classical
    In- dian epistemology — specifically from Nyāya–Vaiśeṣika, Advaita Vedānta, Pūrva
    Mīmāṃsā, and Sāṃkhya — into runtime mechanisms for an LLM agent’s working context:
    pratyakṣa (direct perception), avacchedaka (typed limitor conditions), bādha (sublation),
    buddhi/manas (judging vs. attending faculties), sākṣī (witness invariants), khyātivāda
    (a six-class taxonomy of cognitive error), and adaptive forgetting. We validate
    across three orthogonal evidence layers: (L1) seven preregistered hypotheses (H1–H7)
    on six public long-context and hallucination bench- marks (RULER, HELMET, NoCha,
    HaluEval, TruthfulQA, FACTS-Grounding) with multi-seed multi-model paired permutation
    tests; (L2) a deterministic, reproducible live case study (P6-B) on three real
    GitHub issues spanning Django, Requests, and pandas; and (L3) a head-to-head A/B
    test on 120 SWE-bench Verified instances (P6-C, 720 paired runs across 2 models
    × 3 seeds × 120 issues) under a fixed 512-token research-block budget. SWE-bench
    Verified instantiates the harness on one challenging coding domain; the mechanisms
    themselves are agent- and domain-agnostic and the L1 evidence is the general claim.
    Across 10 quantitative studies, the system produces a Stouffer-combined 𝑍= 9.114
    (two-sided 𝑝 = 7.94 × 10−20), with mean per-study delta +0.476 in the harness’s
    favour and a 100% target-path-hit rate on SWE-bench Verified versus 50.3% for
    the budgeted baseline. The khyātivāda 6-class hallucination annotator achieves
    Cohen’s 𝜅 = 0.736 (“substantial”) on 𝑛 = 3,000 jointly annotated examples. The
    contribution is not a new model architecture but a typed, witness-tracked, sublation-
    aware context discipline that any LLM-based agent — research assistants, document
    QA, multi-tool orchestrators, code-review agents — can adopt today via a drop-in
    plugin. The system, the plugin, and the full reproducibility manifest are open-sourced.'
  venue: Zenodo (CERN European Organization for Nuclear Research)
- title: 'Trace2Skill: Verifier-Guided Skill Evolution for Long-Context EDA Agents'
  date: 2026-05
  url: https://arxiv.org/abs/2605.21810
  category: runtime
  subcategory: ''
  authors:
  - Zijian Du
  - Nathaniel Pinckney
  abstract: Complex Verilog Design Problems (CVDP) challenge hardware LLM agents because
    solving them requires localizing verifier-relevant RTL, testbenches, include paths,
    and build dependencies inside large repository snapshots, making precise edits,
    and recovering from sparse hidden-verifier failures. We present Trace2Skill, a
    test-time scaling framework that improves a hardware agent without RTL-specialized
    model fine-tuning. Rather than training a new model or only sampling more candidate
    solutions, Trace2Skill treats the agent's natural-language skill as an evolvable
    policy. It mines repeated rollout traces for success and failure modes, converts
    them into dense diagnostics and oracle lessons, and uses an oracle, mutator, and
    selector loop to produce task-specific skills that guide later search, editing,
    validation, and recovery. Because final pass/fail labels are often too coarse
    for hard failures, Trace2Skill also supports bounded runtime dense verifier feedback
    that returns sanitized functional observations while keeping hidden harnesses
    and reference solutions inaccessible to the agent. This feedback helps guide skill
    evolution and agent execution by connecting skill text, verifier evidence, and
    downstream behavior. Across hard CVDP tasks that defeat the seed CVDP agent, including
    tasks that also defeat frontier coding agents, Trace2Skill with dense verifier
    feedback substantially improves task pass rates and produces breakthrough passes
    on previously unsolved tasks, without requiring high-quality fine-tuning data,
    specialized RTL model training, or model weight updates. The same framework provides
    a general test-time scaling strategy that can extend beyond digital design to
    other verifiable EDA tasks.
  venue: arXiv (Cornell University)
- title: 'ReFold: Training-Free Reversible Inter-Turn Context Folding for Long-Horizon
    Agents'
  date: 2026-10
  url: https://arxiv.org/abs/2610.07863
  category: runtime
  subcategory: ''
  authors:
  - Yupeng Su
  - Jiayi Tian
  - Zheng Zhang
  abstract: 'Long-horizon LLM agents act on an append-only interaction history that
    is re-sent to the model at every step, so the context and its cost grow with steps
    until the sessions exceed the context window. Existing methods manage the context
    through context requirement prediction, relying on additional model calls, heuristic
    rules, or trained policies. However, these predictive approaches introduce runtime
    overhead, invalidate prefix caches, and permanently discard content with no guarantee
    of recovery. To overcome these limitations, we introduce ReFold: a training-free
    rendering layer that preserves the underlying interaction history while compressing
    only the model''s rendered context. It removes two kinds of inter-turn redundancy
    without an auxiliary predictor: content an earlier turn already displayed, replaced
    by a stub, and turns the agent itself reports finished, folded into a one-line
    note. Both operators use chunked rendering, rewriting the cached prefix once every
    few steps rather than at every step. Every removal is strictly reversible, a wrong
    removal costs one restore from the history rather than permanent content loss.
    Because it operates at the rendering layer, ReFold is plug-and-play across standard
    ReAct-style harnesses. Evaluations across five long-horizon benchmarks and two
    frontier LLMs demonstrate that ReFold reduces token consumption by up to 2.5x
    and halves the KV-cache memory per session without degrading task success rates.
    Under capped context budgets, it avoids up to 92% of forced compactions. Under
    concurrent serving workloads, it reduces request queuing delays by up to 100%,
    accelerating inference by up to 1.7x, while cutting inference costs by up to 3.4x.'
  venue: arXiv (Cornell University)
- title: 'LLM4VC: Harnessing Large Language Models for Virtual Commissioning of IEC
    61499 Automation Systems'
  date: 2025-06
  url: https://doi.org/10.1109/isie62713.2025.11124673
  category: runtime
  subcategory: ''
  authors:
  - Tuojian Lyu
  - Udayanto Dwi Atmojo
  - Valeriy V. Vyatkin
  abstract: 'This paper addresses a critical deficiency of virtual commissioning systems
    developed for industrial automation: they lack the ability to analyze the avalanche
    of generated events and recognize faulty situations in them efficiently. The solution,
    called LLM4VC, is a cloud-based pipeline that turns a large language model into
    an LLM-based Validation Agent (LVA). It is an autonomous program that ingests
    human-centred specifications and produces pass/fail verdicts for distributed IEC
    61499 systems automatically during testing. The agent''s knowledge is derived
    from user-approved artifacts: the Sequence of Operations (SOO) and the Cause-&-Effect
    matrix (C&E), and users'' prompts. A lightweight parser plus GPT models prompts
    converts these materials into a Machine-Readable Expected Behavior (MREB), which
    is a JSON document enriched with timing requirements and interlock rules. A Python
    script streams normalized runtime logs from mul-tiple SoftPLC containers. At run
    time the LVA uses MREB and SoftPLC logs to generate a structured verdict together
    with a human-readable description. We demonstrate LLM4VC on a four-controller
    conveyor and jack system containing manually injected fault scenarios. The agent
    analyses about 12 000 log lines in around 38 s per test, identifies most of the
    injected faults and produces traceable explanations suitable for factory acceptance
    reports without manual intervention or hard-coded rules.'
  venue: IEEE International Symposium on Industrial Electronics (ISIE)
- title: Synthesizing Executable Specifications to Improve AI Programming Agents
  date: 2026-05
  url: https://escholarship.org/uc/item/6804w8cz
  category: runtime
  subcategory: ''
  authors:
  - Naman Jain
  abstract: 'Modern large language models are trained on large corpora of static source
    code but receive limited supervision about how that code behaves at run time.
    This gap surfaces at every stage of the AI programming stack: benchmarks that
    grade with weak or missing tests, training pipelines bounded by signals that never
    execute the candidate code, and inference-time verifiers that select for textual
    plausibility rather than execution evidence.This dissertation studies how to synthesize
    and exploit executable specifications: runnable artifacts that expose program
    behavior to an automated system. In this thesis, they take three main forms: tests
    and input generators, performance harnesses, and dynamic-analysis annotations.
    Once these artifacts can be generated from problems, repositories, or executions,
    they make behavior quantitatively measurable: agents can be evaluated by running
    candidate programs and comparing the observed behavior against the specified behavior.
    The same mechanism is useful not only for evaluation, but also for constructing
    training data and guiding inference. The chapters follow this idea across three
    settings (evaluation, training, and agent design), one for each of the three parts
    of this dissertation.Part I studies synthesized executable specifications for
    evaluation. In LiveCodeBench, the specification is an input generator paired with
    a reference solution: new tests can be sampled for each live-contest problem,
    making evaluation less dependent on static benchmark instances. In R2E, an LLM
    and static-analysis context synthesize repository-level equivalence harnesses
    that run a candidate function against the original implementation inside its GitHub
    context. In GSO, the specification adds a timed workload to the correctness harness,
    turning optimization into a continuous executable check on which evaluated agents
    score below 5% at a speedup threshold calibrated against expert optimization commits
    in real-world open-source codebases.Part II uses synthesized executable specifications
    as training signal: as rejection sampling filters, as behavior-preservation constraints,
    and as rewards. In R2E-Gym, executable fail-to-pass tests are paired with synthesized
    issue descriptions to create a procedurally curated training environment, and
    supervised fine-tuning on the resulting trajectories yields 34.4% Pass@1 on SWE-Bench-Verified,
    a +13 8-point gain over SWE-Gym at matched model scale. Test suites can also constrain
    training-data cleaning: candidate rewrites are accepted only if they preserve
    behavior under the original tests, matching full-dataset performance with 15%
    of the cleaned data. DeepSWE trains an agent end-to-end using the test suite as
    the only reinforcement-learning reward, reaching 42.2% Pass@1 and, with hybrid
    test-time scaling, 59% Best@16.Part III uses executable specifications at inference
    time. One verifier scores sampled patches by running synthesized reproduction
    tests, while another scores whole agent trajectories without execution. Individually,
    these verifiers reach 43.7% and 42.8% Best@26 on SWE-Bench-Verified; together,
    their hybrid reaches 51.0%. Syzygy synthesizes specifications at a finer granularity:
    top-level executions are mined into per-function equivalence tests and LLVM-derived
    dynamic-analysis annotations, which guide each step of a long-horizon C-to-Rust
    translation. This translates Google’s Zopfli compression library (3,000 lines
    of C) into compilation-safe Rust, validated against the original over 1,000,000
    equivalence inputs.Across these settings, executable specifications provide a
    common way to turn execution into objective feedback for evaluation, training,
    and inference, and a unifying lens on AI programming agents that close the gap
    between static source code and runtime behavior.'
  venue: eScholarship (California Digital Library)
- title: 'Agent-System Interface Designs for Enterprise Applications: A Comparative
    Empirical Study'
  date: 2026-06
  url: https://aaltodoc.aalto.fi/handle/123456789/147169
  category: runtime
  subcategory: ''
  authors:
  - Alexander Nygård
  abstract: 'Although large language model (LLM) agents reason effectively, their
    practical value in enterprise settings is often limited by how they interface
    with target software. This thesis studies the agent harness (the non-model infrastructure
    handling actions, documentation, state placement, observations, and error feedback)
    as a performance-bearing architectural variable. We evaluate three harness designs
    using a shared, seeded local deployment of Ardoq, an enterprise architecture platform:
    traditional tool calling (H1), programmatic tool calling (H2) via sandboxed Python
    execution, and an agent-native domain module (H3) that raises the abstraction
    level over the same execution runtime. The evaluation benchmark consists of 24
    read-only analytical tasks based on recurring enterprise architecture workflows.
    Each task defines a typed output contract verified objectively in real time against
    the deployment''s live Ardoq API. Seven repeated runs per task-harness combination
    yield 504 evaluation runs. Shifting from traditional tool calling to programmatic
    execution (H1 to H2) removes a major state-coordination bottleneck. H2 increases
    the mean task success rate from 39.29 percent to 91.67 percent (+52.4 pp). It
    also reduces mean total tokens by 66 percent, the final context window by 45 percent,
    and estimated model cost per run by 48 percent. The largest gains concentrate
    on graph traversal, metamodel analysis, set construction, and cross-source composition;
    on these tasks, H1 typically fails either by exhausting its turn or time budget
    as context accumulates or by returning over-inclusive answers. Raising the abstraction
    level (H2 to H3) largely preserves correctness while further improving operational
    efficiency. H3''s exact pass rate is 91.07 percent, only 0.60 percentage points
    below H2, with no median per-task difference. It reduces mean total tokens by
    18.9 percent, the final context window by 10.3 percent, per-task model cost by
    15.2 percent, and wall-clock latency is 11.5 percent lower. One possible reason
    for H3''s slightly lower success rate is that its domain-tailored interface exposes
    less exploratory data, which saves tokens but may also limit the agent''s ability
    and inclination to explore when needed. The findings support programmatic tool
    calling as the default for compositional enterprise workflows when code execution
    is operationally viable. Traditional tool calling remains sufficient for narrow
    report-based tasks. High-level domain modules are a selective trade-off, justified
    when stable, recurring workflows warrant the governance and maintenance costs
    of the abstraction. These conclusions are limited to one frontier model, one seeded
    Ardoq deployment, and read-only analytical tasks.'
  venue: Aaltodoc (Aalto University)
- title: 'BeVerA-KG: Behaviour-Driven Design-Time Verification of Neuro-Symbolic Agents
    via Knowledge Graphs for Trustworthy Humanitarian Edge Systems'
  date: 2026-09
  url: https://git.l3s.uni-hannover.de/behailu.getachew/bevera-kg-v1.1.0.git
  category: runtime
  subcategory: ''
  authors:
  - Behailu Getachew Wolde
  abstract: Runtime guardrails for LLM agents enforce safety per individual action
    at execution time, but fail to verify the reachable state space before deployment.
    We present BeVerA-KG, a behaviour-driven framework that shifts verification to
    design time. Stakeholder-authored Gherkin scenarios are deterministically compiled
    into OWL 2 DL disjointness axioms (HermiT-verified for schema consistency) and
    paired with SPARQL 1.1 ASK guards for runtime defence-in-depth. The composed agent
    model is statistically analyzed as a priced timed automaton via UPPAAL statistical
    model checking (≥26,500 Monte Carlo runs, providing ≥ 0.99 confidence with ≤ 0.01
    error per the Chernoff-Hoeffding bound), and re-verified post-quantization to
    ensure safety invariants survive deployment on ultra-constrained humanitarian
    edge hardware (<150 MB footprint, <200 ms latency for the symbolic engine). We
    formalise the statistical assurance as Pr[ϕ(s)∧♦ψ(s)] ≥ 0.99 over reachable states
    providing broader pre-deployment assurance than per-action enforcement alone and
    contribute a twelve-scenario guardrail suite grounded in field census data, a
    machine-auditable test harness, and an open-source compliance pipeline.
