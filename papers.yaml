- title: COMPOSITE-Stem
  date: 2026-04
  url: https://arxiv.org/abs/2604.09836
  category: runtime
  subcategory: systems
  authors: []
  venue: ''
  code_url: ''
  project_url: ''
  abstract: AI agents hold growing promise for accelerating scientific discovery;
    yet, a lack of frontier evaluations hinders adoption into real workflows. Expert-written
    benchmarks have proven effective at measuring AI reasoning, but most at this stage
    have become saturated and only measure performance on constrained outputs. To
    help address this gap, we introduce COMPOSITE-STEM, a benchmark of 70 expert-written
    tasks in physics, biology, chemistry, and mathematics, curated by doctoral-level
    researchers. Our benchmark combines exact-match grading and criterion-based rubrics
    with an LLM-as-a-jury grading protocol, allowing more flexible assessment of scientifically
    meaningful outputs. Using an adapted multimodal Terminus-2 agent harness within
    the Harbor agentic evaluation framework, we evaluate four frontier models. The
    top-performing model achieves 21%, demonstrating that COMPOSITE-STEM captures
    capabilities beyond current agent reach. All tasks are open-sourced with contributor
    permission to support reproducibility and to promote additional research towards
    AI's acceleration of scientific progress in these domains.
