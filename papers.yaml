  - auto-systems
- title: 'LeanMarathon: Toward Reliable AI Co-Mathematicians through Long-Horizon
    Lean Autoformalization'
  date: 2026-06
  url: https://arxiv.org/abs/2606.05400
  category: runtime
  subcategory: systems
  authors: []
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Long-horizon autoformalization of research mathematics fails not only
    at hard lemmas, but at scale: statements drift, dependencies tangle, context decays,
    and local repairs corrupt distant work. We present LeanMarathon, a multi-agent
    harness for reliable research-level Lean autoformalization. Its core abstraction
    is an evolving blueprint: a Lean file that serves simultaneously as formal proof
    skeleton, natural-language proof graph, and shared system of record. Four contract-scoped
    agents construct, audit, prove, and repair this blueprint. These agents are coordinated
    by a two-stage orchestrator that first stabilizes target fidelity through adversarial
    review and then discharges the proof directed acyclic graph (DAG) from its dynamic
    leaves upward in parallel CI-gated rounds. LeanMarathon turns one brittle multi-hour
    run into many local, recoverable, parallel transactions. We evaluate LeanMarathon
    on two recent research papers spanning four Erdős problems (#1051, #1196, #164,
    #1217). Across three autonomous runs, it formalizes all seven target theorems
    with no sorry, proving 258 lemmas and theorems. These results show that reliable
    AI co-mathematics requires not only stronger provers, but durable harnesses that
    preserve target fidelity across long mathematical developments. The code can be
    found at https://github.com/YuanheZ/LeanMarathon.'
  tags:
  - auto-runtime
  - auto-systems
- title: 'Syll: Open-Source Personal Automation with Cross-Surface Execution'
  date: 2026-05
  url: https://arxiv.org/abs/2606.07594
  category: runtime
  subcategory: systems
  authors: []
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Personal AI agents must increasingly operate across APIs, shells, web
    surfaces, and desktop GUIs, yet many systems remain tuned to a single interface
    and offer limited support for user teaching and auditability. We present Syll,
    an open-source, self-hosted multimodal agent harness that unifies MCP/API tools,
    CLI execution, and visual GUI control in a modular runtime, enabling agents to
    coordinate computer use across heterogeneous interfaces while streamlining how
    users and agents exchange information. At the core of Syll is a bidirectional
    user-agent interaction layer: users teach procedures through direct demonstration,
    which Syll compiles into reusable skills; agent execution is translated back into
    multimodal evidence -- logs, keyframes, and approval checkpoints -- for inspection
    and control. Syll further externalizes memory, skills, routines, and governance
    as editable local artifacts, supporting straightforward inspection, extension,
    and downstream development. Our implementation has been validated on production
    desktop applications including Adobe Photoshop, Adobe Audition, Stardew Valley,
    macOS Finder and others. We report mechanism-oriented studies that validate multimodal
    routing, teachable GUI replay, and persistent local artifacts. We hope Syll can
    serve as a practical open-source foundation for personal automation that users
    can teach, inspect, and continuously extend.'
  tags:
  - auto-runtime
  - auto-systems
- title: Learning Agentic Time Series Forecasting via Trajectory Distillation and
    Memory-Based Reinforcement Learning
  date: 2026-02
  url: https://arxiv.org/abs/2602.13802
  category: runtime
  subcategory: systems
  authors: []
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Recent agentic time series forecasting (TSF) approaches use large language
    models (LLMs) to autonomously orchestrate analytical and forecasting tools and
    reason about temporal patterns using the resulting evidence. However, many such
    approaches rely on powerful LLMs in training-free, prompt-driven workflows, leaving
    open whether smaller models can learn these interaction and reasoning capabilities.
    In this paper, we introduce Cast-R1, an 8Bparameter agentic forecasting model
    trained through trajectory distillation and multi-turn reinforcement learning
    with structured memory. First, we develop a forecasting agent harness with specialized
    analysis and prediction tools to generate multi-turn interaction trajectories
    using a teacher LLM, which are subsequently evaluated and selected for supervised
    fine-tuning. Second, we apply group relative policy optimization (GRPO) across
    multi-turn forecasting episodes, with structured memory preserving diagnostic
    evidence and intermediate forecasts for state construction. Rewards based on prediction
    accuracy and temporal structure guide tool selection, model routing, and forecast
    refinement. A difficulty-aware curriculum combines sample filtering and progressive
    sample ordering during training. Extensive experiments on multiple datasets demonstrate
    the effectiveness of Cast-R1. These findings highlight the potential of forecasting-specific
    post-training to equip smaller LLMs with multi-turn, tool-augmented forecasting
    capabilities within structured workflows.
  tags:
  - auto-runtime
  - auto-systems
- title: 'HARBOR: Automated Harness Optimization'
  date: 2026-04
  url: https://arxiv.org/abs/2604.20938
  category: runtime
  subcategory: systems
  authors: []
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Long-horizon language-model agents are dominated, in lines of code and
    in operational complexity, not by their underlying model but by the harness that
    wraps it: context compaction, tool caching, semantic memory, trajectory reuse,
    speculative tool prediction, and the glue that binds the model to a sandboxed
    execution environment. We argue that harness design is a first-class machine-learning
    problem and that automated configuration search dominates manual stacking once
    the flag space exceeds a handful of bits. We defend this claim in two steps. First,
    we formalize automated harness optimization as constrained noisy Bayesian optimization
    over a mixed-variable, cost-heterogeneous configuration space with cold-start-corrected
    rewards and a posterior chance-constrained safety check, and give a reference
    solver, HARBOR (Harness Axis-aligned Regularized Bayesian Optimization Routine),
    built from a block-additive SAAS surrogate, multi-fidelity cost-aware acquisition,
    and TuRBO trust regions. Second, we instantiate the problem in a flag-gated harness
    over a production coding agent and report a controlled four-round manual-tuning
    case study against a fixed task suite and an end-to-end HARBOR run. The formulation
    itself is task-class agnostic: the configuration space, reward correction, acquisition,
    and safety check apply to any agent harness with a bounded flag space and a reproducible
    task suite.'
  tags:
  - auto-runtime
  - auto-systems
- title: 'Lies We Can See: Joint Verbal and Non-Verbal Deception by VLM Agents in
    Embodied Social Interactions'
  date: 2026-08
  url: https://arxiv.org/abs/2608.30428
  category: runtime
  subcategory: systems
  authors: []
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Strategic deception by LLM and VLM agents has emerged as a central AI
    alignment and safety concern. Social-deduction games (where each player holds
    a hidden role and communicates with others to deduce identities) serve as the
    canonical testbed, particularly in multi-agent settings. Existing testbeds, however,
    are text-only and run on a single fixed agent configuration, missing the non-verbal
    sensorimotor channels treated as core by deception taxonomies and leaving it ambiguous
    whether an observed behavior reflects the underlying model or the surrounding
    harness. We introduce MineAmongUs, a 3D multimodal Among Us sandbox where imposter
    agents must deceive crewmates through joint verbal and non-verbal action. We also
    propose ARIA, a configurable VLM-agent harness that exposes five cognitive-component
    ablation axes; and an atom- and arc-level annotation scheme grounded in deception
    taxonomies and operationalized at scale by an LLM-as-a-Judge reaching near-human
    atom-labeling agreement. Empirical results show that VLM agents pursue imposter
    wins through joint verbal and non-verbal deception, with non-verbal channels emerging
    as the more decisive winning contributors across both harness ablation and cross-VLM
    evaluation. Taken together, our work opens a new path for embodied VLM-agent alignment
    research.
  tags:
  - auto-runtime
  - auto-systems
- title: 'SWE-VERIFIER: Selective Verification for Cost-Efficient Coding Agents'
  date: 2026-10
  url: https://arxiv.org/abs/2610.30284
  category: runtime
  subcategory: systems
  authors: []
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Coding agents spend substantial computation generating actions and processing
    long interaction histories. Poor action choices can steer agents into low-value
    states, wasting computation and increasing API costs. Sampling and verifying alternative
    actions can improve the agent's decisions, but applying this procedure at every
    step adds substantial overhead. We introduce SWE-Verifier, a lightweight generative
    model that selectively triggers candidate sampling and verification. It scores
    the coding agent's proposed action to determine when additional candidate sampling
    is needed, then ranks the resulting actions before execution. We train SWE-Verifier
    from Qwen3.5-4B using preference data that groups contrasting actions with their
    resulting environment observations and rubric-guided teacher scores. Using the
    mini-swe-agent harness, SWE-Verifier improves resolution from 75.47% to 77.20%
    on MiniMax-M2.7 at 1.09 times cost and generalizes to DeepSeek-V4-Flash without
    training on its actions, improving resolution from 72.60% to 74.27% at 1.13 times
    cost. Across both models, SWE-Verifier verifies fewer than 4% of steps and achieves
    comparable or higher resolution than the trajectory and all-step baselines at
    substantially lower cost. These results demonstrate that selective candidate sampling
    and lightweight verification provide complementary gains in coding-agent performance
    and inference efficiency. Our model, code, and data are available at https://github.com/zkjzou/SWE-Verifier.
  tags:
  - auto-runtime
  - auto-systems
- title: 'DynBranch: Speculative Subgraph Reuse for Dynamic Agentic LLM Serving'
  date: 2026-09
  url: https://arxiv.org/abs/2609.31047
  category: runtime
  subcategory: systems
  authors: []
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Agentic LLM workflows decide their execution paths at runtime. Downstream
    computation may be predictable, or may have run before, yet it cannot begin until
    the model or the user resolves the branch. We call this serialization the branch-resolution
    barrier. Caching alone does not hide it: the key that identifies a reusable result
    is not known until then. In this paper, we propose DynBranch, which makes an unresolved
    branch addressable before it resolves. Its stable coordinate lets candidate subgraphs
    run during resolution and completed subgraph results be reused across later requests.
    A two-level controller admits this work when its expected benefit exceeds the
    load price. DynBranch sits at the model-API boundary and requires no changes to
    agent harnesses or model execution engines. Across four agentic workloads with
    Qwen3-32B on 4x H200 GPUs, DynBranch reduces mean latency by up to 32% over each
    workload''s strongest prior system and by 46-66% against a no-reuse floor, while
    preserving workflow results. The benefit persists across backbone families and
    on a commodity Qwen3-8B/RTX 4090 deployment.'
  tags:
  - auto-runtime
  - auto-systems
- title: 'Beyond Token Savings: A Systematic Study of Context Compression in LLM Agents'
  date: 2026-09
  url: https://arxiv.org/abs/2609.32961
  category: runtime
  subcategory: systems
  authors: []
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'As LLM agents tackle longer tasks, they increasingly compress growing
    histories of reasoning, actions, and tool outputs. Compression can reduce token
    use, but it also changes the information available for later decisions. Existing
    agentic harnesses bundle decisions about what to compress, when to compress, and
    how much to remove into fixed policies. A systematic characterization is needed
    to disentangle these decisions and reveal how each affects task success and execution
    cost. We systematically vary these decisions across three open-weight models on
    SWE-bench Verified and Terminal-Bench 1.0. Across nearly 35,000 agent runs, we
    measure task success, token use, end-to-end latency, and estimated cost. We find
    that fewer tokens need not mean faster or cheaper execution: on Terminal-Bench
    with Qwen, policies using roughly one-third as many tokens can take 20-80% longer
    than the uncompressed agent. Policies with similar overall success can solve different
    tasks, while the same policy can perform quite differently across models. Our
    results motivate evaluating compression by its effects on agent execution and
    tailoring policies to the task, model, and workload.'
