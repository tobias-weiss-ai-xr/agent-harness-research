- title: The Limits of Long-Context Reasoning in Automated Bug Fixing
  date: 2026-02
  url: https://arxiv.org/abs/2602.16069
  category: runtime
  subcategory: systems
  authors: []
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Rapidly increasing context lengths have led to the assumption that large
    language models (LLMs) can directly reason over entire codebases. Concurrently,
    recent advances in LLMs have enabled strong performance on software engineering
    benchmarks, particularly when paired with agentic workflows. In this work, we
    systematically evaluate whether current LLMs can reliably perform long-context
    code debugging and patch generation. Using SWE-bench Verified as a controlled
    experimental setting, we first evaluate state-of-the-art models within an agentic
    harness (mini-SWE-agent), where performance improves substantially: GPT-5-nano
    achieves up to a 31\% resolve rate on 100 samples, and open-source models such
    as Deepseek-R1-0528 obtain competitive results. However, token-level analysis
    shows that successful agentic trajectories typically remain under 20k-30k tokens,
    and that longer accumulated contexts correlate with lower success rates, indicating
    that agentic success primarily arises from task decomposition into short-context
    steps rather than effective long-context reasoning. To directly test long-context
    capability, we construct a data pipeline where we artificially inflate the context
    length of the input by placing the relevant files into the context (ensuring perfect
    retrieval recall); we then study single-shot patch generation under genuinely
    long contexts (64k tokens). Despite this setup, performance degrades sharply:
    Qwen3-Coder-30B-A3B achieves only a 7\% resolve rate at 64k context, while GPT-5-nano
    solves none of the tasks. Qualitative analysis reveals systematic failure modes,
    including hallucinated diffs, incorrect file targets, and malformed patch headers.
    Overall, our findings highlight a significant gap between nominal context length
    and usable context capacity in current LLMs, and suggest that existing agentic
    coding benchmarks do not meaningfully evaluate long-context reasoning.'
  tags:
  - auto-runtime
  - auto-systems
- title: 'The Hitchhiker''s Guide to Agentic AI: From Foundations to Systems'
  date: 2026-06
  url: https://arxiv.org/abs/2606.24937
  category: runtime
  subcategory: systems
  authors: []
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'The Hitchhiker''s Guide to Agentic AI is a comprehensive practitioner''s
    reference for building autonomous AI systems, covering the full stack from first
    principles to production deployment. The central thesis: building great agentic
    systems requires understanding every layer of the pipeline, not just one. The
    book opens with the LLM substrate, covering transformer architecture, GPU systems,
    training and fine-tuning (SFT, LoRA, MoE), model compression, and inference optimization,
    as essential foundations. It then develops the alignment and reasoning layer:
    RLHF, PPO, DPO and its variants, GRPO, reward modeling, and RL for large reasoning
    models including chain-of-thought and test-time scaling. The second half is devoted
    to agentic AI proper: agentic training and trajectory-based RL, RAG and Agentic
    RAG, memory systems (in-context, external, episodic, and semantic), agent harness
    design, loop engineering, graph-based orchestration, and a taxonomy of agent design
    patterns covering security, red teaming, and gateway infrastructure. Inter-agent
    coordination is covered in depth: the Model Context Protocol (MCP), agent skills
    and tool use, the Agent-to-Agent (A2A) protocol, and multi-agent architectures
    spanning centralized, decentralized, and hierarchical topologies. The book concludes
    with agent development frameworks, agentic UI design, evaluation methodology (non-deterministic
    evaluation, reasoning collapse, LLM-as-Judge), production deployment, and the
    regulatory environment (EU AI Act, California SB 942) as an engineering requirement.
    Each chapter pairs theory with implementation guidance, executable notebooks,
    and references to the primary literature.'
  tags:
  - auto-runtime
  - auto-systems
- title: 'Harness^2: Recursive Agent Harnessing for an Open World'
  date: 2026-10
  url: https://arxiv.org/abs/2610.14224
  category: runtime
  subcategory: systems
  authors: []
  venue: ''
  code_url: ''
  project_url: ''
  abstract: LLM agents' capabilities depend not only on their underlying models but
    also on their execution harnesses. Recursive self-improvement (RSI) offers a promising
    approach to automatically evolve these harnesses. However, deploying RSI in open-world
    settings still faces two critical challenges. First, open-world tasks are typically
    unseen during the harness design phase and novel at test time, leaving no ground-truth
    verifiers to reliably guide online harness edits. Second, the RSI process remains
    highly task-specific and fails to generalize to novel scenarios. We introduce
    Harness^2, a plug-and-play, recursive agent harnessing framework that addresses
    these challenges through two connected levels of recursion. Task-level recursion
    refines the current task's harness using a contrastive Propose-Probe-Compose step
    that reliably guides edits without ground-truth verifiers, and can be scaled further
    via parallel or sequential recursion. Harnessing-level recursion then extracts
    experience from these edits to update a continual improvement harness, enabling
    the agent to better adapt to future tasks. Across three professional benchmarks
    and four model-harness configurations, a single step consistently improves GLM-5
    and Gemini 3.5 Flash over their base harnesses, yielding gains of up to 11.5 points
    on WorkBuddy-Bench, 4.5 points on JobBench, and 11.8 percentage points on LAB,
    with further gains as the task-level recursion budget increases.
  tags:
  - auto-runtime
  - auto-systems
- title: 'MOSS: Self-Evolution through Source-Level Rewriting in Autonomous Agent
    Systems'
  date: 2026-05
  url: https://arxiv.org/abs/2605.22794
  category: runtime
  subcategory: systems
  authors: []
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Autonomous agentic systems are largely static after deployment: they
    do not learn from user interactions, and recurring failures persist until the
    next human-driven update ships a fix. Self-evolving agents have emerged in response,
    but all confine evolution to text-mutable artifacts -- skill files, prompt configurations,
    memory schemas, workflow graphs -- and leave the agent harness untouched. Since
    routing, hook ordering, state invariants, and dispatch live in code rather than
    in any text artifact, an entire class of structural failure is physically unreachable
    from the text layer. We argue that source-level adaptation is a fundamentally
    more general medium: it is Turing-complete, a strict superset of every text-mutable
    scope, takes effect deterministically rather than through base-model compliance,
    and does not erode under long-context drift. We present MOSS, a system that performs
    self-rewriting at the source level on production agentic substrates. Each evolution
    is anchored to an automatically curated batch of production-failure evidence and
    proceeds through a deterministic multi-stage pipeline; code modification is delegated
    to a pluggable external coding-agent CLI while MOSS retains stage ordering and
    verdicts. Candidates are verified by replaying the batch against the candidate
    image in ephemeral trial workers, then promoted via user-consent-gated, in-place
    container swap with health-probe-gated rollback. On OpenClaw, MOSS lifts a four-task
    mean grader score from 0.25 to 0.61 in a single cycle without human intervention.'
  tags:
  - auto-runtime
  - auto-systems
- title: 'Towards Agentic Cloud Engineering: Graph and Loop Engineering with a Zero-Trust
    Agent Harness'
  date: 2026-08
  url: https://arxiv.org/abs/2609.00050
  category: runtime
  subcategory: systems
  authors: []
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Agentic AI is enabling cloud-based workflows in which autonomous agents
    reason over operational state, invoke authorized tools, modify software and infrastructure,
    deploy services, verify execution outcomes, and adapt across long-horizon, multistep
    tasks. Engineering such workflows requires explicit mechanisms for workflow progression,
    constrained execution, failure recovery, and verifiable completion. We present
    Agentic Cloud Workflow Engineering, an agentic AI framework that transforms natural-language
    agentic cloud-engineering tasks into validated code repositories and verified
    operational cloud deployments for automating cloud-based agentic workflows. The
    framework separates three complementary concerns: graph engineering specifies
    long-horizon workflow progression and verification-dependent transitions; loop
    engineering provides bounded diagnosis, repair or re-planning, retry, and re-verification;
    and agent harness engineering enforces zero-trust execution through identity,
    authorization, policy-scoped capabilities, isolation, and runtime safeguards.
    Workflow progression and completion require machine-checkable repository, deployment,
    and runtime evidence, with recovery constrained by explicit operational bounds
    and termination criteria. We instantiate the framework on Google Cloud and evaluate
    repository completeness, controlled execution, evidence-gated progression, operational
    deployment, and bounded recovery. Experimental results show that executions terminate
    with either a verified operational cloud deployment or an auditable terminal failure
    under bounded recovery. The framework provides a unified engineering architecture
    for cloud-based workflows spanning Agentic DevOps, Agentic CloudOps, Agentic SRE/AIOps,
    Agentic SecOps, Agentic DataOps, Agentic MLOps/LLMOps, AgentOps, Agentic RAG/GraphRAG,
    and related cloud-engineering domains.'
  tags:
  - auto-runtime
  - auto-systems
- title: 'MemoryWalker: Stop Training Agents on Contexts They Never Saw'
  date: 2026-09
  url: https://arxiv.org/abs/2609.00865
  category: runtime
  subcategory: systems
  authors: []
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Production agent harnesses such as Claude Code and Qwen-Agent compress
    context during rollout, but training under compression creates a conditioning
    problem: every eviction branches the effective history, so the learning object
    is a tree rather than a sequence. Existing linearizations either retain the rightmost
    path, causing time-travel leakage, or replay a depth-first traversal, causing
    train-inference mismatch. We introduce two exact, gradient-equivalent corrections:
    LogitTree, a segmented K-forward traversal, and a packed 4D attention mask. LogitTree
    requires K+1 backward passes; the 4D mask requires a custom kernel and white-box
    eviction records. We also propose SDCC (Self-Distillation for Conditioning Consistency),
    a single-backward-pass variational relaxation. At each eviction, it minimizes
    forward KL between the compressed student and a stop-gradient teacher on the reconstructed
    pre-eviction prefix. A residual per-junction KL of epsilon_KL gives an O(sqrt(epsilon_KL))
    bound on the train-deployment total-variation gap. SDCC also applies to black-box
    harnesses. On seven web-search benchmarks with TC-RAG, AgentFold, MemexRL, Claude
    Code, and OpenCode, naive training inflates the train-rollout log-probability
    gap, especially on eviction-heavy batches. The exact methods stay at the no-compression
    floor, and SDCC substantially closes the gap, with lower logit drift and higher
    rollout rewards.'
  tags:
  - auto-runtime
  - auto-systems
- title: 'SkVM: Revisiting Language VM for Skills across Heterogenous LLMs and Harnesses'
  date: 2026-04
  url: https://arxiv.org/abs/2604.03088
  category: runtime
  subcategory: systems
  authors: []
  venue: ''
  code_url: ''
  project_url: ''
  abstract: LLM agents increasingly adopt skills as a reusable unit of composition.
    While skills are shared across diverse agent platforms, current systems treat
    them as raw context, causing the same skill to behave inconsistently for different
    agents. This fragility undermines skill portability and execution efficiency.
    To address this challenge, we analyze 118,000 skills and draw inspiration from
    traditional compiler design. We treat skills as code and LLMs as heterogeneous
    processors. To make portability actionable, we decompose a skill's requirements
    into a set of primitive capabilities, and measure how well each model-harness
    pair supports them. Based on these capability profiles, we propose SkVM, a compilation
    and runtime system designed for portable and efficient skill execution. At compile
    time, SkVM performs capability-based compilation, environment binding, and concurrency
    extraction. At runtime, SkVM applies JIT code solidification and adaptive recompilation
    for performance optimization. We evaluate SkVM across eight LLMs of varying scales
    and three agent harnesses, covering SkillsBench and representative skill tasks.
    Results demonstrate that SkVM significantly improves task completion rates across
    different models and environments while reducing token consumption by up to 40%.
    In terms of performance, SkVM achieves up to 3.2x speedup with enhanced parallelism,
    and 19-50x latency reduction through code solidification.
  tags:
  - auto-runtime
  - auto-systems
- title: Harness Scaling for Generalizable Agentic Reinforcement Learning
  date: 2026-10
  url: https://arxiv.org/abs/2610.29458
  category: runtime
  subcategory: systems
  authors: []
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Agent harnesses have become a central component of modern agentic systems,
    shaping how models use tools, manage context, and coordinate long-horizon interaction.
    Realizing the benefits of these harnesses depends on how effectively the underlying
    model can make use of them, motivating reinforcement learning directly through
    the harness. While recent efforts have explored harness diversification to reduce
    specialization to particular execution settings, how to systematically construct
    and organize harness diversity for cross-harness generalization remains insufficiently
    understood. This work studies Harness Scaling as a distinct scaling dimension
    for agentic RL, focusing on structured variation in how policies execute and interact
    with the same underlying task and environment. Concretely, we construct a factorized
    harness space, select a compact training subset with balanced factorial coverage,
    and organize cross-harness training through locality-aware task assignment. Across
    multiple benchmarks, model scales, and RL algorithms, Harness Scaling consistently
    improves generalization to unseen harness combinations. Moreover, policies trained
    through structured white-box harness variation transfer effectively to unseen
    external black-box harnesses, outperforming policies trained through a single
    complex black-box harness. These results establish harness diversity as a meaningful
    scaling dimension for agentic RL and highlight the importance of how this diversity
    is organized for cross-harness generalization.
  tags:
  - auto-runtime
  - auto-systems
- title: 'Measurement Boundaries in LLM Financial Agent Evaluation: Fixed-Tape Execution
    and Multi-Defect Auditing'
  date: 2026-09
  url: https://arxiv.org/abs/2609.32379
  category: runtime
  subcategory: systems
  authors: []
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'What controls are needed to interpret execution performance and audit
    scores in LLM agent evaluations? We study two limits on these interpretations
    in a financial agent harness. In Study~A, comparing independent runs under idealized
    and stressed execution on three synthetic settings that share one 24-day upward
    phase mixes the execution rule with fresh model responses and portfolio feedback:
    the parsed decision paths agree in only 19.8\% of 450 pairs. Replaying each stored
    response tape through both execution destinations gives a narrower result. Conditional
    on those responses, stressed execution changes total return by -0.0170 (95\% interval
    [-0.0230,-0.0117]), or 10.4\% of the idealized baseline, and ten seed clusters
    do not resolve the model ranking. Study~B corrects an incomplete answer key and
    replaces legacy tasks with matched zero-, one-, and two-defect tasks under an
    explicit multi-label prompt. The drop in target violation recall from one to two
    defects is positive in five of six combinations of auditor and source (median
    0.267), with three surviving Holm correction. Yet the auditor that includes both
    target labels most often has micro-precision 0.149, emits findings on 98/100 zero-defect
    tasks, and returns the exact dual-defect set in only 21/100 cases. Target recall
    by itself therefore gives a poor account of audit quality on this construction.
    The studies address different limits: what an execution comparison estimates,
    and what target recall captures. Together, they show how fixed conditions and
    diagnostic controls bound the claims a score can support.'
  tags:
  - auto-runtime
  - auto-systems
- title: 'The Router Within: Eliciting Native Skill Routing from a Frozen LLM'
  date: 2026-09
  url: https://arxiv.org/abs/2609.15982
  category: runtime
  subcategory: systems
  authors: []
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Skills extend an LLM agent beyond its parametric knowledge, and the gain
    they promise rests on picking the right one. Deployed harnesses route by preloading
    every skill's metadata into the context, which disperses the agent's attention
    and caps the library size. Retrieval pipelines move the selection out of the context,
    but also out of the agent's capability. We show that the frozen agent LLM already
    carries the routing signal in its own forward passes, and that two linear maps
    suffice to read it out with no skill text in the context. Our Gavel (Glance And
    Verdict from a frozen LLM) reads it in two steps. A glance scores the full library
    by matching the task's mid-layer states against a compact bank that one forward
    pass builds for each skill at installation, with the two maps as the only trained
    parameters. A verdict then resumes each shortlisted skill's forward pass, reads
    the model's own likelihood and yes/no judgment, and fuses both with the glance
    as a product of experts. Trained once, Gavel transfers zero-shot to three public
    benchmarks and SkillTraj, our new benchmark of 372 simulated agent trajectories.
    On Qwen3-32B it outperforms progressive disclosure and retrieve-and-rerank pipelines
    that add 1.2B to 16B external parameters, by up to 13.4 points on written tasks
    and up to 21.9 when the need for a skill arises mid-rollout. Routing accuracy
    improves as the backbone does, and in a bash-agent harness Gavel lets the 32B
    trigger the right skill on Skill-Use more often than models of up to 1.6T parameters
    in Codex.
  tags:
  - auto-runtime
  - auto-systems
- title: 'Harnessing Agent Skills: Architectural Patterns and a Reference Architecture
    for Skill-Mediated LLM Agents'
  date: 2026-05
  url: https://arxiv.org/abs/2606.20631
  category: runtime
  subcategory: systems
  authors: []
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'CONTEXT: Agent skills package reusable behavioural guidance and resources
    that large language model agents load or apply during a run. Within the agent
    harness, agent skill harnessing comprises connected architectural responsibilities
    that govern which skills enter a run, which actions they can cause, and how their
    use is recorded and informs revision. OBJECTIVES: We identify architectural patterns
    for agent skill harnessing and organise their responsibilities into a reference
    architecture that makes these connections explicit. METHODS: A multivocal literature
    review covered 36 practitioner systems and 51 academic papers; we consolidated
    practices into patterns and derived the reference architecture from patterns,
    source evidence, and architectural reasoning. We evaluated the reference architecture
    by mapping eight systems and applying it in Deep Agents and Hermes Agent. RESULTS:
    Ten patterns cover skill supply and activation, skill declarations and execution
    authority, verification and recording of skill use, and run evidence feeding repair
    and governed revision. The reference architecture organises their responsibilities
    into four layers (Supply Chain, Mediation, Execution Control, Evidence &amp; Feedback)
    and two cross-cutting substrates, separating permission determination from enforcement
    and routing persistent revisions through acceptance. Mapping eight systems showed
    the first three layers broadly realised and 14 of 15 partial or unestablished
    ratings in Evidence \&amp; Feedback. Applying the architecture in Deep Agents
    and Hermes Agent turned requirements into checks that exposed a shell route outside
    the file-tool rules and a preview--apply mismatch. CONCLUSION: The patterns and
    reference architecture support comparing implementations and turning requirements
    into responsibility allocations and checks.'
