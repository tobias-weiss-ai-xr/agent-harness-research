  abstract: 'Oncoflux V2.0 is a fully deterministic, oncology‑flavoured systems‑modelling
    console built on the Williams–Carlo Research Framework (W.C.R.F.) V2.0. It integrates
    a multi‑region field engine, a conserved‑pressure invariant, a deterministic cascade‑propagation
    model, rare‑mode tiering, descriptive statistics, and a complete 20‑operator signalling‑defense
    suite — all inside a single offline HTML application. Oncoflux provides a unified
    environment for exploring threshold‑based classification, structured response
    patterns, propagation dynamics, operator‑chain transformations, and multi‑layer
    conceptual framing (including the Ω‑series depth ladder). The console is designed
    for researchers, educators, and systems‑thinkers who want a rigorous, reproducible
    sandbox for oncology‑inspired reasoning without relying on real biological data.
    Every rule, threshold, operator, and behaviour class is defined within the framework
    itself, enabling transparent experimentation, teaching, and conceptual exploration.
    Oncoflux runs entirely client‑side, requires no installation, and stores all state
    locally. It includes a full researcher toolkit: CSV export, batch signalling analysis,
    radar‑chart comparison, cascade viewer, snapshot system, report generator, glossary,
    casebook generator, and a command palette for rapid navigation. Oncoflux V2.0
    consolidates the Systems Engine (V4) and the Coercion/Defense Engine (V5) into
    a single, coherent modelling suite — delivering a complete conceptual environment
    for multi‑node, multi‑region systems dynamics. Author: Matthew Arthur Carlo of
    Carlo Research SystemsVersion: Oncoflux 2.0 · Status: Complete · Type: Software
