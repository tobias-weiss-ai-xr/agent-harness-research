- title: 'Beyond Prompts: Measuring and Optimizing LLM Tool-Agent Harnesses'
  date: 2026-01
  url: https://arxiv.org/abs/2609.05736
  category: runtime
  subcategory: ''
  authors:
  - Cen
  - Zhao
  - Wenjie Chen
  abstract: 'LLM tool agents can be improved without retraining by modifying the runtime
    harness around a fixed model: prompts, tool interfaces, middleware, state handling,
    and recovery logic.We study this setting as resource-bounded harness selection
    for fixed-model multi-turn tool agents, with the search surface scoped to prompts
    and tool-boundary middleware: edits are guarded intercepts at the tool boundary,
    not arbitrary rewriting of agent execution logic.Our optimizer-agnostic protocol
    reports mean held-out lift, worst-condition lift, repeatability, logged cost diagnostics,
    and RelLift 95 (B), a conservative estimate of the held-out gain of the harness
    selected under budget B. We instantiate the protocol with prompt-only and prompt-plus-middleware
    optimizers, including PRISM, which clusters failures and routes repairs to prompt,
    tool-boundary middleware, or joint edit surfaces within a Pareto search.On BFCL
    multi-round, τ 2 -Retail, and τ 2 -Telecom, PRISM obtains mean held-out lifts
    of 14.2, 14.9, and 10.1 percentage points and positive empirical RelLift 95 on
    all three benchmarks, and a component ablation attributes the margin chiefly to
    failure-surface routing and the edit-pattern constraint.Across optimizers, the
    results show that some search procedures can occasionally find large gains but
    still choose brittle updates, so the reliability of the chosen harness should
    be reported alongside average held-out lift.'
  venue: 'Findings of the Association for Computational Linguistics: EMNLP (Findings
    of EMNLP)'
- title: Self-Healing Harness for Runtime Oversight of Agent Self-Modification
  date: 2026-09
  url: https://arxiv.org/abs/2609.24130
  category: runtime
  subcategory: ''
  authors:
  - Sina Tayebati
  - Divake Kumar
  - Nastaran Darabi
  abstract: LLM agents can change their own future behavior, raising a basic control
    question of which self-generated changes should be allowed to persist. We formulate
    this as admission control for self-modification. The agent may propose changes
    to its operating instructions, while an external runtime gate controls persistence.
    We implement this principle as a model-agnostic self-healing harness that runs
    a Detect, Notice, Heal, Validate loop around an otherwise unmodified agent. The
    agent authors candidate behavioral rules in an external workspace, where they
    receive provisional execution authority during evaluation and acquire persistent
    cross-episode authority only after measured improvement on the triggering failure
    without regression beyond a fixed margin on protected cases. Replay provides matched
    evidence when available, forward trials provide a weaker fallback, and a corpus-level
    guard re-tests the accumulated active rule set. Across 16 matched Baseline and
    Harness runs spanning AppWorld, Terminal-Bench, and $τ^2$-Bench, the gate rejected
    383 replay-decided proposals. Of these, 211 (55%) improved their triggering failure
    while degrading a case that previously worked. This shows that locally beneficial
    self-modifications can introduce collateral regressions often enough to materially
    affect gate decisions, providing direct empirical motivation for external admission
    control. Task-completion score is higher under the Harness in all 16 pairs, with
    two paired bootstrap intervals excluding zero, while repeated-trial reliability
    is higher in 12 pairs, tied in 4, and lower in none. Because adaptation modifies
    the policy-inducing context while leaving model weights fixed, admitted changes
    remain inspectable, reversible, and compatible with closed-weight models.
  venue: arXiv (Cornell University)
- title: 'Formal Skill: Programmable Runtime Skills for Efficient and Accurate LLM
    Agents'
  date: 2026-05
  url: https://arxiv.org/abs/2605.19604
  category: runtime
  subcategory: ''
  authors:
  - Xi Zhang
  - Meijun Gao
  - Yuntian Zhao
  abstract: 'Large Language Model (LLM) agents increasingly act inside real workspaces,
    where tools and skills determine whether model reasoning becomes reliable action.
    Existing skills remain largely informal: Markdown skills and instruction packs
    encode procedures as long natural-language documents, while function calling,
    Model Context Protocol (MCP) servers, and framework tools structure individual
    actions but usually leave workflow state, policy enforcement, and completion discipline
    outside the skill itself. We introduce Formal Skill, a runtime-native abstraction
    that represents reusable capability with JSON metadata and action schemas, reliable
    Python executors, hook-governed control logic, Formal Skill routing, and skill-local
    runtime state. By moving reusable procedure from repeated prompt text into executable
    state machines and hook policies, Formal Skill gives agents a token-efficient
    and enforceable control surface. We implement the abstraction in FairyClaw, an
    open-source event-driven runtime for executable, observable, and composable Formal
    Skills. On Harness-Bench, FairyClaw obtains highly competitive average scores
    while using substantially fewer tokens, with especially strong results on tasks
    that expose the role of Formal Skill.'
  venue: arXiv (Cornell University)
- title: 'SafeCoEvo: Co-Evolving Safety Harnesses and Guards for LLM Agents at Test-Time'
  date: 2026-09
  url: https://arxiv.org/abs/2609.36580
  category: runtime
  subcategory: ''
  authors:
  - Yu Cheng
  - Yongkang Hu
  - Shuaijie Ma
  abstract: 'LLM agents deployed in real-world environments continually encounter
    new tasks and safety risks, while execution feedback typically becomes available
    only after each task is completed. However, existing self-evolving approaches
    commonly rely on multiple rounds of optimization over fixed and repeatedly accessible
    task distributions, fundamentally differing from test-time adaptation in real-world
    deployment, where only experience accumulated from past tasks can be used to improve
    safety decisions on future unseen tasks. To address this limitation, we propose
    SafeCoEvo, a test-time Harness-Guard co-evolution framework for LLM agent safety
    that enables the external safety system to continually adapt from accumulated
    runtime experience. SafeCoEvo jointly improves two complementary safety capabilities
    at different timescales: S-Harness rapidly externalizes recent runtime experience
    into updatable explicit safety knowledge that can promptly influence subsequent
    tasks, while GuardVPO internalizes accumulated runtime safety experience over
    a longer timescale into parametric risk-judgment capabilities. By combining short-term
    rapid adaptation with long-term capability consolidation, SafeCoEvo continually
    improves the agent''s safety capabilities, reducing the unsafe outcome rate by
    10.05% while improving the task success rate by 12.15% over the strongest baseline,
    thereby achieving simultaneous gains in safety and task utility.'
  venue: arXiv (Cornell University)
- title: 'EvoUndo: Recoverability-Constrained Self-Evolution for LLM Agent Harnesses'
  date: 2026-08
  url: https://arxiv.org/abs/2608.28363
  category: runtime
  subcategory: ''
  authors:
  - Tanmay Sah
  - Dolly Sah
  - Harshul Jain
  abstract: 'LLM agents increasingly modify their own prompts, tools, middleware,
    resources, and execution harnesses at runtime. Such self-evolution can improve
    capability, but a successful mutation may leave persistent effects that cannot
    be safely reversed in states different from the one in which it was created. We
    introduce EvoUndo, a framework for representing, synthesizing, diagnosing, and
    independently verifying recoverability of model-generated self-modifications across
    counterfactual states. Across 600 unseen one-shot self-evolution tasks, we identify
    197 capability-improving mutations that fail recoverability verification. Under
    the original recovery representation, conventional repair strategies recover 0/197
    of these natural failures. Deterministic oracle analysis recovers 48/197 under
    the original recovery language L0, while the extended recovery calculus increases
    empirical oracle recovery to 191/197. A protocol-locked 2x2 grounding-by-expressivity
    intervention then separates two bottlenecks: exact state-address grounding increases
    successful recovery from 0/48 to 38/48 (79.2%) when the original language is sufficient,
    while extending the recovery language enables recovery on 142/143 (99.3%) failures
    in the oracle-defined S1 stratum. On the primary gpt-oss-120b backbone, adding
    exact-address diagnostics to the richer language reduces recovery to 133/143 (93.0%);
    a Qwen3.8-27B replication preserves the grounding and expressivity effects but
    not this negative interaction, indicating that the latter is model-dependent.
    These results indicate that reliable agent self-evolution requires co-designing
    verification, state grounding, witness semantics, and recovery-language expressivity
    rather than relying on iterative prompting alone.'
  venue: arXiv (Cornell University)
- title: 'AGATE: Provenance-Based Runtime Defense Against Compositional Attacks on
    LLM Agents'
  date: 2026-09
  url: https://arxiv.org/abs/2609.30830
  category: runtime
  subcategory: ''
  authors:
  - Xiaorui Zhang
  - Zhuoran Cheng
  - Kailin Liu
  abstract: LLM agents can produce harmful effects through sequences of ordinary operations.
    Judging such actions requires establishing both the authority that permits them
    and the origin of the data they carry. We present AGATE, an authorization and
    data-provenance gate at instrumented agent-harness boundaries. Operator declarations
    and host approval events ground authorization; delegated actions are constrained
    by grants that bind to exact parameters, expire, and permit a limited number of
    uses. Source registration connects observed inputs to subsequent transfers, while
    an effect ledger tracks repeated requests. Deterministic checks make decisions
    without an LLM in the decision path and retain their grounds with execution evidence
    for forensic replay. Adapters integrate three production harnesses -- DeepSeek
    Harness, OpenCode, and OpenClaw -- without modifying host code, translating each
    host's native observation and veto points into a single shared gate interface;
    the judgment core is identical in all three, and only enforcement depth differs.
    Our evaluation combines 153 exercised attack-chain records with deployment, utility,
    and reconstruction experiments. The deployment observations expose how tool declarations
    and data checks govern business actions, including a bypass through parameter
    rewriting. Six of eleven benign file-processing scenarios contain denial events,
    revealing the utility cost of content-based provenance policies. Across 252 runs
    on 63 sanitized scenarios, replay agrees with live graph projections for all 63
    scenarios on each of two platforms. These results establish the feasibility of
    provenance-based runtime judgment and identify content transformation, legitimate
    reuse, and observation coverage as concrete limits.
  venue: arXiv (Cornell University)
- title: 'From Prompts to Contracts: Harness Engineering for Auditable Enterprise
    LLM Agents'
  date: 2026-07
  url: https://arxiv.org/abs/2607.08028
  category: runtime
  subcategory: ''
  authors:
  - JoongHo Ahn
  - MoonSoo Kim
  abstract: 'Enterprise large language model (LLM) applications often begin as prototypes
    whose behavior is carried by prompts and retrieval context. Productization adds
    requirements for source boundaries, entity routing, answer contracts, and reproducible
    traces. We present a harness-engineering approach that reconstructs this pattern
    into a traceable, auditable LLM-agent architecture: deterministic behavior moves
    into code, manifests, schemas, and validation artifacts around a replaceable composition
    boundary, while source-backed claims remain the authority for runtime answers.
    We instantiate it on a public-data slice of five Korean corporate groups (25 listed
    companies) and evaluate three research questions. (1) The harness preserves its
    source-grounding, entity-routing, trace, output-hygiene, and recommendation-language
    contracts across the fixed validation scenarios; a fault-injection control confirms
    the validators flag deliberately broken contracts. (2) The checks the harness
    enforces held under model substitution: across three hosted models, they passed
    on all 270 composition-boundary runs; failures were confined to the model-composed
    side and were caught and recorded. (3) The code-owned guarantees are load-bearing,
    not reproducible by prompting alone: holding the model fixed and varying only
    the enforcement layer, prompt instructions alone let recommendation-language and
    internal-trace-leakage violations reach the reader, which the harness blocks entirely.
    A bolt-on external guardrail prevents such violations too but over-refuses, dropping
    utility to 88/120 where the harness preserves full utility (120/120); in this
    ablation, only code-owned enforcement preserves both safety and utility. The result
    is a reusable engineering pattern for turning exploratory prototypes into auditable
    applications with versioned source, control, and validation artifacts.'
  venue: arXiv (Cornell University)
- title: Can Agent Harnesses and Inference Engines Hear Each Other? The HEAR Protocol
    for Agentic LLM Serving
  date: 2026-10
  url: https://arxiv.org/abs/2610.06597
  category: runtime
  subcategory: ''
  authors:
  - Jiaqi Zhao
  - Haodong Chen
  - Jitai Hao
  abstract: 'LLM agents increasingly execute complex workflows involving multi-turn
    reasoning, tool use, and parallel agents. Efficient serving requires decisions
    that span two layers with complementary information: the agent harness understands
    workflow dependencies, context lifecycles, and execution objectives, whereas the
    inference engine observes request queues, KV-cache state, resource pressure, and
    execution capabilities. Existing interfaces do not systematically connect these
    views, limiting workflow-aware execution. HEAR, a bidirectional Harness--Engine
    Pairing protocol for agentic LLM serving. HEAR standardizes how the harness communicates
    workflow intent and execution requirements and how the engine returns runtime
    state, capabilities, and outcomes. By separating protocol semantics from optimization
    policies, HEAR supports diverse coordination strategies without changing workflow
    or model semantics. We instantiate HEAR for online cache-aware runtime coordination
    and workload-aware execution-mode selection for agent roles. Across four conversational
    and research-agent benchmarks under memory-constrained, concurrent serving, HEAR
    achieves a $1.61\times$ batch speedup and reduces median time-to-first-token by
    $2.23\times$ on SCBench. Mooncake shows that workflow intent and live engine state
    provide complementary benefits across load regimes. On BrowseComp-Plus and DeepResearchBench,
    workload-specific configurations yield $1.23\times$ and $2.45\times$ end-to-end
    speedups, respectively, without observed task-quality degradation. These results
    establish HEAR as a reusable coordination substrate for efficient agentic LLM
    serving.'
  venue: arXiv (Cornell University)
- title: 'AgentS4D: Benchmarking Runtime Risks across the Execution Lifecycle of LLM-Based
    Workspace Agents'
  date: 2026-07
  url: https://arxiv.org/abs/2607.27294
  category: runtime
  subcategory: ''
  authors:
  - Jiajun Zhou
  - Zhaoxuan Ke
  - Jihang Ye
  abstract: Large language model (LLM)-based workspace agents execute stateful, multi-step
    workflows across heterogeneous resources, external tools, and persistent state.
    Their safety must therefore be assessed from actions, side effects, and state
    changes throughout execution. Although recent benchmarks have advanced executable
    safety testing and trajectory-aware verification, they rarely provide a unified
    account of where risks enter, how they elicit unsafe behavior, which harms they
    target, and where supporting evidence appears during execution. We introduce AgentS4D,
    a sandboxed benchmark for lifecycle-wide runtime safety evaluation. Its four-dimensional
    runtime-safety framework uses six risk-entry sources, six induction strategies,
    and nine target harms to guide case construction, while seven lifecycle checkpoints
    organize post-run evidence. AgentS4D contains 328 risk-injected cases. We evaluate
    all 20 combinations of four harnesses (Hermes, OpenClaw, Claude Code, and Codex)
    and five LLM backends (GPT-5.5, Gemini 3.1 Pro, DeepSeek-V4-Pro, MiniMax-M3, and
    Qwen3.7-Plus) on these cases, yielding 6,560 runs. Overall, 4,461 runs (68.0%)
    trigger prespecified unsafe signals. Across the 20 configurations, the observed
    safety of an agent system varies with both its harness-LLM pairing and how risk
    is introduced. Agent systems exhibit markedly different safety behavior when the
    same induction strategy reaches them through different risk carriers. They also
    respond differently to the same target harm when it is realized through different
    carriers and strategies. Moreover, 4,344 runs (66.22% overall) are unsafe yet
    complete. Thus, task completion cannot establish runtime safety, and testing only
    one form of a risk can conceal important weaknesses. Evaluations should examine
    complete agent configurations across diverse risk conditions and retain evidence
    throughout execution.
  venue: arXiv (Cornell University)
- title: 'Self-Harness: Harnesses That Improve Themselves'
  date: 2026-06
  url: https://arxiv.org/abs/2606.09498
  category: runtime
  subcategory: ''
  authors:
  - Hangfan Zhang
  - Shao Zhang
  - Kangcong Li
  abstract: 'The performance of LLM-based agents is jointly shaped by their base models
    and the harnesses that mediate their interaction with the environment. Because
    different models exhibit distinct behaviors, effective harness design is inherently
    model-specific. Yet agent harnesses are still largely engineered by human experts,
    a paradigm that scales poorly as modern LLMs become increasingly diverse and rapidly
    evolving. In this paper, we introduce Self-Harness, a new paradigm in which an
    LLM-based agent improves its own operating harness, without relying on human engineers
    or stronger external agents. We operationalize Self-Harness as an iterative loop
    with three stages: Weakness Mining, which identifies model-specific failure patterns
    from execution traces; Harness Proposal, which generates diverse yet minimal harness
    modifications tied to these failures; and Proposal Validation, which accepts candidate
    edits only after regression testing. We instantiate Self-Harness across Terminal-Bench-2.0,
    SWE-bench Verified, and AppWorld using a minimal initial harness and three base
    models from diverse families: MiniMax M2.5, Qwen3.5-35B-A3B, and GLM-5. Across
    all nine model--benchmark combinations, every final harness improves both held-in
    and held-out pass rates, with overall relative gains of up to 132%. Qualitative
    analyses further show that the retained mechanisms address benchmark-specific
    bottlenecks in artifact handling and runtime control, software-patch verification,
    and application-state retrieval. These results suggest a path toward LLM-based
    agents that are not merely shaped by their harnesses, but can also participate
    in reshaping them.'
  venue: arXiv (Cornell University)
- title: 'Kernel Forge: An Agent Harness for LLM-based Generation and Optimization
    of CUDA Kernels'
  date: 2026-06
  url: https://arxiv.org/abs/2607.24762
  category: runtime
  subcategory: ''
  authors:
  - Joshua Brodsky
  - Dhravid Kumar
  - Savini Kashmira
  abstract: Machine learning models are increasingly embedded in everyday software,
    and most of their runtime is spent in a small set of compute kernels such as matrix
    multiplication, convolution, and normalization. Optimizing these kernels is one
    of the most direct ways to reduce latency and cost, but it has traditionally required
    expert engineers to hand-write low-level GPU code. Agentic systems built on large
    language models (LLMs) can now generate and optimize kernels with far less human
    effort, yet existing tools are largely evaluated on randomly generated tensors
    and isolated kernels, emit standalone CUDA code that developers must manually
    reintegrate, mostly target only LLM PyTorch models, and offer limited support
    for inspecting and debugging results. We present Kernel Forge, an open-source,
    end-to-end agentic harness that accepts any unmodified PyTorch model in place.
    Kernel Forge supports vision, diffusion, and LLM workloads, uses Monte Carlo Tree
    Search (MCTS) to explore multiple optimization paths rather than a single linear
    refinement chain, and ships with a graphical user interface for monitoring progress,
    inspecting candidate kernels, and debugging failures. We evaluate Kernel Forge
    on four PyTorch models spanning vision, diffusion, and LLM workloads on an NVIDIA
    DGX Spark with GB10 GPU. With only 50 optimization iterations per kernel, it optimizes
    14 kernels to outperform PyTorch eager mode, reaching $1.52\times$ on adaptive\_avgpool2d
    in ResNet-50, $1.70\times$ on group\_norm in Stable Diffusion 3.5 Medium, $2.83\times$
    on softmax in Gemma 4 E2B, and $1.54\times$ on softmax in Qwen 3.5 35B-A3B.
  venue: arXiv (Cornell University)
- title: 'How Much Heavy Lifting Can an Agent Harness Do?: Measuring the LLM''s Residual
    Role in a Planning Agent'
  date: 2026-04
  url: https://arxiv.org/abs/2604.07236
  category: runtime
  subcategory: ''
  authors:
  - Sungwoo Jung
  - Seonil Son
  abstract: 'Agent harnesses -- the stateful programs that wrap a language model and
    decide what it sees at each step -- are now known to change end-to-end performance
    on a fixed model by as much as six times. That raises a question asked less often
    than it should be: how much of an agent''s competence does the harness itself
    already carry, and how much genuinely still needs the LLM? We externalize a planning
    harness for noisy Collaborative Battleship into four progressively richer layers
    -- posterior belief tracking, declarative planning, symbolic reflec tion, and
    an LLM-backed revision gate -- under a common runtime, taking \emph{win rate}
    as the primary metric and \emph{F1} as secondary, and pre-specifying \emph{heavy
    lifting} as the single largest positive marginal to the primary metric. Across
    54 games, declarative pla nning carries the heavy lifting ($+24.1$pp win rate
    over a belief-only harness, zero LLM calls); symbolic reflection is mechanistically
    real but calibration-sensitive, with signed board-level effects up to $\pm0.140$
    F1 that cancel on aggregate; and LLM-backed revision ac tivates on only $4.3\%$
    of turns with a bounded, non-monotonic effect. The contribution is methodological:
    once harness layers are made externally measurable, the LLM''s role can be quantified
    as residual rather than assumed central.'
  venue: arXiv (Cornell University)
- title: 'EvoHarness-RL: Learning Runtime Harness Coordination for Self-Evolving Agents'
  date: 2026-08
  url: https://arxiv.org/abs/2608.05446
  category: runtime
  subcategory: ''
  authors:
  - Xuying Ning
  - Dongqi Fu
  - Tianxin Wei
  abstract: Long-horizon LLM agents increasingly rely on external execution support
    to maintain state, track progress, recover from failures, and reuse experience
    across extended interactions. Yet existing harnesses and their use are often tailored
    to environments and controlled through prompts, heuristics, or system-specific
    rules, making agent and harness coordination difficult to jointly optimize. We
    introduce EvoHarness-RL, a unified framework that separates environment-specific
    harness implementations from a shared policy-facing interface. EvoHarness-RL organizes
    external support into a Belief, Progress, and Experience (BPE) workspace and exposes
    four compact harness actions for accessing and updating this state. We first instantiate
    BPE as an inference-time scaffold and then make harness coordination learnable
    through supervised initialization followed by cost-aware GRPO. Across heterogeneous
    long-horizon tasks, EvoHarness-Base improves the average success rate of frontier
    models by 10.0 percentage points, while EvoHarness-RL outperforms the strongest
    open-source baseline by 8.5 percentage points, together with higher RL rollout
    efficiency and stronger generalization to unseen tasks. Our analyses show that
    training gradually shifts agents from frequent scaffold use toward selective,
    environment-dependent harness access as the policy becomes more capable, while
    the external workspace continues to evolve and refine itself to better support
    task execution and generalization. Together, these results show that long-horizon
    agents benefit not only from external scaffolding itself, but also from learning
    how and when to coordinate with external support as part of a cost-aware policy.
  venue: arXiv (Cornell University)
- title: 'Enterprise Governance of Reusable Agentic AI Skills : A Runtime Governance
    Framework Built on Dynamic Capability Projection and the Agent Harness as Trust
    Boundary'
  date: 2026-08
  url: https://doi.org/10.71097/ijsat.v17.i3.11589
  category: runtime
  subcategory: ''
  authors:
  - Sandeep Kumar Anuguthala
  abstract: 'Enterprises are increasingly building agentic AI systems out of reusable
    skills — modular units that bundle prompts, reasoning strategies, tool integrations,
    and execution policies, and that get reused across many AI use cases. This pattern
    speeds up delivery, but it creates a risk that current AI governance frameworks
    were not designed for. A single privileged skill, reused across dozens of workflows,
    can quietly accumulate excess privilege, expand the operational blast radius of
    every workflow it touches, and drift from its original policy boundary. The NIST
    AI Risk Management Framework, ISO/IEC 42001, MITRE ATLAS, and OWASP''s guidance
    for LLM and agentic applications all treat AI systems as a single object. None
    of them gives an organization a way to govern reusable skills as the cross-cutting
    assets they have become. This paper argues that reusable agent skills should be
    treated as first-class governed enterprise assets, and that the enterprise agent
    harness — not the skill, the model, or the use case — must serve as the runtime
    trust boundary at which a skill''s authority is granted. The paper proposes a
    runtime governance framework built on three constructs. Skill Risk Inheritance
    is a design-time model for reasoning about how risk flows through the composition
    of skills, tools, and use cases. Dynamic Capability Projection (DCP) is the runtime
    mechanism by which the harness grants, on each invocation, only the subset of
    a skill''s declared capabilities authorized for the current use case and principal.
    Risk-Adaptive Capability Projection (RACP) extends DCP across time: the granted
    subset widens or narrows as runtime risk signals change. The framework is grounded
    in the object-capability tradition, modern policy engines such as OPA and Cedar,
    and Zero Trust architecture. It is validated through a prototype implementation
    on Open Policy Agent and a graph-based simulation, which together show that DCP
    reduces the runtime capability surface to 41% of declared scope withholding 59%
    of potential capabilities per invocation–at a median policy-evaluation overhead
    of 8.9ms, negligible against LLM inference latency. Critically, inheritance analysis
    revealed that 93% of simulated use cases operated at higher effective risk than
    their declared classification, a finding with immediate implications for enterprise
    AI risk programs.'
  venue: International Journal on Science and Technology
- title: 'Polar: Agentic RL on Any Harness at Scale'
  date: 2026-05
  url: https://arxiv.org/abs/2605.24220
  category: runtime
  subcategory: ''
  authors:
  - Binfeng Xu
  - Hao Zhang
  - Shaokun Zhang
  abstract: 'Reinforcement learning for language agents increasingly depends on custom
    harnesses that manage long-running context, multi-turn tool use and multi-agent
    orchestration. However, porting these harnesses into RL environment interfaces
    remains difficult and often loses important training signals. We bridge this gap
    with polar, a rollout framework for scalable asynchronous RL over arbitrary agent
    harnesses. Polar treats the agent harness as a black box: it proxies LLM API calls,
    records token-level model interactions, and reconstructs token-faithful trajectories
    for training. Each rollout node efficiently manages runtime prewarming, agent
    execution, trajectory reconstruction, and evaluation in parallel, exposing asynchronous
    service endpoints that can be consumed by independent trainers at scale. This
    decoupled design makes Polar agnostic to agent harnesses, training infrastructure,
    and RL algorithms while improving compute utilization for long-running agent workloads.
    We validate polar by training agents on software-engineering tasks with popular
    coding harnesses. Using simple GRPO, polar improves Qwen3.5-4B by 22.6, 4.8, 0.6
    and 6.2 points on SWE-Bench Verified with the Codex, Claude Code, Qwen Code and
    Pi harnesses, respectively. We further demonstrate Polar for offline data generation
    over custom harnesses and ablate trajectory reconstruction strategies. Polar rewrites
    its preceding work, Prorl Agent, and has been registered as one of NeMo Gym environments.'
  venue: arXiv (Cornell University)
- title: Agent Safety Should Be a Runtime Contract
  date: 2026-08
  url: https://arxiv.org/abs/2608.11274
  category: runtime
  subcategory: ''
  authors:
  - Albus W. Ng
  - Yi Han
  - Jusheng Zhang
  abstract: 'The dominant paradigm treats AI safety as a property to be instilled
    during model training via RLHF, DPO, or Constitutional AI. We argue this is structurally
    insufficient for autonomous agents that execute code, mutate files, send messages,
    and modify databases. Agent safety should be a runtime contract enforced by the
    harness, and the contract has two complementary faces. The preventive face blocks
    dangerous actions before they happen via sandboxes, permission gates, output filters,
    and trajectory monitors. The evidential face requires verifiable proof that good
    actions actually happened, gating task submission on hard evidence such as test
    runs, log captures, file diffs, and citation grounding. We ground the position
    in four lines of public evidence, with row-level protocols and data released in
    the supplementary JSON files: a survey of 52 documented AI-agent and LLM safety
    incidents, a false-completion audit with 31 non-contested core cases plus one
    disputed illustrative case, a trajectory-schema audit of 12 public agent systems
    and harnesses, and a title-level audit of all 28,560 papers accepted at NeurIPS,
    ICML, and ICLR 2023-2025 showing a pooled 8-12x imbalance between training-time
    and deployment-time publication. Two prior communities that needed to enforce
    safety, computer security and the experimental sciences, converged on runtime
    contracts with both preventive and evidential elements; agentic AI is now under
    the same pressure. We formalize an Agent Trajectory Schema and Evidence Chain,
    state a compositional gating proposition based on standard monitor composition,
    and outline a research agenda. The right unit of safety in agentic AI is the trajectory-with-checkable-evidence,
    not the model.'
  venue: arXiv (Cornell University)
- title: 'Autonomous Topology Mutation: Safe Runtime Restructuring for Multi-Agent
    LLM Systems with Capability, State, and Shadow Invariants'
  date: 2026-06
  url: https://arxiv.org/abs/2607.20488
  category: runtime
  subcategory: ''
  authors:
  - Bronislav Sidik
  - Chaya Levi
  - Nizzan Kimhi
  abstract: 'Multi-agent LLM frameworks typically fix their team topology at boot
    time. When an individual agent becomes overloaded at runtime, for example by mixing
    too many action categories, accumulating tool errors, or queueing behind too many
    calls, the system has no mechanism to restructure itself. We introduce Autonomous
    Topology Mutation (ATM), a runtime team-mutation mechanism for multi-agent LLM
    frameworks. ATM combines telemetry-driven overload detection with three safety
    invariants that gate each structural change: capability monotonicity, state-routing
    completeness, and shadow-before-live validation. ATM monitors a six-signal Bottleneck
    Index that includes queue depth, context thrash, tool-error rate, role entropy,
    retry-loop rate, and cross-agent wait time. When a warmup-calibrated threshold
    is breached for multiple consecutive ticks, ATM factorises the overloaded agent
    into specialised sub-agents and hot-swaps the parent into a coordinator role while
    preserving its external identity. State transfer is controlled by privacy-level-aware
    routing: each memory atom is routed only to a permitted child set, or explicitly
    dropped with a logged reason. No candidate topology receives live traffic until
    it has passed a shadow validation window. On 720 DeepSeek-V3-driven task runs
    with deterministic tool stubs across four ablation conditions and three workloads,
    the ATM factoriser split lifts code-task success from 3.3% to 61.7%. The full
    rail-and-distillation system reduces detected high-privacy memory exposure under
    a regex classifier from 2.0 to 0.0 events per task while preserving task quality.
    The runtime rails carrying ATM''s invariants add less than 500 microseconds of
    p99 latency on the agent hot path. A small live-tool probe with real Python execution
    is included as an external-validity check. The implementation, benchmark harness,
    and traces are open-sourced.'
  venue: arXiv (Cornell University)
- title: 'openJiuwen + DeepSeek Agent Harness: state machine, tool gateway, task-level
    validation, and failure recovery for LLM agents'
  date: 2026-09
  url: https://doi.org/10.5281/zenodo.22646170
  category: runtime
  subcategory: ''
  authors:
  - Jian Yao
  - Yiming Shi
  - Jinghang Ai
  abstract: 'openJiuwen + DeepSeek Agent Harness: state machine, tool gateway, task-level
    validation, and failure recovery for LLM agents This deposit provides a complete,
    reproducible Agent Harness platform that runs real LLM agents (DeepSeek-V4-Flash
    via a configurable DeepSeek-compatible HTTP endpoint) under strict execution control,
    and evaluates it head-to-head against a plain ReAct agent using the same model,
    tools, budgets, and tasks. What is deposited- Full source of the harness runtime
    (execution state machine, tool gateway with schema-constrained I/O, execution
    budgets, loop detection, per-call trajectories), the task-level validator and
    independent business Oracle scoring, three tool types (calculator, read_text_file,
    http_get), and six business task families.- Real-model benchmark runner with isolated
    per-task workspaces and three comparison arms: plain ReAct, full Harness, and
    a Harness-without-outer-recovery ablation.- Sealed, replayable evidence packs:
    per-trial execution logs, state-transition diagrams, and validation reports (468
    per-trial state diagrams and validation reports inside the v2 pack), plus report
    documents and PDFs.- 194 offline unit/schema/evidence tests, all passing on the
    deposited snapshot. Evaluation design (real model, same model for both arms)-
    Splits: development calibration (12 tasks), confirm (36 tasks x 3 repeats), fault
    injection (12 tasks x 3 repeats); arms react / harness / no_recovery; 3 worker
    processes; max 15 inner model iterations per trial.- Results are accepted only
    through a strict envelope: exact RESULT contract, no malformed JSON prefixes,
    no duplicate keys, and error results are never counted as success.- Recoverable
    fault families (tool parameter error, incomplete/conflicting tool result, tool
    loop) plus a permanently-missing-information family where the correct behavior
    is a grounded refusal. Headline results (as labeled; no over-claiming)- Authority-anchor
    tasks: plain ReAct 3/27 vs full Harness 27/27 (+88.9 pp, 24 additional successes)
    — labeled AUTHORITY_ANCHOR_PROVEN.- Controlled recovery trials: 0/18 -> 18/18
    recoveries — labeled CONTROLLED_RECOVERY_PROVEN.- Business benchmark, current-source
    run (v2, provider llmapi.paratera.com, model DeepSeek-V4-Flash, temperature=0.95,
    top_p=0.1, JSON response_format, 3 repeats): - Confirm set: react 86/108 (79.6%),
    harness 89/108 (82.4%), no_recovery 85/108 (78.7%) — harness vs react +2.8 pp.
    - Fault set: react 28/36 (77.8%), harness 32/36 (88.9%), no_recovery 28/36 (77.8%)
    — harness vs react +11.1 pp. - Development set (calibration only, not pooled into
    the effect estimate): all arms 10/12. - Intercepted false successes (strict envelope):
    react 22 (confirm) + 6 (fault); harness 0. Correct refusals 8-18 per arm per set.-
    Natural benign-layer comparison is honestly labeled NOT statistically proven (94.4%
    vs 98.9%, +4.4 pp, CI lower bound -1.1 pp, p=0.219) and is retained rather than
    hidden. Honesty boundaries- Business-set gains are reported descriptively; no
    preregistered significance threshold is claimed for them. Gains reflect complete
    execution, spec-compliant output, and bounded recovery rather than broadened reasoning
    ability.- Version 1 evidence (api.deepseek.com era) is retained as historical
    material; it binds to run-era source that is not in the git history, whereas the
    v2 evidence pack binds to the current source and passes `replay_business_pack`
    deep replay with zero errors on this snapshot.- The development layer is never
    pooled with confirm/fault statistics. Reproducibility- `python -m unittest discover
