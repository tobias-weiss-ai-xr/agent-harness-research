- title: 'ScarfBench: A Benchmark for Cross-Framework Application Migration in Enterprise
    Java'
  date: 2026-05
  url: https://arxiv.org/abs/2605.06754
  category: runtime
  subcategory: ''
  authors:
  - Advait Pavuluri
  - Bridget McGinn
  - Ashita Saxena
  abstract: 'Java remains central to enterprise software, and many applications outlive
    their original architecture. Migrating them across frameworks is a behavior-preserving
    refactoring spanning build configuration, dependency injection, persistence, request
    handling, and deployment. Existing software-engineering benchmarks cover bug fixing,
    feature implementation, and language or version modernization, but leave cross-framework
    refactoring largely unmeasured. We introduce ScarfBench, a benchmark for behavior-preserving
    cross-framework refactoring of enterprise Java applications. It is built from
    expert-written implementation triples across Spring, Jakarta EE, and Quarkus:
    34 applications (29 focused single-layer, 5 whole) yielding 102 variants (~151K
    lines across 1946 source and test files) and 204 directed refactoring tasks. Each
    task gives an agent a working source application and a target framework; the agent
    must synthesize a target implementation preserving the source behavior. Correctness
    is evaluated by an application-specific executable oracle: the candidate must
    compile, deploy in a containerized target runtime, and pass behavioral tests over
    the application''s observable interface. We evaluate five state-of-the-art coding
    agents on ScarfBench. The strongest achieves only 15.3% aggregate test pass on
    focused-layer migrations and 12.2% on whole applications, and only one of the
    204 tasks yields a fully behaviorally equivalent target. Difficulty is asymmetric
    across framework directions and architectural layers: Spring<->Quarkus is the
    most tractable pair, and Jakarta-targeted migrations are hardest. From LLM-as-a-judge
    and expert adjudication of failed-task traces, we derive a taxonomy of recurring
    failure categories spanning build, deploy, and test stages. We release the benchmark,
    harness, and agent traces at https://scarfbench.info.'
  venue: arXiv (Cornell University)
- title: 'Bring Your Own Assurance: Extensible, Composable AI Test and Evaluation
    with CheckMAITE'
  date: 2026-11
  url: https://doi.org/10.1609/aaaiss.v10i1.43417
  category: runtime
  subcategory: ''
  authors:
  - Kenneth Foster
  - Nick Byrne
  - Brandon Geraci
  abstract: 'Practical artificial intelligence (AI) test and evaluation (T&E) is inhibited
    less by a shortage of analyses than by interoperability and reproducibility. Consider
    the computer vision (CV) use case. Datasets sit on disk in many formats, model
    formats and runtimes are more heterogeneous still, label taxonomies disagree even
    within nominal standards, and the ad hoc glue written to bridge these gaps leaves
    no durable record tying a result to the components and configuration that produced
    it. We present CheckMAITE, an extensible, composable T&E harness that addresses
    both interoperability and reproducibility challenges. CheckMAITE''s initial implementation
    addresses subproblems within the relatively mature and stable field of CV, while
    its architectural primitives are mappable to components in T&E pipelines on frontier
    AI use cases such as large language models (LLMs) and multi-agent workflows for
    future implementations. CheckMAITE builds on MIT Lincoln Laboratory''s Modular
    AI Trustworthy Engineering (MAITE) protocols, which define structural component
    interfaces such as Model, Dataset, and Metric. We add two foundational primitives:
    Capability and Run. Capabilities are configurable tests for T&E subproblems such
    as performance, data quality, obustness, and explainability. Runs are content-addressed
    records that bind T&E evidence to the evaluated components. Because the execution
    and evidence core consumes only MAITE''s task-agnostic protocols, new modalities
    are added as modular task packages without changing the harness. We demonstrate
    the harness through a case study that runs a third-party drone-imagery detector
    and dataset through model evaluation, dataset bias, and robustness tools as one
    pipeline. Returned evidence can inform a machine client or a human reviewer as
    one component of a broader certification and authorization pipeline.'
  venue: Proceedings of the AAAI Symposium Series
- title: Vibe Science
  date: 2026-02
  url: https://doi.org/10.5281/zenodo.18663141
  category: runtime
  subcategory: ''
  authors:
  - Elisa Bertelli
  - Carmine Russo
  abstract: 'Vibe Science v5.0 — IUDEX (Claude Code Edition) An AI-native research
    engine for Claude Code that transforms LLM agents into rigorous scientific investigators
    through structural enforcement, not just prompting. Grounded in Huang et al. (ICLR
    2024), who proved that LLMs cannot self-correct reasoning without external feedback,
    v5.0 introduces four architectural innovations that make adversarial review structurally
    unbypassable: - Seeded Fault Injection (SFI) — Injects known errors into claim
    sets before review. If Reviewer 2 misses the seeded faults, the entire review
    is invalid. Mutation testing applied to scientific claims. Gate: V0 (RMS ≥ 0.80).
    - Blind-First Pass (BFP) — Reviewer 2 assesses claims without seeing the researcher''s
    justifications first, breaking anchoring bias. Independent assessment before full
    context. - Judge Agent (R3) — A meta-reviewer that scores Reviewer 2''s work on
    a 6-dimension rubric (Specificity, Independence, Counter-Evidence, Depth, Constructiveness,
    Consistency). Reviews the review, not the claims. Gate: J0 (≥ 12/18). - Schema-Validated
    Gates (SVG) — 8 of the system''s 27 quality gates enforce JSON Schema validation
    against 9 read-only schema files. Prose claims of completion ("confounder harness:
    DONE") are structurally impossible to accept. Core architecture: OTAE-Tree (Observe-Think-Act-Evaluate)
    loop embedded in a branching tree search over hypotheses, with 7 node types, 3
    tree modes (LINEAR, BRANCHING, HYBRID), best-first selection, and automatic pruning.
    Reviewer 2 Ensemble: 4-reviewer adversarial co-pilot operating in 6 modes (BRAINSTORM,
    FORCED, BATCH, SHADOW, VETO, REDIRECT) with a 12-flag mandatory checklist, double-pass
    review (Fatal Hunt → Method Repair), and mandatory counter-evidence search. Confounder
    Harness (Law 9): Every quantitative claim must pass raw → conditioned → propensity-matched.
    Sign change = ARTIFACT (killed). Collapse >50% = CONFOUNDED (downgraded). Survives
    = ROBUST (promotable). Additional subsystems: - 10 Constitutional Laws — non-overridable
    by any agent, protocol, or user request - Evidence Engine with typed claims, geometric
    confidence formula, hard veto thresholds - Serendipity Engine with active radar
    scoring (0–20 scale), cross-branch pattern detection, escalation protocols - Brainstorm
    Engine (Phase 0) with Inversion Exercise, Collision-Zone Thinking, Productive
    Tensions - 5-Stage Experiment Manager with iteration limits per stage - Circuit
    Breaker — same R2 objection ×3 rounds with no state change → DISPUTED (frozen,
    not killed), Stage 5 poison pill - Agent Permission Model — separation of powers:
    R2 produces verdicts but never writes to the claim ledger; R3 scores reviews but
    never modifies them; schemas are read-only for all agents - Knowledge Base for
    cross-research-question persistence - Claude Code hooks for deterministic runtime
    enforcement Runtime modes: SOLO (all roles in one context window) and TEAM (Agent
    Teams with dedicated context windows per role, requires Claude Code experimental
    Agent Teams feature). Battle-tested over 21 sprints of CRISPR-Cas9 off-target
    research, where it caught four confounded claims that would have passed conventional
    AI review — including one with OR = 2.30 and p < 10⁻¹⁰⁰ whose sign reversed under
    propensity matching. Lineage: v3.5 TERTIUM DATUR → v4.0 ARBOR VITAE → v4.5 ARBOR
    VITAE (Pruned) → v5.0 IUDEX'
