  - auto-systems
- title: 'Co-Design Bench: Multimodal Collaborative Coding Evaluation for Agentic
    Models'
  date: 2026-10
  url: https://arxiv.org/abs/2610.35138
  category: runtime
  subcategory: systems
  authors: []
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Evaluating human-AI co-design requires testing whether coding agents
    can translate real users'' multimodal requests into working application revisions.
    We introduce Co-Design Bench, a reference-free benchmark of 273 tasks curated
    from 37,463 deduplicated queries across 26,314 real user coding sessions. Its
    two tracks, Multimodal Editing (ME) and Repository Editing (RE), cover localized
    edits with optional image, audio, video, or document inputs and coordinated repository
    revisions. Tasks span three capability dimensions: Grounded Understanding, UI
    Transformation, and Functional Implementation. The tasks pair normalized requests
    and runnable pre-edit applications with 2,331 hidden expert-authored acceptance
    criteria. Our judge-then-refute protocol grades criteria using source and browser
    evidence, challenges positive verdicts with a separate LLM verifier, and audits
    visual and interaction claims without gold code or target screenshots. Under a
    shared agentic harness, the strongest of ten model endpoints passes an average
    of 69.9% of criteria per task but fully satisfies only 26.4% of tasks. All ten
    endpoints achieve lower criterion completion on repository edits spanning three
    or four change types than on those spanning one or two. Co-Design Bench provides
    a testbed for studying the gap between partial requirement satisfaction and complete
    task success under agentic execution for real-user application revisions.'
  tags:
  - auto-runtime
  - auto-systems
- title: 'Getting Space Right: Agentic Rewards for Image Generation'
  date: 2026-10
  url: https://arxiv.org/abs/2610.14852
  category: runtime
  subcategory: systems
  authors: []
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Reinforcement learning (RL) is promising for spatial text-to-image generation,
    but existing work largely focuses on policy optimization, assuming accurate rewards
    and effective online rollouts. We observe in-domain gains with out-of-domain degradation,
    exposing two limitations: unreliable spatial rewards in open-world settings and
    rollouts lacking basic-to-complex progression. We propose a curriculum-guided
    RL framework. First, we introduce SpatialCritic, an agentic reward model equipped
    with a spatial perception harness that combines reusable verification guidance
    with specialized vision tools. We then construct spatial preference datasets through
    targeted counterfactual perturbations and perform agent-harness alignment to improve
    tool selection and evidence integration efficiently. Second, curriculum learning
    organizes shared foundational capabilities and their compositional dependencies
    in a capability graph for mastery-guided rollouts, periodic review, and targeted
    remediation. On SpaRW-Eval, SpatialCritic achieves 95.1% verification accuracy,
    outperforming 320B GLM-5.3-Flash with a 40x smaller 8B backbone and raising average
    baseline scores from 78.4 to 83.9 on SD3.5-Medium and 83.2 to 86.5 on BAGEL. Project
    page: https://xiaofeng-tan.github.io/projects/spatialcritic/'
  tags:
  - auto-runtime
  - auto-systems
- title: 'JIT-Agent: Scaling Harness Intelligence via Just-in-Time Harness Evolution'
  date: 2026-08
  url: https://arxiv.org/abs/2608.25593
  category: runtime
  subcategory: systems
  authors: []
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Agent capability is not determined by the model alone. The agent harness,
    encompassing memory management, planning strategy, action protocol, and tool/skill
    orchestration, can dominate the contribution of the underlying foundation model.
    Yet harness design remains manual, task-specific, and fundamentally unscalable.
    We present JIT-Agent, a harness intelligence model trained to synthesize task-adaptive
    agent harnesses on the fly for arbitrary off-the-shelf agentic LLMs. We formalize
    the agent harness as a composable, machine-generatable artifact governed by a
    fixed four-module protocol, and train JIT-Agent to customize harnesses for a given
    task at hand, repair harnesses for stable and reliable execution, and self-evolve
    by distilling performance signals from an expanding archive of prior harness configurations.
    Equipped with JIT-Agent as a harness helper, DeepSeek-V4-Flash surpasses GPT-5.6
    on DeepSearchQA (+9.1) and OdysseyBench (+4.3), while the already strong GLM-5.2
    gains up to +20.2 points. Across controlled evaluations, JIT-Agent-generated harnesses
    are performance-competitive with mature agent runtimes such as OpenCode and Claude
    Code and consistently improve multi-scale model families of DeepSeek V4, Mimo-V2.5,
    and Qwen3.6. To our knowledge, JIT-Agent is the first model purpose-built for
    just-in-time harness generation, establishing harness intelligence as a trainable,
    transferable, and compounding dimension of agent capability orthogonal to model
    scaling.
  tags:
  - auto-runtime
  - auto-systems
- title: 'ShinkaEvolve: Towards Open-Ended And Sample-Efficient Program Evolution'
  date: 2025-09
  url: https://arxiv.org/abs/2509.19349
  category: runtime
  subcategory: systems
  authors: []
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'We introduce ShinkaEvolve: a new open-source framework leveraging large
    language models (LLMs) to advance scientific discovery with state-of-the-art performance
    and unprecedented efficiency. Recent advances in scaling inference time compute
    of LLMs have enabled significant progress in generalized scientific discovery.
    These approaches rely on evolutionary agentic harnesses that leverage LLMs as
    mutation operators to generate candidate solutions. However, current code evolution
    methods suffer from critical limitations: they are sample inefficient, requiring
    thousands of samples to identify effective solutions, and remain closed-source,
    hindering broad adoption and extension. ShinkaEvolve addresses these limitations,
    introducing three key innovations: a parent sampling technique balancing exploration
    and exploitation, code novelty rejection-sampling for efficient search space exploration,
    and a bandit-based LLM ensemble selection strategy. We evaluate ShinkaEvolve across
    diverse tasks, demonstrating consistent improvements in sample efficiency and
    solution quality. ShinkaEvolve discovers a new state-of-the-art circle packing
    solution using only 150 samples, designs high-performing agentic harnesses for
    AIME mathematical reasoning tasks, identifies improvements to ALE-Bench competitive
    programming solutions, and discovers novel mixture-of-expert load balancing loss
    functions that illuminate the space of optimization strategies. Our results demonstrate
    that ShinkaEvolve achieves broad applicability with exceptional sample efficiency.
    By providing open-source accessibility and cost-efficiency, this work democratizes
    open-ended discovery across diverse computational problems.'
  tags:
  - auto-runtime
  - auto-systems
- title: 'ACE: Agentic Control for Embodied Manipulation via Zero-shot Workflow Reasoning'
  date: 2026-07
  url: https://arxiv.org/abs/2607.04162
  category: runtime
  subcategory: systems
  authors: []
  venue: ''
  code_url: ''
  project_url: ''
  abstract: General-purpose manipulation requires both semantic reasoning over task
    constraints and reliable execution of contact-rich actions. We present ACE, an
    agentic manipulation harness that composes a high-level language agent with a
    reusable mask-conditioned visuomotor policy. Given an open-ended instruction,
    the agent solves semantic constraints, binds objects to destination roles, and
    decomposes the task into executable transfers represented by tracked pick-and-place
    masks. Execution feedback supports outcome assessment, re-grounding, and retry,
    while persistent object and task context preserves earlier associations when manipulation
    changes visible cues. We evaluate ACE on two physical multi-step tabletop tasks,
    Semantic Formula Assembly and Constraint Retrieval. The visuomotor policy is trained
    only on generic pick-and-place demonstrations and reused without complete demonstrations
    of either evaluation task, enabling task-level zero-shot composition. Across 20
    randomized trials per task, ACE achieves 70% and 80% success, respectively, compared
    with 55% and 70% without persistent context. These results suggest that an agentic
    harness can extend a primitive-trained manipulation policy to semantically distinct
    tasks through explicit object-destination interfaces and closed-loop execution
    feedback.
