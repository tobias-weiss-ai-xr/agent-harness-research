- title: 'AvalancheBench: Evaluating Enterprise Agent-Driven Semantic Query Processing
    Through Latent World Recovery'
  date: 2026-05
  url: https://arxiv.org/abs/2605.24183
  category: runtime
  subcategory: systems
  authors: []
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'As LLMs improve, data agents are emerging as a new interface for analytics,
    while semantic query processing engines use LLMs to operate over structured and
    unstructured data. Existing benchmarks largely evaluate agents and semantic query
    engines in isolation, leaving it unclear whether agents can decide when and how
    to use semantic operators in end-to-end analysis. We introduce AvalancheBench,
    a multimodal enterprise analytics benchmark that generates observed data from
    latent world specifications and evaluates data agents on their ability to recover
    that world. The benchmark''s 3 validated tasks contain 58 questions spanning text,
    images, and documents. Questions are provided together as a multi-part analytical
    brief and may share intermediate results, exposing the avalanche effect: errors
    can propagate through legitimate dependencies, and inappropriate reuse can cause
    otherwise unrelated questions to fail. AvalancheBench measures analytical fidelity,
    monetary cost, and capability-adjusted token cost (CATC), a new metric that weights
    token use by model capability to separate technical efficiency from provider pricing.
    We evaluate 5 model-harness configurations across 3 agent harnesses using Snowflake
    Cortex AISQL as the engine, with the best configuration reaching macro analytical
    fidelity of 0.82. Agents fail primarily in constructing the analysis: failing
    to recover facts that require semantic computation costs 45.1% of lost points,
    yet incorrect operator outputs account for only 2.5%, versus 36.3% from agents
    misusing or avoiding semantic operators. Misinterpreting requirements costs the
    most, at 51.5%. Errors also spread between questions: 29% of lost points come
    from reusing another question''s results. Finally, monetary cost and CATC produce
    different Pareto frontiers, distinguishing economically attractive configurations
    from those that are technically resource efficient.'
  tags:
  - auto-runtime
  - auto-systems
- title: 'CurveShift: Is Agent Progress Scalar? Separating Level from Shape'
  date: 2026-07
  url: https://arxiv.org/abs/2608.00355
  category: runtime
  subcategory: systems
  authors: []
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Progress in large language models is often summarized using a single scalar
    measure, such as a time horizon, a latent ability estimate, or an aggregate benchmark
    score. These summaries capture the overall performance, but they do not test whether
    progress is distributed differently across task difficulty. We find that most
    of the apparent shift in gains toward harder tasks does not reflect a change in
    the shape of the difficulty-response curve. On METR time-horizon data, a single
    Rasch model with rising ability reproduces this pattern, so it is largely explained
    by ceiling effects rather than a qualitative change in capability. This echoes
    how the choice of metric can make claimed emergent abilities look like a property
    of the models themselves. We then identify a smaller hard-task effect that survives
    this control. Isolating it is difficult on agentic benchmarks, because newer models
    are usually run with newer agentic harnesses, so a gain on hard tasks cannot be
    assigned to the model or its scaffold. We break the confound with LiveCodeBench,
    a public competitive programming benchmark that runs no agentic scaffold while
    pairing dated models with an exogenous difficulty ordering. After accounting for
    the rise in overall ability, models released after September 2024 still gain on
    the hardest problems beyond what their easy and medium performance predicts, by
    about +0.40 logits under our most conservative assumption, raising the hard-problem
    solve rate from roughly 18% to 25%. The effect is led by the strongest reasoning
    models and holds for hard tasks that need only short reasoning, not autonomy over
    long horizons. We present this as a result specific to competitive programming,
    since our clean identification rests on a single coding benchmark. We release
    the LiveCodeBench Difficulty Panel (66 dated models x 1,055 problems) and our
    analysis code.
