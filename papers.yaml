- title: The MIDAS Protocol Multi-Turn Invariant Drift Analysis System for Large Language
    Model Interactions
  date: 2025-12
  url: https://doi.org/10.5281/zenodo.17939370
  category: runtime
  subcategory: ''
  authors:
  - Stewart, John
  abstract: 'Abstract Autoregressive large language models exhibit progressive semantic
    drift and contradiction accumulation during extended multi-turn interactions,
    undermining reliability in long-horizon reasoning. While training-time alignment
    techniques such as instruction tuning, RLHF, and retrieval systems shape single
    turn outputs, runtime protocols for stabilizing multi-turn interaction dynamics
    remain under explored. This paper introduces the MIDAS Protocol (Multi-Turn Invariant
    Drift Analysis System), a minimal, falsifiable protocol based on four interaction
    invariants: exact resurfacing, correction immediacy, continuity of state, and
    channel separation. We define operational metrics for drift (D) and preservation
    fidelity (P), provide a dual-LLM evaluation harness, and outline predicted collapse
    modes. No empirical results are reported; instead, three falsifiable predictions
    are articulated to enable independent replication. This work serves as a call
    to action for the systematic study of interaction-time stability in multi-agent
    LLM systems.'
