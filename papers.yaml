- title: 'MOF-VERIFY: A Failure-Aware Agentic Harness for MOF Hypothesis Verification'
  date: 2026-10
  url: https://arxiv.org/abs/2610.03056
  category: runtime
  subcategory: systems
  authors: []
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Large language models are increasingly used as reasoning components in
    AI-driven materials Co-Scientists, yet the reliability of the resulting verification
    pipeline remains unclear. Metal-organic frameworks (MOFs) provide a particularly
    challenging setting because structures may appear under different identifiers,
    synthesis outcomes depend strongly on experimental conditions, evidence is distributed
    across heterogeneous sources, and some hypotheses require computation rather than
    literature alone. We introduce a diagnostic benchmark with four task families
    covering structural grounding, synthesis-condition verification, evidence-sufficiency
    verification, and MLIP-based computational verification. T-MOF-1-3 are evaluated
    under closed-book, retrieval-enabled, and oracle-evidence settings to localize
    failures in knowledge access, evidence acquisition, and reasoning, while T-MOF-4
    separately evaluates computational verification. Guided by these diagnosed failure
    modes, we develop MOF-Verify, a failure-aware agentic harness that targets structural,
    literature, evidence-sufficiency, and computational bottlenecks before producing
    a final verdict. Across multiple backbone LLMs, MOF-Verify improves the reported
    average over direct inference and retrieval-based baselines on this benchmark,
    with gains concentrated in structural grounding and evidence sufficiency. Benchmark
    records and release-status documentation are available at https://github.com/IMMS-Ewha/MOF-Verify-Benchmark.
  tags:
