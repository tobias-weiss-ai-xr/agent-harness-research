- title: 'BioXArena: Benchmarking LLM Agents on Multi-Modal Biomedical Machine Learning
    Tasks'
  date: 2026-05
  url: https://arxiv.org/abs/2605.15766
  category: runtime
  subcategory: ''
  authors:
  - Loka Li
  - Duzhen Zhang
  - Xingbo Du
  abstract: 'Large language model (LLM) agents increasingly automate machine-learning
    model building, yet biomedical benchmarks emphasize question answering, reasoning,
    and tool use or cover narrow slices of biomedical ML coding. We introduce BioXArena,
    a biomedical machine learning (BioML) coding benchmark for task-specific model
    building on heterogeneous, often multi-modal datasets. It contains 76 end-to-end
    tasks across 9 domains: sequence, single-cell, structure, network biology, chemical
    biology, perturbation dynamics, phenotype--disease, imaging, and text-integrated
    tasks. Each task packages primary-source data with hidden labels, held-out graders,
    and biology-aware metrics on a unified 0-to-100 scale; agents write runnable code,
    train models, and predict private test samples. BioXArena emphasizes realistic
    data interfaces: most tasks require agents to integrate multiple input sources,
    including 46 tasks that combine distinct modality families. We compare 18 harness--backbone
    configurations: general-purpose coding, biomedical, and ML agents plus our Minimal
    runner, all under the same controlled resource configuration. Codex with GPT-6
    Astra achieves the highest task-level average score of 73.91 among 18 configurations,
    closely followed by Claude Code with Opus 5.5 (73.79). Matched-backbone comparisons
    show higher observed scores for mature coding systems than for Minimal; seven
    Minimal backends characterize model differences under a fixed runner. Beyond the
    main leaderboard, ablations, robustness checks, and scaling, runtime, and failure-mode
    analyses characterize how backbones, scaffolds, budgets, and domains affect BioML
    coding performance, exposing modeling and execution gaps across agent and LLM
    backbone families.'
  venue: arXiv (Cornell University)
- title: 'ClawSentry: A Progressive Multi-Tier Security Monitor for Safeguarding Autonomous
    LLM Agents'
  date: 2026-08
  url: https://arxiv.org/abs/2608.21101
  category: runtime
  subcategory: ''
  authors:
  - Kai Wang
  - Zeming Wei
  - B. Zeng
  abstract: 'As large language model (LLM) agents move from conversation to executing
    code, reading local files, and orchestrating external tools, a single agent hijacked
    by a malicious third-party skill can cause data exfiltration, privilege escalation,
    or cascading compromise. We argue that agentic risk is progressive: it can enter
    at four loci of the agent control loop--skill admission, invocation-time intent,
    execution-time effect, and post-action consequence--while a denied dangerous objective
    can reappear across surface forms, tools, or turns; existing safeguards are typically
    local to one lifecycle boundary or one call. Guided by this threat model, we present
    ClawSentry, an open-source, framework-agnostic security supervision gateway for
    agent runtimes. Before a skill package is ever executed, First-use Skill Package
    Review (FSPR) audits it under a deterministic evidence floor, escalating unresolved
    cases to bounded read-only agentic review (locus A). At runtime, a three-tier
    progressive decision engine--a deterministic L1 layer, a rule-anchored L2 semantic
    reviewer, and a read-only L3 evidence-seeking agent--spends contextual review
    only on the residual ambiguity, while a session-level anti-bypass mechanism recognizes
    tool-switching and rephrased retries (loci B--C); a post-action path feeds high-severity
    evidence non-retroactively into later review (locus D). An Agent Harness Protocol
    (AHP) abstraction applies one policy across Codex, Claude Code, Kimi CLI, and
    Gemini CLI without modifying agent internals. On SkillInject with Codex/GPT-5.4,
    contextual ASR falls from 39.55% to 2.61% while contextual TSR moves only from
    83.78% to 83.05%. Across five Work Agents on the full SkillsSafety benchmark,
    ClawSentry confines ASR to 9.09--15.03% from 33.5--49.7% unprotected, and aggregate
    TSR on clean skills remains 98.7%.'
  venue: arXiv (Cornell University)
- title: 'RankEvolve: A Reliable Multi-Agent Auto-Research Harness for Evolving Ranking
    Models'
  date: 2026-09
  url: https://arxiv.org/abs/2609.39551
  category: runtime
  subcategory: ''
  authors:
  - Zheng Chen
  - Linfeng Liu
  - Hong Li
  abstract: 'Auto-research agents, LLM systems that propose, implement, train, and
    evaluate model changes across iterations, promise to automate applied ML''s experimental
    loop. Over long horizons, execution accuracy is a binding constraint: a change
    can silently leak held-out data, omit normalization, disconnect a gradient, or
    leave a train/eval flag unwired, invalidating expensive runs and compounding error
    across iterations. We present RankEvolve, an auto-research framework for evolving
    generative ranking models. An Executable Operating Protocol (EOP) declares phases,
    gates, branches, and loops, and the runtime enforces the compiled state machine.
    A meta-meta-harness composes complete black-box coding-agent products, including
    Claude Code and Codex, as execution-graph nodes that review and repair one another''s
    work. In a budget-matched evaluation, heterogeneous composition raises all-oracle
    execution accuracy from the best single-product baseline of 45.8 percent to 62.5
    percent (paired +16.7 points, 95 percent CI [6.6, 26.7]) while achieving a 10.4
    percent silent critical-defect rate. An implemented knowledge layer carries findings,
    including negative results, across iterations. In a twelve-iteration deployment
    on the open-source HSTU recommender, RankEvolve reported NDCG@10 of 0.2192 on
    MovieLens-20M LARGE (+4.48 percent over the published anchor) and 0.1948 on BASE
    (+2.80 percent). ExecML-HSTU, seeded by incidents from that deployment, provides
    the oracle benchmark for the execution-accuracy evaluation. A pre-specified LitGPT
    transfer split replicates the heterogeneous-composition effect beyond recommendation
    (+12.5 points, 95 percent CI [3.0, 22.0]), and a paired ablation isolates per-step
    from full-protocol instruction injection. These results characterize when runtime-controlled
    composition of coding-agent products improves execution accuracy.'
  venue: arXiv (Cornell University)
- title: 'From Harness to cognitive runtime: an architectural hypothesis of control
    plane for AI systems—a theory of cognitive governance toward artificial general
    intelligence'
  date: 2026-08
  url: https://doi.org/10.3724/sp.j.1249.2026.05509
  category: runtime
  subcategory: ''
  authors:
  - Huimin ZHANG
  - Yadong Wei
  abstract: 'The engineering practice of large language models (LLMs) and Agent systems
    is currently facing a structural dilemma: seemingly disparate technical approaches,
    such as LangGraph, reinforcement learning from human feedback (RLHF), and Guardrail,
    are all optimizing execution efficiency on the same "cognitive map", yet they
    universally lack a meta-cognitive capability to determine whether the current
    cognitive map itself remains valid. This study argues that this dilemma is not
    accidental but a structurally inclined manifestation of the "compression-residual"
    structure inherent in any finite cognitive system under long-term operation and
    continuous environmental adaptation. To address this, an architectural theory
    of cognitive runtime is proposed. The core thesis is that LLMs generate cognitive
    content, while the cognitive runtime manages the lifecycle of cognitive states.
    The main contributions include: ① proposing "complexity-capability divergence
    (CCD)" as a working concept for diagnosing the long-term evolutionary trajectory
    of cognitive systems, and clarifying its distinction from existing concepts such
    as concept drift and technical debt; ② revealing that the fundamental driving
    force behind the continuous expansion of Harness systems is the misalignment between
    token loss and business loss objectives, and pointing out that scaling optimizes
    the accuracy of selection among existing frameworks rather than the meta-selection
    capability of deciding whether to abandon the current framework; ③ presenting
    a systematic definition of the cognitive runtime—a system layer responsible for
    creating, maintaining, evaluating, migrating, and reorganizing the lifecycle of
    cognitive states—and arguing for its plausibility and principled justification
    as an independent system layer; ④ outlining the possible evolutionary path of
    the cognitive runtime from "state maintenance" to "ontological evolution", and
    clarifying the role of humans as value boundary setters and paradigm supervisors
    within this architecture. The core contribution of this paper is not to propose
    a new Agent framework, but to abstract "cognitive framework switching" as an independently
    manageable runtime behavior, and thereby to propose the cognitive runtime as a
    new system layer. This study presents a testable theoretical hypothesis and provides
    five falsifiable predictions. The mathematical representation and evolutionary
    algorithms of cognitive state space remain open questions. The aim of this paper
    is to provide a discussable, revisable, and falsifiable conceptual framework for
    future research.'
  venue: JOURNAL OF SHENZHEN UNIVERSITY SCIENCE AND ENGINEERING
- title: 'Skills as Verifiable Artifacts: A Trust Schema and a Biconditional Correctness
    Criterion for Human-in-the-Loop Agent Runtimes'
  date: 2026-04
  url: https://arxiv.org/abs/2605.00424
  category: runtime
  subcategory: ''
  authors:
  - Alfredo Metere
  abstract: 'Agent skills - structured packages of instructions, scripts, and references
    that augment a large language model (LLM) without modifying the model itself -
    have moved from convenience to first-class deployment artifact. The runtime that
    loads them inherits the same problem package managers and operating systems have
    always faced: a piece of content claims a behavior; the runtime must decide whether
    to believe it. We argue this paper''s central thesis up front: a skill is untrusted
    code until it is verified, and the runtime that loads it must enforce that default
    rather than infer trust from a signature, a clearance, or a registry of origin.
    Without skill verification, a human-in-the-loop (HITL) gate must fire on every
    irreversible call - which is operationally untenable and degrades into rubber-stamping
    at any non-trivial scale. With skill verification treated as a separate, gated
    process, HITL fires only for what is unverified, and the system becomes sustainable.
    We give a trust schema that includes an explicit verification level on every skill
    manifest; a capability gate whose HITL policy is a function of that verification
    level; a biconditional correctness criterion that any candidate verification procedure
    must satisfy on an adversarial-ensemble exercise; and a portable runtime profile
    with ten normative guidelines abstracted from a working open-source reference
    implementation. The contribution is harness- and model-agnostic; nothing here
    requires retraining, fine-tuning, or proprietary infrastructure.'
  venue: arXiv (Cornell University)
- title: 'OpenClaw-Bench: Reproducible Evaluation of Multi-Agent Harnesses for Multi-Step
    Tool-Use Tasks'
  date: 2026-08
  url: https://doi.org/10.1109/csmla70906.2026.11724415
  category: runtime
  subcategory: ''
  authors:
  - Shuo Zhang
  abstract: 'Large language model (LLM) agents are increasingly expected to operate
    external tools, browse information, edit files, execute code, and deliver task
    artifacts. However, many practical tasks are not single-turn question-answering
    problems; they require multi-step planning, tool invocation, intermediate-state
    management, failure recovery, and result verification. This paper presents OpenClaw-Bench,
    a reproducible experimental protocol for evaluating governed multi-agent harnesses
    on multi-step tool-use tasks. The protocol is motivated by OpenClaw, a Supervisor-Worker
    runtime designed to make long-horizon tool use more governable without repeating
    implementation details in the abstract. We define a benchmark covering five task
    families: file and data processing, code repair, evidence-grounded web research,
    document generation, and cross-tool workflows. The proposed evaluation compares
    a single-agent tool user, a naive multi-agent baseline, the full OpenClaw harness,
    and five ablated variants. Metrics combine automated checks, LLM-as-a-judge scoring,
    human calibration, execution-cost accounting, tool-use correctness, collaboration
    quality, and error recovery. By formalizing task cards, system variants, scoring
    dimensions, and statistical procedures, OpenClaw-Bench provides an implementation-ready
    protocol for studying reliability in long-horizon tool-use tasks.'
  venue: International Conference on Computer Science, Machine Learning and Agents
    (CSMLA)
- title: 'LLM as API Server: A System-Prompt-Defined Runtime for Natural-Language
    Endpoint Routing, Tool Calling, and Database-Backed Execution'
  date: 2026-01
  url: https://doi.org/10.2139/ssrn.6840900
  category: runtime
  subcategory: ''
  authors:
  - Loai Abdalslam
  abstract: ''
  venue: SSRN Electronic Journal
- title: 'Containment over Detection: Cryptographic Boundary Enforcement for Prompt
    Injection Defense in Agentic LLM Systems'
  date: 2026-07
  url: https://doi.org/10.21203/rs.3.rs-10196595/v1
  category: runtime
  subcategory: ''
  authors:
  - Saurabh Sharma
  abstract: 'Abstract Prompt injection—the manipulation of an LLM-based agent through
    adversarial content embedded in user input—poses a critical security risk in production
    agentic systems with access to sensitive datastores and code execution environments.
    Detection-based defenses (keyword filtering, learned classifiers) suffer from
    a fundamental accuracy–latency tradeoff and fail to address the root cause: the
    absence of a syntactic boundary between instructions and data in LLM context windows.
    We present a containment-based defense architecture that shifts the security objective
    from detecting malicious input to rendering injection attempts structurally inert.
    The defense comprises four composable layers: (1) ephemeral cryptographic token
    generation providing 256 bits of boundary entropy, (2) input canonicalization
    eliminating encoding-based bypass vectors, (3) token-authenticated XML envelope
    wrapping with server-side escape validation, and (4) behavioral prompt grounding
    that leverages the envelope as a trust signal. We formalize the security guarantee
    and prove that, under a black-box attacker model without oracle access to the
    runtime token, the probability of crafting a valid boundary escape is negligible
    (\(\le 2^{-256}\)). The architecture is validated through 15 machine-checkable
    correctness properties using the Hypothesis property-based testing framework—three
    of which caught security-critical bugs before production deployment. Empirical
    evaluation against 547 adversarial patterns drawn from four established attack
    corpora (Garak, OWASP LLM Top 10, HarmBench prompt injection subset, and a custom
    multilingual probe set) demonstrates a 94.3% syntactic containment rate; the 5.7%
    residual failures are confirmed to be model-level semantic jailbreaks orthogonal
    to input-layer defense. Measured runtime overhead is <0.5ms per request. The evaluation
    harness and property specifications are released as open-source.'
  venue: Research Square
- title: 'Bridle: A Fail-Closed POSIX Harness and Deterministic Integration Sensor
    for Autonomous AI Coding Agents'
  date: 2026-09
  url: https://doi.org/10.5281/zenodo.22803322
  category: runtime
  subcategory: ''
  authors:
  - Mario Quintero Pulice
  abstract: 'Autonomous AI coding agents often treat a locally compiling diff as a
    finished engineering task. An agent creates a new module, checks that the syntax
    is valid, sees isolated unit tests pass, and ends the turn reporting success---even
    when the module is never imported by any entrypoint, never registered in runtime
    wiring, still contains unresolved Git conflict delimiters, or defers implementation
    with NotImplementedError. We call this pathology hallucinated completion. Prompting
    an LLM to ``always wire your files and verify completion'''' is prompt therapy:
    under token pressure and deep recursion, compliance decays. Nesting a second ReAct
    loop inside the IDE harness creates terminal contention, duplicates semantic indexes,
    and adds latency. This paper presents Bridle, a zero-dependency, fail-closed POSIX
    harness for agents running inside Cursor. Taking as given that an agent is the
    sum of a model and a harness, Bridle does not replace the host loop. It enforces
    mechanical invariants across four frozen hooks, anchors evidence to Git tree hashes,
    and adds a static integration sensor (complete_gate.sh) that emits a confidence
    score in $[0, 100]$ and a binary machine verdict (Act, exit 0, vs. Escalate, exit
    3). On a 12-case benchmark corpus of framework edge cases, Bridle raises detection
    accuracy from 0.583 to 1.000, with 1.000 recall on incomplete work and a 0.000
    false-positive rate, at 85 ms per-turn overhead across a 374-test formal gauntlet.'
  venue: Zenodo (CERN European Organization for Nuclear Research)
- title: 'Persistent Billable State: Denial-of-Wallet Attacks and Defenses in Tool-Calling
    LLM Agents'
  date: 2026-09
  url: https://arxiv.org/abs/2609.28585
  category: runtime
  subcategory: ''
  authors:
  - 张晋千
  - Haojun Xia
  - Shujiang Wu
  abstract: 'Multi-step tool-calling LLM agents rely on host runtimes to preserve
    state across turns. When a runtime carries an external tool return into later
    model inputs, providers meter it again. An admitted malicious or compromised tool
    can thereby convert untrusted data into recurring victim-billed processing without
    victim credentials or local runtime privilege. We call retained content persistent
    billable state and formalize the host''s decision over whether and how it enters
    later billable context as the persistent billable-state boundary. We present the
    first systematic security study of this post-admission lifecycle. We derive six
    denial-of-wallet attack vectors and build DOW-BENCH, an end-to-end harness evaluated
    across six model families. Across 243 executions, usage telemetry shows that the
    maximum per-session cumulative input reaches 14,293x the session''s first-call
    input. Controlled history-policy reruns isolate raw retention''s contribution:
    retaining raw history increases mean effective session cost by 21.2-35.9%. Compression
    succeeds on 10/12 and 11/12 history-dependent tasks, versus 2/12 under deletion
    for each provider. To govern this boundary, we combine deterministic history transformation
    with four host-side invariants that bound prompt mass, context growth, recursive
    opportunity, and cumulative spend before reingestion. The kernel contains every
    recurring attack in the 123-evaluation replay corpus. Across 24 Mistral Small
    4 workflows, a progress-authorized policy achieves 22/24 oracle-verified task
    successes with no pre-completion interruptions, versus 13/24 under a fixed cap.
    Only 71 of 3,830 scanned MCP server and transport repositories expose any code-visible
    safeguard proxy, and none cover all four safeguard families. These results establish
    persistent billable state as a first-class security object and pre-reingestion
    as its host-owned control point.'
  venue: arXiv (Cornell University)
- title: Harness Engineering as Categorical Architecture
  date: 2026-05
  url: https://arxiv.org/abs/2605.12239
  category: runtime
  subcategory: ''
  authors:
  - Bogdan Banu
  abstract: 'The agent harness, the system layer comprising prompts, tools, memory,
    and orchestration logic that surrounds the model, has emerged as the central engineering
    abstraction for LLMbased agents. Yet harness design remains ad hoc, with no formal
    theory governing composition, preservation of properties under compilation, or
    systematic comparison across frameworks. We show that the categorical Architecture
    triple (G, Know, Phi) from the ArchAgents framework provides exactly this formalization.
    The four pillars of agent externalization (Memory, Skills, Protocols, Harness
    Engineering) map onto the triple''s components: Memory as coalgebraic state, Skills
    as operad-composed objects, Protocols as syntactic wiring G, and the full Harness
    as the Architecture itself. Structural guarantees-integrity gates, quality-based
    escalation, supported convergence checks-are Know-level certificates whose preservation
    is structural replay: our compiler checks identity and verifier replay, not output-layer
    correctness or model behavior. We validate this correspondence with a reference
    implementation featuring compiler functors targeting Swarms, DeerFlow, Ralph,
    Scion, and LangGraph: the four configuration compilers preserve three named certificate
    types by identity or replay, and LangGraph preserves the same certificates through
    its shared per-stage execution path. The LangGraph compiler creates one node per
    stage using the same per-stage method as the native runtime, providing LangGraph-native
    observability without reimplementing harness logic. An end-to-end escalation experiment
    with real LLM agents confirms that the quality-based escalation control path is
    model-parametric in this two-model, one-task experiment. The result positions
    categorical architecture as the formal theory behind harness engineering.'
  venue: arXiv (Cornell University)
- title: Agentic Torch2JAX - Automated PyTorch-to-JAX Model Translation with Multi-Agent
    LLMs
  date: 2026-01
  url: https://dr.lib.iastate.edu/handle/20.500.12876/106436
  category: runtime
  subcategory: ''
  authors:
  - Aprameya Madhwaraj
  abstract: The translation of deep learning models from PyTorch to the JAX framework
    represents a significant operational bottleneck in computational research and
    industrial deployment. While PyTorch provides dynamic computational graphs suitable
    for prototyping, JAX offers optimized compilation and distributed training capabilities
    required for scaling. Manual translation between these frameworks is labor-intensive
    and prone to systemic errors. Initial evaluation indicates that single-shot code
    generation with standard Large Language Models produces unreliable results. These
    base models struggle with framework-specific API fidelity, frequently hallucinate
    functions, and inappropriately retain PyTorch paradigms within the functional
    JAX context. This report presents an automated multi-agent translation runtime
    that reliably converts PyTorch scripts into executable JAX and Flax code. The
    proposed architecture replaces the single-shot generation paradigm with an iterative
    pipeline consisting of code generation, static validation, isolated execution,
    and automated repair. The system utilizes a designated Translation Agent to generate
    baseline code from strict instruction prompts. A deterministic static validation
    script then normalizes the syntax and checks for residual PyTorch dependencies.
    The sanitized code is executed within a secure, resource-constrained container
    sandbox, with interchangeable Docker and Apptainer backends so the same pipeline
    can run on a developer workstation or on a high-performance computing cluster.
    Upon execution failure, a Debugging Agent analyzes the standard error and standard
    output logs to synthesize targeted code patches. This loop continues until the
    code successfully compiles and runs or a predefined retry budget is exhausted.
    The system is evaluated over a curated corpus of PyTorch tasks categorized by
    implementation difficulty. The runtime functions as an end-to-end evaluation harness
    that records raw model generations, repaired JAX scripts, and structured error
    logs to facilitate post-hoc comparative analysis. By automating the debug-and-repair
    loop, the multi-agent framework produces runnable JAX code and establishes a comprehensive
    dataset of model-specific capabilities and failure taxonomies for framework translation.
  venue: Iowa State University Digital Repository (Iowa State University)
- title: 'Beyond Guardrails: Runtime Enforcement for Secure AI Agents-A Systematic
    Review of Action Control, Isolation, and Policy Enforcement'
  date: 2026-10
  url: https://doi.org/10.62762/jrsc.2026.526903
  category: runtime
  subcategory: ''
  authors:
  - Jimmy Ming‐Tai Wu
  - Lingping Kong
  - Matin Pirouz
  abstract: 'Large language model (LLM) agents turn model-generated decisions into
    tool calls, API requests, code execution, data access, and transactions. When
    agent reasoning is manipulated or simply wrong, model-centric guardrails cannot
    by themselves stop the resulting action. We systematically reviewed runtime-enforcement
    mechanisms for autonomous and tool-using AI agents in literature published or
    publicly available from January 2023 to September 2026. Searches of Compendex
    and the Web of Science Core Collection, followed by deduplication, multi-stage
    screening, source-grounded eligibility assessment, and targeted snowballing, yielded
    58 primary studies, which we coded by enforcement placement, security mechanism,
    and assurance type. Most studies enforce security at the tool/action boundary
    (33/58, 56.9%) or inside the agent runtime or harness (18/58, 31.0%), whereas
    only 7/58 (12.1%) work primarily at the OS/process/execution boundary. Authorization
    and privilege control (41/58, 70.7%) and action validation (34/58, 58.6%) are
    the most common mechanism families. Across very different mechanisms and assurance
    models, a common design emerges: the model proposes an action, and a separate
    enforcement point decides whether that action may take external effect. Durable
    authorization, multi-agent delegation, cross-layer enforcement, recovery from
    partially committed effects, and standardized evaluation remain open problems.
    These findings suggest that secure agent architectures should separate reasoning
    from execution authority and place consequential actions behind independently
    enforceable runtime boundaries.'
  venue: Journal of Reliable and Secure Computing
- title: 'Demoting the Master Control Program: Deterministic Orchestration of a Fleet
    of LLM Agents'
  date: 2026-07
  url: https://doi.org/10.5281/zenodo.21613791
  category: runtime
  subcategory: ''
  authors:
  - Ânderson Quadros
  abstract: 'Multi-agent systems that build software usually coordinate their agents
    through a language model: an orchestrator reasons in prose about who works next,
    whether a task is done, and when to involve the human operator. That puts a probabilistic
    component on the control path of a system whose value depends on reliability,
    and it holds orchestration state inside a process that cannot be safely interrupted.
    Recent work argues the inverse for a single workflow: fix an explicit blueprint
    and confine the model to bounded steps (Qiu et al., arXiv:2508.02721). We lift
    that paradigm to the harder problem of orchestrating many concurrent, long-lived
    agentic builders, and present a deterministic finite-state orchestrator in which
    a fixed dispatch loop advances every unit of work by table lookup over a closed,
    lint-validated vocabulary, and the model never chooses the next step. The claim
    is the paradigm rather than the artifact. A deterministic control plane is built
    to design out the coordination, long-horizon, and self-verification failures that
    published work attributes to LLM-routed orchestration — a design claim we ground
    in that failure literature, not in a head-to-head baseline (§15) — while keeping
    the operator in contact through an agent they can talk to. The central invariant:
    the model builds, but a deterministic gate decides done. We trust neither the
    agent''s report nor the commit. We report a pre-registered campaign of 74 orchestrated
    delivery runs on one immutable engine build (three ablation arms, a wide-parallelism
    arm, and a main @2 configuration run to a clean target of 30, at 34 attempts),
    plus a separate post-hoc 5-run PROJECT-04 extension (15 blocks, seven dependency
    layers, nearly twice as wide and ~40% deeper). The headline reliability configuration
    — PROJECT-03 main @2 — delivered 30 of 34 clean (88%, an optional-stopping estimate).
    Across all 74 campaign runs — which also fold in ablation and wide-parallelism
    arms, where walls are rare at this scale — 70 were clean, and the fixed-build
    extension delivered 5/5: every declared block built, landed, and re-validated
    on trunk with zero operator intervention, each product passing separate in-house
    probes. The four non-clean runs are reported in full, and three never touched
    the engine''s decision path: two were our own test harness leaking state between
    trials and one was an external API outage. The fourth was a real engine defect,
    since fixed with regression tests, and even then the engine refused to fake a
    result. Every one failed safe: the orchestrator escalated rather than close work
    it had not done, and under the operator-dark protocol the run terminated there.
    The gate''s rejection behavior is shown directly by six by-construction false-done
    fixtures (five seeded shortcuts and one trunk-only defect, on the fixed pin v0.0.30
    with engine, gate, and vocabulary unmodified), all six rejected, none landed.
    Across the 79 delivery runs no worker ever attempted to close work it had not
    done, so the 0-of-79 false-completion count is observational: evidence about worker
    behavior, not the gate under fire. The gate''s strength is the 6-of-6, a small
    adversarial sample, and the rule of three bounds the miss rate only at ≤50%. No
    clean run needed the operator; the only pages were those four. When reality misbehaved,
    the system said so instead of faking green. Beyond our own benchmarks, the same
    runtime delivered clean on two MIT 6.5840 labs the course specified and tested
    — MapReduce and the full Raft lab, 2 of 2 — a first check that gate-decided done
    transfers to acceptance criteria we did not write (reported separately, not pooled
    into the campaign rates; §15).'
