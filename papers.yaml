  abstract: 'Demian DinéYazhi''s 2019 piece, my ancestors will not let me forget this,
    glows as a chemical remembrance for a world stolen by colonial terror and in joyful
    celebration of the United States'' inevitable undoing. As the cover image for
    this issue, Demian''s neon and aluminum sign is perhaps most urgently a reminder
    for us all that genocide is recursive, illuminating the words, “every American
    flag is a warning sign.” Demian''s piece, along with Leslie Feinberg''s insistence
    that anti-imperialism is Pride''s precondition and Major''s read of it all, offers
    not simply an alternative path for trans analysis and action but also one that
    confronts where we assume “trans” properly lives. Rather than wading into disciplinary
    formations, here we suggest, with them, that colonialism''s death symbolizes trans
    life as much as, if not more than, a pink and blue flag ever could. This is perhaps
    another way of suggesting that the only banner under which we might find trans
    liberation is that of total communization and the end of the state form as we
    know it.This special issue emerges from exhaustion. Seemingly endless cycles of
    reform-decay, boom-bust, and progress-pacification erode our capacity to think
    beyond forms of mediation and resolve. Within this time of despair and dreams,
    how do we keep abolition dangerous? How do we keep our people safe? Against aimless
    defeatism and generic alterity, many of us feel captured by the current moment''s
    contradictions. Stuck, perhaps, but not lost. Here, rather than conceding to what
    Nat Raha (2017: 632) calls our “states of brokenness,” how can we find a way out
    of, or at least through, the manifold crises of racial capitalism''s durability?While
    this special issue travels with the terms anti-imperialism, anarchism, and abolition,
    they are neither presented as interchangeable nor offered as antagonisms. These
    capacious signs offer us ways of reading the unfolding present as much as they
    guide us toward the necessity of direct action. Rather than, once again, reproducing
    a struggle between communists and anarchists, which lives primarily on the page,
    we think about where the two meet. This is not to silence their necessary differences
    but to gesture toward inhabiting how such differences lead us somewhere else.
    In other words, we are less concerned with the intricacies of these differentiations
    than we are with learning together new possibilities of destroying the world that
    is destroying us.We offer this issue as nondefinitive and against the very idea
    of the last word. Like any writing, it can only represent fragments of possibility,
    especially when possibility seems to escape us. We intentionally built this collection
    around a series of conversations with insurgents who are producing vital trans
    theory outside, and oftentimes against, the academy. While some are antagonistic
    to the idea of a classroom, others remain more ambivalent; however, they are all
    writing/doing/thinking from prison cells, SROs (single room occupancy housing),
    squats, or on the streets. This is not to cathect onto spaces of imagined alterity,
    but to reaffirm our commitment to knowledge''s beautiful flow. We also chose to
    include the work of a number of more junior scholars whose work pushes us. While
    never enough, we are committed to making this volume accessible to those in prisons
    and without institutional affiliation. Though we have made every effort to decenter
    the academy as the basis of our study, we also recognize the limits of our editorial
    vision for this issue. Our hope, nevertheless, is that this range of intellectual
    and teachable materials might inspire even a glimmer of the unruliness that has
    halted the construction of new carceral facilities and set fire to police stations.Out
    from under a mound of curls a white woman flashed a bright smile accented by thickly
    drawn red lipstick as she walked down Market Street in San Francisco. As she is
    clad in a mélange of pin-backed buttons from various global anti-racist struggles,
    one could almost overlook the thickly taped stock Winchester rifle she brandishes
    with a grin (fig. 1). Sure the rifle was fake, so what? Gripping this rifle sure
    as hell did more to intimidate her enemy than clutching and waving a rainbow flag.
    To be clear, Tede Matthews was not marching with the new proto-police snitch squad
    the “Lavender Panthers,” started by SF Pride cofounder Raymond Broshears.1 No,
    Matthews, a queer poet, drag performer, and organizer, is arming herself against
    the US government. The rifle signified for Matthews the need for fabulously militant
    queer direct action against the mounting US imperial violence being waged throughout
    the global South, in Southeast Asia, Africa, and particularly in South and Central
    America.To understand what led Matthews to take to the streets, as she often did,
    is to consider both the possibility and impossibility of anti-imperialist movement
    building in the United States, a question that Matthews''s good friend and comrade
    June Jordan pondered in her own writings. Jordan (1975: 41), who would later offer
    a eulogy to Matthews when she died of AIDS in 1993, asked what could be done to
    halt the violent procession of US empire: What does life and death mean to us,
    in America? Are we capable of grief, of something like atonement? Or are we limited
    to a boundless capacity for backslapping the winner-types? Can we undertake a
    moral response to death, to the losers of life and destiny: can we atone for the
    lives we take away, the destinies we shunt into extinction? These queries are
    not rhetorical: I am thinking of Chile. Where is the outcry, the movement from
    nausea, from shame, from silence, into an act, a rising, that will redeem, that
    will attempt to redeem that recent historic slaughter?Matthews undoubtedly heard
    the call of her would-be comrade, Jordan, and was up to the challenge, because
    she already was an out and proud draft dodger and anti-war activist. Just a few
    years before arriving in San Francisco, Matthews had fled to Boston to avoid conscription
    in the US imperialist war in Vietnam. When FBI (Federal Bureau of Investigation)
    agents surveilling anti-war activists tracked Matthews down and showed up to his
    door and demanded he turn up for military induction, “He [Matthews] showed up
    in high femme attire and camped his way through the army physical, declaring at
    one point, ‘Dahling, I AM a homosexual fantasy!’ and convincing doctors he was
    unsuitable” (Hobson 2016: 73). Matthews had been, as he would for much of the
    1970s, living as a woman, getting by on drag gigs and sex work money, but most
    often identified as a “faggot, sissy or a queen,” identities that also appeared
    in the title of a workshop Matthews led on anti-rape and anti-femmephobia (72).Not
    long after moving to San Francisco, Matthews joined a group in which he likely
    met Jordan, Gays in Solidarity with Chilean Resistance (GSCR), which formed in
    response to the US-backed fascist coup in Chile to overthrow socialist leader
    Salvador Allende. The 1970s in Chile marked a period of brutal antigay repression,
    and groups like GSCR attempted to document, share information, and stage direct
    actions. When drag performer Lola Puñales was brutally tortured, raped, castrated,
    and killed by Augusto Pinochet''s death squads, queer and trans collectives were
    among the few groups responding to the antiqueer enormity perpetuated by the US-backed
    fascist regime. In 1974 the GSCR staged a direct action and picket line around
    the Chilean consulate in San Francisco, barring anyone from entering and demanding
    an end to the violent persecution of queer people and all people in Chile under
    the authoritarian Pinochet regime. GSCR organized a solidarity action with the
    radical sex worker collective COYOTE (Call Off Your Old Tired Ethics) to have
    sex workers refuse service to sailors from the Chilean ship the Esmerelda who
    had been the military perpetrators of Pinochet''s torture programs of queer Chilean
    civilians. This organizing was not only done by queer “outsiders” but also queer
    Chilean exiles who fled Pinochet''s most concentrated purges for the Bay Area
    throughout the mid-1970s.Small, communal channels of queer communication and support
    sustained this radical internationalist organizing. For instance, Matthews temporarily
    served on the San Francisco Sentinel, one of the many platforms for a new generation
    of queer internationalist and anti-imperialist politics in the Bay Area. Rather
    than the monopolized sprawl of what we now know as social media, periodicals like
    the Sentinel focused on smaller nodes of connectivity, which seemed to make such
    politics all the more possible, even in the face of the utter nonresponse Jordan
    observed to the steady march of US empire.Far worse than the apathy Jordan decried,
    queer political concern would quickly turn toward homosexual rights and other
    modes of participation in assimilatory pro–US democratic processes that were imperialist
    at their core. In the fight for access to and participation in the global corporations
    and war machine that Matthews fled and foiled, the political will to gain admission
    to state power was easily assimilated into the objectives of US empire. The desire
    for incorporation and the legacy of such conscription have made queer/trans internationalism,
    as Jordan forewarned, unlikely, if not impossible. Any fragmented sustenance,
    real or imaginatively gained, from participation and representation in such imperial
    projects remains merely incidental, temporary, and selectively doled out.,It is
    not as if trans internationalism was, in Matthews''s time, being constructed “on
    behalf” of a projected other. As her own flight from conscription and warmongering
    attests, it was out of shared interests to live in the demise of US empire. In
    the early 1980s in San Francisco, a group of anarchists and communists came together
    to form Lesbians and Gays Against Intervention or LAGAI (Meronek 2016, 2018).
    LAGAI, which Matthews, Deeg Gold, Cole Benson, and several others cofounded, was
    specifically organized as a response to escalated US intervention and its state-sponsored
    resourcing of El Salvadorian fascist death squads in the late 1970s and early
    1980s. Trans/queer groups like LAGAI, along with one of its later offshoots, Queers
    Undermining Israeli Terrorism (QUIT), coordinated their work with active anti-imperialist
    struggles abroad while cohering an anti-assimilation politics that sought to dismantle
    the US war machine from within.“Assimilation is NOT liberation” was a frequent
    LAGAI slogan throughout the Reaganite 1980s. During the first Iraq invasion, LAGAI
    deployed an even campier slogan and campaign, “We like our queers out of uniform,”
    complementing ACT UP''s famous interruption of a CBS evening news broadcast with
    their demand to “fight AIDS, not Arabs.” LAGAI and other anti-imperialist queer/trans
    groups organized de-recruitments to deprive the largest death squad in the world,
    the US military, of its human resource. Groups like LAGAI nourished this legacy
    of queer anti-imperialism, culminating, in 2003, in the largest street protest
    in the history of the Bay Area, the “Direct Action to Stop the War” directed against
    the US invasion of Afghanistan and the second invasion of Iraq. As in the broader
    period of the 1990s, the early aughts saw growing political education and radicalization
    around queer Palestinian and anti-Zionist liberation.Today we might read Jordan''s
    and Matthews''s efforts as simple calls for solidarity. But solidarity assumes,
    too easily, that the shroud of representation benefits us at the expense of punishing
    a southern global other. Instead, these historical actions rebuke our conditional
    individuation to collectively demolish the systems that kill and imprison us.
    Matthews''s life of queer caring and militant presence names something far broader
    than solidarity, which obscures how the fight to bring down the pillars of US
    imperialism is simultaneously a fight for our lives.Meanwhile, our enemies make
    friends in the public places from which we are increasingly evicted. Tech companies
    like Google and Meta not only enjoy less militant opposition but also employ a
    small but significant managerial class of trans bourgeoisie to defend and expand
    their reach.2 These mostly white (but rapidly diversifying) trans techies design
    missile-guidance systems and drone navigation software, while waving their corporate-branded
    rainbows amid the gentrifying tourist event of SF Pride, which invades the very
    streets Matthews once patrolled in fierce defiance.3This iteration of trans visibility
    covers up the millions of Black and Brown deaths made anonymous via biometric
    and AI warfare, and it deepens the incalculable loss of Indigenous and colonized
    trans life in the global South taken through military-contracted corporate ecocide.
    Trans internationalism, then, must militantly abolish our with and the us, and
