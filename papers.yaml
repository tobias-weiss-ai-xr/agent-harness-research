  - auto-systems
- title: Natural-Language Agent Harnesses
  date: 2026-03
  url: https://arxiv.org/abs/2603.25723
  category: runtime
  subcategory: systems
  authors: []
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Agent performance is strongly shaped by the surrounding harness: the
    external execution system around a model that organizes a task run. Yet this logic
    is usually buried in tightly coupled controller code, which makes harnesses hard
    to inspect, compare, transfer, and ablate. This paper asks whether the reusable
    design pattern of an agent harness can be represented as an executable natural-language
    object. We introduce Natural-Language Agent Harnesses (NLAHs), editable documents
    that describe run-level harness policy, and Intelligent Harness Runtime (IHR),
    a shared runtime that interprets these documents into agent calls, handoffs, state
    updates, validation gates, and artifact contracts. Across coding, terminal-use,
    and computer-use benchmarks, IHR-executed NLAHs achieve comparable task outcomes
    to code and prompted realizations, while exposing much shorter static harness
    policies. Module ablations further show that explicit harness modules are analyzable.
    These results suggest that agent harnesses can be turned from incidental glue
    around models into scientific representation objects.'
  tags:
  - auto-runtime
  - auto-systems
- title: 'VeRO: A Harness for Agents to Optimize Agents'
  date: 2026-02
  url: https://arxiv.org/abs/2602.22480
  category: runtime
  subcategory: systems
  authors: []
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'An important emerging application of coding agents is agent harness optimization:
    the iterative improvement of a target agent by editing and evaluating its code.
    Despite its relevance, the community lacks a systematic understanding of coding
    agent performance on this task. Harness optimization differs from conventional
    software engineering: agent harnesses interleave deterministic code with stochastic
    LLM completions, requiring structured capture of both intermediate execution traces
    and downstream outcomes. To address these challenges, we introduce (1) VeRO (Versioning,
    Rewards, and Observations), an outer harness that provides versioned snapshots,
    budget-controlled evaluation, and structured execution traces of target harnesses,
    and (2) VeRO-Bench, a benchmark suite of target agents and tasks with reference
    evaluation procedures. Using VeRO, we conduct an empirical study comparing optimizers
    across tasks and analyzing which modifications reliably improve target agent harnesses.
    We release VeRO to support research on agent optimization as a core capability
    for coding agents. Code is available at https://github.com/scaleapi/vero.'
  tags:
  - auto-runtime
  - auto-systems
- title: 'HeavySkill: Heavy Thinking as the Inner Skill in Agentic Harness'
  date: 2026-05
  url: https://arxiv.org/abs/2605.02396
  category: runtime
  subcategory: systems
  authors: []
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Recent advances in agentic harness with orchestration frameworks that
    coordinate multiple agents with memory, skills, and tool use have achieved remarkable
    success in complex reasoning tasks. However, the underlying mechanism that truly
    drives performance remains obscured behind intricate system designs. In this paper,
    we propose HeavySkill, a perspective that views heavy thinking not only as a minimal
    execution unit in orchestration harness but also as an inner skill internalized
    within the model's parameters that drives the orchestrator to solve complex tasks.
    We identify this skill as a two-stage pipeline, i.e., parallel reasoning then
    summarization, which can operate beneath any agentic harness. We present a systematic
    empirical study of HeavySkill across diverse domains. Our results show that this
    inner skill consistently outperforms traditional Best-of-N (BoN) strategies; notably,
    stronger LLMs can even approach Pass@N performance. Crucially, we demonstrate
    that the depth and width of heavy thinking, as a learnable skill, can be further
    scaled via reinforcement learning, offering a promising path toward self-evolving
    LLMs that internalize complex reasoning without relying on brittle orchestration
    layers.
  tags:
  - auto-runtime
  - auto-systems
- title: 'AgenticRAG: Agentic Retrieval for Enterprise Knowledge Bases'
  date: 2026-05
  url: https://arxiv.org/abs/2605.05538
  category: runtime
  subcategory: systems
  authors: []
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'We present AgenticRAG, a practical agentic harness for retrieval and
    analysis over enterprise knowledge bases. Standard RAG pipelines place significant
    burden of grounding on the search stack, constraining the language model to a
    fixed candidate set chosen deep in the retrieval process. Our approach reduces
    this overdependence by layering a lightweight harness on top of existing enterprise
    search infrastructure, equipping a reasoning LLM with search, find, open, and
    summarize tools enabling the model to iteratively retrieve information, navigate
    within documents, and analyze evidence autonomously. On three open benchmarks
    we observe substantial gains: 49.6\% recall@1 on BRIGHT (+21.8 pp over the best
    embedding baseline), 0.96 factuality on WixQA (+13\% relative improvement), and
    92\% answer correctness on FinanceBench--within 2 pp of oracle access to true
    evidence. Ablation studies show that the most significant factor is the shift
    from single-shot retrieval to agentic tool use (5.9\times improvement), while
    multi-query search and in-document navigation contribute to both quality and efficiency.
    We present various design choices in our agentic harness that were informed by
    pre-production deployments. Our results demonstrate its suitability for real-world
    enterprise production environments.'
  tags:
  - auto-runtime
  - auto-systems
- title: 'CAX-Agent: A Lightweight Agent Harness for Reliable APDL Automation'
  date: 2026-05
  url: https://arxiv.org/abs/2605.15218
  category: runtime
  subcategory: systems
  authors: []
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Large language models deployed for MAPDL finite-element simulation face
    practical reliability challenges: without structured execution control, tool encapsulation,
    and fault recovery, outputs may be inconsistent and task failures are common.
    The Agent Harness paradigm addresses this by inserting domain-specific orchestration
    middleware that manages tool lifecycles, workflow state, and recovery escalation.
    This paper presents the architecture of CAX-Agent, a lightweight agent harness
    purpose-built for MAPDL automation, and empirically evaluates one of its core
    components -- the recovery policy.CAX-Agent organizes execution into three layers
    -- LLM service, agent harness, and solver backend -- with a recovery ladder that
    escalates from deterministic rule patching through model-driven regeneration to
    context enrichment and human intervention. We evaluate three recovery strategies
    (no_recovery, rule_only, and model_only) on 50 standard structural benchmarks
    with three repeated runs per strategy (450 case-runs total). Two independent human
    raters score task completion under blind conditions; inter-rater agreement is
    strong (quadratic weighted Cohen''s kappa = 0.84, 96 percent of score pairs within
    one point). Model_only achieves the best completion rate (0.9267), task score
    (3.59/4), total score (9.16/10), and zero-intervention rate (0.84), outperforming
    rule_only (0.7733, 3.17/4, 7.03/10, 0.00) and no_recovery (0.6933, 2.74/4, 5.60/10,
    0.00) with large effect sizes (Cliff''s delta = 0.81-0.87). The benchmark uses
    deliberately simple geometries to isolate recovery-policy effects; we discuss
    the scope of these findings and directions for broader validation.'
