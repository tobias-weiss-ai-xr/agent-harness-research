    (isSupplementTo). 中文摘要:本作品为 LLM Agent 的可靠性平台实现与评测——以同一模型(DeepSeek-V4-Flash)对普通
    ReAct 与"任务验证 + 失败诊断 + 有界恢复"的 Harness 做对照。实现层证据:权威锚层 3/27 → 27/27、受控恢复 0/18 → 18/18;当前源码业务评测(v2):确认集
