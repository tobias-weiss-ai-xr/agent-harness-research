- title: 'PREreview of "RepoRescue: An Empirical Study of LLM Agents on Whole-Repository
    Compatibility Rescue"'
  date: 2026-10
  url: https://doi.org/10.5281/zenodo.23111061
  category: runtime
  subcategory: ''
  authors:
  - Karmendra Pandey
  abstract: 'This Zenodo record is a permanently preserved version of a PREreview.
    You can view the complete PREreview at https://prereview.org/reviews/23111062.
    Summary This paper introduces compatibility rescue: adapting a repository that
    demonstrably worked in its historical environment but fails after runtime/dependency
    drift (Python 3.13 / JDK 21 with current dependencies), where the agent receives
    only the repo and the failing modern environment — no issue description or fault
    localization. RepoRescue contains 193 Python repos (47 unmaintained, 146 "time-travel"
    snapshots from just before a maintainer''s own compatibility fix) and 122 Java
    repos, each admitted only after passing its unmodified suite in a reconstructed
    historical environment (Phase 0) and failing deterministically after modernization
    (Phase 1). Five deployed agent systems are tested on Python (four on the shared
    Claude Code harness plus GPT-5.2 via Codex) and three on Java. Beyond full-patch
    pass rate, the authors report post-hoc source-only success (test edits stripped),
    runtime-blocked source-only success (test edits blocked in-session), and post-PASS
    validation (realistic scenarios + bug-hunt probes) on 34 unmaintained Python rescues.
    Findings: Claude Code systems depend on forbidden test edits in 38–53% of apparent
    successes (vs. 4% for GPT-5.2/Codex); successes are complementary (union 62.7%
    vs. best single 51.8%); L4 whole-codebase coordination is a cliff (Codex 14/14,
    Claude Code ≤2); of 34 suite-passing rescues, 22 survive realistic scenarios and
    12 survive bug-hunt. Strengths The three-phase admission construct is excellent.
    Requiring each subject to pass historically and fail after modernization — with
    frozen environments handed identically to every system — is a genuine advance
    over static benchmarks and directly addresses the staleness/contamination worries
    in agent evaluation. 68,895 Phase-0 tests (median 165/repo) give the "once worked"
    claim teeth. The evaluation stack is the paper''s best contribution. Full-patch
    vs. post-hoc source-only vs. runtime-blocked vs. post-PASS scenario validation
    operationalizes the exact question practitioners ask during model validation:
    what does a green suite actually prove? I build production AI agent frameworks,
    and the gap between "the suite is green" and "the fix is real" is where validation
    failures hide — making it measurable is valuable. In our own framework work, we
    learned that guardrails have to live in the agent''s instruction files themselves:
    precise, concise directives about what the agent may and may not touch. Verbosity
    is its own failure mode — too much instruction dilutes the context window and
    the agent drifts off course. We give each agent a dedicated task file and link
    agents to each other through file descriptions, so every agent knows its boundaries
    and when to hand off to another. The paper''s runtime-enforcement result validates
    this approach empirically: constraints don''t just limit agents, they improve
    them. The runtime-enforcement result is genuinely novel. Blocking test edits raises
    Kimi from 22.8% (post-hoc source-only) to 41.5% — the same agent produces source
    repairs it skipped when the shortcut existed. Compliance-as-capability matters
    for deployment guardrails: how you constrain an agent changes what it can do,
    not just what it may do. The threats-to-validity discussion is admirably honest
    — κ=0.76 with the L2/L3 boundary flagged, ±5–10 repo drift bounds, a "no tests
    ran" audit (1.4% bound), no direct Python/Java rate comparison. The PyCG→Scalpel
    cascade (a two-layer failure the 29 unit tests miss but a downstream wrapper exposes)
    makes the suite-insufficiency point concrete. Major comments/issues 1. Headline
    claims rest on single-trial estimates. The L4 cliff (14/14 vs. ≤2) and the +10.9pp
    union gain inherit the single-trial-per-cell variance the authors themselves bound
    at ±5–10 repos, with provider sampling defaults an acknowledged residual confound
    (sampling parameters not reported as fixed). For a benchmark offered as a comparison
    instrument, the 14 L4 repos and a stratified Medium-tier sample should be re-run
    3× per system so the cliff carries uncertainty, not just a point estimate. 2.
    The shortcut taxonomy is too binary and may overstate gaming. ~90% of "shortcut"
    edits are "plausible API adaptations inside tests" (e.g., nose→pytest); only ~10%
    are direct bypasses (skip/xfail, assert relaxation). But the cerberus example
    shows the tests themselves import drift-removed modules (pkg_resources) — the
    test files are also broken by the same failure, and migrating them is legitimate
    maintenance (human maintainers modify tests in 9.9% of time-travel fixes). Lumping
    drift-induced test migration with genuine gaming inflates the "38–53% depend on
    forbidden test edits" narrative. A graded taxonomy — drift-induced migration vs.
    assertion weakening vs. outright bypass — would be more honest and more useful.
    From a practitioner''s standpoint, the fix is architectural, not just taxonomic:
    in production agent frameworks, test files and configuration files should be outside
    the agent''s editable scope by default, with any test edit requiring explicit
    human approval and any logic change triggering mandatory re-review. A written
    "do not edit tests" rule in the prompt is not enough; the boundary needs to be
    enforced by the harness, which is exactly what the paper''s runtime-blocked condition
    demonstrates. 3. RQ4 rests on a small, Python-only sample. "22 of 34 work realistically,
    12 survive bug-hunt" is carefully reported, but it is 34 unmaintained Python candidates
    and Java post-PASS validation is future work. The abstract''s framing is fair;
    broader "practical reuse" language should stay scoped to the sample, and the Java
    post-PASS protocol ideally pre-registered for comparability. 4. Deployment economics
    are missing and they are first-order. 1,717 trials on commercial systems, sessions
    of 21–206 messages, failed sessions running 29–58% longer (p<0.01) — yet no cost/latency
    data. Cost-per-successful-rescue dominates any practitioner adoption decision,
    and the turn-count gap is already a cost signal. Even rough per-trial inference
    costs in an appendix would help. Please also record sampling parameters — "provider-side
    sampling defaults remain a residual confound" implies defaults were used, limiting
    reproducibility. 5. Time-travel vs. unmaintained equivalence deserves a harder
    look. The GEE regression finds repo_type non-significant (p=0.75), but time-travel
    snapshots come from active repos at pre-fix commits with maintainer ground truth
    — a cleaner, better-specified task than truly abandoned repos. The aggregate coefficient
    doesn''t rule out different difficulty-tier distributions; an Easy/Medium/Hard
    split by repo_type would show whether the 146 snapshots quietly shape headline
    rates. 6. Surface the "no tests ran" audit in the main text. The 1.4% bound (6/436
    PASS outcomes, concentrated in wssh) lives in §8, but the Phase-2 gate is exactly
    what should catch empty runs. A sentence in §3.2 naming the failure mode and per-trial
    flags would show the guard is monitored, not just defined. Minor comments/issues
    - Table 1''s L1 row is n=4 — worth noting alongside the "L1/L2 mostly routine"
    claim. - The false-completion detector''s wide interval (adjusted prevalence 32–76%)
    warrants the exploratory framing §5.3 mostly gives it. - The Java pom.xml normalization
    is reasonable and disclosed, but it is itself a human rescue step; when readers
    compare the Java union (88.5%) with Python (62.7%), it deserves a foreground reminder,
    not just §3.1/§5.5. Overall A strong, carefully constructed paper on a real problem
    — I have watched teams burn weeks resurrecting abandoned-but-depended-on libraries,
    and the requests-html example (1M+ monthly downloads, no release since 2019) will
    resonate with practitioners. The evaluation stack genuinely advances how we validate
    agent work. My major comments ask for uncertainty on the headline comparisons,
    a fairer test-edit taxonomy, and the deployment-economics data practitioners need.
    I would be glad to see this published once those are addressed. Competing interests
    The author declares that they have no competing interests. Use of Artificial Intelligence
    (AI) The author declares that they used generative AI to come up with new ideas
    for their review.'
  venue: Zenodo (CERN European Organization for Nuclear Research)
- title: 'Run data and analysis code for "How Credentials Leak from ''Safe'' LLM Coding
    Agents: An Attack-Surface Measurement"'
  date: 2026-08
  url: https://doi.org/10.5281/zenodo.21860162
  category: runtime
  subcategory: ''
  authors:
  - Adrian Asher
  abstract: 'Per-run results and analysis code behind every rate reported in the paper
    "How Credentials Leak from ''Safe'' LLM Coding Agents: An Attack-Surface Measurement"
    (under review, Springer Cybersecurity). The study measures whether an indirect
    prompt injection can drive an LLM coding agent to complete credential exfiltration,
    not merely whether it is redirected, as a function of the channel the injection
    arrives through, across 16 agents from five vendors. All measurements are the
    undefended baseline (no runtime judge, filter, or approval gate). Each result
    file is one cell containing every repetition in runs[] with the full turn-by-turn
    transcript (assistant text and tool calls with inputs and outputs) and per-run
    signals: exfiltrationDetected (with egressChannel), maliciousArtifactEmitted,
    scriptAudited, and payloadDelivered. Contents: - 01-injection-map/ — the 16 ×
    8 channel map (Table 3) and the within-channel T4 concealment sweep, organised
    by channel then model.- 03-egress-axis/ — the five-way egress axis (README-delivered
    and command-output-delivered), the delayed-trigger variants, and the off-account
    external-canary collector log.- 04-hygiene/ — the three coupling vectors: execution
    (T-STAGE), install (T-SLOP), and output (T-EMIT) hygiene.- 05-temit-precision-audit/
    — the output-hygiene detector-precision audit: the stratified 45-blob sample,
    the blind labels, an author-verified human relabel (human_labels.json), and the
    precision-corrected per-model counts.- scripts/ — the crossed random-effects logistic
    model / deviance decomposition (r2_1_variance_decomp.py) and the false-positive
    classifier (temit-fp-classify.mjs).- per-cell-counts.csv — the per-cell aggregate
    underlying every reported rate; README.md maps each paper table and figure to
    its data. Ethics and safety: all experiments use a synthetic canary credential
    (.env.test) and a collector bound to localhost; no production system, third-party
    service, or real secret was accessed. Canary strings (CANARY-*, AKIACANARY, sk-ant-CANARY,
    sk_live_CANARY) are the planted test secrets and are expected throughout the transcripts.
    Internal hostnames, endpoint identifiers, and source IP addresses that incidentally
    appeared in the test environment have been redacted. Caveats (see the paper''s
    Limitations and the README): the external-canary results (the image-GET validity
    check and the Gemini T-SLOP split) are scored from the collector''s server-side
    log, included here, rather than the in-harness canary; the Gemini column is on
    a preview endpoint (gemini-3.1-pro-preview, Vertex global, probed August 2026)
    and is not decoding-matched to the other frontier models.'
  venue: Zenodo (CERN European Organization for Nuclear Research)
- title: Harness Engineering for Software Engineering via Modular Executable Dev-Primitives
  date: 2026-10
  url: https://arxiv.org/abs/2610.07832
  category: runtime
  subcategory: ''
  authors:
  - Haibo Jin
  - Xinjie Li
  - Peng Kuang
  abstract: Large language models (LLMs) equipped with terminal access have demonstrated
    strong capabilities in automating software engineering tasks. However, existing
    agents remain brittle on long-horizon workflows, where they must repeatedly reconstruct
    program state scattered across source files, configurations, tests, dependencies,
    and runtime behavior, leading to increasingly long interaction histories, context
    explosion, and semantic drift. Large repositories further complicate the identification
    of task-relevant components. To address these challenges, we introduce \textbf{Dev-Primitives}
    (\emph{Development Primitives}), a modular and executable abstraction that transforms
    repository components from passive software artifacts into active participants
    in software engineering. Each Dev-Primitive pairs a repository artifact with a
    resident LLM, which gives the artifact an agent-native interface grounded in its
    own implementation and dependencies, enabling natural-language reasoning, inter-component
    communication, and localized self-modification. Building on Dev-Primitives, we
    propose \textbf{HERMES}, a Harness Engineering framework for software engineeRing
    via Modular Executable Dev-PrimitiveS, which instantiates these primitives at
    repository scale through a dependency-aware dynamic activation mechanism and a
    bug diagnosis mechanism that maps execution evidence back to the components that
    must be revised. Extensive experiments on four software engineering benchmarks
    demonstrate that HERMES outperforms matched baseline harnesses by 12.4\% on average.
    Moreover, when paired with strong activation and diagnosis models, HERMES, even
    with Qwen3-8B Dev-Primitives, remains within 4.5\% of the homogeneous GPT-5.6
    Sol configuration across all four benchmarks, while reducing inference cost by
    26.2\% on Terminal-Bench 4.0, highlighting the importance of harness design in
    software engineering agents.
  venue: arXiv (Cornell University)
- title: 'Self-Driving ERP: An Autonomous Enterprise System Integrating Sixty AI Capabilities,
    from LLMs and RAG to AI Agents'
  date: 2026-11
  url: https://osf.io/vg8x9
  category: runtime
  subcategory: ''
  authors:
  - Salim Thowfeek
  abstract: 'This research presents the Self-Driving ERP, an autonomous enterprise
    system in which 60 AI capabilities, from large language models (LLMs) and retrieval-augmented
    generation (RAG) to AI agents, are built into ten ERP modules: Sales & CRM, Purchase,
    Inventory, Accounting, HR & Payroll, Projects, Manufacturing, Helpdesk, Reporting
    & BI, and a Developer Studio. Modelled on the components and six levels of automation
    of self-driving cars, the system senses business events, understands documents
    and voice, reasons with a shared pool of models, acts through the ERP''s own transactions,
    stops at a risk gate when stakes are high, and hands control to a person with
    an explanation. The paper specifies a layered architecture (ERP core, perception,
    knowledge and memory, cognitive core, agent runtime, interaction layer, plus governance
    and operations planes) and provides an open-source reference stack on the Odoo
    framework with 24 reference implementations, covering hybrid RAG, cost-aware model
    routing, LoRA fine-tuning, demand forecasting, anomaly detection, invoice extraction,
    MCP tool servers, a risk-gated agent loop, PII redaction, a tamper-evident audit
    ledger, evaluation harnesses and deployment. Nine reproducible experiments on
    synthetic ERP and software-operations data test the core mechanisms: forecast
    error fell from 17.3% to 15.0% WAPE; fraud-style anomaly detection rose from 0.814
    to 0.997 AUROC; a risk gate automated 67% of actions while leaving only 12.2%
    of error cost unreviewed, against 48.9% for a value-only limit; production incidents
    were detected 23 times out of 24 with five times fewer false alarms; and all 1,000
    tampering attempts on the audit ledger were caught. A worked example estimates
    payback in under five months for a 40-person company. A comparison with SAP, Oracle,
    Microsoft Dynamics 365, Odoo, Zoho and ERPNext shows where the Self-Driving ERP
    is stronger (affordability, privacy, bilingual Arabic-English use and measured
    safety) and where commercial suites remain ahead. The paper also covers the history
    of AI and ERP, AI for software engineering, governance aligned with ISO/IEC 42001
    and the NIST AI RMF, an implementation roadmap, the future of AI skills and a
    research agenda. It extends the author''s earlier study of AI app builder platforms
    (https://doi.org/10.5281/zenodo.19280643). This work is a preprint and has not
    been peer-reviewed.'
  venue: OSF Preprints (OSF Preprints)
- title: 'Harness Evolution Hits a Ceiling: When Weight Training Should Begin'
  date: 2026-10
  url: https://arxiv.org/abs/2610.11655
  category: runtime
  subcategory: ''
  authors:
  - Yuan Tian
  - Bing Hu
  - Hao Wang
  abstract: 'Improving a long-horizon LLM agent means evolving the harness around
    a frozen model or training its weights. We let a self-evolving harness make the
    system stronger first, then cross seed and evolved harnesses with base and trained
    weights to learn which gains the trained model keeps and which still need the
    runtime. We show that the right lever can be read off the agent''s failure composition:
    labelling failed trajectories by the first signal that fires separates process
    failures (blocked calls, loops, exhausted step budgets) from content failures
    (a delivered plan that is poor). Harness evolution repairs the former, the behaviour
    it instils can be trained into the weights, and content failures are what weight
    training is for. On DeepPlanning, a self-evolving harness loop lifts the held-out
    score of Qwen3.5-4B from 0.16 to 0.30 and of Qwen3.5-9B from 0.32 to 0.44; for
    4B, held-out delivery rises from 55% to 90% while content failures are left for
    the weights. LoRA adapters trained on evolved-harness trajectories internalise
    the gain: under the original harness they add +0.13 on held-out tasks for both
    sizes; on 4B they stack with the harness to more than double the held-out score,
    and on 9B the adapter alone matches the full evolution line, cutting content failures
    from a quarter of trajectories to one in twenty. A placebo adapter trained on
    answer-shuffled trajectories falls below the base model. The loop transfers to
    WebArena-Lite (+0.09 on 117 unseen tasks), where the gain lives in what the model
    sees and adapters do not add to it. The result is a diagnose-then-intervene rule
    applied twice: read the failure composition to choose between harness and weights,
    then read what the accepted edits changed to decide which gains to train in. Scores
    are four-rollout means against fresh anchors, same-night except where marked,
    across eight models from six families and two benchmarks.'
  venue: arXiv (Cornell University)
- title: 'The Macrokit Pattern: Intent Routing and Macro Distillation for Weak LLMs
    on Narrow Workflows'
  date: 2026-05
  url: https://doi.org/10.5281/zenodo.20412771
  category: runtime
  subcategory: ''
  authors:
  - Cheng Qian
  abstract: 'Most production LLM applications today face a forced choice between frontier-API
    models (capable, expensive, network-dependent) and weak or local models (cheap,
    private, fragile). We describe an alternative architecture — intent routing plus
    macro distillation — that obviates this choice for narrow, parameterizable workflows
    on opaque external surfaces. The architecture moves each workflow''s encoding
    to design-time, with a strong model supervising a developer, and confines the
    runtime LLM to one-shot intent classification against a registry of pre-encoded
    macros. Multi-step reasoning happens once, offline. Runtime is routing. We report
    results from a pre-registered 100-task benchmark across six maintainer-agent macros.
    A 7B local model (Qwen 2.5 7B Instruct Q4_K_M, ~4.4 GB) on a 16 GB MacBook achieves
    94.5% intent-routing accuracy with zero structural failures. The methodologically
    important finding is the two-run story: a first run of the same model on the same
    corpus, with the same harness but before a single SDK fix, scored 53.5%. The model''s
    capability on routed workloads was sufficient in both runs; what changed was one
    configuration choice about how the SDK rendered argument names to the model. We
    additionally describe a CLI-enforced cultural artifact — the distillation gate
    — that we argue is the more durable contribution: every session interacting with
    an un-encoded workflow must encode it as a new macro before terminating. We deliberately
    publish no cloud-API comparison rows; the harness ships open, and frontier comparisons
    are explicitly community work.'
  venue: Zenodo (CERN European Organization for Nuclear Research)
- title: 'ShieldMCP: An Interactive System for Runtime Security of Model Context Protocol
    Tool Calls'
  date: 2026-01
  url: https://doi.org/10.18653/2026.emnlp-demos.20
  category: runtime
  subcategory: ''
  authors:
  - Saurabh Yergattikar
  abstract: 'The Model Context Protocol (MCP) lets large language model agents call
    external tools, and that tool channel has become a security liability: poisoned
    tool metadata, injected instructions in tool responses, and malicious servers
    can subvert an agent while never touching the user''s prompt.These risks are increasingly
    well documented, but hard to experience: most defenses exist as prose or prototypes.We
    present SHIELDMCP, an interactive, deployment-ready system that makes both the
    attack and the runtime defense tangible in a browser.SHIELDMCP operates as a transparent
    proxy between the LLM client and any MCP server, performing threestage validation:
    pre-call description integrity, outbound parameter sanitization, and postresponse
    analysis, all without modifying either the agent or the server.The demonstration
    exposes the full pipeline through a browser interface in which visitors launch
    curated attacks, watch each validation stage execute live with per-token highlighting
    of the detected payload, and submit their own tool descriptions, call parameters,
    or tool responses to a playground that runs the real detector.On a framework benchmark
    of 487 attack and 200 benign scenarios across 40 MCP servers, the default rule-based
    backend reduces the overall attack success rate to 8.6% (from a 70.9% undefended
    baseline measured against live agents in a companion study) at a median added
    latency under 20 ms; an optional fine-tunedclassifier backend reaches near-zero
    on this benchmark, though we show this is a withindistribution result that does
    not yet transfer to paraphrased, multilingual, or encoded attacks.SHIELDMCP is
    open-source under the Apache-2.0license and installable with a single pip command;
    every framework number in this paper is reproducible from the shipped harness.'
  venue: 'Conference on Empirical Methods in Natural Language Processing: System Demonstrations
    (EMNLP)'
- title: 'Behavioral Controllability of Agentic Models for Information Extraction:
    From Fixed Workflows to Reflective Agents'
  date: 2026-07
  url: https://arxiv.org/abs/2607.15715
  category: runtime
  subcategory: ''
  authors:
  - Lujia Zhang
  - Xingzhou Chen
  - Hongwei Feng
  abstract: Large language model (LLM) agents are increasingly used for complex information-extraction
    tasks, yet it remains unclear whether agentic components such as reflection and
    memory lead to observable and controllable improvements over fixed LLM workflows.
    We study this question through conference-paper dataset extraction, where a system
    must identify datasets mentioned in scholarly PDFs and produce structured records.
    We compare a fixed workflow baseline with reflective agent variants and specify
    an optimized agent condition (S2) that extends the same task with richer PDF tools
    and dynamic tool selection. Our evaluation emphasizes process-level behavior--including
    tool execution, retries, reflection, memory use, runtime, and failure recovery--while
    treating extraction coverage and field completeness as secondary outcome measures.
    The paper characterizes when agentic mechanisms change system behavior, whether
    these changes improve task completion, and how the observed failure modes motivate
    an optimized agent design under the same evaluation harness.
  venue: arXiv (Cornell University)
- title: 'Towards Long-Horizon Agents: A Survey'
  date: 2026-07
  url: https://doi.org/10.20944/preprints202607.1328.v1
  category: runtime
  subcategory: ''
  authors:
  - Guanting Dong
  - Xiaoshuai Song
  - Yuyang Hu
  abstract: 'With the rapid advancement of LLM capabilities, expectations for AI agents
    are shifting from solving simple, single-turn tasks toward carrying out long-horizon
    tasks in the real world. We refer to such systems as long-horizon agents: agents
    that plan over extended horizons, interact with real-world environments, recover
    from their own mistakes, and adapt their strategies during execution. This capability
    is rapidly becoming the central bottleneck for practical agent intelligence. Despite
    this progress, the field still lacks a shared definition and taxonomy for long-horizon
    agents. Related concepts such as "self-evolving" or "autonomous" agents are often
    used interchangeably, none of which clearly captures what it means to build a
    long-horizon agent. This gap leaves the community without a principled way to
    attribute advances in long-horizon competence. This paper offers a unified landscape
    by framing long-horizon agency as the co-evolution of an externalized harness
    and an internalized optimization, and organizes the paper around six connected
    perspectives: Foundation, Evolution, Harness, Optimization, Application, and Frontier.
    We first formalize long-horizon agency as a harness-coupled decision process and
    distinguish it from neighboring concepts such as long-running execution, autonomy,
    and self-evolution. We then trace the field''s evolution from prompt-level control
    to runtime agent systems, classifying existing work through the complementary
    lenses of externalized harnesses and internalized optimization. Building on this
    view, we organize five application forms of long-horizon agents by their interfaces,
    and review the corresponding benchmarks and resources. Finally, we discuss key
    challenges and frontier directions. Looking ahead, we hope this paper serves not
    only as a reference for existing work, but also as a foundation for building the
    next generation of capable, reliable long-horizon agents.'
  venue: Preprints.org
- title: 'Evaluating Skills, Not Just Agents: Agentic Continuous Evaluation of Skills'
  date: 2026-08
  url: https://arxiv.org/abs/2608.20614
  category: runtime
  subcategory: ''
  authors:
  - Christopher Kevin
  - Narendran Raghavan
  - Jean‐François Puget
  abstract: 'Enterprise agent programs are moving from prototypes into production,
    where reusable skills, tools, and workflow packages must be reviewed with evidence
    rather than prose. Current gates often scan these artifacts for structure, style,
    and security, but they do not answer the deployment question: does the capability
    package help a live agent complete enterprise tasks under the same model, sandbox,
    and grading policy? We present ACES (Agentic Continuous Evaluation of Skills),
    a repository-native framework for evaluating skills and product capability packages
    as executable agent artifacts. ACES runs paired live trials with and without a
    target skill, normalizes trajectories into the Agent Trajectory Interchange Format
    (ATIF), grades six default runtime metrics, and reports Skill Lift: the target
    skill''s added value for a fixed task, harness, workspace, and scorer. The same
    protocol supports product-owned task suites that compare baseline, skill, bundle,
    team-skill, and plugin targets. On 145 real skills from internal enterprise repositories
    and public catalogs, scan-only gates surface useful authoring issues but measure
    complementary facets (structural versus LLM-judge Spearman $ρ= 0.14$). Across
    947 scored paired cases from 58 of 64 production skills and four primary harnesses,
    mean composite Skill Lift is 0.2134 (95\% paired-case CI [0.1967, 0.2301]); mean
    outcome-only lift, the average of accuracy and goal accuracy, is 0.1799. Composite
    lift is positive in 72.8\% of paired cases. The largest process-metric gains appear
    in skill execution, behavior check, and skill efficiency---signals about discovery,
    routing, workflow following, and tool use that document scans cannot observe.
    An open-source implementation of the methodology is available in NVIDIA SkillEvaluator.'
  venue: arXiv (Cornell University)
- title: 'NVIDIA-labs OO Agents: Native Python Object-Oriented Agents'
  date: 2026-07
  url: https://arxiv.org/abs/2607.20709
  category: runtime
  subcategory: ''
  authors:
  - Paul Furgale
  - Severin Klingler
  - James Nolan
  abstract: 'Traditional agent development is split across prompt templates, tool
    schemas, callback code, and workflow graphs. We present NVIDIA Object-Oriented
    Agents (NOOA), a model-agnostic Python framework for building reliable AI agents.
    NOOA takes a simpler approach: an agent is a Python object. Its methods are the
    actions the model can take, fields are its state, docstrings are its prompts,
    and its type annotations are contracts. A method whose code body consists of "..."
    is completed at runtime by an LLM-driven agent loop, while methods with normal
    bodies remain standard deterministic Python. This gives developers and agents
    the same interface, so agent behavior can be tested, traced, refactored, and improved
    just like other software. This paper makes three contributions. (1) We present
    the agent-as-a-Python-object programming model and the design principles behind
    it. Where Python has existing abstractions, we adopt them directly. Agent-specific
    capabilities--context, events, state rendering, long-term memory, and validated
    LLM loops--are exposed through simple Pythonic APIs, so both developers and agents
    share one familiar programming model. (2) We identify six model-facing ideas that
    NOOA is, to our knowledge, the first to combine on a single surface: typed input/output,
    pass-by-reference over live objects, code as action, programmable loop engineering,
    explicit object state, and model-callable harness APIs for context and events.
    We find the community already converging on several of these ideas--often as experimental
    or partial features--and present the comparison to encourage further adoption.
    (3) We demonstrate that current models use this interface effectively, both in
    targeted capability tests and on agentic and reasoning benchmarks such as SWE-bench
    Verified and Terminal-Bench 2.0 and ARC-AGI-3.'
  venue: arXiv (Cornell University)
- title: 'SAGE: Symbolic Action-Gating and Editing for LLM Task Planners'
  date: 2026-09
  url: https://arxiv.org/abs/2609.34268
  category: runtime
  subcategory: ''
  authors:
  - Trung Minh Bui
  - 문종술
  - YoungOuk Kim
  abstract: 'Large language models (LLMs) are now the default cognitive core of embodied
    household agents, yet the plans they emit are rarely checked against a grounded
    model of the environment before execution, and the task-success they report is
    often measured on benchmarks so saturated that no method can be separated from
    another. We present SAGE (Symbolic Action-Gating and Editing), a single-LLM planner
    built from two lightweight mechanisms: a domain-agnostic symbolic gate (~250 lines
    of Python, zero tokens, $O(|π|)$) that blocks precondition-violating actions with
    typed reasons as a runtime safety monitor, and a local edit that regenerates only
    the failed sub-goal''s suffix, keeping completed and untouched work intact; a
    hybrid seed+live memory store supports cold-start coverage. We evaluate under
    a leak-free protocol (leave-one-out retrieval) over five open-weight models and
    a 75-task AI2-THOR benchmark. On the standard benchmark goal-completeness saturates
    (52% of instances trivially solved) and SAGE ties strong hierarchical baselines.
    On a harder, method-agnostic multi-goal composition, SAGE''s completeness lead
    re-emerges large (+0.06 to +0.23 across four models). Under injected mid-execution
    failures, SAGE recovers as reliably as whole-plan replanners at 2.4-3.3x fewer
    LLM calls. As a verify-before-execute gate, the symbolic monitor blocks unsafe
    actions before actuation and raises simulator-reported step-success for every
    planner tested (up to +0.11), a signal the verifier never sees (non-circular).
    Because the gate calls no model (0.008 ms/plan), it is a safety layer that runs
    essentially free on the edge: SAGE planning reproduces its quality on a Jetson
    AGX Orin, where small-model verification helps most. We release the benchmark,
    the leak-free protocol, the recovery and safety-gate harnesses, and a verifier-portability
    study (auto-induced on ALFWorld, 0.89 held-out).'
  venue: arXiv (Cornell University)
- title: A Multi-Agent LLM System for Autonomous Detection, Diagnosis and Repair of
    Micro-Frontend Integration Failures
  date: 2026-09
  url: https://doi.org/10.5281/zenodo.22677057
  category: runtime
  subcategory: ''
  authors:
  - Ibrahim Khalil Shehada
  - Lamis Fedaa Samhan
  - Basel Hassan Lubbad
  abstract: 'Modern web applications are increasingly assembled at runtime, not build
    time. A micro frontend architecture stitches a single user-facing product together
    out of fragments — a product list, a cart, a checkout flow — each built, deployed
    and owned independently by a different team. It''s a pattern already in production
    at DAZN, Ikea and Starbucks. It is also a pattern that fails in ways no single
    fragment can see on its own: a shell requests a shared library version a remote
    no longer exports; a renamed event field silently corrupts data in two other fragments
    that were never touched; one remote''s CSS bleeds into another''s layout. These
    are integration failures, not code defects, and today they are found by a human
    staring at a broken page — or not found at all. We set out to measure, not assume,
    how visible these failures actually are, and then to close the gap with a system
    that watches for them, works out which fragment is genuinely at fault, and fixes
    it without a human in the loop. The measurement came first, and it was uncomfortable.
    Of five representative micro frontend integration failures we injected into a
    working application, two — a violated event contract and a leaked stylesheet —
    wrote nothing to the browser console in a production build. Every agentic diagnosis
    system we could find in the literature, including systems already deployed at
    Google and Meta, is built around exactly that signal. That''s not a flaw in those
    systems; it''s a boundary of the domain they were designed for. It means log-based
    diagnosis has a structural ceiling here that no amount of tuning removes. So the
    system we built doesn''t start from logs. Detection is deterministic and runs
    across five independent probes — console, network, DOM structure, computed style,
    and the event contract itself — so a failure that only speaks through a corrupted
    layout or a silently reshaped payload is still caught. Only once something is
    detected does a model get involved: a Diagnoser agent reads the deployment manifests
    and reasons its way to the specific fragment at fault, and a Repair agent proposes
    an anchored source edit. Every proposed patch is checked twice before it is accepted
    — once behaviourally, by re-running the detector against the live, patched application,
    and once structurally, against the architectural declarations (shared-dependency
    singletons, in particular) a repair is never allowed to delete just to make the
    symptom disappear. Evaluated at ten runs per failure scenario on a Module Federation
    testbed with a fully reversible fault injector, the system named the correct culprit
    fragment in 67 of 70 diagnoses and repaired 50 of 50 injected faults on its first
    attempt. We report two findings that qualify those totals rather than polish them.
    Accuracy on one fault class drops to 7 of 10 once properly measured, where an
    earlier single-run evaluation had reported it flawless. And under a deliberately
    induced failure, behavioural verification alone accepted a patch that "fixed"
    the application by deleting the very shared-dependency declaration whose misconfiguration
    had caused the failure in the first place — a known limitation of validation-based
    repair, caught here in a form that emitted no error signal at all, and only partially
    closed by the structural check described above. Everything needed to check those
    numbers is released alongside the paper. The archive contains the full Module
    Federation testbed and its reversible fault injector, the source of all three
    agents, the evaluation harnesses, and the raw output of all 122 billed runs—cost,
    token usage, outcome and the complete reasoning trace for every one of them. Every
    figure reported in the paper can be recomputed directly from this artifact.'
  venue: Zenodo (CERN European Organization for Nuclear Research)
- title: 'AgentCompass: A Unified Evaluation Infrastructure for Agent Capabilities'
  date: 2026-01
  url: https://doi.org/10.18653/2026.emnlp-demos.25
  category: runtime
  subcategory: ''
  authors:
  - Dongsheng Zhu
  - Shufan Jiang
  - Wenhui Tian
  abstract: As Large Language Models (LLMs) evolve into autonomous agents, the need
    for unified evaluation infrastructure becomes critical.However, current evaluation
    pipelines remain highly fragmented and tightly coupled, hindering reproducibility
    and causing redundant engineering.To address this, we introduce AgentCompass,
    an open-source, lightweight, and extensible infrastructure for evaluating LLM-based
    agents.AgentCompass organizes the evaluation process around three independent
    components, namely Benchmark, Harness, and Environment, thereby enabling flexible
    configurations without requiring the reimplementation of complex execution logic.Furthermore,
    it features a fault-tolerant asynchronous runtime and comprehensive trajectory
    analysis tools to transparently diagnose nuanced failure modes like reward-hacking.Natively
    supporting over 20 benchmarks across five capability dimensions, AgentCompass
    provides the community with a scalable and reproducible infrastructure for advancing
    agent research.
