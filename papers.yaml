- title: The Capability Manifold and ML Scaling Laws
  date: 2026-09
  url: https://arxiv.org/abs/2609.27588
  category: runtime
  subcategory: systems
  authors: []
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Existing machine learning (ML) scaling laws relate predictive loss to
    compute, model parameters, and data. However, as models are increasingly deployed
    through agentic harnesses, loss alone is insufficient to characterize downstream
    performance: models with similar loss can exhibit different capabilities in reasoning,
    retrieval, planning, and adaptation. Yet, no unified framework connects such capabilities
    to the coupled resources available across the ML lifecycle. We bridge this gap
    by introducing a capability manifold, a multidimensional framework mapping downstream
    capabilities to pre-training, post-training, and test-time resources through bounded
    scaling functions. Analytical Jacobians quantify capability sensitivity to resource
    changes and interactions. As an initial application, we embed Kaplan- and Chinchilla-type
    scaling laws and test-time compute within the framework, demonstrating how existing
    scaling relationships can be unified as trajectories on a common capability manifold.'
  tags:
  - auto-runtime
  - auto-systems
- title: 'CVEvolve: Autonomous Algorithm Discovery for Unstructured Scientific Data
    Processing'
  date: 2026-05
  url: https://arxiv.org/abs/2605.11359
  category: runtime
  subcategory: systems
  authors: []
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Scientific data processing often requires task-specific algorithms or
    AI models, creating a barrier for domain scientists who need to analyze their
    data but may not have extensive computing or image-processing expertise. This
    barrier is especially pronounced when data are noisy, have a high dynamic range,
    are sparsely labeled, or are only loosely specified. We introduce CVEvolve, an
    autonomous agentic harness with a zero-code interface for scientific data-processing
    algorithm discovery. CVEvolve combines a multi-round search strategy with tools
    for code execution, evaluation implementation, history management, holdout testing,
    and optional inspection of scientific data and visual outputs. The search alternates
    between discovery and improvement actions, and uses lineage-aware stochastic candidate
    sampling to balance exploration and exploitation. We demonstrate CVEvolve on X-ray
    fluorescence microscopy image registration, Bragg peak detection, high-energy
    diffraction microscopy image segmentation, and hybrid analytical-learning-based
    affine registration. Across these tasks, CVEvolve discovers algorithms that improve
    over baseline methods, while holdout test tracking helps identify candidates that
    generalize better than later over-optimized alternatives. These results show that
    zero-code, autonomous LLM-powered algorithm development can help domain scientists
    turn unstructured scientific image data into practical algorithms and downstream
    scientific discoveries.
  tags:
  - auto-runtime
  - auto-systems
- title: 'SciVisAgentSkills: Design and Evaluation of Agent Skills for Scientific
    Data Analysis and Visualization'
  date: 2026-06
  url: https://arxiv.org/abs/2606.05525
  category: runtime
  subcategory: systems
  authors: []
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Recent advances in agentic visualization have enabled the translation
    of natural language into executable scientific visualization (SciVis) workflows.
    While general-purpose coding agents show strong capabilities, they often lack
    the tool-specific expertise required for SciVis tasks. In this work, we present
    SciVisAgentSkills, a collection of reusable agent skills that augment coding agents
    for scientific data analysis and visualization by encoding environment assumptions,
    tool usage patterns, and domain heuristics across scientific tools such as ParaView,
    napari, VMD, and TTK. We evaluate these skills on Codex and Claude Code using
    SciVisAgentBench, a benchmark of 108 expert-designed multi-step tasks. Results
    show that agent skills improve mean task scores across the evaluated suites, with
    token-efficiency benefits that depend on the agent harness and tool setting. These
    findings highlight the importance of structured procedural knowledge for enabling
    reliable, long-horizon SciVis workflows, while also showing that skills should
    be studied alongside the execution harness that loads and applies them. The skills
    are available at https://github.com/KuangshiAi/SciVisAgentSkills.
  tags:
