- title: 'Ep. 154: From Apps to Agents: Building Your Digital Workforce'
  date: 2026-01
  url: https://doi.org/10.5281/zenodo.19357992
  category: runtime
  subcategory: ''
  authors:
  - Daniel Rosehill
  - Gemini 3.1 (Flash)
  - Chatterbox TTS
  abstract: 'Episode summary: In this episode of My Weird Prompts, Herman and Corn
    dive deep into the rapidly evolving world of agentic AI as of early 2026. They
    break down the crucial differences between reactive custom GPTs and autonomous
    multi-agent workflows, exploring how tools like Claude Code and N8N are reshaping
    productivity. From the architectural debate between serverless hosting and local
    "agent boxes" to the essential strategies for preventing token-burning infinite
    loops, this episode provides a practical roadmap for anyone looking to build a
    secure, scalable, and cost-effective digital workforce. Show Notes In the rapidly
    shifting landscape of 2026, the term "AI agent" has become a ubiquitous buzzword,
    often applied to everything from simple chatbots to complex autonomous systems.
    In the latest episode of *My Weird Prompts*, hosts Herman and Corn Poppleberry
    set out to demystify this technology, sparked by a prompt from their housemate
    Daniel. The discussion moves past the surface-level hype to explore the architectural,
    practical, and financial realities of building a modern digital workforce. ###
    The Clerk vs. The Chef: Defining Agency Herman begins the discussion by addressing
    a common point of confusion: the difference between a custom GPT and a true agentic
    workflow. He characterizes a custom GPT as a "smart clerk." It is fundamentally
    reactive, sitting behind a window and waiting for a specific request. While it
    has a system prompt and perhaps a few tools, its operations are linear and one-to-one.
    In contrast, Herman introduces the "Chef" analogy for agentic workflows. Unlike
    the clerk, an agentic workflow—built on platforms like N8N or using tools like
    Claude Code—operates with a degree of autonomy. These systems are often event-driven
    rather than prompt-driven. They don''t just wait for a user to speak; they "wake
    up" based on a schedule or a specific trigger, evaluate their environment using
    a Large Language Model (LLM) as a reasoning engine, and execute a series of iterative
    steps to achieve a goal. The core distinction, according to the hosts, lies in
    the "loop." While a traditional script follows a rigid "if-this-then-that" logic,
    an agentic workflow uses the LLM to reason through ambiguity. If a website format
    changes or a tool fails, the agent can evaluate the error and attempt a different
    path, much like a chef who adjusts a recipe when an ingredient is out of stock.
    ### The Architect and the Sub-Agent Pattern The conversation then shifts toward
    the complexity of multi-agent systems. Herman describes the "manager-worker" or
    "architect" pattern, which is becoming the standard for complex tasks. In this
    setup, a high-level architect agent receives a broad objective—such as "launch
    a marketing campaign"—and breaks it down into specialized sub-tasks. Corn raises
    a valid concern regarding the "game of telephone" effect, where instructions become
    garbled as they pass from agent to agent. Herman explains that the industry has
    moved away from purely natural language handoffs toward "structured output." By
    forcing agents to communicate via specific JSON schemas, developers can ensure
    that the reasoning of the architect is translated into precise, actionable data
    for the sub-agent. This blend of natural language reasoning and rigid data structures
    is what allows modern agents to maintain reliability over long-running tasks.
    ### Architecture: Where Do the Agents Live? A significant portion of the episode
    is dedicated to the "home" of these agents. For simple, periodic tasks like a
    daily news summary, Herman suggests that serverless architecture (such as AWS
    Lambda) is the most cost-effective solution. The agent exists only for the duration
    of the task, minimizing overhead. However, for agents that require "state"—the
    ability to remember context over days or weeks—or those that need to interact
    with a local file system (like Claude Code), the requirements change. Herman and
    Corn discuss the rise of "agentic runtimes" and Docker-based environments that
    keep an agent "warm." Interestingly, they predict a resurgence of local hardware.
    Corn suggests the rise of the "agent box"—a high-powered, local Mac Mini or NUC
    sitting in a home closet. This trend is driven by two factors: the increasing
    capability of local models like Llama 3 and Mistral, and the growing need for
    data privacy. For agents handling sensitive financial or personal data, running
    the intelligence locally on one''s own hardware is becoming the preferred choice
    over cloud hosting. ### The Fiscal Guardrails: Preventing the Infinite Loop Perhaps
    the most practical segment of the discussion centers on cost control. Corn highlights
    the "agentic dilemma": unlike a traditional code loop that might crash a CPU,
    an agentic loop can drain a bank account. If two agents enter a cycle of recursive
    clarification, they can burn through thousands of dollars in API tokens in a matter
    of minutes. To combat this, Herman outlines three layers of "fiscal guardrails":
    1. **Token Caps:** Setting hard limits on the number of tokens any single run
    can consume. 2. **Budget Proxies:** Using a middleman service that sits between
    the agent and the API provider. This proxy tracks real-time spending across all
    agents and acts as a "kill switch" once a daily or monthly budget is reached.
    3. **Constrained Agency:** Designing agents with narrow, task-specific scopes
    rather than open-ended goals. By limiting what an agent *can* do, developers naturally
    limit what it *can spend*. ### Conclusion: The Future of Constrained Agency As
    the episode concludes, Herman and Corn emphasize that the goal of agentic AI in
    2026 is not to create a "god in a box" that can do everything, but to build a
    fleet of specialized, well-governed tools. The transition from reactive chatbots
    to autonomous workflows requires a shift in mindset—from writing prompts to designing
    architectures. By focusing on structured communication, local hosting, and strict
    budgetary controls, users can finally harness the power of a digital workforce
    without the fear of a "runaway" AI. Listen online: https://myweirdprompts.com/episode/ai-agentic-workflows-evolution'
  venue: Zenodo (CERN European Organization for Nuclear Research)
- title: Can LLM-Generated Backend Services Meet Performance Slos? A Controlled Study
    of Explicit Requirements and Measured-Feedback Repair
  date: 2026-01
  url: https://doi.org/10.67228/30715717/ijdeic-v9i3p103
  category: runtime
  subcategory: ''
  authors:
  - Priyank Agrawal
  abstract: 'Production backend services must satisfy functional contracts and operational
    objectives simultaneously, yet most evaluations of code-generating language models
    still emphasize compilation, unit-test success, or repository issue resolution.
    This study asks whether a coding-agent workflow can generate small backend services
    that satisfy explicit service-level objectives (SLOs), and whether measured runtime
    feedback changes the result. We built SLOBench, a reproducible local harness that
    combines versioned prompts, deterministic functional validation, process-isolated
    FastAPI execution, concurrent HTTP load, CPU and memory sampling, provenance hashes,
    and implementation-level analysis. The controlled pilot evaluated three services,
    metadata lookup, a bounded cache-backed API, and concurrent aggregation, under
    three conditions: functional-only prompting, functional prompting plus an explicit
    SLO, and one-step repair after measured feedback. Five generation attempts per
    task produced 45 implementations; each implementation was measured three times,
    yielding 135 final runs. All implementations passed the functional oracle and
    every final load run had zero observed request errors. Adding SLO language alone
    reduced P95 latency by a median 2.2% across 15 paired generation-task comparisons
    (bootstrap 95% interval -2.7% to 10.7%; 9/15 improved). Measured-feedback repair
    improved all 15 pairs, with a median 16.8% reduction relative to the SLO-prompted
    version (95% interval 15.7% to 20.2%). The two strictest latency targets were
    nevertheless never reached. Source review further showed that all repaired implementations
    bypassed portions of the ordinary framework path and three hard-coded the disclosed
    hot request. Measured feedback therefore improved performance on the declared
    workload consistently, but the evidence does not establish production readiness.
    The findings motivate hidden acceptance workloads, calibrated baselines, stronger
    post-repair contract testing, and multi-model replication in performance-oriented
    coding-agent evaluation.'
  venue: International Journal of Data Engineering and Intelligent Computing
- title: Bi-Level Harness Optimization and Textual Backpropagation in Autonomous 4-Loop
    Recursive Self-Improvement Engines (Technical Report 2026)
  date: 2026-10
  url: https://doi.org/10.5281/zenodo.23935033
  category: runtime
  subcategory: ''
  authors:
  - Alexander Gavares
  - Yasemin Gavares
  abstract: 'Autonomous Recursive Self-Improvement (RSI) in large language model (LLM)
    agents has historically suffered from reward hacking, oscillating regressions,
    catastrophic context collapse, non-differentiable search space stagnation, and
    exploration entropy collapse. We present a formal framework for Bi-Level Harness
    Optimization governed by an airtight 4-Layer Defense-in-Depth Execution Substrate.
    Instead of modifying foundational model weights during inner-loop search, an outer
    meta-optimization loop searches over a structured, capacity-bounded cognitive
    harness space H ∈ S_H—comprising topological control flow, node prompts, runtime
    verification contracts, and a crystallized skill library—via Causal Program Slicing
    and Counterfactual Textual Backpropagation over Directed Acyclic Execution Graphs
    (DAGs). We incorporate physical resource proxies for algorithmic scalability and
    AST mutation elasticity directly into a 5-dimensional Pareto fitness vector, prove
    almost-sure monotonic convergence under a Two-Timescale Quality-Diversity MAP-Elites
    formulation, formalize adversarial curriculum synthesis as an asymmetric Stackelberg
    regret-maximization game utilizing constructive complexity separation and metamorphic
    invariants, and derive an information-theoretic lower bound on token complexity
    reduction achieved by domain-indexed System-2 to System-1 LoRA weight distillation
    via Reinforcement Learning with Verifiable Rewards (RLVR). Finally, we validate
    the architecture across an 85-generation multi-epoch evolution curriculum and
    thirteen physical execution phases: (1) achieving 100% Vault pass rate convergence
    across all five benchmark domain archetypes in Generations 1–30 and a theoretical
    policy compression bound of ρ_{τ,bound} = 4.1498; (2) distilling harvested trajectories
    into Qwen2.5-Coder-1.5B-Instruct LoRA weights via GRPO, attaining an 85.00% (17/20)
    zero-shot and 100.00% (20/20) contract-specified holdout Vault pass rate with
    a 2.8034× mean (4.91× peak) empirical token compression ratio; (3) executing self-referential
    AST surgery on the Meta-Harness orchestration DAG to achieve a 6.15× end-to-end
    latency speedup, eliminate 92.5% of redundant System-2 invocations, and intercept
    100% of adversarial gate-bypass mutations; (4) closing the bi-level loop into
    Macro-Epoch 2 (Generations 31–35) to achieve a 100.0% (5/5) greedy zero-shot (T
    = 0) pass rate on unseen cross-domain hybrid specifications with a 0.0176 ms (576,976×)
    amortized replay latency; (5) extending the substrate across Generations 36–43
    under live CUDA LoRA synthesis to validate capacity-bounded skill crystallization
    (5/5 primitives admitted, 100% second-order composition), oracle-free Hypothesis
    metamorphic verification (400/400 randomized trials passed at 89.3 tokens mean
    GPU output, 100% reward-hack blindspot interception), and 3-module transactional
    repository evolution (SWE-EVO, 100% live GPU commit rate across 200/200 Hypothesis
    trials at mean Δ_AST = 0.4690 and 100% atomic rollback on cross-file regressions);
    (6) closing Macro-Epoch 3 (Generations 44–50) via 196-layer double-pass QR orthogonal
