  venue: Zenodo (CERN European Organization for Nuclear Research)
- title: 'SRHarness: A Harness for Agentic Symbolic Regression'
  date: 2026-09
  url: https://arxiv.org/abs/2609.35501
  category: runtime
  subcategory: ''
  authors:
  - Zihan Yu
  - Shixuan Zhou
  - Hao Huang
  abstract: 'Recent agentic symbolic regression approaches increasingly rely on large
    language models to analyze data, select scientific operations, and refine hypotheses
    over long search trajectories. In such systems, performance depends not only on
    the underlying model and search strategy, but also on the runtime infrastructure
    that supports scientific search. We introduce SRHarness, a domain-specific harness
    for agentic symbolic regression built around three mechanisms: composable scientific
    actions that provide a common interface over raw, transformed, and candidate-derived
    quantities; persistent scientific state that retains evaluated hypotheses and
    exposes compact model-facing views; and trajectory lifecycle management that coordinates
    continuation, branching, restart, and termination. On LLM-SRBench, SRHarness consistently
    improves both numerical generalization and symbolic recovery under matched LLM
    backbones. With DeepSeek-v4-flash-0731, it achieves 93.69% symbolic accuracy on
    LSR-Transform, compared with 62.16% for SR-Scientist, and retains 72.97% accuracy
    on an anonymized variant that removes scientific descriptions and variable semantics,
    versus 39.64% for SR-Scientist. Under the same DeepSeek-v4-flash-0731 backbone,
    SRHarness also substantially outperforms Codex (72.97% vs. 20.72%) and reaches
    performance comparable to Codex with GPT-5.5, while simply providing Codex with
    the same scientific tools does not reproduce this advantage. These results show
    that effective agentic symbolic regression depends not only on models or tools,
    but also on structured runtime support for organizing scientific actions, accumulated
    hypotheses, and long-horizon search.'
  venue: arXiv (Cornell University)
- title: Architectural Obsolescence of Unhardened Agentic-AI Runtimes
  date: 2026-05
  url: https://arxiv.org/abs/2605.01740
  category: runtime
  subcategory: ''
  authors:
  - Alfredo Metere
  abstract: 'An agentic-AI runtime issues tool calls, sends messages, and actuates
    devices on behalf of an LLM. Catching the four ways an action can diverge from
    its audit record -- F1 gate-bypass, F2 audit-forgery, silent host failure, F4
    wrong-target, -- is a load-bearing safety property of any such runtime. We show
    that upstream OpenClaw, the most engineered single-user agentic-AI gateway in
    public release, catches none of them: recall is 0.000 on every cell of every confusion
    matrix, on a 1600-sample template baseline through OpenClaw''s actual production
    command-line interface (CLI) and on a ten-LLM cross-model generalisation run.
    Detecting F1--F4 requires seven specific runtime structures absent from OpenClaw''s
    source tree: a biconditional checker, a hash-chained audit log, an extension admission
    gate, a two-layer egress guard, a Bell-LaPadula classification policy, a module-signing
    trust root, and a bootstrap seal. enclawed-oss -- an MIT-licensed drop-in fork
    that ships all seven -- reaches $P = R = F_1 =$ accuracy $= 1.000$ on the same
    input. The gap is structural, not parametric: a six-line append-only widening
    of enclawed-oss''s data-loss-prevention (DLP) regex catalog raises per-channel
    F3 detection by 14.6\% net at unchanged precision; the same edit on OpenClaw has
    nowhere to land. The harness deliberately exercises real Discord and Telegram
    channels -- plugin categories the first enclawed release deleted as unsafe --
    to show F1--F4 detection extends to those previously-unsafe extensions. With architectural
    superiority for security and feature parity for extensions, we argue that unhardened
    agentic-AI runtimes are architecturally obsolete: a strictly better alternative
    exists, is adoptable today, and the gap requires re-architecture rather than configuration.
    We invite reviewers to apply the harness to any candidate runtime.'
  venue: arXiv (Cornell University)
- title: Synthesizing Multi-Agent Harnesses for Vulnerability Discovery
  date: 2026-04
  url: https://arxiv.org/abs/2604.20801
  category: runtime
  subcategory: ''
  authors:
  - Hanzhi Liu
  - Chaofan Shou
  - Xiaonan Liu
  abstract: 'LLM agents have begun to find real security vulnerabilities that human
    auditors and automated fuzzers missed for decades, in source-available targets
    where the analyst can build and instrument the code. In practice the work is split
    among several agents, wired together by a harness: the program that fixes which
    roles exist, how they pass information, which tools each may call, and how retries
    are coordinated. When the language model is held fixed, changing only the harness
    can still change success rates by several-fold on public agent benchmarks, yet
    most harnesses are written by hand; recent harness optimizers each search only
    a narrow slice of the design space and rely on coarse pass/fail feedback that
    gives no diagnostic signal about why a trial failed. AgentFlow addresses both
    limitations with a typed graph DSL whose search space jointly covers agent roles,
    prompts, tools, communication topology, and coordination protocol, paired with
    a feedback-driven outer loop that reads runtime signals from the target program
    itself to diagnose which part of the harness caused the failure and rewrite it
    accordingly. We evaluate AgentFlow on TerminalBench-2 with Claude Opus 4.6 and
    on Google Chrome with Kimi K2.5. AgentFlow reaches 84.3% on TerminalBench-2, the
    highest score in the public leaderboard snapshot we evaluate against, and discovers
    ten previously unknown zero-day vulnerabilities in Google Chrome, including two
    Critical sandbox-escape vulnerabilities (CVE-2026-5280 and CVE-2026-6297).'
  venue: arXiv (Cornell University)
- title: 'From Question Answering to Task Completion: A Survey on Agent System and
    Harness Design'
  date: 2026-06
  url: https://arxiv.org/abs/2606.20683
  category: runtime
  subcategory: ''
  authors:
  - Jianyuan Guo
  - Zhiwei Hao
  - Chengcheng Wang
  abstract: 'LLM-based agents mark a shift from passive question answering to active
    task completion: they perceive environments, invoke tools, maintain state, and
    act over extended horizons. As agent systems have evolved from prompt engineering
    to workflows and context engineering, harness engineering, and agent-native training
    with co-evolution, a central question has become increasingly important: where
    does the bottleneck in agent performance reside—in the foundation model, in the
    execution harness, or in the coupling between them? This survey examines LLM-based
    agents through a model harness lens. We first clarify the functional definition
    of agents and the implementation view of an LLM-based agent as a foundation model
    coupled with an execution harness. Wethen analyze the limits of model-centric
    scaling, trace four paradigms of agent engineering, and decompose the execution
    harness into six coupled runtime responsibilities: observation, context, control,
    action, state, and verification/governance. Using this decomposition, we map task
    properties and domain pressures to harness configurations, review benchmark and
    evaluation practices, and synthesize model–harness evidence on how runtime design
    affects long-horizon task completion, efficiency, and reliability. Finally, we
    identify open challenges in value-aware evaluation, safety, harness generalization,
    and model–harness co-evolution. Rather than treating agents as models with auxiliary
    tools, this survey argues that agent quality—including success, efficiency, safety,
    and generalization—emerges from the interaction between model capability, runtime
    infrastructure, task structure, and evaluation design. A collection of papers
    discussed in this survey is provided in https://github.com/ggjy/Awesome-Agent-Engineering.'
  venue: Preprints.org
- title: 'AgentAbstain: Do LLM Agents Know When Not to Act?'
  date: 2026-07
  url: https://arxiv.org/abs/2607.10059
  category: runtime
  subcategory: ''
  authors:
  - Xun Liu
  - Yi Evie Zhang
  - Vira Kasprova
  abstract: 'Agent systems based on large language models (LLMs) are increasingly
    deployed for autonomous tasks, yet existing evaluations mostly focus on task success
    rather than whether agents know when to abstain. This gap poses real risks: under
    ambiguity, conflicting constraints, or tool failures, agents may execute unintended
    and irreversible actions. To close this gap, we present the first systematic evaluation
    framework for agentic abstention: the calibrated ability of tool-using LLM agents
    to recognize when not to act. At its core, AgentAbstain is a paired-task benchmark
    built on an agent-native taxonomy of 8 abstention scenarios across pre-execution
    reasoning and runtime discovery. It contains 263 paired tasks across 42 executable
    sandbox environments, where each pair consists of a should-act task and a should-abstain
    variant produced through a controlled perturbation to the instruction, tool, or
    environment state. To scale this paired design and resist data contamination,
    we propose AbstainGen, a fully automated pipeline that synthesizes sandbox environments
    and generates paired tasks end-to-end, validated by deterministic replay and semantic
    LLM judges; fresh task instances can be regenerated on demand, and three independent
    annotators rate 94-98% of sampled tasks as well-designed. Across 17 frontier LLMs
    in 4 agent harnesses, the best agent (Gemini 3.1 Pro) achieves only 59.5% paired
    accuracy (correct on both the act and abstain sides of each paired task). More
    importantly, abstention capability is largely independent of general task-solving
    capability, indicating that scaling task-solving alone will not close this gap.
    We further identify failure modes such as post-hoc abstention, in which agents
    execute irreversible actions before recognizing abstention triggers. Our code
    and dataset are open-sourced at agentabstain.github.io.'
  venue: arXiv (Cornell University)
- title: Embodied Agentic Harnesses for Physical Intelligence A Survey
  date: 2026-09
  url: https://doi.org/10.31224/8297
  category: runtime
  subcategory: ''
  authors:
  - Yu Huang
  - Yue Chen
  - Zijiang Yang
  abstract: 'Embodied agents depend on more than the capabilities of a language, vision-language,
    or action model. They require a runtime that grounds observations, coordinates
    executable capabilities, monitors outcomes, and manages intervention when physical
    execution diverges from a plan. This survey examines embodied agentic harnesses
    as this runtime control plane. We distinguish four logical responsibilities—reasoning,
    runtime governance, skill execution, and hardware interfacing—and separate essential
    execution services from optional prediction, persistent memory, and adaptation
    mechanisms. A contract-based formulation connects skill preconditions, resource
    ownership, interruption, postconditions, and trace collection without assuming
    that every system implements an identical stack. We organize the literature by
    mechanisms rather than publication period: grounding and composition, state and
    memory, scheduling and coordination, verification and recovery, and adaptation.
    Complementary descriptors record the execution interface, intervention timescale,
    adaptation target, and evidence setting. The synthesis connects LLM and agent
    foundations, VLA policies, world models, and predictive-action models to affordance-based
    planning, programmatic control, memory-guided orchestration, agent operating systems,
    and evolving runtime critics. It distinguishes operational harnesses from infrastructure
    for robot learning and deployment. We further distinguish semantic task verification,
    invocation authority, and physical safety assurance, which require different evidence.
    The resulting synthesis identifies execution contracts, compositional evaluation,
    bounded adaptation, and explicit human authority as priorities for reliable long-horizon
    physical intelligence.'
  venue: ''
- title: 'SecureClaw: Clawing Back Control of LLM Agents'
  date: 2026-06
  url: https://arxiv.org/abs/2606.09549
  category: runtime
  subcategory: ''
  authors:
  - Yuhan Ma
  - Stefan Schmid
  abstract: 'Tool-using large language model (LLM) agents face two distinct security
    failures: unauthorized external actions and exposure of sensitive plaintext inside
    the runtime before any final output check can intervene. Existing defenses usually
    protect one boundary, either the planner/runtime or the point where external actions
    are executed, and therefore do not by themselves secure both surfaces. We present
    SecureClaw, a dual-boundary architecture that enforces authorization in a trusted
    executor and keeps raw protected data outside the LLM runtime. Sensitive reads
    pass through a trusted gateway that replaces raw values with reference IDs. In
    the evaluated deployment, the gateway also provides short planning summaries that
    deliberately release selected information, a process called declassification.
    Writes that change external state follow a PREVIEW$\rightarrow$COMMIT protocol
    in which only a trusted executor may execute the exact request authorized by policy.
    The runtime can still plan over summaries and reference IDs, but cannot directly
    resolve the IDs into secrets or perform side effects. Across the AgentDojo, AgentLeak,
    and Agent Security Bench (ASB) benchmarks, SecureClaw is the only defense we evaluate
    in a common harness that simultaneously retains usable task utility and achieves
    0% attack success rate (ASR) on ASB, 0.64% ASR on AgentDojo, and 3.23% overall
    leak on AgentLeak''s attacked parity lane, which measures final-output and internal-relay
    leakage. Code is available at https://github.com/ponyyuhan/SecureClaw.'
  venue: arXiv (Cornell University)
- title: Causal Improvement Graph for Agentic Harness Optimization
  date: 2026-10
  url: https://arxiv.org/abs/2610.05039
  category: runtime
  subcategory: ''
  authors:
  - Junjie Zhang
  - Shunyu Liu
  - Haoyu Wang
  abstract: Agentic Harness is the runtime that constructs task context and controls
    execution flow, thereby shaping overall agent performance. Given a fixed model
    and external evaluation, automated Harness optimization seeks to improve this
    runtime through an iterative proposal--evaluation loop to better solve target
    tasks. Existing meta-harness methods mainly adopt proposer-centric discovery,
    in which an LLM-based proposer integrates accumulated experimental findings to
    determine subsequent Harness revisions. This places the burden of maintaining
    the evolving improvement state on the proposer as history expands and its underlying
    experimental logic becomes harder to discern. In this paper, we introduce the
    Causal Improvement Graph (CIG), a graph-governed meta-harness framework that externalizes
    the evolving improvement state in a persistent graph, allowing prior findings
    to directly govern subsequent Harness optimization through local proposer operations.
    CIG grows and links Evidence, Hypothesis, Intervention, and Outcome nodes to represent
    what was observed, how it may be explained, how to test that explanation, and
    what the evaluation reveals. Their structural relations preserve how the improvement
    state changes across iterations, allowing local proposers to build directly on
    relations among prior findings rather than recover them from raw history. Across
    various agent tasks, CIG discovers stronger Harnesses than previous meta-harness
    baselines and remains robust to the choice of task solver and proposer. Structural
    ablations further support the design of an explicit improvement state with graph-governed
    evolution.
  venue: arXiv (Cornell University)
- title: 'Harness as a Language: A Minimalist Agent Framework With Maximal Expressivity'
  date: 2026-09
  url: https://arxiv.org/abs/2609.26891
  category: runtime
  subcategory: ''
  authors:
  - Zhening Li
  - Joshua Liu
  - Mateja Vukelić
  abstract: 'Modern language-model agents are built around the agent loop: the LLM
    is placed in an environment exposing a set of tools, and the LLM has full control
    over the workflow by alternating between tool calls and observing their output.
    However, certain capabilities such as long-term memory and self-improvement currently
    require specialized systems beyond the agent loop itself. We built an LLM agent
    framework, JAZ, to explore the extent to which a minimal harness that is little
    more than the agent loop itself can accomplish tasks these specialized systems
    are built for. JAZ exposes a single LLM-based primitive `invoke` and provides
    a set of built-in hooks that allow the programmer to apply constraints and perform
    monitoring. Generalizing existing code-mode agent loops, `invoke` is the simplest
    loop that satisfies two defining properties: (1) the LLM can write arbitrary executable
    code that can include recursive `invoke`; (2) everything visible to the LLM -
    all inputs to `invoke` as well as its interaction history with the code environment
    - are variables in the code environment. We motivate our design from first principles,
    viewing `invoke` as a language primitive representing a function whose implementation
    is provided at runtime by an LLM every time it is called. To validate the design
    of our core `invoke` primitive, we evaluate `invoke` - with only prompting, no
    manually designed tools, harness, or external systems (e.g., memory or the file
    system) - on workflows traditionally implemented through specialized harnesses.
    On long-horizon workflows requiring recall far beyond the context window, JAZ
    `invoke` outperforms Letta (MemGPT) by 8% at half its cost on the recall-heavy
    portion of StuLife. On continual self-improvement, JAZ `invoke` outperforms ACE
    by 4% at a lower cost on AppWorld.'
  venue: arXiv (Cornell University)
- title: 'Beyond Handcrafted Security: Towards Self-Evolving Defense for LLM Agents'
  date: 2026-08
  url: https://arxiv.org/abs/2608.12977
  category: runtime
  subcategory: ''
  authors:
  - Jiajun Ruan
  - Peiyang Li
  - Yukun Chen
  abstract: The expanding operational capabilities of large language model (LLM) agents
    introduce sophisticated security threats. Runtime defenses have emerged as an
    effective approach to mitigating these risks by integrating security mechanisms
    into the agent execution loop. However, existing runtime defenses rely heavily
    on manually designed interventions and lack a principled framework for their construction
    and maintenance. In this work, we first develop a harness-level formulation of
    runtime defense that systematically characterizes how harness mechanisms enable
    defense construction and provides a unified view of existing runtime defense interventions
    from a harness perspective. Building on this formulation, we propose HARD (Harness-based
    Autonomous Runtime Defense Evolution), a self-evolving runtime defense framework
    that automatically identifies appropriate intervention strategies and iteratively
    improves defense artifacts based on observed failure traces. HARD transforms runtime
    defense development from manual engineering into an autonomous evolution process,
    and extensive experiments demonstrate that it improves security performance over
    existing handcrafted defenses while preserving benign task utility. Our findings
    highlight autonomous defense evolution as a promising new paradigm for securing
    deployed LLM agents, enabling agents to identify defense weaknesses and continuously
    improve their protection mechanisms.
  venue: arXiv (Cornell University)
- title: 'Calibrated Decision Models for Autonomous Penetration-Testing Harnesses:
    JEV and Laya as System One Decision Layers for LLM-Driven Pentest Agents'
  date: 2026-09
  url: https://arxiv.org/abs/2609.28940
  category: runtime
  subcategory: ''
  authors:
  - Joas Antonio dos Santos Barbosa
  abstract: 'Autonomous penetration-testing harnesses use large language models (LLMs)
    for reconnaissance, exploitation, and reporting, but often rely on those same
    models to confirm findings, grade severity, and select agents. This can lead to
    false positives, inflated severity, and wasted compute. We examine how System
    One decision models, lightweight non-generative classifiers that return typed,
    calibrated verdicts, can support these decisions. We make five contributions.
    First, we define four decision points: finding adjudication, severity recalibration,
    agent pruning, and confirmation loops. Second, we present an exploratory NeuroSploit
    case study comparing one run with TypeSafe System One (Jev) and one without it
    against a web target containing 13 vulnerabilities. Differences in severity distribution,
    runtime, and grading by exposed data type motivate the architecture but do not
    establish statistical significance. Third, we review published specifications
    for Jev, Jev-Ultrafast, and the open-source Laya without assuming that results
    from other benchmarks transfer to penetration testing. Fourth, we discuss RLHF,
    RLAIF, RLCD, and RLHV as training approaches and their implications for trust
    in security decisions. Finally, we propose Rave, a domain-adapted System One model,
    and outline its training data, evaluation protocol, and potential effect on harness
    assurance.'
  venue: arXiv (Cornell University)
- title: 'flink-agentic-tuner: an LLM agent that tunes and heals a Flink Kafka-to-Parquet
    pipeline'
  date: 2026-10
  url: https://doi.org/10.5281/zenodo.23644211
  category: runtime
  subcategory: ''
  authors:
  - Anurag Mishra
  abstract: 'Source code, evaluation harness and raw results for the paper "Agent-in-the-Loop
    Streaming: An LLM Agent That Tunes and Heals a Flink Kafka-to-Parquet Pipeline".-
    pipeline/: an exactly-once Kafka-to-Parquet job on Apache Flink 1.19 whose checkpoint
    interval, bucketing, rolling policy and parallelism can be changed at runtime
    through savepoint restarts.- agent/: an LLM agent (Claude) that observes the job
    through the Flink REST API and its output files, and acts through tools bounded
    by code-enforced guardrails, with deterministic verification and automatic rollback.
    Includes offline tests.- eval/: a Docker-based evaluation harness (Kafka and Flink),
    a load generator, a metrics collector, a threshold-rule baseline controller, an
    analysis script, and raw results for 12 runs (4 scenarios × 3 controllers).'
  venue: Zenodo (CERN European Organization for Nuclear Research)
- title: 'The Harness as the Only Mutable Surface: Compliance-Bounded Self-Evolution
    of LLM Agents in Credit Pipelines, with a Measured Admission Gate'
  date: 2026-10
  url: https://arxiv.org/abs/2610.10629
  category: runtime
  subcategory: ''
  authors:
  - Ravil Akhtyamov
  abstract: 'Self-improving LLM agents can adapt a credit pipeline to a changed rule,
    but an agent that rewrites itself destroys the artefact a supervisor reviews:
    a named change, a recorded test, an approval. We argue that self-evolution is
    reviewable only if it is confined to the runtime harness (instruction text, tool-call
    logic and primitive composition) while model weights stay fixed, so that every
    adaptation is a diff with a cause and a test attached. We give a dual-loop engine
    built on that bound, with one admission gate that writes a hash-chained record
    before deployment, and we measure the gate in simulation, with a simulated agent
    and a seeded-search proposer rather than language models. Across three families
    of supervisory re-interpretation at three severities, 10 seeds each, the gated
    loop admitted 144 of 7,449 candidate changes, none of which worsened error on
    held-out history, and restored the false-positive rate to the oracle level without
    raising missed flags in every low- and mid-severity cell. With the gate replaced
    by the check an unbounded system applies (fewer errors visible in recent traces),
    the same loops admitted 309 harmful changes and left missed flags above 10% in
    49 of 90 runs: false positives fell because the screen was loosened. Evaluated
    on pre-shift labels, the gate rejected every candidate, so a re-interpretation
    must be encoded as a rule that relabels history. Parametric and scope shifts were
    repaired locally, a structural one only by primitive replacement; at the highest
    structural severity the gate''s fixed tolerance blocked the correct replacement
    in half the seeds. We map the mechanisms to the EU AI Act''s provisions for high-risk
    credit scoring and note that the April 2026 US model-risk guidance excludes agentic
    AI from its scope.'
  venue: arXiv (Cornell University)
- title: 'Signed but Unsafe: Securing Runtime Tool Selection in LLM Agents under Adversarial
    Metadata Injection'
  date: 2026-01
  url: https://doi.org/10.2139/ssrn.7199341
  category: runtime
  subcategory: ''
  authors:
  - Basit Ali
  - Muhammad Raheel Anwar
  - Tehreem Minhas
  abstract: ''
  venue: SSRN Electronic Journal
- title: 'A Survey of Agent Skills: Toward Procedural Infrastructure for LLM Agents'
  date: 2026-05
  url: https://doi.org/10.20944/preprints202605.1276.v1
  category: runtime
  subcategory: ''
  authors:
  - Cehao Yang
  - Xiaojun Wu
  - H.-Y. Liu
  abstract: Large language model (LLM) agents are increasingly expected to solve long-horizon
    tasks through repeated interaction with external environments, tools, users, and
    other agents. In this setting, agent skills have emerged as a central mechanism
    for transforming fragmented experience into reusable procedural knowledge. Unlike
    raw memory which preserves past traces, or abstract rules which often lack executable
    detail, skills compress recurring patterns of successful behavior into operational
    artifacts that can guide future action. However, existing studies on agent skills
    remain scattered across diverse areas, making it difficult to form a unified understanding
    of what skills are, how they are represented, and how they should be governed.
    To bridge this gap, this paper presents a comprehensive survey of agent skills.
    We propose a six-layer taxonomy covering ontology, representation and packaging,
    lifecycle, runtime integration, governance, and applications. We first define
    agent skills as reusable procedural abstractions that connect memory, human expertise,
    and execution. We then review major skill representations, including natural-language
    guidance, executable code snippets, decision graphs, filesystem-based packages,
    and structured skill records. Next, we analyze the skill lifecycle, from acquisition,
    storage, retrieval, usage, and maintenance to selective internalization into model
    behavior. We further examine how skills integrate with terminal interfaces, tool
    interfaces, multi-agent systems, and agent harnesses. In addition, we discuss
    the emerging skill ecosystem, its security and governance risks, and mechanisms
    for trusted deployment. Finally, we survey applications in robotics, games, web
    agents, GUI/mobile/OS agents, and software engineering, and identify open challenges
    in evaluation, robustness, standardization, safety, and infrastructure. Related
    resources, as well as the latest developments in this field, are accessible on
    https://github.com/DataArcTech/Awesome-Agent-Skill-Papers.
  venue: Preprints.org
- title: 'From Natural Language Policies to Executable Obligations: A Verification
    Harness for Dependable In-Car LLM Agents'
  date: 2026-08
  url: https://arxiv.org/abs/2608.23282
  category: runtime
  subcategory: ''
  authors:
  - Radouane Bouchekir
  - Damir Safin
  - Tomas Bueno Momčilović
  abstract: 'Large Language Models (LLMs) agents deployed in vehicles must satisfy
    a written operating policy on every turn: a single hallucinated identifier, omitted
    mandatory side-effect, or premature completion claim fails the task. We present
    AgentGuardUtil, our entry to CAR-bench Track~1, which treats the AI planer (LLM)
    as a fallible proposer inside a grounded verify-and-revise loop. Its core novelty
    is a runtime policy compiler: the natural-language policy shipped with each conversation
    is compiled, once per policy, into typed machine-checkable rules, a subset of
    which receive an executable form. A deterministic obligation engine interprets
    these rules against live tool results and the simulated post-write state of the
    draft itself, emitting the exact remedial calls with computed arguments rather
    than natural-language reminders. Around this engine, 25 deterministic gates (identifier
    provenance, schema and enum validity, gather-before-act, confirmation and future-time
    protocols) and an LLM critic produce tiered findings that drive a bounded revision
    loop tuned for the pass k metric.'
  venue: arXiv (Cornell University)
- title: 'UniACE: A Unified Framework for Evaluating LLM Agentic Capabilities'
  date: 2026-05
  url: https://arxiv.org/abs/2605.27898
  category: runtime
  subcategory: ''
  authors:
  - Pengyu Zhu
  - Lijun Li
  - Yaxing Lyu
  abstract: Agent benchmarks are increasingly used to compare large language models
    (LLMs) across domains, yet a reported score reflects a complete model--harness--environment
    configuration rather than the model alone. Benchmark packages couple native tasks
    with specific prompts, tool protocols, orchestration logic, and sometimes dynamic
    external resources, making cross-benchmark comparisons sensitive to implementation
    and resource conditions. We present UniACE, a unified framework for model-centric
    evaluation under an explicit, common execution condition. UniACE represents each
    benchmark as an instruction--tool--environment triplet, executes LLMs through
    a shared, task-agnostic harness in isolated per-task runtimes, and preserves native
    success criteria. For tasks that rely on dynamic resources, an optional offline
    mode replaces live access with fixed, pre-collected snapshots. Its evaluation
    protocol further standardizes efficiency measurement, execution records, and trace-based
    failure attribution. We migrate 7 benchmarks spanning 24 domains and evaluate
    15 models in more than 400K rollouts consuming 5B tokens. Comparisons with source
    implementations show large bidirectional score changes and model-ranking reversals,
    while matched online and offline runs reveal substantial sensitivity to accessible
    evidence and its representation. Under the shared UniACE configuration, efficiency
    and failure profiles expose task-dependent model behaviors hidden by task-success
    scores alone. These findings motivate reporting agent benchmark outcomes as properties
    of an explicit evaluation configuration, enabling more interpretable and reproducible
    cross-benchmark comparisons. Codes and benchmarks at are available at https://github.com/whfeLingYu/A-Unified-Framework-for-the-Evaluation-of-LLM-Agentic-Capabilities,
    https://huggingface.co/datasets/whfeLingYu/Unified_Agent_Framework.
  venue: arXiv (Cornell University)
- title: 'SyzHarness: Patch-Based Kernel Bug Reproduction with LLM-Synthesized Fuzzing
    Harnesses'
  date: 2026-09
  url: https://arxiv.org/abs/2609.23889
  category: runtime
  subcategory: ''
  authors:
  - Xingyu Li
  - Juefei Pu
  - Haonan Li
  abstract: 'Automated kernel vulnerability reproduction is essential for bug triage,
    patch validation, and regression testing, but still lacks an effective and efficient
    solution. The core challenge is twofold: a reproducer must first recover the trigger
    scaffold needed to reach the vulnerable state and determine the precise concrete
    values that actually trigger the bug. Existing directed fuzzing approaches are
    ineffective at recovering the necessary trigger scaffold, while LLM-only generation
    is brittle because it struggles with concrete-value discovery and runtime nondeterminism.
    We design SyzHarness, a framework that combines LLM reasoning with coverage-guided
    fuzzing for patch-based Linux kernel vulnerability reproduction. Given a patch,
    SyzHarness uses an LLM agent grounded by code navigation tools to synthesize a
    parameterized fuzzing harness that fixes the prerequisite setup logic while exposing
    only uncertain, bug-critical input parameters to be mutated by Syzkaller. SyzHarness
    then translates this harness into a Syzkaller compatible interface and iteratively
    refines it using hierarchical reachability feedback. We evaluate SyzHarness on
    multiple datasets of triggerable real-world Linux kernel vulnerabilities. On 100
    KernelCTF cases, SyzHarness achieves a 78% bug reproduction success rate. On the
    SyzDirect benchmark, SyzHarness achieves a 73% bug reproduction success rate,
    substantially outperforming prior directed greybox fuzzing. On 50 recent, known-triggerable
    syzbot bugs fixed after March 2026, SyzHarness reproduces 40/50 (80%) using only
    the fix commits as input.'
  venue: arXiv (Cornell University)
- title: 'EvoSafeHarness: Evolving Model- and Domain-Specific Harnesses for Securing
    Agents'
  date: 2026-09
  url: https://arxiv.org/abs/2609.05903
  category: runtime
  subcategory: ''
  authors:
  - Nanxi Li
  - Yingzi Ma
  - Yulong Cao
  abstract: Large language model (LLM) agents can translate natural-language requests
    into real-world actions, creating safety risks from both indirect prompt injections
    and directly harmful requests. Existing system-level safety harnesses are typically
    designed by experts and applied across heterogeneous models and domains, despite
    substantial differences in model behavior, utility tolerance, and domain-specific
    safety requirements. We present EvoSafeHarness, a framework for automatically
    synthesizing deployment-specific safety harnesses for frozen LLM agents. Given
    a target model and domain specification, EvoSafeHarness jointly evolves a natural-language
    policy and executable enforcement logic using behavioral feedback from the target
    model. Each candidate is additionally evaluated through fresh-context adversarial
    review to filter rules that depend on benchmark artifacts. Across four agent benchmark
    families, EvoSafeHarness achieves a stronger safety-utility frontier than fixed
    expert-designed defenses. On DecodingTrust-Agent, evaluated across fifteen model-domain
    deployments, it reduces attack success rate from 50.9% to 12.6% for direct attacks
    and from 40.4% to 7.4% for indirect attacks, with a 3.3-point utility cost. On
    AgentDojo, it achieves 82.8% utility with 0.0% attack success rate, twice the
    utility of CaMeL at the same zero-attack-success operating point, while the same
    harness transfers unchanged to unseen AgentDyn suites. It also achieves the best
    score on Agent-SafetyBench for every evaluated victim model and maintains an attack
    success rate below 18% against an adaptive PAIR-style attacker with sixteen attempts
    per task. Analysis of the synthesized harnesses shows that domain semantics determine
    which safety relations and trajectory state must be tracked, while model and runtime
    behavior determine how and where those relations should be enforced.
  venue: arXiv (Cornell University)
- title: 'CURA: Certified Runtime Alarms for Computer-Use Agents'
  date: 2026-08
  url: https://arxiv.org/abs/2608.27808
  category: runtime
  subcategory: ''
  authors:
  - Divake Kumar
  - Sina Tayebati
  - Devashri Naik
  abstract: 'Self-report is the cheapest oversight channel a deployer has, and on
    capable computer-use agents (CUAs) it fails precisely where oversight matters.
    On 361 OSWorld tasks our pipeline, a read-only feasibility gate, a planner, and
    a GUI executor, reaches a mean task score of 82.9, above the 72.4 human reference,
    yet 64 of its 71 failures (90%) end with a success claim, 61 acknowledging no
    blocker, and the explicit failure affordance is never used in roughly 9,100 calls.
    We introduce CURA (Certified Runtime Alarms for Computer-Use Agents), an external
    monitor that reads only harness-visible telemetry, with no model internals, extra
    LLM calls, or prompt changes, and turns the running trajectory into a sequential
    test with certified false-alarm control. At alpha = 0.10 its CUSUM alarm detects
    42.3% of failures a median of 31 steps before termination at a realized false-alarm
    rate of 0.066, and risk is partly resolvable before the first action (gate probe,
    0.69 AUROC). Retrospectively the composite reaches 0.828 AUROC (fold-internal
    floor 0.802), but its margin over a total-token baseline is not significant (Delta
    = +0.026, p = 0.101); the separation is online, where CURA recalls more at matched
    certified budgets: 0.41 versus 0.34 at alpha = 0.10, 0.56 versus 0.38 at alpha
    = 0.20. Alarm-gated mid-execution oversight recovers 23 of 70 failures while spending
    a frontier overseer on 38, giving a deployable cascade at mean score 86.8 and
    84.5% full-solve (305 of 361). The certificate bounds false alarms only. We also
    report where behavioral monitoring is uninformative.'
  venue: arXiv (Cornell University)
- title: 'EviDx: Evidence-Aware Active Diagnosis with Scaffolded LLM Agents'
  date: 2026-01
  url: https://arxiv.org/abs/2608.24570
  category: runtime
  subcategory: ''
  authors:
  - Lihang Zeng
  - Shaoting Zhang
  - Xiaofan Zhang
  abstract: 'Clinical diagnosis is an active evidenceseeking process in which clinicians
    acquire evidence, update competing hypotheses, and decide when the available evidence
    is sufficient for diagnosis.Yet many medical diagnosis systems built around large
    language models (LLMs) still formulate diagnosis as static case-to-answer prediction,
    with limited support for evidence acquisition.Agentic LLMs offer a dynamic alternative
    through tool use and intermediate diagnostic trajectories, but existing systems
    often under-specify how patient evidence should be exposed, scaffolded, and controlled
    at runtime.We introduce EviDx, an evidence-aware active diagnosis framework that
    pairs patient-specific diagnostic environments with a clinical diagnostic scaffold
    and an observer-guided runtime harness.In EviDx, E-Synthesis constructs interactive
    environments from raw clinical cases; the scaffold organizes role-specialized
    agents, evidence tools, and evolving evidence states; and the harness regulates
    diagnostic termination by tracking uncertainty and evidence coverage.A 3-level
    evaluation pyramid assesses execution robustness, reasoning dynamics, and diagnostic
    outcomes.Experiments show that EviDx improves diagnostic performance and process
    stability while revealing model-dependent capability boundaries.Work Diagnosis
    Setting System Design Evaluation Interactive Env.Evidence Access Clinical Scaffold
    Runtime Harness Process-Level Eval.MDAgents (Kim et al., 2024) Agent Hospital
    (Li et al., 2024) AgentClinic (Schmidgall et al., 2024) MedAgentBench (Jiang et
    al., 2025) AutoMedic (Oh et al., 2025) EviDx * *Example 1 (Missing ICU status):*
    Add to `demographics.other_notes`OR append to ` physical_exam.general_appearance`.
    * *Example 2 (Missing Vaccine status):* Append to `past_medical_history`list:
    `["Up to date with COVID vaccines"]`.**OUTPUT:** Return the **FULLY CORRECTED
    JSON** object."""'
  venue: 'Findings of the Association for Computational Linguistics: EMNLP (Findings
    of EMNLP)'
- title: 'SafeEvolve: Harness-Policy Co-Evolution from Agent Experience for Safety
    Alignment'
  date: 2026-09
  url: https://arxiv.org/abs/2609.02786
  category: runtime
  subcategory: ''
  authors:
  - Qinghua Mao
  - Wanying Qu
  - Dadi Guo
  abstract: The performance of LLM-based agents is jointly shaped by the base model
    and the harness used when interacting with the environment. This exposes them
    to safety risks in both harmful final responses and multi-step execution trajectories.
    Existing safety alignment mechanisms often rely on either external harness updates
    or policy optimization, yet applying either paradigm in isolation fails to bridge
    runtime control with intrinsic safety. We propose SafeEvolve, an experience-driven
    self-evolving framework for agent safety alignment. SafeEvolve leverages safety
    experience from completed on-policy trajectories to drive a continual loop of
    harness-policy co-evolution. On the harness side, SafeEvolve converts trajectory-level
    safety evidence into bounded, component-level updates across safety prompt and
    hierarchical skills, yielding auditable and reversible harness artifacts. On the
    policy side, SafeEvolve follows a two-stage SFT-RL paradigm, where harness-use
    SFT bootstraps the policy to actively leverage evolved harness artifacts, and
    harness-augmented RL further shapes autonomous safety behaviors during multi-step
    exploration via verifier-decomposed rewards. Through harness-policy co-evolution,
    SafeEvolve converts safety experience into an evolved runtime harness and improved
    policy behavior. Experiments on agentic safety benchmarks show that SafeEvolve
    achieves a stronger safety-utility tradeoff than existing baselines. For Qwen3.5-4B,
    SafeEvolve achieves a $3\times$ ASR reduction on AgentDojo while improving benign
    utility from 59.79% to 61.86%.
  venue: arXiv (Cornell University)
- title: 'Skillware-Bench: The Empirical Benchmark & Evaluation Harness for Governed
    Agent Skills'
  date: 2026-10
  url: https://doi.org/10.5281/zenodo.23725543
  category: runtime
  subcategory: ''
  authors:
  - Vladimiros Peilivanidis
  - ARPA Hellenic Logical Systems
  abstract: Skillware-Bench is a transparent, open-source benchmark suite and evaluation
    harness designed to measure how frontier LLMs and agent runtimes utilize governed
    registry skills. Unlike generic function-calling benchmarks, Skillware-Bench measures
    multi-action procedural compliance, constitutional safety gates (preview-before-send,
    dry-runs, ambiguous consent), comparative with-vs-without skill efficiency (token
    bloat, latency, cost), and end-to-end real-world simulation crucibles.
  venue: Zenodo (CERN European Organization for Nuclear Research)
- title: 'Harness Engineering: Anatomy, Architecture, and Evolution of Coding Agents
    -- A Source-Code Study of Eleven Systems'
  date: 2026-07
  url: https://arxiv.org/abs/2609.00006
  category: runtime
  subcategory: ''
  authors:
  - Paul Barbaste
  - Tristan Darrigol
  - Germain Vu
  abstract: 'An agent is a model plus a harness -- the runtime that couples an LLM
    to the world through a loop, tools, context management, safety controls, orchestration,
    and extension surfaces. Harness engineering, named as a discipline in early 2026,
    is the design and evolution of that runtime. This paper gives the young discipline
    its most comprehensive empirical foundation to date: a source-code anatomy of
    eleven production coding harnesses (Claude Code, Codex CLI, Gemini CLI, Mistral
    Vibe, OpenHands, Aider, Mini-SWE-Agent, Hermes, Pi, OpenCode, OpenClaw), plus
    Omnigent, the first meta-harness, analyzed as a contrast point. We define what
    a harness is, map its seven canonical subsystems with the minimal and maximal
    implementation of each, and dissect all eleven systems along those subsystems.
    The audit yields 13 cross-cutting observations and a catalog of 29 recurring design
    patterns. Two absences survive a threefold corpus expansion: across roughly four
    million lines of Python, TypeScript, and Rust, no agent runtime imports a general-purpose
    agentic framework, and none retrieves code with vector embeddings; the field runs
    on hand-rolled async loops and deterministic retrieval. SKILL.md skills lead MCP
    in adoption (9/11 vs. 8/11), and ACP ships in six systems with a new third role:
    harness hosting. Because the original eight systems were re-pinned rather than
    replaced, the study also contains a controlled longitudinal sample -- the same
    harnesses source-diffed across one quarter -- showing convergence becoming imitation
    and behavioral policy migrating from prompt prose to configuration. These threads
    converge on the paper''s thesis: in the first half of 2026 the coding harness
    completed a turn from tool to platform. The paper closes with 18 design recommendations
    and a 90-line minimum-viable-harness scaffold.'
  venue: arXiv (Cornell University)
- title: 'Structural Debt in the Execution Layer: How Oracle Weakness, Harness Fragility,
    Type-System Gaps, and Behavioral Fingerprinting Jointly Expose a Candidate Framework
    for Agent Runtime Integrity'
  date: 2026-06
  url: https://doi.org/10.5281/zenodo.20760931
  category: runtime
  subcategory: ''
  authors:
  - Saluca Agentic AI Research Team
  abstract: 'Agentic AI systems deployed in production exhibit a recurring failure
    pattern that is not primarily about model capability: the execution layer surrounding
    the model — its test oracles, harness infrastructure, runtime governance, and
    type-enforcement mechanisms — systematically fails to catch errors that the model
    itself cannot self-report. This paper synthesizes seven findings from recent cs.SE,
    cs.PL, and cs.AR preprints into a candidate framework we call *structural execution
    debt*: the gap between what an agent runtime claims to enforce and what it actually
    enforces, measured at the layer of program structure rather than task outcome.
    The core thesis is a heuristic reading, not a derivation: across empirically distinct
    domains — AI coding agents, LLM-driven network operations, quantum software debugging,
    budget enforcement, and harness repair — the same structural pattern recurs. Verification
    signals are weak or absent at the oracle level [corpus:arxiv:2606.18168v1]; post-hoc
    selection operators cannot recover what oracle weakness discards [corpus:arxiv:2606.16999v1];
    harness layers introduce failure modes that mask task-level signal [corpus:arxiv:2606.02494v1];
    behavioral fingerprinting reveals that procedural identity persists even when
    benchmark scores converge [corpus:arxiv:2606.16988v1]; type-system enforcement
    can make entire classes of runtime hazard non-bypassable at compile time [corpus:arxiv:2606.04056v1];
    governed mutation frameworks can bound runtime adaptation without sacrificing
    auditability [corpus:arxiv:2605.27328v1]; and fixed-point scaffolding in a compiled
    ML-family language demonstrates that structural invariants can be preserved through
    compilation rather than checked post-hoc [corpus:arxiv:2606.02854v1]. The falsification
    path is concrete: an agentic system that combines oracle-aware quality gates,
    affine-typed budget enforcement, and structured harness monitoring should exhibit
    lower undetected failure rates than one relying on task-outcome metrics alone.
    The claim is falsifiable by constructing both systems on the same benchmark suite
    and measuring held-out failure escape rate. Sources span cs.SE (primary), cs.PL
    (secondary), and cs.AR (weakly connected addendum). All sources are preprints;
    none are peer-reviewed at time of synthesis. --- Authorship: Saluca Agentic AI
    Research Team (Saluca LLC). AI-drafted from arXiv preprint corpus on the date
    in the filename. Cited arXiv preprints: 2605.21337v1, 2605.27328v1, 2605.27332v1,
    2605.29490v1, 2605.31004v1, 2606.01490v1, 2606.02442v1, 2606.02494v1, 2606.02854v1,
    2606.04056v1, 2606.06324v1, 2606.07314v1, 2606.09686v1, 2606.09800v1, 2606.11076v1,
    2606.11117v1, 2606.12064v1, 2606.12212v1, 2606.16988v1, 2606.16999v1, 2606.18168v1,
    2606.19055v1'
  venue: Zenodo (CERN European Organization for Nuclear Research)
- title: 'Self-GC: Self-Governing Context for Long-Horizon LLM Agents'
  date: 2026-07
  url: https://arxiv.org/abs/2607.00692
  category: runtime
  subcategory: ''
  authors:
  - Xubin Hao
  - Hongjin Meng
  - Xin Yin
  abstract: 'Long-horizon LLM agents accumulate tool results, files, plans, and user
    constraints that are too structured to be treated as a disposable text suffix.
    Current systems mostly rely on in-run heuristics such as chronological pruning
    and tool-output masking, or on final self-summary near a context limit. Heuristics
    are cheap but blind to future dependencies; summaries preserve narrative state
    but often hide exact evidence, locators, and editable artifacts. We present Self-GC,
    where GC denotes self-governing context while deliberately echoing garbage collection:
    the system does not merely reclaim unused tokens, but governs the lifecycle of
    agent context objects. Self-GC turns user turns, tool spans, and skill state into
    indexed objects; asks a side-channel planner to propose fold, mask, and prune
    actions; and lets the harness enforce recoverable sidecars, safe commit boundaries,
    and cache-aware commit. On a 33-session Hard Set, Self-GC prunes 43.95% of prefix
    tokens while leaving 84.85% of future continuations unaffected, compared with
    no-impact rates of 54.55% to 69.70% for heuristic baselines. On a 332-session
    production-derived suite, three planner backbones reach no-impact rates of 91.27%
    to 94.58%, while baselines remain at 77.71% to 87.46%. In production, an online
    account-level split reduces daytime average input tokens by 10% to 15%, with peak
    reductions near 20%. These results point to context management as runtime lifecycle
    control over indexed, recoverable objects rather than post hoc text cleanup.'
  venue: arXiv (Cornell University)
- title: 'Querying BIM Models with LLM Agents: A Comparison of Data Representations'
  date: 2026-09
  url: https://doi.org/10.5281/zenodo.22679658
  category: runtime
  subcategory: ''
  authors:
  - Changyu Du
  - Sylvain Hellin
  - Stefan Fuchs
  abstract: 'Large Language Model (LLM)-based agents show promise for answering natural-language
    questions about BIM models. To do so, an agent relies on a representation of the
    model and a suitable tool to query it. This paper compares four representation–query
    tool pairings under one fixed agent harness: (1) IFC STEP file with IfcOpenShell,
    (2) JSON records in a file system queried with command-line tools, (3) relational
    database with SQL, and (4) a labelled property graph with Cypher. On 507 IFC-Bench
    questions, all four configurations reach similar overall accuracy: 78.7% for IFC
    STEP file, 76.3% for the file system, 75.5% for the graph database, and 74.6%
    for SQL. Cochran''s Q and pairwise McNemar tests confirm no significant differences
    at the 0.05 level. Where the configurations differ is in operation and category
    profile: IFC STEP file needs the fewest tool calls and the shortest runtime, while
    SQL is comparably strong on the geometric or spatial computation questions. Across
    IFC representations, faithfulness is the dominant bottleneck, suggesting that
    better value extraction, unit handling, and verification may matter more than
    the choice of the format alone. The code is available at https://github.com/sylvainHellin/
    ecppm-2026-du-hellin-fuchs-borrmann.'
  venue: Zenodo (CERN European Organization for Nuclear Research)
- title: 'HarnessSecurity-Bench: Do Security Mechanisms Really Protect Coding Agent
    Harnesses?'
  date: 2026-10
  url: https://arxiv.org/abs/2610.07639
  category: runtime
  subcategory: ''
  authors:
  - Zhengyang Zhu
  - Liming Huang
  - Runmin Ji
  abstract: 'Coding agent harnesses mediate tool use and authorize actions, yet their
    security mechanisms and runtime effects remain incompletely characterized. We
    present HarnessSecurity, the first systematic empirical study and benchmark of
    open- and closed-source coding agent harnesses. First, we derive a ten-mechanism
    taxonomy and then assess 400 harness-mechanism cells using independent ratings
    by researchers and large language model (LLM) judges. We find that about half
    of confirmed mechanism implementations are opt-in, while closed-source harnesses
    exhibit substantial evidence gaps. Second, we introduce HarnessSecurity-Bench,
    a benchmark of 23 tasks across five attack surfaces without sacrificing legitimate
    task requirements. Using separate deterministic oracles to measure task utility
    and attack effects with security setting comparisons, we evaluate nine mechanisms
    across six leading harnesses: Claude Code, Codex CLI, Gemini CLI, gptme, Qwen
    Code, and GitHub Copilot. Under a controlled LLM baseline GLM-5.2, we conduct
    2,500 trials, recording 81,155 tool calls and over 2.2 billion tokens. Enabling
    auto-approve increases utility and raises attack success from 29.2% to 95.6%.
    Network isolation and read-only mode reduce attack effects with substantial utility
    losses, while command allowlisting and command denylisting reduce attack effects
    with a small utility loss and a utility gain, respectively. Task-level cases show
    that restrictions on a shared capability can obstruct both legitimate and malicious
    operations, and that allowed tools or commands can leave unauthorized operations
    reachable through alternative execution paths. Harness providers should make security
    settings verifiable, test alternative execution paths to protected operations,
    and assess attack effects alongside task utility and execution costs.'
  venue: arXiv (Cornell University)
- title: 'UnityBench-Mini3D: Evaluating LLM Agents for 3D Game Development in Unity'
  date: 2026-10
  url: https://arxiv.org/abs/2610.35980
  category: runtime
  subcategory: ''
  authors:
  - Yijun Zhou
  - Minghao Shao
  - Ke Zhang
  abstract: 'Game development stresses coding agents in ways general software engineering
    does not: correctness depends on how engine APIs, serialized scene state, and
    runtime behavior interact, not on source code alone. Existing benchmarks mainly
    target platforms such as Godot and heavily rely on LLM judges or coarse task-level
    outcomes. We present UnityBench-Mini3D, a benchmark of 77 project-level Unity
    tasks organized around seven expert-defined skill categories rather than tutorials
    or genres, with three difficulty tiers. Each task pairs a complete Unity project
    with natural-language requirements and is evaluated using 1,178 held-out, human-authored
    milestone tests covering scene structure, component configuration, and runtime
    behavior. This in-engine evaluation provides deterministic partial credit, localizes
    failures, and distinguishes partial implementations from complete solutions without
    relying on subjective judges. Across 21 models and 9 coding harnesses, the average
    pass rate reaches 80.9% on easy tasks but falls to 35.2% on hard tasks, with just
    57.7% overall. UnityBench-Mini3D provides a reproducible, diagnostic testbed distinguishing
    systems across difficulty levels.'
  venue: arXiv (Cornell University)
- title: 'CACE-Bench: A Synthetic Agentic Evaluation Benchmark for LLM Credit-Pipeline
    Agents'
  date: 2026-07
  url: https://doi.org/10.5281/zenodo.21394049
  category: runtime
  subcategory: ''
  authors:
  - Ravil Akhtyamov
  abstract: 'Compliance-Aware Credit-agent Evaluation (CACE-Bench): a fully synthetic,
    reproducible benchmark and generator for evaluating and auto-evolving LLM-agent
    credit pipelines under auditability constraints. No real personal or production
    credit data is used anywhere in this benchmark. What is archived here. The generator,
    a reference agent, a deterministic ground-truth judge, the auto-evolution ablation,
    the metric collectors and the command-line interface are implemented in a single
    dependency-free Python file. The archive also ships the provider registry, the
    run configuration, the methodology and reproducibility notes, and dated reference
    runs, so every published figure can be regenerated from the code beside it. Data-availability
    axis. Cases are drawn per country and each of three source classes (open banking,
    alternative data, sanctions and PEP screening) is resolved by walking that country''s
    provider fallback chain. Only the structure of the registry is used; no provider
    data enters the benchmark. Consent is a separate gate, and ESCALATE is a first-class
    ground-truth outcome: the correct answer when the facts a decision needed were
    not obtainable, which makes a pipeline that never escalates measurably wrong.
    Every claim carries the provider it came from, so citing a source that did not
    respond is a separately reported error class. Metrics. Silent-decision rate, provenance
    completeness, over-escalation rate, hallucination rate, recovery rate, compliance
    false-positive rate and step-level correctness, all with 95 percent Wilson confidence
    intervals computed from genuine counts. Reference run (seed 0, N = 23,000 synthetic
    cases, registry 2026-08-03). 3,582 cases (15.57 percent) are undecidable. Baseline
    with self-evolution off versus self-evolution on: silent-decision rate 55.11 to
    6.53 percent; compliance false-positive rate 22.51 to 4.96 percent (-77.9 percent
    relative); hallucination rate 2.55 to 0.62 percent; over-escalation 3.60 to 0.53
    percent; provenance completeness 93.40 to 99.33 percent; recovery rate 81.81 percent;
    step-level correctness 86.98 to 97.70 percent. Scope. These figures characterise
    a reference agent and judge on a synthetic distribution, not a production LLM
    pipeline, and are illustrative of the method rather than of production performance.
    Provider-coverage figures are working assumptions, not vendor-confirmed data.
    Protected attributes are deliberately omitted, so fairness auditing is out of
    scope and flagged as required future work. Validation on production data has not
    been done. Relation to the accompanying paper. The paper reports a different experiment:
    a simulated regulatory re-interpretation at the 70 percent mark of the stream,
    compared across four conditions, in which the compliance false-positive rate recovers
    from 23.7 to 5.1 percent, counted over approximately 23,000 labelled trace steps
    for 3,000 applications. That harness is not part of this release and is planned
    for a later version; the figure should be cited to the paper, not to this record.
    Version 0.4.1 is a documentation and metadata release. It adds a changelog and
    citation guidance, documents the optional real_data module for public credit datasets
    added in 0.4.0, separates this repository''s reproducible reference run from the
    results reported in the paper, and rewrites this description, which previously
    opened by describing the preceding version. The benchmark, generator and data
    are unchanged from 0.4.0.'
  venue: Zenodo (CERN European Organization for Nuclear Research)
- title: 'SafeAgent: A Safety Intervention Framework for LLM-Based Coding Agents in
    CI/CD Pipelines'
  date: 2026-10
  url: https://doi.org/10.5281/zenodo.23582975
  category: runtime
  subcategory: ''
  authors:
  - anonymous
  abstract: 'This repository is the replication package for a Safety Intervention
    Framework for LLM-Based Coding Agents in CI/CD Pipelines. The guardian acts as
    a runtime monitor : intercepts each agent action, assigns a typed safety signature,
    and selects an intervention through a fixed mapping. The package contains the
    tool and evaluation harness, the six ablation configurations, the recorded runs
    behind the paper’s tables, the anonymized expert-validation data, and scripts
    that reproduce every reported number deterministically from the recorded traces.
    See README.md for instructions'
  venue: Zenodo (CERN European Organization for Nuclear Research)
- title: 'AgentBoundary: Counterfactual Evaluation of Safety in Tool-Using LLM Agents'
  date: 2026-09
  url: https://arxiv.org/abs/2609.33658
  category: runtime
  subcategory: ''
  authors:
  - Tianzhuo Yang
  - Zirui Mi
  - Yantao Huang
  abstract: 'Safety alignment for large language models (LLMs) in conversational settings
    is largely framed around whether to answer or refuse a request. In agentic settings,
    however, the same models must decide whether to act as permission-critical evidence
    emerges during execution. This creates a distinct challenge: apparent risk, action
    permissibility, and task competence are easily confounded, making agentic over-refusal
    difficult to distinguish from ordinary task failure. To address this, we introduce
    AgentBound, the first four-way counterfactual generation-and-evaluation framework
    for tool-using agent safety. AgentBound transforms the same executable workflow
    by independently varying apparent risk and action permissibility, enabling controlled
    comparisons of risky-looking but authorized tasks and routine-looking but unauthorized
    tasks. These comparisons jointly diagnose over-refusal and unsafe compliance while
    controlling for task competence. We instantiate AgentBound as a human-validated
    4,000-task evaluation suite with trajectory-based and post-state-based judgments.
    Across 17 model and harness configurations, high safety frequently coexists with
    poor authorized-task completion: GPT-5.5 blocks 99.5\% of routine-looking unauthorized
    actions yet completes only 28.7\% of risky-looking authorized tasks. We further
    train a lightweight runtime calibration module that improves authorized-task completion
    by 18.2\% on average across 10 evaluated configurations, while improving unsafe-action
    blocking by 5.4\% on average. These show that effective agentic alignment requires
    action decisions to track permission-relevant execution evidence, rather than
    refusal strength alone.'
  venue: arXiv (Cornell University)
- title: 'When Malicious Instructions Persist: Persistent Memory Poisoning Attack
    on Harness-Based Agents'
  date: 2026-09
  url: https://arxiv.org/abs/2609.13889
  category: runtime
  subcategory: ''
  authors:
  - Shuhuai Huang
  - Jingfeng Zhang
  - Hong Jia
  abstract: Harness design has transformed the development of LLM-based agents by
    integrating memory, tool use, and runtime control. However, this design also introduces
    security and privacy risks because malicious instructions from external sources
    may be written into persistent memory and persist across sessions. To study this
    risk, we propose PMPA, a Persistent Memory Poisoning Attack against harness-based
    agents. PMPA embeds malicious instructions into benign external sources and induces
    the victim agent to write them into persistent memory without directly accessing
    to the agent framework. Once stored, the poisoned memory can be retrieved in later
    sessions, triggering additional malicious actions and causing privacy leakage.
    We evaluate PMPA on OpenClaw and Claude Code across different backbone LLMs, input
    modalities, and trigger scenarios. Across all settings, PMPA achieves average
    Injection Success Rate (ISR) and Cross-session Attack Success Rate (C-ASR) of
    73.7%/ 55.5% on OpenClaw and 66.9%/ 81.7% on Claude Code, while preserving benign
    task performance on both systems. We further evaluate a targeted prompt-level
    defense and find that it can reduce memory injection in many settings, but provides
    limited protection once the persistent memory has been poisoned.
  venue: arXiv (Cornell University)
- title: 'ScopeLatch: Reproducibility Artifact for Authenticated Approval Envelopes
    and Bounded LLM-Agent Tool Effects'
  date: 2026-08
  url: https://doi.org/10.5281/zenodo.21898078
  category: runtime
  subcategory: ''
  authors:
  - Huimin Zheng
  - Rui Li
  abstract: 'ScopeLatch studies how a tool approval remains bound to its execution
    principal, request, action, and budget across concurrency, retries, crashes, and
    target changes. This reproducibility artifact contains Lean 4 formal models and
    proofs, Python reference implementations and regression tests, TLA+ specifications
    and recorded finite-state checks, a hash-pinned OpenClaw runtime boundary harness,
    and reproduction scripts accompanying the paper “ScopeLatch: Authenticated Approval
    Envelopes for Bounded LLM-Agent Tool Effects.”'
  venue: Zenodo (CERN European Organization for Nuclear Research)
- title: 'A Process Harness for Uplifting Legacy Workflows to Agentic BPM: Design
    and Realization in CUGA FLO'
  date: 2026-06
  url: https://arxiv.org/abs/2606.27188
  category: runtime
  subcategory: ''
  authors:
  - Fabiana Fournier
  - Lior Limonad
  abstract: 'We introduce the process harness, a new mechanism for uplifting legacy
    workflows into Agentic Business Process Management (Agentic BPM) without replacing
    the underlying workflow engine. A process harness places a policy-governed agentic
    layer around a deterministic workflow engine, intercepting designated control
    points to contribute reasoning, adaptation, and oversight while the engine retains
    structural authority over the process. To define the process harness rigorously,
    we develop the Task-Decision-Flow (TDF) model, specifying both its data schema
    and its execution semantics. TDF decomposes LLM reasoning across three policy-governed
    agent types: a TaskAgent for knowledge-intensive task execution, a DecisionAgent
    for per-case gateway routing, and a FlowAgent that governs runtime flow adaptation
    through a principled hook mechanism. Each agent reasons within an explicit policy
    drawn from the process FRAME, the aggregate policy set governing all LLM calls
    in the system. We then present CUGA FLO as the design and implementation realization
    of the TDF model, and demonstrate it on a loan approval workflow that exercises
    all three agent types and hook-driven regulatory override. The process harness
    uniquely reconciles imperative requirements, realized through deterministic workflow
    execution that enforces structural compliance, with normative requirements, realized
    through policy-framed agentic autonomy invoked at designated control points wherever
    the process demands it.'
  venue: arXiv (Cornell University)
- title: 'Trust the Brand, Lose Control: How Identity Hijacks LLM Agent Orchestration'
  date: 2026-09
  url: https://arxiv.org/abs/2609.32635
  category: runtime
  subcategory: ''
  authors:
  - Xutao Mao
  - Rui Qian
  - Linghan Chen
  abstract: LLM agents now execute tasks end to end with permission to change real
    systems and increasingly orchestrate subagents that differ in capability and cost.
    Prior work treats the choice of subagent as an optimization problem. Yet the orchestrator
    makes this choice from the identities that subagents display, and an attacker
    can spoof them. Displayed identity thus decides operational authority, meaning
    who is trusted to check the work and who is allowed to change it. As a result,
    a risky subagent can keep authority over execution even after other evidence contradicts
    it. We introduce TrustFork, an LLM agent safety benchmark with 1,890 tasks and
    27,826 valid trajectories across 16 agent systems. These systems run eight orchestrators
    under the OpenCode, OpenClaw, and Pi harnesses. In each task, one subagent carries
    a risky goal while the other three stay aligned with the user, so contradicting
    evidence can exist. A task can also change the identity a subagent displays without
    changing the model behind it, which lets us trace a shift in authority to the
    label. Our analysis shows that even when another subagent contradicts the risky
    response, the orchestrator still acts on it in 72.0% of cases on average, most
    often in the systems with the least terminal harm. Swapping the family labels
    nearly triples how often the orchestrator obtains the risky response. A safer
    response is available in 84.0% of tasks, yet it decides the outcome in only 25.0%.
    The harness also decides which responses reach the orchestrator. Among three runtime
    defenses, hiding identity cues helps most consistently, while verifying before
    action helps only when the harness returns enough evidence. TrustFork shows that
    production agent orchestration must bind authority to evidence before execution
    causes harm. Our project is in https://henrymao2004.github.io/agent-orchestration-safety/.
  venue: arXiv (Cornell University)
- title: 'Replace Runtime. Keep State: IPSD as a Field Methodology for State-Centric
    Work with AI Agents'
  date: 2026-01
