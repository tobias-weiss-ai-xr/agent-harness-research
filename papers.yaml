- title: 'HarnessMM: Recursive Self-Improvement for Harness Token Efficiency'
  date: 2026-10
  url: https://arxiv.org/abs/2610.32813
  category: runtime
  subcategory: systems
  authors:
  - Yuhua Jiang
  - Chang Xu
  - Feifei Gao
  - Li Zhao
  venue: ''
  code_url: https://github.com/YuhuaJiang2002/HarnessMM
  project_url: ''
  abstract: HarnessMinusMinus (HarnessMM) is a research project on improving the efficiency
    of agent harnesses, the software coordinating model reasoning, tool execution,
    and feedback. This technical report consolidates its shared framework, implementations,
    and empirical studies across coding, tool-based, and visual-agent settings. Agent
    harnesses often invoke reasoning after each tool result, even when earlier calls
    have already determined subsequent actions. HarnessMM addresses this overhead
    through guarded decision reuse and recursive self-improvement (RSI). RSI refines
    author prompts, context settings, and adapter rules using training feedback, with
    validation selecting deployment configurations. At inference time, a controller
    reuses resolved decisions while keeping actor weights fixed. Executable Decision
    Graphs encode actions, arguments, dependencies, and guards. Guarded Decision Reuse
    activates eligible decisions from observed feedback, while Certified Callback
    Substitution executes them through native tool interfaces, replacing redundant
    reasoning callbacks. The original actor resumes when new reasoning is required
    or reuse conditions are unmet. On HumanEval, HarnessMM preserves Codex success
    at 90.82\% while reducing tokens per task from 66.72k to 47.02k (29.54\% saving).
    For DeepSeek Harness, success improves from 71.43\% to 85.71\% while tokens decrease
    from 96.28k to 11.62k (87.93\% saving). An MBPP ablation shows 26.91\% lower cost
    than single-use graphs and 19.52\% lower cost than retained callbacks. The report
    also summarizes the HarnessMM-V visual-agent study and documents optimization
    overhead and execution time where measured. Together, these studies investigate
    guarded decision reuse across diverse agent harness settings. Code is available
    at https://github.com/YuhuaJiang2002/HarnessMM.
- title: 'Adapting the Interface, Not the Model: Runtime Harness Adaptation for Deterministic
    LLM Agents'
  date: 2026-05
  url: https://arxiv.org/abs/2605.22166
  category: runtime
  subcategory: ''
  authors:
  - Tianshi Xu
  - Huifeng Wen
  - Meng Li
  abstract: LLM agents are shaped not only by their language models, but also by the
    runtime harness that mediates observation, tool use, action execution, feedback
    interpretation, and trajectory control. While existing agent adaptation methods
    mainly update model parameters, many failures in deterministic, rule-governed
    domains stem from mismatches at the model--environment interface. We propose Life-Harness,
    a lifecycle-aware runtime harness that improves frozen LLM agents without changing
    model weights or evaluation environments. Life-Harness evolves from training trajectories
    by converting recurring interaction failures into reusable interventions across
    environment contracts, procedural skills, action realization, and trajectory regulation,
    and remains fixed for evaluation on unseen tasks. We evaluate Life-Harness across
    eight environments from AgentBench, $τ$-bench, $τ^2$-bench, and AppWorld using
    18 open-weight backbones, and further test three frontier models on seven environments.
    With Qwen3-4B-Instruct, Life-Harness exceeds Meta-Harness and AHE by 28.7 and
    7.5 percentage points in mean accuracy across the seven shared environments, respectively,
    while using 8.5\% and 68.4\% fewer optimization tokens. The evolved harnesses
    also benefit GPT 5.5, Opus 4.8, and Gemini 3.1 Pro, yielding an average accuracy
    gain of 3.5 percentage points. Code is available at https://github.com/Tianshi-Xu/Life-Harness.
  venue: arXiv (Cornell University)
- title: 'Ecdysis: Efficient and Effective Training of Runtime Harnesses for LLM Agents'
  date: 2026-09
  url: https://arxiv.org/abs/2609.11677
  category: runtime
  subcategory: ''
  authors:
  - Ruiqing Yue
  - Yu Cui
  - Sun Zhuoyu
  abstract: Self-evolving runtime harnesses can substantially improve the capabilities
    of large language model (LLM) agents and provide a promising paradigm for optimizing
    agent execution. Existing failure-driven approaches often treat observed agent
    failures as direct evidence for harness modification. A key challenge in failure-driven
    harness evolution is that observed failures can reflect either limitations of
    the underlying model or systematic deficiencies of the harness. Directly optimizing
    against individual failures can therefore induce model-specific accommodation
    and impair generalization across tasks and models. We study whether failure evidence
    accumulated across task instances can provide a more reliable signal for harness
    training. Our key insight is that failures recurring across distinct tasks provide
    stronger inductive evidence for systematic harness deficiencies than isolated
    failures. Based on this insight, we propose Ecdysis, which aggregates failure
    evidence across task instances before promoting recurring failure patterns into
    persistent harness evolution, biasing evolution toward repairs that are more likely
    to generalize beyond individual model behaviors. Ecdysis further employs collaborative
    failure analysis to refine modification specifications, trading additional evolution-time
    reasoning for improved modification quality. Across multiple LLMs and benchmarks,
    Ecdysis improves the reasoning accuracy of evolved harnesses by 18.56% over existing
    harness evolution while achieving up to 1.84x faster harness training. Ecdysis
    also enables more data-efficient training. Fine-grained analysis shows that Ecdysis
    reduces model-specific accommodation during evolution, while the resulting harnesses
    exhibit stronger cross-LLM generalization and lower inference-time token consumption.
  venue: arXiv (Cornell University)
- title: 'Agentao: A Policy-Governed Runtime Harness for Embeddable Tool-Using LLM
    Agents'
  date: 2026-07
  url: https://arxiv.org/abs/2608.13574
  category: runtime
  subcategory: ''
  authors:
  - Bo Jin
  - Qiang Jiao
  - Xin Tong
  abstract: LLM agents increasingly operate as execution systems that invoke tools,
    modify local state, use persistent memory, and interact with external protocols.
    These capabilities make agents useful, but they also introduce risks related to
    over-privileged actions, weak auditability, prompt injection, tool poisoning,
    and uncontrolled side effects. This paper presents Agentao, a governed local-first
    runtime for tool-using LLM agents. Agentao separates model-generated action proposals
    from host-authorized execution through a layered architecture consisting of host-facing
    surfaces, a host contract, a runtime core, a permission-mediated tool system,
    and supporting subsystems for memory, replay, plugins, skills, sub-agents, and
    protocol integration. We describe the motivation, threat model, design goals,
    governance model, execution pipeline, and structured event interface of the system.
    Agentao does not provide formal safety guarantees; rather, it demonstrates how
    permissions, state, protocol boundaries, and execution traces can be made explicit
    runtime abstractions for building agents that are more governable, inspectable,
    and suitable for host-controlled local environments. The code is publicly available
    at https://github.com/jin-bo/agentao .
  venue: arXiv (Cornell University)
