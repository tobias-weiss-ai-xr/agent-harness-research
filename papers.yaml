- title: 'Claw-SWE-Bench: A Benchmark for Evaluating OpenClaw-style Agent Harnesses
    on Coding Tasks'
  date: 2026-06
  url: https://arxiv.org/abs/2606.12344
  category: runtime
  subcategory: systems
  authors: []
  venue: ''
  code_url: ''
  project_url: ''
  abstract: The software engineering capabilities of general-purpose agent harnesses
    remain underexplored, and existing benchmarks offer limited support for comparing
    these harnesses under consistent conditions. To address this gap, we introduce
    Claw-SWE-Bench, a unified benchmark that enables researchers to systematically
    assess the capabilities and efficiency of general-purpose harnesses on software
    engineering tasks. The benchmark contains 350 real-world GitHub issue-resolution
    instances across eight programming languages and 43 repositories and provides
    a shared adapter protocol to align task inputs, outputs, and execution environments
    across harnesses. Experiments show that general-purpose harnesses can effectively
    resolve real-world software issues and that their success rates and resource consumption
    vary substantially even when the underlying model is held fixed. To lower evaluation
    costs and support faster debugging and iteration, we also provide Claw-SWE-Bench
    Lite, an 80-instance subset designed to preserve the key evaluation properties
    of the full benchmark. We hope this benchmark will help researchers better evaluate
    and understand the performance of general-purpose harnesses on software engineering
    tasks and guide the development of more capable and efficient harnesses. The data
    is available at https://github.com/opensquilla/claw-swe-bench and https://huggingface.co/datasets/TokenRhythm/Claw-SWE-Bench.
