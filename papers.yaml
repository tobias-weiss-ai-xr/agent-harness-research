    (EMNLP)'
- title: 'Gatekeepers and Hallucinations: A Layered Evaluation Framework for LLM-Driven
    Quantum Circuit Generation'
  date: 2026-06
  url: https://arxiv.org/abs/2606.18422
  category: runtime
  subcategory: ''
  authors:
  - Christopher Coleman
  - Sharon Marfatia
  abstract: 'As large language models (LLMs) become embedded in quantum simulation
    workflows (IDE copilots, notebook assistants, agentic pipelines), evaluation must
    move beyond functional correctness to anticipate and catch structured failures
    before they propagate through expensive pipelines. We present a layered evaluation
    framework for materials-informed Variational Quantum Eigensolver (VQE) circuit
    generation: (i) a gatekeeper screening rubric across seven physical and framework
    criteria; (ii) a circuit fidelity analysis comparing model outputs against analytical
    and reference-implementation values for H2/STO-3G/Jordan-Wigner/UCCSD, with ansatz
    classification and gate-composition breakdown; and (iii) design entropy, a run-to-run
    behavioral consistency metric. We surface a taxonomy of five distinct LLM failure
    modes (geometry hallucination, nonexistent API usage, runtime integration failures,
    constraint violations, and plausible-but-unverifiable output), each with distinct
    detectability profiles and structural to the task rather than to any one model.
    A forensic audit of the evaluation platform''s own source code further establishes
    that two apparent model failures originated in the harness through silent fallback-template
    substitution, demonstrating that evaluation infrastructure belongs inside the
    same trust boundary as the models it tests. Applied across multiple foundation
    models on a Materials Project integrated pipeline, the framework shows that gatekeeper-style
    validation is necessary, not optional, for reliable deployment.'
  venue: arXiv (Cornell University)
- title: 'CraftBench-UE: Deterministic Evaluation for Coding Agents in Unreal Engine'
  date: 2026-09
  url: https://arxiv.org/abs/2609.23142
  category: runtime
  subcategory: ''
  authors:
  - Shutong Wu
  - Kevin Calderone
  - Andy Tsen
  abstract: Building gameplay features in a game engine requires more than code, as
    code that compiles and runs does not necessarily implement the requested gameplay.
    We introduce CraftBenchUE, an evaluation harness that runs agents in an isolated
    Unreal Engine environment, reconstructs their saved submissions in fresh projects,
    and applies deterministic build, asset, and runtime checks without an LLM judge.
    Based on the harness, we built a benchmark consisting of 70 tasks spanning C++
    source, Blueprint assets, and editor scripting. We evaluate seven models under
    two editor-tool configurations, with a file-and-shell baseline on C++ tasks. We
    further pair tasks that specify the same gameplay and use the same runtime tests,
    but require C++ and Blueprint as the deliverables. Across the 10 paired tasks,
    C++ completion rates exceed Blueprint by 30.0 and 42.9 percentage points in the
    two tool configurations. Among on-time Blueprint submissions in this paired set
    that pass asset checks, 42.2% and 50.0% fail explicit runtime assertions. These
    submissions satisfy asset requirements but fail the required gameplay tests. We
    will release the harness, task benchmark, and our trajectory findings with the
    report.
  venue: arXiv (Cornell University)
- title: 'Automata from Agent Traces: Failure and Next-Step Prediction'
  date: 2026-08
  url: https://arxiv.org/abs/2608.23670
  category: runtime
  subcategory: ''
  authors:
  - Seonglae Cho
  - Franklin Cardeñoso Fernández
  - Umar Mohammed
  abstract: 'LLM-based agents execute multi-step tasks, but their behavioral structure
    remains opaque: long unstructured traces resist the safety auditing and runtime
    monitoring that deployment requires. Existing approaches operate per-trace or
    success-only, so they miss the cross-run topology that links next-step and failure
    prediction. To recover that shared structure, we collapse an entire trace corpus
    into a single, compact finite-state machine (FSM) that serves as a structural
    substrate for the otherwise unpredictable behavior of LLM agents. Across twelve
    public datasets, the FSMs are compact (7-43 states), replay held-out data at >=0.997
    fitness with near-identical topology across splits, and build in milliseconds.
    This substrate addresses both prediction goals. For next-step prediction, FSM-state
    context outperforms Agent Workflow Memory on every ground-truth-matched dataset.
    For failure prediction, per-state behavioral features reach held-out AUROC up
    to 0.94, and an online monitor ranks failing runs above passing ones from a partial
    trace, triggering early stopping well before completion. Behavioral topology thus
    appears shaped more by the deployment harness than by the LLM, providing a model-agnostic
    structural primitive for safety auditing and runtime monitoring.'
  venue: arXiv (Cornell University)
- title: 'Credo: Reusable Declarative Primitives for Agentic Workflows'
  date: 2026-08
  url: https://arxiv.org/abs/2608.27790
  category: runtime
  subcategory: ''
  authors:
  - Duo Lu
  - Andrew Crotty
  - Uğur Çetintemel
  abstract: 'An LLM application depends on both a model and a harness: the program
    that determines what each call sees, how many calls to make, and which answers
    to trust. Coding agents can now discover strong harnesses by searching over candidate
    programs, but the resulting artifact is an opaque block of imperative code whose
    logical steps, runtime signals, physical execution decisions, and prompt strategies
    remain implicit and task-specific, forcing subsequent tasks to start the harness
    search process from scratch. The potential for reuse, however, is substantial.
    A searched harness encodes significant knowledge, such as the logical steps that
    work, the signals that matter, the physical operator decisions that adapt execution,
    and the prompt strategies that are effective, yet this knowledge is buried in
    imperative code with no inspectable or reusable structure, nor does it carry any
    provenance or metadata. Credo addresses this problem by recovering a structured
    declarative description of a searched harness, tagging each extracted primitive
    with relevant metadata, and cataloguing all of it with provenance. A compiler
    can then bind stored primitives to generate harnesses for new tasks without having
    to start the search over from scratch. This paper provides preliminary results
    demonstrating the potential of our approach and lays out a related research agenda
    that the database community is well-positioned to tackle, including cost-based
    compilation over declarative catalogs and catalog maintenance under model and
    workload drift.'
  venue: arXiv (Cornell University)
- title: Agentic Separation Logic Specification Synthesis
  date: 2026-05
  url: https://arxiv.org/abs/2605.27531
  category: runtime
  subcategory: ''
  authors:
  - Tarun Suresh
  - David Korczynski
  - Julien Vanegue
  abstract: 'Specification synthesis, the task of automatically inferring formal specifications
    from program implementations and natural language, is important for refactoring,
    transpilation, optimization, and verification, yet remains an open challenge for
    large C++ repositories. Existing LLM-based approaches fail to simultaneously scale
    to such repositories, produce specifications expressive enough to capture systems-code
    features such as dynamic memory and heap-allocated data structures, and systematically
    validate those specifications to rule out incorrect candidates. We present Spec-Agent,
    an agentic system for synthesizing expressive, well-validated specifications across
    large C++ codebases. Spec-Agent targets a ladder of specification languages: propositional
    logic, first-order logic, propositional separation logic, and first-order separation
    logic. For each function, Spec-Agent uses static analysis and runtime heap tracing
    to select the appropriate target specification language, generalizes existing
    functional tests into fuzz harnesses, and iteratively refines LLM-generated candidates
    via counterexample-guided feedback. We evaluate Spec-Agent on open source C++
    codebases comprising millions of lines of code. Spec-Agent synthesizes valid specifications
    for 85% of target functions, with no false positives observed under fuzzing and
    expert validation, outperforming Claude Code Opus 4.6 at 10x lower token cost.'
  venue: arXiv (Cornell University)
- title: Cross-hardware reproducibility of LLM evaluation results (item level)
  date: 2026-09
  url: https://doi.org/10.5281/zenodo.23042034
  category: runtime
  subcategory: ''
  authors:
  - CSOAI Ltd (Council of AI)
  - Nicholas Templeman
  abstract: 'Byte-identical copy of the Hugging Face dataset csoai/cross-hardware-reproducibility
    at revision d374bab8a8c06912de0a6ce81ec975207d9da271. It was copied only after
    that revision scored 100% on CSOAI''s outward quality gate (2026-09-29T05:00:09Z).
    Per-file SHA-256 values are in MANIFEST.json. The card below is the dataset card,
    unedited. A listing on this site is a copy for access, not a sign of adoption.
    Cross-hardware reproducibility of LLM evaluation results (item level) Same model,
    same prompts, same decode settings, different machine: does each item get the
    same answer? This dataset holds the item-level evidence behind the preprint "Same
    model, same prompts, different answers: item-level cross-hardware reproducibility
    of LLM evaluation results" (Nicholas Templeman, CSOAI Ltd (Council of AI), 2026).
    The PDF is in this repository: paper/paper.pdf; its LaTeX source, with the analysis
    scripts, is paper/paper-source.tar.gz. 154 evaluation results ("cards") · 11 open-weight
    models · 14 axes · 9,757 items · 3 runs per item (RunPod RTX 3090 primary run;
    Kaggle Tesla T4 reproduction; the same T4 job repeated in the same session). Each
    item carries the raw output of every run, its SHA-256, parsed label, grade, status
    (correct / wrong / excluded) and stop reason, plus the agreement flags used in
    the paper. Headline numbers. Each is read from paper/numbers.json, which the paper''s
    script regenerates from data/items.jsonl (see "How to verify"): raw output byte-identical,
    RTX 3090 vs T4 8,231 / 9,757 items (84.4%) grade equal 9,497 / 9,757 items (97.3%)
    grade flips 260 (2.66%, 95% CI 2.36–3.00%): 122 wrong→right on T4, 138 right→wrong
    status swaps (same grade; parse error on one runtime, wrong label on the other)
    83 items on 31 cards cards with equal totals (correct, graded, parse errors) 62
    / 154 … of which an item''s grade differs (flips cancel in the total) 11 cards
    with the same grade on every item 54 / 154 admitted under the item-level rule
    (equal totals and equal grade on every item) 51 / 154 T4 repeat not byte-identical
    to T4 run 1 20 / 150 cards (4 models); 13 cards changed totals This is a measurement
    of whether a result survives a change of runtime. It is not a grade or a certification
    of any model, GPU vendor or cloud provider, and it does not say which runtime
    is "right". None of the models is a CSOAI model. What this does not show Not a
    ranking or a score of any model, company, GPU vendor or cloud provider. Flips
    run in both directions in near-equal numbers (two-sided sign test p = 0.35); neither
    runtime is "better". Not a cause below "the runtime". GPU architecture, GPU count
    and layer split, driver, flash-attention setting and possibly the server build
    all differ between the two runtimes, and several primary-side values are UNRECORDED.
    No component is identified as the cause. Not a statement about other serving engines
    (vLLM, SGLang, TensorRT-LLM), larger or unquantized models, long reasoning outputs,
    or batched serving. One engine was tested: Ollama with its llama.cpp backend,
    single-request, 4-bit quantized models of 0.5–12B parameters. Not a measurement
    of the primary runtime''s own stability. The RTX 3090 side has no repeat run.
    Not a third runtime. A Tesla P100 reproduction of the item-level-admitted cards
    was queued while the analysis was prepared; it has not been admitted or signed,
    and no result from it is in this dataset. Not an independent reproduction. All
    runs, graders and the admission rule are the publisher''s. The per-item data and
    signed roots let anyone re-check the comparison, but a reproduction by a different
    operator would be stronger evidence. Not grader-independent above the raw-output
    level. Grade and status depend on the instruments'' graders; raw-output agreement
    does not. Contents path what data/items.jsonl one row per (card, item). Columns
    prefixed rtx3090_, t4_run1_, t4_run2_ (run2 is null for 4 gemma3:12b cards the
    budget guard skipped). xhw_* compare 3090 vs T4 run 1; repeat_* compare T4 run
    2 vs run 1. expected is the bank''s reference answer. data/cards.jsonl one row
    per card: counts on each run, agreement counts, flip/swap item ids, admission
    outcome under the counts-only and item-level rules data/runtimes.jsonl one row
    per run: declared runtime. Fields not recorded at run time are the string UNRECORDED,
    never inferred data/withheld.jsonl raw outputs withheld from this public copy
    (hash kept), with the reason; empty if none declarations/*.json the runtime declarations
    (csoai.mill-runtime-declaration/0.1), byte-identical to the files the signed capsules
    bind capsules/batch1, capsules/batch2 signed capsule batches: record.json, record.signed.json,
    capsules.jsonl.gz, OpenTimestamps proof paper/paper.pdf the preprint paper/paper-source.tar.gz
    LaTeX source (with paper.bbl), tables, figures and the three analysis scripts
    paper/numbers.json every number in the paper, as generated by make_figures.py
    code/figures/ the analysis scripts: xhw.py, make_figures.py, from_dataset.py verify.py
    offline verifier (below) manifest.jsonl path, bytes and SHA-256 of every other
    file Prompts are not copied. Each item is identified by item_id and prompt_sha256
    within a bank pinned by bank_sha256; the banks are public on this Hub under csoai/gspc-<axis>.
    Setup in one paragraph Models are served by Ollama and pinned by registry manifest
    digest (checked in-run on both sides; a mismatch halts). Decode: temperature 0,
    seed 0, max_tokens 128 (1,024 for swarm), no streaming, thinking off. Instruments
    (prompt adapter, label set, graders, decode, digest) are pinned by instrument_sha256,
    recomputed on both runtimes from harness commit fd80a903. Primary: RunPod RTX
    3090, 23–24 Sep 2026; GPU driver, Ollama server version at run time, flash-attention
    setting and GPU count are UNRECORDED. Reproduction: Kaggle 2×Tesla T4, 26 Sep
    2026, driver 580.159.04, CUDA driver API 13.0, Ollama 0.33.0, Kaggle image pinned
    by digest, flash attention auto (enabled). Quantization per model (read from the
    T4 serve log): Q4_0 for mistral-nemo:12b and phi3.5:3.8b, Q4_K_M for the rest.
    Signed roots batch capsules RFC 6962 Merkle root record.json SHA-256 1 (mistral-nemo:12b)
    14 5ae00c1f4c2ed290fb91206f29372d0df3e61478c568d4797855502e751ebff6 32ece857c94062f41a03aad9e269532cdbe5dc0a576ed20110edc4ecacb0468d
    2 (ten models) 140 78226433e9e433b311e067ee56fcbaf415f6dc57301254f3bb4922a0b8053cf6
    422fa6377b274bab095e8e875f67d087a275417c14c90a4c4e4cedb56ca9a5ff Each record is
    signed with Ed25519 under did:web:csoai.org#board-attestation-1 (public key in
    https://csoai.org/.well-known/did.json). The signature is over the canonical JSON
    (sorted keys, no whitespace) of record.signed.json → payload. Timestamps: each
    record.json.ots is an OpenTimestamps proof over its record.json. capsules/batch1/record.json.ots
    is Bitcoin-attested (confirmed in Bitcoin block 968671). capsules/batch2/record.json.ots
    is Bitcoin-attested (confirmed in Bitcoin block 968673). Each record.json.ots
    also carries calendar attestations that are still pending, which do not affect
    the Bitcoin one. Check with ots verify capsules/batch1/record.json.ots (and the
    same for batch 2). How to verify pip install cryptography python3 verify.py #
    or fully offline: python3 verify.py --pubkey-x k2fPWb6ctyu8l5at8FYgHsHFit_qoT-DssW3VNbCAXA
    The signature check on its own, in a few lines of Python (did.json refuses the
    default Python User-Agent, so the snippet names one): import json, hashlib, base64,
    urllib.request from cryptography.hazmat.primitives.asymmetric import ed25519 for
    b in ("capsules/batch1", "capsules/batch2"): s = json.load(open(f"{b}/record.signed.json"))
    c = json.dumps(s["payload"], sort_keys=True, separators=(",", ":"), ensure_ascii=False).encode()
    assert hashlib.sha256(c).hexdigest() == s["signature"]["payload_sha256"] assert
    hashlib.sha256(open(f"{b}/record.json", "rb").read()).hexdigest() == s["payload"]["artifact"]["sha256"]
    req = urllib.request.Request("https://csoai.org/.well-known/did.json", headers={"User-Agent":
    "cross-hardware-reproducibility-verify/1.0 (+https://councilof.ai/research/cross-hardware-reproducibility/)"})
    did = json.load(urllib.request.urlopen(req, timeout=30)) x = [m for m in did["verificationMethod"]
    if m["id"].endswith("#board-attestation-1")][0]["publicKeyJwk"]["x"] ed25519.Ed25519PublicKey.from_public_bytes(base64.urlsafe_b64decode(x
    + "==")).verify(bytes.fromhex(s["signature"]["sig_ed25519"]), c) print("VERIFIES",
    b) verify.py checks: record hashes against the signed payload; capsule file hashes;
    that every capsule is canonical and its id is the SHA-256 of its body; the RFC
    6962 root over the sorted ids; every declaration''s hash against the record; the
    Ed25519 signature; that each declaration''s per-item results hash to the value
    its capsule binds and agree with data/items.jsonl; that recounting data/items.jsonl
