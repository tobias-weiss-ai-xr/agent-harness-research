  - auto-systems
- title: 'Quant-Arena: Benchmarking LLM Agents for Quantitative Trading Research'
  date: 2026-10
  url: https://arxiv.org/abs/2610.30113
  category: runtime
  subcategory: systems
  authors: []
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Quantitative research is an iterative loop: a researcher proposes a market
    hypothesis, implements it as an executable signal, tests it on historical data,
    and decides what to keep. Existing benchmarks score formulas, code, or individual
    trading decisions, leaving open whether large language models (LLMs) can complete
    this loop and produce strategies that work beyond the research period. We introduce
    Quant-Arena, a benchmark and public leaderboard for end-to-end quantitative research
    on real A-share market data. A model constructs features and stock-scoring code,
    receives feedback only on 2022--2023, and freezes one strategy for assessment
    on the sealed year 2024. A cash-account evaluator applies trading constraints
    and costs, including market impact estimated from a simulated order book. Scores
    are dominated by realized excess return and complemented by signal quality and
    the diversity of features used by the strategy. We evaluate nine frontier models,
    among which GPT-6 Astra scores highest; yet no model beats the equal-weight market
    in 2024. Quant-Arena is open to submissions from any model or agent harness.'
  tags:
  - auto-runtime
  - auto-systems
- title: 'EvoAlloc: A Self-Evolving Resource Allocation Agent for Efficient Program
    Evolution'
  date: 2026-10
  url: https://arxiv.org/abs/2610.12086
  category: runtime
  subcategory: systems
  authors: []
  venue: ''
  code_url: ''
  project_url: ''
  abstract: LLM-based program evolution relies on evaluation feedback to guide the
    iterative search for high-performing programs. However, evaluation is often computationally
    expensive, making it essential to allocate limited resources to candidates that
    can most effectively advance the search. Existing LLM-based methods typically
    rely on fixed allocation strategies throughout the search, potentially wasting
    resources on low-value candidates while overlooking promising ones. We propose
    EvoAlloc, a self-evolving resource-allocation agent that learns from search experience
    to revise its strategy for allocating computational resources across candidates.
    EvoAlloc periodically consolidates prior search and allocation outcomes into reusable
    experience, which informs subsequent strategy revisions. It further uses a counterfactual
    exploration mechanism to occasionally evaluate candidates denied resources by
    the allocator, revealing their outcomes to enrich its experience for future strategy
    updates. Across coding and agent-harness optimization benchmarks, EvoAlloc requires
    59-82% fewer full evaluations and 61-89% fewer total LLM tokens to reach baseline-level
    performance. Moreover, under the same full-evaluation budget, EvoAlloc achieves
    8.7-12.0% higher final performance.
  tags:
  - auto-runtime
  - auto-systems
- title: 'Eta Given Delta: Defining LLM Tool Efficiency With Marginal Tool Utility'
  date: 2026-05
  url: https://arxiv.org/abs/2607.14108
  category: runtime
  subcategory: systems
  authors: []
  venue: ''
  code_url: ''
  project_url: ''
  abstract: This paper introduces tool efficiency, a new quantitative metric to evaluate
    the rate of useful tool calls in an LLM agent trajectory. To ensure that tool
    efficiency is well-defined, we also introduce marginal tool utility, a new quantitative
    metric defined per tool call indicating whether a tool is useful or whether it
    can be safely removed from the tool suite without affecting accuracy while increasing
    tool efficiency; in this paper, we determine the sign of marginal tool utility
    for each tool call in a trajectory using LLM-as-a-Judge. While much prior work
    has been done to develop techniques that improve tool use by LLMs and design evaluation
    methods measuring efficiency indirectly using accuracy as a proxy, our work is
    centered on measuring efficiency directly via the quantitative metric proposed
    in this paper in post hoc trajectory analyses. It is our intention that this work
    contributes to the frontier of LLM evaluation research as a springboard for future
    benchmark designs and agent harness engineering (specifically with regards to
    creating lean tool suites) that optimize for metrics that complement but are distinct
    from accuracy.
  tags:
