- title: 'Librarian Agents: Training LLMs to Curate Long-Context Workspaces that Anticipate
    Future Queries'
  date: 2026-10
  url: https://arxiv.org/abs/2610.22273
  category: runtime
  subcategory: systems
  authors: []
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Reasoning over long document contexts remains a challenge for large language
    models (LLMs). Standard retrieval methods are inherently reactive, bottlenecking
    agents with complex, cross-document reasoning at inference time, while precomputed
    structures like knowledge graphs often fall short because they rely on rigid heuristics.
    Instead, can we allow agents to perform anticipatory directed curation: learning
    to proactively reorganize unstructured corpora prior to inference to efficiently
    serve diverse future queries. We build on a key asymmetry in modern agentic harnesses
    (e.g., Claude Code): while LLM agents are adept at navigating existing filesystems
    to solve an immediate task, they are rarely trained to construct reusable workspaces
    for future use. To instantiate this capability, we introduce Librarian Agents,
    a framework in which a builder agent transforms raw documents into a hierarchical
    filesystem of synthetic files and reference links, which forms a workspace tailored
    for a downstream answering agent. We formulate workspace construction as a Markov
    decision process and optimize the builder policy via reinforcement learning to
    directly maximize downstream answering accuracy. Empirically, Librarian Agents
    outperforms the strongest retrieval and precomputation baselines by 33 percentage
    points on BrowseComp-Plus, amortizes upfront construction costs across repeated
    queries, and generalizes zero-shot to unseen domains on BRIGHT with a 31-point
    average accuracy improvement.'
  tags:
  - auto-runtime
  - auto-systems
- title: Benchmarking and Enhancing Agentic Causal Discovery
  date: 2026-10
  url: https://arxiv.org/abs/2610.22846
  category: runtime
  subcategory: systems
  authors: []
  venue: ''
  code_url: ''
  project_url: ''
  abstract: LLM agents can now run causal discovery algorithms on a dataset and report
    what comes out. Whether they do more than that, such as noticing where an algorithm
    went wrong and fixing it with further tests, is hard to tell from current benchmarks.
    Most of them give the variables meaningful names, and an LLM shown only the names
    of the Tübingen cause-effect pairs already gets 99% of the directions right. With
    the names removed, the data are usually clean enough that picking a better algorithm
    than PC closes most of the gap. We introduce Heuresis, a benchmark of anonymous
    simulated datasets whose mechanisms range from linear Gaussian to heavy-tailed.
    For each family of datasets it separates what a better existing algorithm can
    gain from what only a closer look at the data can gain, and it traces every edge
    an agent changes. Every family leaves a gap that none of the algorithms, the router
    and the two causal-discovery foundation models we ran can close, so a score above
    the best chosen algorithm has to come from using the data. We instantiate the
    benchmark with an agent harness and three LLMs, GPT-6.1 Sol, Claude Opus 5.5 and
    Qwen 3.8 Flash. GPT-6.1 Sol surpasses the best chosen algorithm on all six families,
    by 14% adjacency F1 on the most difficult one, and Claude Opus 5.5 does so by
    7.4% there. A third of the true edges the two agents restore on the two hardest
    families appear in no algorithm's output. The code and data will be publicly released
    to facilitate future work.
  tags:
  - auto-runtime
  - auto-systems
- title: 'FlashRT: Agent Harness for Guiding Agents to Deploy Real-Time Multimodal
    Applications'
  date: 2026-07
  url: https://arxiv.org/abs/2607.18171
  category: runtime
  subcategory: systems
  authors: []
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Real-time multimodal applications, including voice agents and interactive
    video generation, compose heterogeneous models into pipelines whose efficient
    deployment requires application-specific decisions about placement, streaming,
    and intra-model parallelism. Existing serving systems and auto-parallelism compilers
    commit to limited transformations and fixed workload assumptions, so achieving
    high performance on a new application requires hand-crafting an efficient implementation.
    We present FlashRT, an agent harness that guides coding agents to lift simple
    developer-written reference implementations into optimized multi-GPU deployments
    that flexibly weigh target metrics like latency and throughput. Using a new chain-of-program
    paradigm, FlashRT directs a generic coding agent through a multi-pass transformation
    process where an agent transforms the reference into an intermediate representation
    (IR) to capture data dependencies and persistent-state scopes, validates this
    IR via a sequential interpreter, and performs static analyses to identify candidate
    transformations. Then, the agent iteratively implements, verifies, and benchmarks
    each candidate under a measurement-gated optimization loop to produce effective
    deployments that span different hardware budgets. Across various applications,
    including video world models and multimodal LLMs, FlashRT converts reference implementations
    into highly efficient deployments, delivering up to ~70x latency reduction and
    2.8x throughput improvement on NVIDIA B200 GPUs. On AMD MI355X GPUs, FlashRT matches
    the peak latency reduction while increasing peak throughput improvement to 3.6x,
    demonstrating that agent-driven optimization can be more scalable on platforms
    with less mature expert optimization. In fact, for Qwen3-Omni text-to-audio inference,
    FlashRT reduces response latency by 65% compared to the expert vLLM-Omni implementation
    on AMD MI355X.
