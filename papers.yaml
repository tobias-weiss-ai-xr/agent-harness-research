- title: 'AJAR: Adaptive Jailbreak Architecture for Red-teaming'
  date: 2026-01
  url: https://arxiv.org/abs/2601.10971
  category: runtime
  subcategory: ''
  authors:
  - Yipu Dou
  - Wang Yang
  abstract: 'Large language model (LLM) safety evaluation is moving from content moderation
    to action security as modern systems gain persistent state, tool access, and autonomous
    control loops. Existing jailbreak frameworks still leave a gap between adaptive
    multi-turn attacks and agentic runtimes: attack algorithms are usually packaged
    as monolithic scripts, while agent harnesses rarely expose explicit abstractions
    for rollback, tool simulation, or strategy switching. We present AJAR, a red-teaming
    framework that exposes multi-turn jailbreak algorithms as callable MCP services
    and lets an Auditor Agent orchestrate them inside a tool-aware runtime built on
    Petri. AJAR integrates three representative attacks, namely Crescendo, ActorAttack,
    and X-Teaming, under a shared service interface for planning, prompt generation,
    optimization, evaluation, and context control. On 200 HarmBench validation behaviors,
    AJAR improves X-Teaming from 65.0% to 76.0% attack success rate (ASR), reaches
    80% cumulative success one turn earlier than the native implementation, and reproduces
    Crescendo more effectively than PyRIT (91.0% vs. 87.5% ASR). Behavior-level analysis
    shows that these gains are concentrated in hard categories and frequently depend
    on rollback-enabled transcript repair. We further show that tool access reshapes
    rather than uniformly enlarges the attack surface: ActorAttack rises from 51.0%
    to 56.0% ASR with tools, whereas Crescendo drops from 91.0% to 78.0% and X-Teaming
    from 76.0% to 55.5%, with the sharpest declines appearing in categories that rely
    on long semantic buildup. These results position AJAR as a practical foundation
    for evaluating multi-turn jailbreaks under realistic agent constraints. Code and
    data are available at https://github.com/douyipu/ajar.'
  venue: arXiv (Cornell University)
- title: 'amitpatole/verel: v1.10.0 — Guard: document-ingress defense (the AI worm
    scanner)'
  date: 2026-08
  url: https://doi.org/10.5281/zenodo.22047966
  category: runtime
  subcategory: ''
  authors:
  - AMIT SAMSON PATOLE
  abstract: 'Fold graded memory into an LLM''s context automatically at runtime —
    no tool call, no model choice. Verel''s memory has been reachable two ways: the
    operator CLI and the agent-driven MCP verel_recall tool (the model must choose
    to call it). This adds the third, deterministic path: a developer-designed runtime
    hook that always injects relevant prior context, so a user never re-supplies what
    they already told an earlier conversation. What''s new inject_memory(mem, messages,
    *, scope, position, token_budget, …) — a pure function over the message list (drops
    into any framework''s hook): derives a recall query deterministically (default:
    the latest user turn), recalls graded-first + budgeted + fenced, and injects at
    a developer-chosen position — system (appended after your own system prompt, which
    stays first + authoritative), user (prepended into the latest user turn), or assistant
    (a synthetic prior turn). Deterministic and side-effect-free — never mutates the
    caller''s messages. MemoryInjector(mem, chat, …) — wraps any ChatFn so one wrap
    turns retrieval deterministic app-wide, with no change to callers. Optional capture=capture_conversation(…)
    writes the turn back after the reply (a full read+write harness); a write-back
    error never breaks the chat turn. Safe by construction The injected block is recall_budgeted''s
    fenced <recalled_memory> DATA — graded-first (a VERIFIED fact beats a candidate;
    a poisoned candidate can''t crowd it out), token-budgeted, and neutralized (zero-width/bidi
    stripped, newlines collapsed, <> defanged) so a stored memory can''t forge the
    fence or smuggle an instruction into the prompt it lands in. Library API only
    — deliberately not an MCP tool, since the whole point is a hook the developer
    controls, not a tool the agent invokes. Security cadence Untrusted memory → LLM
    context, regression-pinned: fence-escape resistance, scope isolation, no-mutation/aliasing
    safety, graded-first under a tight budget, determinism, rejected-value exclusion.
    Verified ruff + mypy clean · 1523 tests pass · dogfood premerge_stage(security=True)
    PASS on all four graders · mkdocs --strict green · clean-install from PyPI verified
    on py3.12. Try it: python examples/demo_inject.py (offline, no key). 🤖 Generated
    with Claude Code'
