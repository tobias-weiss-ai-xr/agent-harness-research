- title: Learning Generalizable Behaviors for Terminal Agents
  date: 2026-08
  url: https://arxiv.org/abs/2608.22631
  category: runtime
  subcategory: systems
  authors: []
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Terminal agents are a compelling application of large language models
    (LLMs), with the potential to integrate deeply into users'' daily workflows. Reinforcement
    learning (RL) is a key technique for improving their capabilities, making scalable
    training environments a central challenge. Since public real-user interaction
    data are scarce, synthetic environments provide a practical alternative, but often
    suffer from domain gaps and limited fidelity, leading to poor generalization.
    Existing work mainly scales the quantity and diversity of synthetic environments,
    while reward-signal quality and the mechanisms governing generalization remain
    under-explored. We study how RL improves terminal agents and propose the Agentic
    Compositional Generalization hypothesis: rather than teaching new domain-specific
    skills from scratch, RL primarily shapes high-level decision-making behaviors
    that compose and route low-level skills acquired during pre-training and supervised
    fine-tuning (SFT). This account is consistent with our empirical results and suggests
    that verifier quality, which determines which behaviors are reinforced, is more
    important than simply increasing environment quantity or diversity. Motivated
    by this insight, we propose River, a simple training recipe that improves reward
    quality by filtering low-quality environments and augmenting outcome rewards with
    process-level behavior regularization. Using this recipe, our RL-trained agent
    achieves the best performance among evaluated open-source RL-trained 8B models
    across four terminal-agent benchmarks. River also generalizes across model families,
    scales, agent harnesses, and RL objectives. Using fewer than 30% of the TMax training
    environments, River improves RL gains by 106% and 30% on average for models ranging
    from 2B to 27B on Terminal-Bench-Lite and Terminal-Bench-v2.1, respectively.'
  tags:
  - auto-runtime
  - auto-systems
- title: 'Fast Models, Slow Evidence: A Paired and Self-Audited Evaluation of System-1
    Decision Models for LLM Agent Harnesses'
  date: 2026-10
  url: https://arxiv.org/abs/2610.02267
  category: runtime
  subcategory: systems
  authors: []
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Agent harnesses make many small, typed decisions per task: which model
    to call, which tool to use, whether retrieved text is relevant, whether an input
    carries an injection. System-1 decision models answer such questions in a single
    forward pass with class probabilities, promising large cost and latency savings
    over LLM calls. We present a paired evaluation of an open-weight (Laya) and a
    hosted (Jev) System-1 model on 11 agent decision points built from 18 public sources:
    7,283 base cases plus 6,640 robustness variants, with byte-identical inputs, paired
    tests, and cross-hardware and cross-day reproducibility checks. Jev is significantly
    more accurate on 9 of 11 decision points (+10.8 to +46.0 pp). Neither model beats
    chance on zero-shot model routing, and they tie on RAG relevance gating. Laya
    changes 30% of its answers when the option order is reversed and degrades sharply
    with many or similar candidates (31% at 50 nearest-neighbour tools, vs. 98% for
    Jev on items with a unique correct tool). We also audit our own pipeline. Three
    analysis errors and one design confound distorted headline deployment claims:
    an omitted pre-screen cost (reported 23.9% saving, actual 4.3%), gate accuracy
    reported as end-to-end quality (58% vs. 98%), in-sample thresholds (5% target,
    up to 17% held-out misses), and a "channel effect" on injection false positives
    that vanishes with channel-native content. Two other suspected confounds did not
    change the conclusions. All cases, raw outputs and analysis code are available
    at https://github.com/David-DL-Space/sys1-eval.'
  tags:
  - auto-runtime
  - auto-systems
- title: 'When the harness decides success: state that cannot be re-observed'
  date: 2026-10
  url: https://arxiv.org/abs/2610.26632
  category: runtime
  subcategory: systems
  authors: []
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Agent harnesses decide what a language model sees across turns: they
    drop old turns, summarize them, or replay the model''s own earlier reasoning.
    We ask when these choices change whether an agent succeeds, not only what it costs,
    and report three findings. First, in a pre-registered synthetic probe, truncating
    the context window costs a low-cost reasoning model nothing in success when a
    needed fact can be looked up again (it looks the fact up instead), but drops its
    success to chance when the fact cannot be re-observed: the two penalties differ
    by 92.5 percentage points (90% CI [89.5, 95.5]). A pre-registered replication
    on one model from a second provider showed the same contrast. Once the fact was
    lost, that model chose no answer rather than guessing. Second, on ARC-AGI-3, where
    the benchmark''s Standard harness trails its Provider Adapter harness by a wide
    margin, we decompose that gap one component at a time, for one model on four games.
    Summarizing old turns instead of dropping them, while keeping the Standard harness''s
    invitation to take notes, recovers 86% of a 63-point gap without replaying the
    model''s reasoning. The same harness without the invitation recovers 43%, and
    adding the provider''s native replay of the model''s reasoning recovers the remaining
    57%. These are point estimates from one counted run per configuration and game,
    and the replay share depends on a single run. Third, in the benchmark''s published
    runs and in ours, the Adapter''s advantage in the probability of clearing a level
    it has reached is larger at deep levels than at early ones. This largely restates
    where runs stopped and does not separate a growing advantage from a constant one.'
