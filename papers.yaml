- title: 'Empirical Lyapunov Stability: Growth-Ratio Energy Functions as Leading Indicators
    of Agent Task Failure'
  date: 2026-06
  url: https://doi.org/10.5281/zenodo.20722986
  category: runtime
  subcategory: ''
  authors:
  - Verma, Vishal
  abstract: 'In our prior theoretical work, we proposed a physics-inspired framework
    for governing the semantic boundary layer of multi-agent AI systems, drawing on
    Lyapunov stability theory, Renormalization Group compression, and Vector Symbolic
    Architectures. That framework was a theoretical edifice; mathematically grounded
    but empirically unverified. This paper presents its empirical validation through
    a 5-condition ablation study (3,175 total runs) isolating each mechanism''s contribution,
    with multi-trial validation (333 SWE-bench runs) confirming statistical robustness
    and cross-model validation across 5 model families including 4 open-weight local
    models. We implement the proposed framework as state-harness, a hybrid Rust/Python
    runtime safety library, and evaluate it across four complementary benchmarks:
    τ³-bench (customer-service agents, 750 runs), SWE-bench Verified (software engineering
    agents, 481 runs), MINT (multi-turn reasoning and coding, 1,136 runs), and a custom
    local-model battery (808 runs across 4 open-weight model families via Ollama on
    consumer hardware). Our central empirical finding is that the naive Lyapunov energy
    function V(k) = S(k) + λθ(k) produces unacceptable false positive rates (46%)
    because multi-turn conversations naturally exhibit ΔV ≥ 0 as context windows accumulate.
    We resolve this through growth-ratio normalization: monitoring the ratio V̂(k)
    = S(k)/S̄ against a warmup baseline rather than raw token counts. This normalization
    transforms an unstable diagnostic signal into a precise leading indicator of task
    failure. Our 5-condition ablation (Baseline → Lyapunov-only → Lyapunov+RG → Full-stack
    → Naive Cap) reveals four principal results: (1) on short/medium-loop benchmarks
    (MINT + τ³), the monitor achieves zero stability violations across 1,886 runs
    with <2% computational overhead; (2) on long-loop benchmarks (SWE-bench), full-stack
    monitoring achieves 38.6% compute reduction and 30% wall-time reduction while
    eliminating all max-budget burnout events; (3) multi-trial evaluation (333 SWE-bench
    runs) confirms all resolve-rate differences between conditions fall within the
    ±4–5% LLM nondeterminism band; (4) local model validation across 4 open-weight
    model families (Llama 3.2:3B, Phi-4-Mini, Qwen3:4B, Gemma4:E4B) confirms zero
    false positives across 80 harness runs and reveals a novel small-model self-sabotage
    pattern where naive turn-limiting outperforms unconstrained baselines by +17.5pp
    on average. The implementation is released as open-source: github.com/vishal-dehurdle/state-harness.
    Install via PyPI: pip install state-harness.'
  venue: Zenodo (CERN European Organization for Nuclear Research)
- title: 'The Agentic Threshold: How a Convergence of Capability Curves Unleashed
    Autonomous AI (2017–2025)'
  date: 2026-07
  url: https://doi.org/10.5281/zenodo.22035562
  category: runtime
  subcategory: ''
  authors:
  - Ossi Gabriel
  abstract: 'The transformer architecture was published in June 2017; large language
    models (LLMs) have been publicly usable since GPT-3 (2020) and culturally ubiquitous
    since ChatGPT (2022). Yet autonomous AI agents (systems that plan, call tools,
    self-correct, and complete multi-step tasks with minimal supervision) did not
    become practical until 2025. We ask why this eight-year gap existed, and answer
    with a convergence thesis: agentic capability is not one skill that improved gradually
    but a conjunction of ten capability curves, each of which had to independently
    clear a usability threshold. Because an autonomous loop fails outright when any
    single ingredient is missing, viability is governed by the *minimum* across curves,
    a Liebig''s-Law-of-the-Minimum dynamic: the era could not begin until the last
    curve crossed. Using published benchmarks we quantify the crossing of seven of
    these curves (IFEval, BFCL, RULER, GPQA, τ-bench, provider pricing, METR) and
    identify the binding constraint as long-horizon autonomy. We define the autonomy
    threshold in task complexity, that is, serial dependent steps, rather than wall-clock
    time, which conflates capability with hardware, latency, and serving speed: published
    agent trajectories place a useful task at roughly 10–50 steps (SWE-bench issue
    resolution has a median of ~12; GAIA grades difficulty by action-sequence length,
    into the tens), and completing ~25 steps at a useful rate requires effective per-step
    reliability near 99% (`0.99^25 = 0.78`), a regime reached only in 2024–2025 through
    inference-time reasoning and harness verification. METR''s time-horizon series
    (whose axis is human-expert task time, not agent runtime) corroborates the trend
    and, extended past the inflection, confirms the rise is structural, not cyclical:
    horizons keep doubling (from ~7 months historically to ~3.5 months since January
    2024) with no reversal. We synthesise all ten curves in one figure and close with
    the next threshold: sub-30B models with GPT-4-class ability, moving the frontier
    from the datacentre to the laptop.'
