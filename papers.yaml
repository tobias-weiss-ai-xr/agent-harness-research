- title: 'AEC-Bench: A Multimodal Benchmark for Agentic Systems in Architecture, Engineering,
    and Construction'
  date: 2026-03
  url: https://arxiv.org/abs/2603.29199
  category: runtime
  subcategory: systems
  authors: []
  venue: ''
  code_url: ''
  project_url: ''
  abstract: The AEC-Bench is a multimodal benchmark for evaluating agentic systems
    on real-world tasks in the Architecture, Engineering, and Construction (AEC) domain.
    The benchmark covers tasks requiring drawing understanding, cross-sheet reasoning,
    and construction project-level coordination. This report describes the benchmark
    motivation, dataset taxonomy, evaluation protocol, and baseline results across
    several domain-specific foundation model harnesses. We use AEC-Bench to identify
    consistent tools and harness design techniques that uniformly improve performance
    across foundation models in their own base harnesses, such as Claude Code and
    Codex. We openly release our benchmark dataset, agent harness, and evaluation
    code for full replicability at https://github.com/nomic-ai/aec-bench under an
    Apache 2 license.
