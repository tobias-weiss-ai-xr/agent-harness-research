- title: Forward-Deployed Full-Stack Engineering for Autonomous Cloud MLOps
  date: 2026-08
  url: https://arxiv.org/abs/2608.29615
  category: runtime
  subcategory: systems
  authors: []
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Across industries, machine-learning systems support applications ranging
    from prediction and anomaly detection to forecasting, optimization, and scheduling,
    yet operationalizing these systems requires coordinating application development,
    model pipelines, cloud infrastructure, security, deployment, monitoring, retraining,
    recovery, and rollback. We present an evidence-gated multi-agent framework for
    transforming a natural-language MLOps cloud engineering task into a verified repository
    and operational cloud deployment. The framework combines graph engineering, loop
    engineering, and agent harness engineering. A stateful Graph Orchestrator coordinates
    specialized agents for repository generation, review, execution, verification,
    release, and monitoring while governing workflow dependencies, evidence gates,
    retry bounds, recovery paths, and termination. Consequential lifecycle transitions
    proceed only when their required predicates are supported by verifiable execution
    or runtime evidence. Verification failures activate bounded reflection, repair,
    and re-verification, while runtime evidence of failure, drift, degradation, or
    policy violation can trigger bounded adaptation, recovery, or rollback. Agent
    harness engineering constrains repository generation, review, and repair, artifact
    execution, and cloud operations through controlled capabilities and isolated execution
    environments. We realize the framework on Google Cloud Platform and evaluate repository
    completeness, controlled execution, evidence-gated transitions, cloud promotion,
    and bounded recovery. Our experimental results show that the framework prevents
    unsupported lifecycle transitions and drives each run toward either a verified
    operational deployment or an auditable terminal failure.
