- title: 'GenMem: Generative Symbolic Memory for Self-Evolving Harness'
  date: 2026-09
  url: https://arxiv.org/abs/2609.34633
  category: runtime
  subcategory: systems
  authors: []
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Long-term memory supports the self-evolution of LLM agents by retaining
    experience and skills across tasks and enabling their retrieval, reuse, and revision
    in subsequent long-horizon decision-making. Yet existing memory management approaches
    remain limited to discriminative retrieval and to address the sparse, hierarchical,
    and highly redundant structure of reusable experience: only a small, task-dependent
    subset of trajectories and memories warrants retention, retrieval, or revision.
    Learning these operations is further complicated by sparse, delayed, and indirect
    task-level feedback, with weak supervision across the memory lifecycle. Moreover,
    continual memory evolution introduces an architectural tension as addressing invariance:
    stored experience is perpetually revised, yet the addressing interface consumed
    by learned retrieval policies must remain stable. To address, we present GenMem,
    which reformulates memory management as generative symbolic addressing. Its core
    mechanism is the Symbolic Identifier (SID), a multi-level discrete token tuple
    drawn from a Cartesian-product address space that factorizes a million-scale sparse
    memory space using fewer than one hundred discrete symbols. Instead of generating
    ever-changing raw content, the memory agent learns to generate SIDs, while memory
    evolution rewrites the payload at a fixed address without shifting the address
    itself. Architecturally, GenMem couples a MemRetriever and a MemEvolver within
    a multi-agent harness, trained via GRPO with dense process and outcome rewards
    with two-channels optimization. Under offline memory evolution, experiments spanning
    ALFWorld, WebShop, multi-hop QA, medical reasoning, and deep research evaluate
    GenMem against strong memory-augmented baselines...'
  tags:
  - auto-runtime
  - auto-systems
- title: Has GPT-6-Astra Achieved Embodied Intelligence?
  date: 2026-10
  url: https://arxiv.org/abs/2610.22471
  category: runtime
  subcategory: systems
  authors: []
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'GPT-6-Astra demonstrates a level of competence in robotic manipulation
    and navigation that challenges the conventional paradigm of building specialized
    models for individual tasks and embodiments. In this report, we ask not only how
    capable GPT-6-Astra is, but what its capabilities imply for the field. First,
    we probe the limits of standalone GPT-6-Astra. We conduct a large-scale evaluation
    across 12 representative benchmarks spanning tabletop manipulation, humanoids,
    mobile platforms, and dexterous hands. Under a unified protocol that allows in-context
    learning (ICL) from training-set demonstrations and substantially increases the
    number of execution steps, GPT-6-Astra achieves unprecedented performance (Fig.
    1). Future research may focus on improving 1) the generality of ICL 2) cost and
    execution time, 3) physical-state verification, 4) recovery from irreversible
    failures, and 5) long-horizon preservation of progress. Second, we study the agentic
    harness for embodied control. We identify that close-loop coordination between
    a high-level "System 2" reasoner (i.e., GPT-6-Astra) and a low-level "System 1"
    controller (e.g., π0.5) is costly but effective. Third, we examine GPT-6-Astra
    on real-world deployment. Our experiments on 8 robot configurations reveal substantial
    gaps: 1) robot demonstrations required for ICL are expensive to collect, and 2)
    it is implausible to trade longer execution for higher success rates with physical
    constraints. Fourth, we envision the next generation of embodied benchmarks. We
    develop a prototype that 1) derives tasks from real-world needs, 2) provides no
    in-domain demonstrations, and 3) judges agents on a world clock that keeps running
    while they deliberate. Taken together, our results suggest that GPT-6-Astra has
    largely crossed the threshold of embodied competence, but not yet that of practical
    embodied intelligence.'
  tags:
  - auto-runtime
  - auto-systems
- title: 'Workspace-Bench 1.0: Benchmarking AI Agents on Workspace Tasks with Large-Scale
    File Dependencies'
  date: 2026-05
  url: https://arxiv.org/abs/2605.03596
  category: runtime
  subcategory: systems
  authors: []
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Workspace learning requires AI agents to identify, reason over, exploit,
    and update explicit and implicit dependencies among heterogeneous files in a worker's
    workspace, enabling them to complete both routine and advanced tasks effectively.
    Despite its importance, existing relevant benchmarks largely evaluate agents on
    pre-specified or synthesized files with limited real-world dependencies, leaving
    workspace-level evaluation underexplored. To this end, we introduce Workspace-Bench,
    a benchmark for evaluating AI agents on Workspace Learning involving Large-Scale
    File Dependencies. We construct realistic workspaces with 5 worker profiles, 74
    file types, 20,476 files (up to 20GB) and curate 388 tasks, each with its own
    file dependency graph, evaluated across 7,399 total rubrics that require cross-file
    retrieval, contextual reasoning, and adaptive decision-making. We further provide
    Workspace-Bench-Lite, a 100-task subset that preserves the benchmark distribution
    while reducing evaluation costs by about 70%. We evaluate 4 popular agent harnesses
    and 7 foundation models. Experimental results show that current agents remain
    far from reliable workspace learning, where the best reaches only about 60%, substantially
    below the human result of 80.7%, and the average performance across agents is
    only 43.3%.
