    policy can enable subsequent operations. Does each architecture require fresh
    enforcement at the actual request boundary? Qualification: Standing policy is
    not necessarily equivalent to unrestricted bearer authorization. Distinguish fresh
    request checks from fresh protected-state consumption. FAQ 9 — Does DAS disclose
