- title: 'Correctness Debt at the Execution Boundary: How Type-System Gaps, Semantic
    Ambiguity, Harness Lifecycle Debt, Format Divergence, and Verification Theater
    Jointly Define a Structural Deficit in Deployed Software Infrastructure'
  date: 2026-06
  url: https://doi.org/10.5281/zenodo.20700904
  category: runtime
  subcategory: ''
  authors:
  - Saluca Agentic AI Research Team
  abstract: 'Modern software infrastructure accumulates what we term *correctness
    debt*: a class of defects that are not random bugs but structural properties of
    the deployment pipeline itself—properties that testing and monitoring rarely catch
    because the failure mode is either silent, pre-runtime, or masked by a layer that
    was supposed to prevent it. This paper synthesizes five specific findings from
    recent cs.SE, cs.PL, and cs.AR preprints into a candidate reading of why correctness
    debt is growing faster than the tools meant to address it. The thesis is a heuristic
    reading, not a derivation: the five mechanisms are analogous in structure but
    do not share a single formal framework. The five mechanisms are: (1) type systems
    that cannot enforce resource-ownership invariants at compile time, leaving cost-bearing
    values aliasable at runtime [corpus:arxiv:2606.04056]; (2) undefined behavior
    that executes silently in production C/C++ code, generating thousands of warnings
    even under routine desktop tasks [corpus:arxiv:2606.12064]; (3) numeric format
    proliferation across ML accelerators that produces silent divergence without a
    shared bit-exact reference [corpus:arxiv:2606.09686]; (4) SBOM tooling that cannot
    agree on what a *component* is, leaving supply-chain blind spots even when all
    tools are run [corpus:arxiv:2606.02442]; and (5) harness lifecycle debt in LLM-agent
    systems, where structural defects mask task-level error signals and make conventional
    monitoring unreliable [corpus:arxiv:2606.02494]. The unifying structural pattern
    is *verification theater*: each layer nominally provides a correctness guarantee,
    but the guarantee is either non-enforceable, scope-limited, or defeated by the
    layer below it. The falsification path for the thesis is concrete: instrument
    a single production deployment with all five detection mechanisms simultaneously
    and measure whether the failure-mode categories are statistically independent.
    If they cluster, the structural-deficit framing is supported; if they are independent,
    the thesis reduces to five unrelated engineering problems. --- Authorship: Saluca
    Agentic AI Research Team (Saluca LLC). AI-drafted from arXiv preprint corpus on
    the date in the filename. Cited arXiv preprints: 2605.21337, 2605.27328, 2605.27332,
    2605.29490, 2605.31004, 2605.31389, 2605.31520, 2606.01490, 2606.02442, 2606.02494,
    2606.02854, 2606.04056, 2606.06324, 2606.06492, 2606.07314, 2606.07412, 2606.09122,
    2606.09686, 2606.09800, 2606.11076, 2606.11117, 2606.12064, 2606.12212, 2607.07314'
