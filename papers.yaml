- title: 'WAMJET: A Harness for World Action Model Acceleration'
  date: 2026-10
  url: https://arxiv.org/abs/2610.03797
  category: runtime
  subcategory: systems
  authors: []
  venue: ''
  code_url: ''
  project_url: ''
  abstract: World Action Models (WAMs) leverage pretrained video foundation models
    for robot manipulation, but their large backbones and video-action co-prediction
    are expensive. Although existing acceleration techniques offer many ways to reduce
    this cost, selecting and composing them requires substantial engineering for each
    model and hardware platform. To tackle this bottleneck, we present WAMJET, an
    agentic harness that accelerates WAM inference by equipping coding agents with
    reusable optimization guidance and measurement and validation tools. WAMJET follows
    a bottleneck-driven workflow where the agent profiles inference, modifies targeted
    code, validates effects, and iteratively refines the acceleration stack as bottlenecks
    shift, while preserving action quality. Experiments span six WAMs, three coding
    agents, and two GPU architectures. WAMJET achieves up to 9.95x lossless speedup
    over upstream implementations. Approximation and hardware-aware optimization yield
    additional latency reductions, with comparable success rates. The results show
    that WAMJET can produce effective acceleration stacks for WAM deployment.
