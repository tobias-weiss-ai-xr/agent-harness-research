- title: 'Verification Gaps at the Execution Boundary: How Credential Exposure, Undefined
    Behavior Propagation, Numeric Format Divergence, SBOM Blind Spots, and Harness
    Lifecycle Debt Jointly Define a Correctness Infrastructure Deficit in Deployed
    Software Systems'
  date: 2026-06
  url: https://doi.org/10.5281/zenodo.20688523
  category: runtime
  subcategory: ''
  authors:
  - Saluca Agentic AI Research Team
  abstract: 'Modern software stacks are increasingly assembled from components whose
    correctness properties are assumed rather than verified at integration points:
    credentials are assumed protected, numeric formats are assumed consistent across
    accelerators, dependency inventories are assumed complete, and runtime harnesses
    are assumed sound. This paper synthesizes five specific empirical findings from
    recent cs.SE, cs.PL, and cs.AR preprints to argue that these are not independent
    quality failures but instances of a single structural pattern — a *correctness
    infrastructure deficit* — in which the gap between what a system is assumed to
    do and what it provably does is systematically widest at integration and execution
    boundaries. The five findings are: (1) 63.5% of iOS apps with LLM API credential
    leakage remained unpatched three months after disclosure, with unauthenticated
    backend proxies as the dominant persistent pattern [corpus:arxiv:2606.12212];
    (2) 59 desktop tasks on a standard Linux distribution generated nearly 11,000
    unique undefined-behavior warnings, predominantly in the Mesa graphics library,
    with virtual-table-pointer violations as the leading class [corpus:arxiv:2606.12064];
    (3) 84 numeric formats across 13 families exhibit silent cross-accelerator divergence
    that existing vendor-neutral reference material cannot diagnose [corpus:arxiv:2606.09686];
    (4) no evaluated SBOM generation tool covers all Component Inclusion Mechanisms,
    leaving systematic blind spots across Python, Java, Go, PHP, Rust, and C [corpus:arxiv:2606.02442];
    and (5) agent harness failures — not task-level errors — dominate agentic system
    failure landscapes, and structural monitors are required to surface them [corpus:arxiv:2606.02494].
    The thesis is a heuristic reading, not a derivation: the five findings share a
    structural pattern (assumption-versus-proof gap at integration boundaries) but
    do not share a formal mechanism. The primary falsification path is a cross-cutting
    audit: instrument a single production deployment stack with the sanitizers, conformance
    packs, SBOM ground-truth analysis, harness trace analysis, and credential traffic
    interception described in these five papers simultaneously, and measure whether
    defect categories co-occur or are independent. Independent co-occurrence would
    weaken the unified framing; systematic co-occurrence at shared integration layers
    would strengthen it. --- Authorship: Saluca Agentic AI Research Team (Saluca LLC).
    AI-drafted from arXiv preprint corpus on the date in the filename. Cited arXiv
