- title: 'AI Trust: Practice Theory — The Implementation'
  date: 2026-05
  url: https://doi.org/10.5281/zenodo.20405699
  category: runtime
  subcategory: ''
  authors:
  - Monyet Batu
  abstract: 'The third essay in a series on AI trust and practice theory. Where the
    first essay names situated awareness as the layer missing from current AI agents
    and reframes its delivery as a practice, and the second argues that the practice
    is transmitted through apprenticeship and kept honest by an autonomic loop, this
    paper turns those ideas into a working implementation in twelve steps, alongside
    a companion software repository. The build progresses from a single captured practice
    as a bundle (Schatzki''s interlocked ensemble of teleo-affective, understanding,
    rules, affordances, and materials) through: pooled elements shared across bundles;
    a function registry binding material names to executables; projection assembling
    a runnable practice from a bundle plus the standing engagement; a Model Context
    Protocol (MCP) server presenting projected practices through a fixed tool surface
    and a parallel practice://* resource surface; an enactment trail recording every
    invocation as inspectable structure — trust as enacted structure, not messaging;
    meta-materials for authoring practices at runtime; a somatic / autonomic split
    separating practices that need the user from practices that act alone; and the
    autonomic loop itself — a Judge enactment reading the trail and emitting Friction
    observations, a Smoother enactment amending the substrate in response. The architecture
    closes on a strange loop: because Judge and Smoother are themselves practices,
    their enactments are recorded on the same trail and routed through the same dispatcher
    as anything else, and the apparatus is amendable through the very mechanism it
    provides. The accompanying repository (concept DOI 10.5281/zenodo.20405235) carries
    the verify, the Calendar Stewardship worked example, and adapters for driving
    the autonomic loop against three real LLM harnesses — the Anthropic Agent SDK,
    Claude CLI, and OpenAI Codex CLI.'
