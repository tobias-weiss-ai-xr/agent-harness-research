- title: 'No Data Centre Required: Adapting Open Models to Chitonga with Paid Bilingual
    Speakers, Printed Books and a Verifying Harness'
  date: 2026-10
  url: https://huggingface.co/zamai-zambia/chitonga-chat-run3
  category: interface
  subcategory: ''
  authors:
  - Christoph Johannes Lindinger
  abstract: 'Chitonga, a Bantu language of southern Zambia and northern Zimbabwe,
    is missing from the standard translation test sets, and the open chat models we
    tried write Nyanja, Lozi or Bemba when asked for it. Between 10 and 20 October
    2026 one person, working with the AI coding agent Claude Code, adapted two open
    models to Chitonga: a translator (Meta''s NLLB-200, 1.3 billion parameters) and
    a small chat model (Google''s Gemma 4, about 4 billion). The method combines printed
    books typed into data, a grammar engine that never invents words, bilingual speakers
    paid per item over WhatsApp, and a harness of outside checks around the chat model.
    AI agents drafted most of the data and did the first judging; speakers settled
    what the books and the machines could not. Money was not the binding constraint:
    the scarce inputs were the author''s attention and method, and access to paid
    bilingual speakers. Itemised GPU jobs came to about USD 84, translator runs not
    itemised cost under USD 2 each, and twelve speakers were paid about K4,300. The
    status is that of a proof of concept. The translator was right in meaning on 66%
    of unseen book lines into English and 77% into Chitonga, as judged by Claude agents,
    and has 19 ratings from self-declared speakers so far. The chat model passes the
    automatic checks on 28% of education tasks, against a 70% target for usefulness
    judged by teachers. Reasoning at answer time made the chat model worse, and automatic
    metrics misled us more than once.'
