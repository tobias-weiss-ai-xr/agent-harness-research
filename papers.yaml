  - auto-runtime
  - auto-systems
- title: 'Leyline: KV Cache Directives for Agentic Inference'
  date: 2026-05
  url: https://arxiv.org/abs/2606.01065
  category: runtime
  subcategory: systems
  authors: []
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Modern KV cache management assumes the chatbot workload: prompts arrive
    once and the cache grows append-only, so prefix caching and forward-only eviction
    are correct by construction. Agentic LLMs break this assumption. Their conversations
    evolve through policy-driven editing: failed tool calls are retried, stale outputs
    dropped, trajectories pivoted. Two distinct cache problems result. First, identical
    content moves to new positions between turns, invalidating exact-prefix caches
    even though the underlying KV would still be valid; recent work on position-independent
    caching for MLA addresses this reuse problem. Second, and this paper''s focus,
    a policy may need to direct the serving system to actively remove or replace a
    span of cached content and continue without re-prefilling everything that came
    after. No existing primitive offers this. Production agentic harnesses fall back
    to re-prefill on every edit, paying full prefix-recomputation cost; kernel-level
    eviction methods make their own decisions and cannot accept policy directives
    from outside the kernel. We introduce Leyline, a serving-side primitive that closes
    this gap. A declarative directive 4-tuple separates what to edit from how to preserve
    position correctness. The policy declares the edit and its mode (in-place splice
    or prefix-trimmed re-prefill for semantic forgetting); an architecture-agnostic
    interface routes to a per-architecture kernel that restores attention math via
    a closed-form RoPE-rotation correction. The splice kernel lifts replay cache-hit
    by +11.2 pp and cuts latency by up to 241 ms. A ten-line truncation rule routed
    through the same interface lifts agentic solve rate by +14.3 pp on debug-gym.
    The mechanism is open; the policy space it enables is the agenda.'
  tags:
  - auto-runtime
  - auto-systems
- title: 'Your Policy Is Secretly a Harness: The Decision Geometry of Agent Interfaces'
  date: 2026-10
  url: https://arxiv.org/abs/2610.37255
  category: runtime
  subcategory: systems
  authors: []
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Language model agents are post-trained and deployed through a harness,
    the prompts, tools, and control logic that present a task to the model and execute
    its outputs. Harnesses are often revised and judged by how an already trained
    model performs under them, which assumes that what the model learned under one
    harness carries over to the next. We ask what a policy learns from its harness
    and what survives when the harness changes. Under KL-regularized control, we show
    that the log odds of an optimal policy recover how strongly its harness favors
    each action over the others, so a trained policy carries the preferences of its
    harness. Deployed return then equals the ceiling of the harness, the best return
    it offers, minus the mismatch of the policy, the return lost to its own suboptimal
    decisions. Training changes only the mismatch, while changing the harness moves
    both terms. Comparing harnesses with a fixed model therefore mixes what each harness
    offers with how well that model uses it. In MiniWoB++, post-training makes a model's
    preferences specific to its training harness. Reversing the order of the observation
    fields leaves every optimal decision unchanged yet lowers a trained model's success
    from 85.0% to 19.2%. Conversely, every new harness that a fixed-model comparison
    rejects but that raises the ceiling outperforms the original agent after further
    training under it, and ceiling and mismatch measured beforehand predict these
    gains. For coding-agent harnesses on Terminal-Bench Lite, ceiling minus mismatch
    estimated with a stronger model as a stand-in for the optimum reproduces the accuracy
    ranking, while either term alone does not. Code is available at https://github.com/2020-qqtcg/HRP.
  tags:
  - auto-runtime
  - auto-systems
- title: Reimagining computational quantum research with AI scientists
  date: 2026-11
  url: https://arxiv.org/abs/2611.02833
  category: runtime
  subcategory: systems
  authors: []
  venue: ''
  code_url: ''
  project_url: ''
  abstract: AI scientists are expanding automated research across scientific domains,
    yet their ability to turn the scientific record into a foundation for autonomous
    discovery remains elusive. Here we uncover a fundamental barrier to this transition
    and demonstrate a route to overcome it in computational quantum science, where
    advances shape both what we can learn from complex quantum systems and what quantum
    computing can ultimately deliver. To identify this barrier, we introduce OmniQ,
    an expert-audited virtual research environment that converts published studies
    into executable reproduction tasks. Across 59 papers spanning classical simulation,
    quantum algorithms and quantum-property characterization, we systematically evaluate
    five agentic systems powered by large language models and six third-party agent
    harnesses. Our findings reveal that current AI scientists often fail to reproduce
    published results, exposing a fundamental mismatch between what scientific papers
    communicate and what autonomous agents require. By contrast, human expert intervention
    can turn these failures into successful reproductions, showing that the missing
    information can be identified and converted into reusable research experience.
    Guided by this observation, we develop Residual Agents (RA), a quantum-tailored
    self-improving AI scientist that distils externally verified workflow repairs
    into such experience. RA substantially improves research performance under fixed
    base models and limited adaptation budgets. For example, RA raises DeepSeek V4.1
    Flash performance from 68% to 85%, matching Claude Code with Opus 5 at a third
    of its cost despite using a weaker base model. We integrate all reproduced results
    into an extensible platform built on the model context protocol, making verified
    research workflows directly accessible to AI scientists and allowing new scientific
    papers to be continuously incorporated.
  tags:
  - auto-runtime
  - auto-systems
- title: 'Capability Sheaves for Compositional Agent-Harness Repair: Controlled Quotients
    and a Real-Repository Stress Test'
  date: 2026-08
  url: https://arxiv.org/abs/2608.13228
  category: runtime
  subcategory: systems
  authors: []
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Agent harnesses combine retrieval, routing, state, provenance, and verification,
    but locally successful components may disagree on shared state. We model this
    failure with a finite capability sheaf: stalks encode typed behavior signatures,
    restriction maps retain shared fields, and accepted runs are useful global sections.
    An exact finite constraint-satisfaction problem (CSP) defines acceptance, while
    a linearized relative cohomology class provides a diagnostic and search feature.
    A controlled experiment over 20 task clusters introduces hidden interior mediators
    whose raw states are nuisance variables. Quotienting their coboundaries reduces
    the candidate budget from 2,000 to 1,000 per cluster; aligning the hidden state
    removes the gap. Exact CSP matches the quotient, so the result demonstrates invariance
    to stale representatives, not superiority over exact reasoning. We then test the
    method on a discovery split from the SWE-bench Multilingual pool of PatchFuseBench:
    160 issues from 20 repositories, 875 real candidate patches, 2,579 source-aware
    edit atoms, and 153 newly executed patches. A first pool-level construction is
    constant because [b-Dx]=[b] in \operatorname{coker}D and therefore cannot rank
    configurations. A candidate-indexed repair is nontrivial on 848/875 candidates
    and varies within 120/160 issues. It resolves 118 issues versus 116 for a matched
    noncohomological selector, but the difference is not supported across repositories
    (exact sign-flip p=0.75). A leave-one-repository-out abstention gate reaches 127/160,
    tying the strong anchor and exceeding its matched gate by one issue (p=1.0). The
    discovery gate therefore fails and the confirmatory split remains sealed. The
    study supports the controlled invariance mechanism and an identifiability correction,
    but not a real-world cohomological advantage.'
  tags:
  - auto-runtime
  - auto-systems
- title: 'MILO: Automated Harness Discovery via Orchestrated Multi-Agent Evolution'
  date: 2026-09
  url: https://arxiv.org/abs/2609.38349
  category: runtime
  subcategory: systems
  authors: []
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Modern agentic systems combine an AI model with a harness that controls
    execution and environmental interactions. Harness design strongly affects long-horizon
    performance, yet its combinatorial search space demands substantial human effort
    that must be repeated as models change. Existing automated methods explore this
    space narrowly, optimizing only components such as prompts or skills or becoming
    trapped by fixed, exploitative search strategies. We introduce MILO (Meta-evolutionary
    Island Orchestration), a framework that co-evolves agent harnesses and the strategy
    used to discover them. MILO combines: (i) hierarchical lineage memory over island-based
    trees, using rejected mutations as negative evidence; (ii) per-island mutator
    agents that rewrite complete harnesses using global search history and parent-specific
    feedback; and (iii) an orchestrator that adapts search through lineage grafting
    and speciation, mutator reassignment and curriculum revision. Across Terminal-Bench
    2.1, PaperBench, and DeepSWE, MILO-discovered harnesses outperform eight state-of-the-art
    harnesses and six search methods using frontier (Opus 4.8) and open-weight (gpt-oss-120b)
    models. With Opus 4.8, MILO improves resolution over its initial harness by +12.0\%,
    +28.3\%, and +10.3\%, respectively, compared with best prior-search gains of +4.5\%,
    +18.3\%, and 0\%. On Terminal-Bench 2.1, it achieves 86.1 \pm 2.0\%, exceeding
    the official leaderboard''s top entry (83.8 \pm 2.3\%) while using 26\% fewer
    tokens than its initial harness. On EinsteinArena open problems, MILO improves
    best-known upper bounds for Erdős minimum-overlap (0.3808586 \to 0.3808568) and
    the first and third autocorrelation inequalities (1.50274365 \to 1.50274360; 1.45081
    \to 1.44889).'
